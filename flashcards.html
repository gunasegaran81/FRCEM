<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FRCEM Final Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F5F3F4; --surface:#FFFFFF; --ink:#1D1418; --muted:#6E5E65; --line:#E6DCE0;
  --accent:#8A1C3B; --accent-ink:#FFFFFF; --grid:#F3C9D5; --grid-strong:#EAA3B8;
  --pri:#B4232C; --pri-bg:#FBE6E7; --chg:#6A4A00; --chg-bg:#FBF0D2; --ok:#1F6F4A; --ok-bg:#E1F2E8;
  --again:#9A3412; --again-bg:#FCE9DC;
  --slo1:#2a78d6; --slo3:#e34948; --slo4:#eb6834; --slo5:#1baf7a; --slo6:#4a3aa7; --sloX:#eda100;
  --fig-line:#6E5E65; --fig-fill:#F5F3F4; --fig-ink:#1D1418;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141012; --surface:#1E181B; --ink:#F2EAEE; --muted:#AE9CA4; --line:#33292E;
    --accent:#E06A8C; --accent-ink:#1A0C12; --grid:#2E1E25; --grid-strong:#48293A;
    --pri:#FF8A8F; --pri-bg:#3A1A1D; --chg:#F2CF73; --chg-bg:#352A0E; --ok:#6FD3A0; --ok-bg:#143325;
    --again:#FFA36E; --again-bg:#3A2012;
    --slo1:#3987e5; --slo3:#e66767; --slo4:#d95926; --slo5:#199e70; --slo6:#9085e9; --sloX:#c98500;
    --fig-line:#AE9CA4; --fig-fill:#241E21; --fig-ink:#F2EAEE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141012; --surface:#1E181B; --ink:#F2EAEE; --muted:#AE9CA4; --line:#33292E;
  --accent:#E06A8C; --accent-ink:#1A0C12; --grid:#2E1E25; --grid-strong:#48293A;
  --pri:#FF8A8F; --pri-bg:#3A1A1D; --chg:#F2CF73; --chg-bg:#352A0E; --ok:#6FD3A0; --ok-bg:#143325;
  --again:#FFA36E; --again-bg:#3A2012;
    --slo1:#3987e5; --slo3:#e66767; --slo4:#d95926; --slo5:#199e70; --slo6:#9085e9; --sloX:#c98500;
    --fig-line:#AE9CA4; --fig-fill:#241E21; --fig-ink:#F2EAEE;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .82rem var(--body);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:var(--accent-ink);opacity:.8}
.chip.pri{border-color:var(--pri)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.controls label{display:flex;align-items:center;gap:6px}
.controls input[type=number]{width:64px;font:500 .85rem var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{position:relative;min-height:320px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:22px 20px 18px;cursor:pointer;display:flex;flex-direction:column;gap:14px;user-select:none}
.card.back{
  background-color:var(--surface);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;
}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:500 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.pri{background:var(--pri-bg);color:var(--pri);border-color:transparent}
.tag.chg{background:var(--chg-bg);color:var(--chg);border-color:transparent}
.num{margin-left:auto;font:500 .75rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.3;text-wrap:balance;margin:0}
.a{background:var(--surface);border-radius:8px;padding:12px 14px;border:1px solid var(--line);font-size:1rem}
.a strong{color:var(--accent)}
.src{font:500 .72rem var(--mono);color:var(--muted);margin-top:auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:auto;text-align:center}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .btn{padding:14px;font-size:1rem}
.again{background:var(--again-bg);color:var(--again);border-color:transparent}
.gotit{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.end{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.end h2{font-family:var(--display);margin:0;font-size:1.4rem}
.code{font:500 .9rem var(--mono);background:var(--bg);border:1px dashed var(--grid-strong);padding:10px 12px;border-radius:8px;word-break:break-all;user-select:all}
.misslist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.chip{position:relative;padding-left:24px}
.chip::before{content:"";position:absolute;left:10px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--slo,var(--muted))}
.chip[aria-pressed="true"]::before{background:var(--accent-ink);opacity:.9}
.card{border-left:4px solid var(--slo,var(--line))}
.tag.slo{background:transparent;border:1px solid var(--slo,var(--line));color:var(--slo,var(--muted));font-family:var(--mono);font-size:.68rem;letter-spacing:.04em}
.bar{position:relative;display:flex;gap:2px;height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .18s ease}
.bar i.k{background:var(--ok)}
.bar i.a{background:var(--again)}
.tally{font-family:var(--mono);font-size:.74rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tally b{font-weight:600;color:var(--ink)}
.tally .kk{color:var(--ok)}
.tally .aa{color:var(--again)}
.fig{margin:14px 0 4px;padding:10px;background:var(--fig-fill);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
.fig text{font-family:var(--mono);fill:var(--fig-ink)}
.figcap{font-family:var(--mono);font-size:.66rem;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:.03em}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>FRCEM Final Deck<small>High-yield · your sets, misses &amp; pocket cards</small></h1>
    <span class="count" id="count"></span>
  </header>
  <div><a class="btn" href="index.html" style="display:inline-block;text-decoration:none">← Catalogue</a></div>
  <div class="chips" id="chips" role="toolbar" aria-label="Choose a deck"></div>
  <div class="controls">
    <label for="startN">Start at card <input type="number" id="startN" min="1" value="1"></label>
    <label><input type="checkbox" id="shuffle"> Shuffle</label>
    <button class="btn" id="restart">Restart deck</button>
  </div>
  <div class="legend"><span class="tag pri">Missed ≥2</span> repeat-miss items &nbsp; <span class="tag chg">Changed</span> old → new guidance</div>
  <div class="bar"><i class="k" id="progK"></i><i class="a" id="progA"></i></div>
  <div class="tally" id="tally"></div>
  <div id="stage"></div>
</div>

<script>
/* d=deck, f: p=missed twice+, c=guideline changed; q=front; a=back; s=source */
const CARDS=[
// ---------- RESUS / TOR ----------
{d:"Resus",f:"c",q:"Termination of resuscitation: how long of ALS in asystole (no reversible cause) before TOR can be considered?",a:"**45 minutes** of ALS, timed from confirmation of arrest.\nOLD teaching: 20 min — wrong.",s:"RCUK Ethics in Resuscitation 2025"},
{d:"Resus",q:"Can TOR rules be applied to a child or neonate, or to in-hospital arrest?",a:"**No — never** for paediatric/neonatal patients in any setting, and not for IHCA.\nEthics 2025 is stricter than the ALS document on this.",s:"RCUK Ethics in Resuscitation 2025"},
{d:"Resus",q:"Monitor shows a flat line. What must you check before treating it as true asystole?",a:"Look for **P waves** — ventricular standstill may respond to **pacing**.",s:"RCUK ALS 2025"},
{d:"Resus",q:"Which findings can be the SOLE basis for stopping CPR: low ETCO2, POCUS, blood gas, fixed pupils?",a:"**None of them.** Each is \"not a sole basis\" for termination.",s:"RCUK Ethics 2025"},
{d:"Resus",q:"Thrombolysis given for suspected PE during arrest. How long should CPR continue?",a:"**60–90 minutes** after thrombolysis.",s:"RCUK Ethics / ALS 2025"},
{d:"Resus",f:"c",q:"Arrest: POCUS shows isolated RV dilatation. Is that diagnostic of PE?",a:"**No** — not diagnostic of PE in arrest (2025 change).",s:"RCUK ALS 2025"},
{d:"Resus",f:"c",q:"Adult in arrest — first-line vascular access?",a:"**IV first**; IO only if IV fails or is impossible.\nOLD: IO-first — reversed in 2025.",s:"RCUK ALS 2025"},
{d:"Resus",q:"Paediatric arrest: is routine calcium given?",a:"**No** — calcium is not used in paediatric arrest (only for a specific indication, e.g. documented hypocalcaemia/hyperkalaemia/CCB OD).",s:"RCUK PLS 2025"},
{d:"Resus",q:"Patient has a ReSPECT form saying 'not for CPR'. Legally binding?",a:"**No** — ReSPECT/ECTP are recommendations; the treating team decides.\nOnly a legally binding document (e.g. **valid ADRT**) binds.",s:"RCUK Ethics 2025"},
{d:"Resus",q:"Cardiac arrest after TCA / sodium-channel blocker overdose — specific drug and how long to resuscitate?",a:"Rapid **100 mL 8.4% sodium bicarbonate**; continue resuscitation **at least 1 hour** (prolonged CPR can have good neuro outcome).",s:"TOXBASE Amitriptyline"},

// ---------- ARRHYTHMIA ----------
{d:"Arrhythmia",f:"c",q:"Adenosine dose sequence for regular narrow-complex tachycardia?",a:"**6 mg → 12 mg → 18 mg**.\nOLD: 6–12–12 — superseded (algorithm V3, March 2026).",s:"RCUK tachyarrhythmia V3 Mar 2026"},
{d:"Arrhythmia",f:"c",q:"Name the FIVE life-threatening features in tachyarrhythmia.",a:"1. **Shock**\n2. **Syncope** with severe or ongoing hypotension\n3. **Myocardial ischaemia**\n4. **Severe heart failure** with pulmonary oedema or shock\n5. **Immediately post-ROSC** (new in 2025)",s:"RCUK 2025"},
{d:"Arrhythmia",q:"Unstable tachycardia: how many synchronised shocks before a drug, and which drugs?",a:"Up to **3 synchronised shocks**, then **amiodarone 300 mg over 10–20 min** OR **procainamide 10–15 mg/kg (max 1 g) over 20 min**, then repeat shock.",s:"RCUK 2025"},
{d:"Arrhythmia",f:"p",q:"STABLE broad-complex regular tachycardia (VT). First-line drug and the amiodarone rate?",a:"**Procainamide 10–15 mg/kg (max 1 g) over 20 min** first line.\nAmiodarone is 2nd line: **300 mg over 10–60 min** (10–20 min is the UNSTABLE rate).",s:"RCUK 2025 · missed ECG1 Q7"},
{d:"Arrhythmia",q:"Irregular narrow-complex (AF) — EF >40% vs EF <40%: rate-control options?",a:"**EF >40%**: beta-blocker, verapamil, diltiazem or digoxin.\n**EF <40%**: no rate-limiting CCB — beta-blocker/digoxin/amiodarone.",s:"RCUK 2025"},
{d:"Arrhythmia",q:"Sinus tachycardia at 160 — shock or antiarrhythmic?",a:"**Neither.** Algorithm is for arrhythmia of abnormal origin — treat the cause, do not normalise sinus rate.",s:"RCUK 2025"},
{d:"Arrhythmia",f:"c",q:"Complete heart block with broad QRS, hypotensive. Atropine?",a:"**Do not give** atropine in high-degree AV block **with wide QRS**, or after **cardiac transplant** → pacing / isoprenaline / adrenaline. Aminophylline 100–200 mg is the option in transplant or spinal injury.\nOLD: 'unlikely to work'.",s:"RCUK bradyarrhythmia 2025 · Pocket cards"},
{d:"Arrhythmia",q:"New-onset AF, not anticoagulated. When is heparin started?",a:"**At presentation** — continue until full assessment and appropriate antithrombotic started.",s:"NICE NG196 · missed ARR1 Q8"},
{d:"Arrhythmia",q:"48 h (NICE) vs 24 h (RCUK) in AF — which answers what?",a:"**NICE 48 h** = cardioversion strategy (>48 h/uncertain → ≥3 weeks anticoagulation first or TOE route).\n**RCUK >24 h** = when to start anticoagulation only.\nExam cardioversion Qs → NICE 48 h.",s:"NG196 + RCUK 2025"},
{d:"Arrhythmia",q:"AF with frank pulmonary oedema — NG196 'senior input on beta-blocker' or cardioversion?",a:"**Synchronised DC cardioversion** — pulmonary oedema is a life-threatening feature.\nNG196 decompensation advice applies only WITHOUT instability.",s:"RCUK 2025 / NG196"},

// ---------- CARDIO ----------
{d:"Cardio",q:"STEMI treated with fibrinolysis — when is the antithrombin given?",a:"**At the same time** as fibrinolysis.",s:"NICE NG185 · missed ACS1 Q2"},
{d:"Cardio",q:"STEMI presenting >12 h after onset with ongoing ischaemia?",a:"**Consider primary PCI.**",s:"NICE NG185"},
{d:"Cardio",q:"Primary PCI anticoagulation: radial vs femoral access?",a:"**Radial** → UFH + bailout GP IIb/IIIa.\n**Femoral** → consider bivalirudin.",s:"NICE NG185"},
{d:"Cardio",q:"NSTEMI, creatinine >265 µmol/L — fondaparinux?",a:"**No** → UFH with monitoring instead.",s:"NICE NG185"},
{d:"Cardio",q:"GRACE 6-month mortality >3.0% in NSTEMI?",a:"**Consider angiography within 72 h.**",s:"NICE NG185"},
{d:"Cardio",q:"Chest pain before NSTEMI/UA diagnosis is made — start DAPT?",a:"**No** — not before the diagnosis is made.",s:"NICE NG185 · missed ACS1 Q12"},
{d:"Cardio",q:"Suspected aortic dissection: ADD-RS & D-dimer rule; classical presentation?",a:"ADD-RS **>1**, or **=1 with D-dimer >500 ng/mL** → image (CTA).\nClassical picture → **straight to CT aortogram**, don't wait for D-dimer.\nNormal CXR misses ~15%, TTE ~30%.",s:"RCEM/RCR TAD Mar 2025"},
{d:"Cardio",f:"c",q:"High-risk cardiac patient (prosthetic valve) for dental extraction — IE prophylaxis?",a:"Still **not routine** (NICE CG64), but since **Nov 2024** NICE points high-risk patients to **SDCEP** advice (AP for extractions/oral surgery).",s:"NICE CG64 amended Nov 2024"},

// ---------- STROKE / BLEED ----------
{d:"Stroke",q:"Suspected TIA in ED — CT head?",a:"**No CT** unless another diagnosis (e.g. haemorrhage) is suspected. MRI comes after specialist assessment.",s:"NICE NG128 · missed STROKE1 Q2"},
{d:"Stroke",q:"Ischaemic stroke, fails swallow screen — aspirin?",a:"**Aspirin 300 mg rectally**, continued 300 mg daily until **2 weeks** after onset. Route changes, dose doesn't.",s:"NICE NG128"},
{d:"Stroke",q:"ICH on warfarin with a mechanical valve — reverse?",a:"**Yes: PCC + IV vitamin K.** A mechanical valve is **not** an exception.",s:"NICE NG128"},
{d:"Stroke",q:"Ischaemic stroke, BP 200/110, not a thrombolysis candidate?",a:"**No BP treatment** unless hypertensive emergency with a serious concomitant condition.\n185/110 applies to thrombolysis candidates only.",s:"NICE NG128"},
{d:"Stroke",q:"ICH, GCS 7, with hydrocephalus — 'rarely needs surgery'?",a:"**Refer to neurosurgery** — the GCS <8 caveat does NOT apply when hydrocephalus is the cause.",s:"NICE NG128"},
{d:"Stroke",q:"SAH — nimodipine route?",a:"**Enteral** (oral/NG). IV only in a specialist setting if enteral unsuitable.",s:"NICE NG228"},
{d:"Stroke",f:"p",q:"ICH on apixaban — andexanet alfa?",a:"**Not NICE-funded for ICH.** TA697 funds andexanet ONLY for **GI bleeding** on apixaban/rivaroxaban (ICH appraisal terminated).\nDabigatran → idarucizumab. Edoxaban → no licensed antidote.",s:"NICE TA697 · missed twice"},
{d:"Stroke",q:"Which anticoagulated patients can be reversed without calling haematology first?",a:"Only **adults on a VKA** → **PCC** (never plasma). Any other agent, or any child → haematology immediately.",s:"NICE (reversal guidance)"},

// ---------- SEPSIS ----------
{d:"Sepsis",f:"p",q:"NEWS2 recalculation intervals by risk band?",a:"**High: every 30 min**\n**Moderate: hourly**\n**Low: every 4–6 h**\nVery low: standard obs.",s:"NICE NG253 · missed 3×"},
{d:"Sepsis",f:"p",q:"NEWS2 risk bands for suspected sepsis — and the single-parameter rule?",a:"**7+ high · 5–6 moderate · 1–4 low · 0 very low.**\nNEWS2 5–6 with a single 3-point parameter caused by infection → **high risk**.",s:"NICE NG253"},
{d:"Sepsis",q:"Adult sepsis fluid bolus volume and rate?",a:"**250 mL over 10–15 min** (reassess; up to 1,000 mL).",s:"NICE NG253 · missed SEP1 Q2"},
{d:"Sepsis",q:"16–18 y with sepsis — oxygen rule?",a:"**Must give** if shock or SpO2 <92%; **consider** if >92%.",s:"NICE NG253"},
{d:"Sepsis",f:"p",q:"Temperature <36 °C — risk level under 5 vs 5 and over?",a:"**Under 5: HIGH risk.**\n**5 and over: MODERATE risk.**",s:"NICE NG254 tables · missed twice"},
{d:"Sepsis",q:"Antibiotic triggers in infants under 3 months (three)?",a:"1. **<1 month with fever** — regardless of appearance\n2. **1–3 months appearing unwell**\n3. **1–3 months with WCC <5 or >15**",s:"NICE NG254 1.7.4 · now correct"},
{d:"Sepsis",q:"Paediatric fluid bolus cap: NICE vs RCUK PLS?",a:"**NICE: max 250 mL** under 16. RCUK PLS allows up to 500 mL at 14+. **Answer NICE** for the exam.",s:"NG254 vs RCUK PLS 2025"},

// ---------- ENDOCRINE ----------
{d:"Endocrine",q:"Markers of SEVERE DKA (needing HDU/senior review)?",a:"Ketones **>6** · bicarbonate **<5** · pH **<7.0** · K **<3.5** on admission · GCS **<12** · SpO2 **<92%** · SBP **<90** · anion gap **>16**",s:"JBDS 02 DKA 2023"},
{d:"Endocrine",q:"DKA insulin — rate, and what happens to their long-acting insulin?",a:"**Fixed rate 0.1 units/kg/h** AND **continue usual long-acting insulin** at usual dose and time.",s:"JBDS 02 DKA 2023"},
{d:"Endocrine",q:"Severe hypoglycaemia, IV access in place — what exactly?",a:"**200 mL 10% or 100 mL 20% glucose over 15 min.**\nNot 50% glucose; glucagon is for no IV access.",s:"JBDS 01 Hypo 2023"},
{d:"Endocrine",q:"Hypo from sulfonylurea or long-acting insulin, now recovered with normal repeat glucose — discharge?",a:"**No** — monitor **24–36 h**, especially in renal impairment.",s:"JBDS 01 Hypo 2023"},
{d:"Endocrine",q:"Suspected adrenal crisis — hydrocortisone timing per NG243?",a:"**Give immediately** — no risk of overdose; don't delay for tests.\n[C] Usual dose 100 mg IV/IM (NG243 gives no mg figure).",s:"NICE NG243 2024"},

// ---------- RESPIRATORY ----------
{d:"Respiratory",q:"Acute SEVERE asthma criteria (adult)?",a:"**Any one of**: PEF 33–50% · RR ≥25 · HR ≥110 · can't complete sentences.\nA normal SpO2 does NOT downgrade it.",s:"SIGN 158 · missed RESP1 Q1"},
{d:"Respiratory",f:"c",q:"Life-threatening asthma — role of SpO2 <92% after the 2024 revision?",a:"Now a **mandatory prerequisite** (was one qualifying feature).",s:"SIGN 158 rev. Nov 2024"},
{d:"Respiratory",q:"COPD exacerbation — prednisolone dose and duration?",a:"**30 mg daily for 5 days** (not the asthma 40–50 mg).",s:"NICE NG115 1.3.16"},
{d:"Respiratory",q:"Acute severe asthma: hydrocortisone dose; ipratropium repeat?",a:"**Hydrocortisone 100 mg IV then 6-hourly.**\nIpratropium 4–6-hourly repeat is for the **not-improving** branch, not automatic.",s:"BTS/SIGN adult algorithm"},
{d:"Respiratory",q:"COPD — when to start NIV?",a:"Persisting **pH <7.35 and PaCO2 >6.5 kPa** despite optimal medical therapy (target SpO2 88–92%).",s:"BTS/ICS AHRF 2016"},
{d:"Respiratory",f:"c",q:"BTS 2023 pneumothorax — what drives intervention?",a:"Single sequential pathway: **haemodynamic compromise → high-risk features → symptom burden**.\nSize (2 cm) is no longer the trigger.",s:"BTS Pleural Disease 2023"},

// ---------- GI / SURGICAL ----------
{d:"GI",q:"Unstable severe upper GI bleed — endoscopy timing?",a:"**Immediately after resuscitation.** Within 24 h is for everyone else.",s:"NICE CG141 · missed GI1 Q2"},
{d:"GI",q:"UGIB blood products — platelets, FFP, cryo triggers?",a:"**Platelets**: actively bleeding + count <50.\n**FFP**: PT/INR or APTT >1.5× normal.\n**Cryo**: fibrinogen <1.5 g/L despite FFP.",s:"NICE CG141"},
{d:"GI",q:"Lower GI bleed, shock index >1 after resuscitation?",a:"**CT angiography.**",s:"BSG LGIB 2019"},
{d:"GI",q:"Restrictive red cell transfusion thresholds?",a:"Trigger **70 g/L**, target **70–90**.\nWith cardiovascular disease: trigger **80**, target **100**.",s:"NICE NG24"},
{d:"GI",q:"Uncomplicated diverticulitis, systemically well, not immunosuppressed?",a:"**Consider no antibiotics.**",s:"NICE NG147"},
{d:"GI",q:"Severe acute pancreatitis with necrosis — prophylactic antibiotics?",a:"**No** — no prophylactic antimicrobials whatever the severity or necrosis.",s:"NICE NG104"},
{d:"GI",q:"Suspected ruptured/symptomatic AAA — first investigation?",a:"**Immediate bedside aortic ultrasound.**",s:"NICE NG156"},

// ---------- TOXICOLOGY ----------
{d:"Tox",q:"Single paracetamol OD (<1 h): 'unlikely toxic' thresholds?",a:"Adults & ≥6 y: **<75 mg/kg**.\nUnder 6 y: **<150 mg/kg**.\nAny self-harm → assess regardless.",s:"TOXBASE Paracetamol 6/2026"},
{d:"Tox",q:"Staggered paracetamol OD (or unknown time) — nomogram? When to start NAC?",a:"**Nomogram can't be used.** Start **NAC without delay in ALL**.\nBloods ≥4 h after last dose. Stop if paracetamol **<10 mg/L** + ALT normal + asymptomatic.",s:"TOXBASE staggered OD 6/2026"},
{d:"Tox",f:"c",q:"End of SNAP 12-h NAC — criteria to CONTINUE?",a:"Any of: **ALT >ULN** · **ALT doubled** from admission (even within normal) · **paracetamol >10 mg/L**.\nINR <2 alone is NOT a reason to continue.",s:"TOXBASE SNAP end 6/2026 (thresholds changed Jun 2026)"},
{d:"Tox",q:"Extended NAC (4th bag onward) — stopping criteria?",a:"**INR ≤1.3**, OR **INR <3 and falling** on two consecutive tests (irrespective of ALT).",s:"TOXBASE SNAP end 6/2026"},
{d:"Tox",q:"Paracetamol >700 mg/L with coma and raised lactate?",a:"**Haemodialysis** (intermittent preferred) + NAC — **double the NAC dose** on RRT.",s:"TOXBASE 6/2026"},
{d:"Tox",q:"TCA OD: sodium bicarbonate doses by QRS?",a:"**Arrest / VT / QRS ≥160** → 100 mL 8.4% bolus.\n**QRS 120–160** → 50 mL 8.4%.\nTarget pH **7.5–7.55**.",s:"TOXBASE TCA 5/2025"},
{d:"Tox",q:"TCA seizures not controlled by benzodiazepines — next? What to avoid?",a:"**Barbiturates** second line; **avoid phenytoin**.",s:"TOXBASE TCA"},
{d:"Tox",q:"TCA: observation period; which children need assessment?",a:"Observe **≥6 h**. **Any** amount in a child → assess. Amitriptyline **15 mg/kg** = serious toxicity.",s:"TOXBASE Amitriptyline"},
{d:"Tox",q:"Propranolol OD now seizing — specific extra step?",a:"**50 mL 8.4% sodium bicarbonate** rapid bolus even if not acidotic (high VT risk).",s:"TOXBASE Propranolol"},
{d:"Tox",q:"Beta-blocker OD with severe hypotension — order of specific therapy?",a:"**Glucagon 5–10 mg IV** over 1–2 min (infusion if it works) → **high-dose insulin**. Observe 6 h (12 h MR).",s:"TOXBASE BB 9/2024"},
{d:"Tox",q:"CCB OD hypotension — calcium dose for ≥50 kg?",a:"**6.8 mmol**: 10 mL CaCl 10% OR 30 mL Ca gluconate 10% over 3–5 min; repeat up to **3 doses**.",s:"TOXBASE CCB 2/2024"},
{d:"Tox",q:"CCB OD: high-risk features and observation times?",a:"High risk: **fluid-refractory hypotension · new hyperglycaemia · rising lactate** → critical care.\nObserve **12 h** (normal release), **24 h** (MR).",s:"TOXBASE CCB"},
{d:"Tox",q:"High-dose insulin euglycaemic therapy — start and titration?",a:"Glucose >10 and K corrected first. **1 unit/kg bolus**, then **1 unit/kg/h**, ↑ by **2 units/kg/h every 15 min** (up to 10), aim SBP >90. Weight cap 110 kg. CBG every 10 min; glucose monitoring **24 h** after stopping.",s:"TOXBASE HIET 3/2026"},
{d:"Tox",q:"Mixed OD of two cardiotoxic drugs — observation period?",a:"The **longest** period recommended for any single agent. Exceeding daily dose of ≥2 cardiotoxic agents → always assess.",s:"TOXBASE"},
{d:"Tox",q:"Cyanide poisoning — antidote choice?",a:"**Hydroxocobalamin** first line.\nDicobalt edetate only when cyanide is certain & severe — toxic if no cyanide.",s:"TOXBASE"},
{d:"Tox",q:"CO poisoning, SpO2 99% — oxygen?",a:"**100% high-flow O2 regardless** — do NOT titrate to SpO2 (pulse oximetry reads COHb as O2Hb).",s:"TOXBASE"},
{d:"Tox",q:"Sulfonylurea OD with recurrent hypoglycaemia despite glucose?",a:"**Octreotide.** (Insulin OD → prolonged glucose; octreotide is the distractor there.)",s:"TOXBASE"},
{d:"Tox",q:"GHB, GCS 6, protecting airway and breathing adequately?",a:"**Supportive care** — rapid spontaneous recovery; don't auto-intubate.",s:"TOXBASE"},
{d:"Tox",q:"Asymptomatic body packer — decontamination?",a:"**Whole bowel irrigation**, not endoscopic retrieval. Surgery if obstruction/rupture.",s:"TOXBASE"},
{d:"Tox",q:"Chloroquine cardiotoxicity?",a:"**High-dose diazepam + adrenaline** with early intubation/ventilation.",s:"TOXBASE"},
{d:"Tox",q:"Paracetamol level checked DURING NAC infusion — caveat?",a:"Some analysers **underestimate by up to 40%** at high NAC concentrations — check with your lab.",s:"TOXBASE 6/2026"},

// ---------- EYE ----------
{d:"Eye",q:"Dendritic corneal ulcer with red eye — topical steroid?",a:"**No** — steroids worsen HSV keratitis. Topical antiviral, same-day ophthalmology.",s:"RCOphth [C]"},
{d:"Eye",q:"GCA with visual loss — steroid?",a:"**IV methylprednisolone** (0.5–1 g daily for 3 days) before biopsy; ophthalmology/rheumatology same day.",s:"BSR 2020 [C]"},
{d:"Eye",q:"Painful red eye with reduced vision days after cataract surgery?",a:"**Endophthalmitis until proven otherwise** → immediate ophthalmology (vitreous tap + intravitreal antibiotics).",s:"RCOphth [C]"},

// ---------- TRAUMA / TRAPS ----------
{d:"Trauma",f:"c",q:"Fully immunised adult (last dose <10 years), high-risk tetanus-prone wound?",a:"**Nothing required** — no vaccine, no immunoglobulin.",s:"UKHSA Green Book Ch.30 2025"},
{d:"Trauma",q:"Major haemorrhage — ROTEM/TEG-guided from the start?",a:"**No** — not routine (research rec only). **Fixed-ratio MHP + TXA** → lab-guided replacement.",s:"NICE NG39"},
{d:"Trauma",q:"Haemophilia A, minor head injury, normal exam and GCS 15?",a:"**Factor replacement + CT anyway.** Normal exam is the trap.",s:"NICE NG232 / trap pattern"},
{d:"Trauma",q:"Neonate with bilious vomiting, soft non-tender abdomen?",a:"**Urgent surgical review** for malrotation/volvulus — soft abdomen doesn't reassure.",s:"Trap pattern (SIM)"},
{d:"Trauma",q:"Suspected ovarian torsion, Doppler flow present?",a:"**Still urgent gynae/surgical exploration** — flow does not exclude torsion.",s:"Trap pattern (SIM)"},
// ---------- FROM POCKET CARDS ----------
{d:"Scores",q:"Wells PE — cut-off and what each side does?",a:"**>4 = PE likely** → immediate CTPA (interim anticoagulation if delayed).\n**≤4 = unlikely** → D-dimer; positive → CTPA, negative → stop.\nRenal impairment / contrast allergy → V/Q.",s:"NICE NG158 · Pocket cards"},
{d:"Scores",q:"Wells PE — the two 3-point items and the 1.5-point items?",a:"**3.0**: clinical signs of DVT · PE most likely diagnosis.\n**1.5**: HR >100 · immobilisation ≥3 d or surgery <4 wk · previous DVT/PE.\n**1.0**: haemoptysis · malignancy.",s:"NICE NG158 · Pocket cards"},
{d:"Scores",q:"Age-adjusted D-dimer — who does it apply to?",a:"**Age × 10**, over-50s only, and only when **Wells ≤4**.",s:"NICE NG158 · Pocket cards"},
{d:"Scores",q:"Wells DVT ≥2 (likely) — ultrasound timing, and if US not available?",a:"Proximal leg vein US **within 4 h**. If unavailable: D-dimer + **interim anticoagulation** + scan **within 24 h**.\n≤1 = unlikely → D-dimer.",s:"NICE NG158 · Pocket cards"},
{d:"Scores",q:"Canadian C-spine: low-risk patient who cannot actively rotate 45° each way?",a:"**Immobilise + image.**\nAny HIGH-risk factor → immobilise + image, **do NOT test rotation**.\nLow risk, pain-free, rotates 45° → neither.",s:"NICE NG41 · Pocket cards"},
{d:"Scores",q:"Child <16 with strong suspicion of cord/column injury — first imaging?",a:"**MRI first-line.** Plain films only if not meeting MRI criteria with persistent suspicion.",s:"NICE NG41 · Pocket cards"},
{d:"Scores",q:"Adult head injury + suspected C-spine injury — which guideline governs the C-spine?",a:"**NG232**, not NG41. New column fracture → image the whole spine; neurology after CT → MRI.",s:"NICE NG232 · Pocket cards"},
{d:"Scores",q:"Kocher criteria — the four and their risk of septic arthritis?",a:"Non-weight-bearing · fever >38.5 · ESR >40 · WCC >12.\n1 = **3%** · 2 = **40%** · 3 = **93%** · 4 = **99%**.",s:"Pocket cards [C]"},
{d:"Scores",q:"Suspected septic joint: aspirate or antibiotics first?",a:"**Stable → aspirate BEFORE antibiotics.** Septic/shocked → antibiotics first.\nNever through cellulitis. **Prosthetic joint → theatre**, not ED.",s:"Pocket cards"},
{d:"Scores",q:"Ottawa ankle — X-ray criteria?",a:"Malleolar pain AND any of: bone tenderness at **posterior edge/tip of lateral or medial malleolus (distal 6 cm)** · unable to weight-bear **4 steps** immediately and in ED.",s:"Ottawa rules · Pocket cards"},
{d:"Scores",q:"Ottawa foot — X-ray criteria?",a:"Midfoot pain AND any of: tenderness at **base of 5th metatarsal** · **navicular** tenderness · can't weight-bear 4 steps.\nLess reliable <5 y, intoxication, distracting injury.",s:"Ottawa rules · Pocket cards"},
{d:"Scores",q:"Ottawa knee — X-ray if any of…?",a:"Age **≥55** · **fibular head** tenderness · **isolated patellar** tenderness · can't flex to **90°** · can't weight-bear 4 steps.",s:"Ottawa rules · Pocket cards"},
{d:"Scores",q:"CURB-65 — components and disposition?",a:"Confusion · Urea >7 · RR ≥30 · SBP <90 or DBP ≤60 · age ≥65.\n**0–1 home · 2 consider admission · 3–5 admit, consider critical care.**",s:"BTS/NICE · Pocket cards"},
{d:"Scores",q:"Centor and FeverPAIN — what are they?",a:"**Centor**: exudate · tender anterior nodes · no cough · fever history → 3–4 consider antibiotics.\n**FeverPAIN**: Fever · Purulence · Attend <3 d · Inflamed tonsils · No cough/coryza.",s:"NICE NG84 · Pocket cards"},
{d:"Trauma",q:"Head injury — CT within 1 HOUR criteria?",a:"GCS **≤12** on arrival · GCS **<15 at 2 h** · open/depressed # · any **basal skull #** sign · **post-traumatic seizure** · focal deficit · **>1 vomit**.",s:"NICE NG232 · Pocket cards"},
{d:"Trauma",q:"Head injury — CT within 8 HOURS criteria?",a:"LOC or amnesia PLUS any of: **age ≥65** · coagulopathy · dangerous mechanism · **>30 min retrograde amnesia**.",s:"NICE NG232 · Pocket cards"},
{d:"Trauma",f:"c",q:"Anticoagulated head injury, no other features — CT?",a:"**CONSIDER** CT within **8 h** of injury (or within **1 h** if presenting >8 h after).\nIncludes VKA, DOAC, heparin, LMWH, antiplatelets **except aspirin alone**.\n'Consider', not 'do' — changed from CG176.",s:"NICE NG232 · Pocket cards"},
{d:"Trauma",q:"Head injury — TXA rule?",a:"TXA if **GCS ≤12**, within **2 h** of injury, **before imaging**.",s:"NICE NG232 · Pocket cards"},
{d:"Trauma",q:"UK exam: Canadian CT head or NG232?",a:"**NG232.** Canadian is only there to be confused with it (high risk: GCS <15 at 2 h, open/basal #, ≥2 vomits, age ≥65).",s:"Pocket cards"},
{d:"Trauma",q:"Major trauma TXA — time limit?",a:"**ASAP; not beyond 3 h** unless hyperfibrinolysis.",s:"NICE NG39 · Pocket cards"},
{d:"Trauma",q:"Major trauma chest decompression before imaging — when, and which technique?",a:"**Only** if haemodynamic instability or severe respiratory compromise. **Open thoracostomy preferred** to needle.",s:"NICE NG39 · Pocket cards"},
{d:"Trauma",q:"Major trauma — role of FAST?",a:"**Do NOT use FAST before CT or to decide on CT.**",s:"NICE NG39 · Pocket cards"},
{d:"Trauma",q:"Major trauma on VKA — bleeding vs not bleeding?",a:"Bleeding → **PCC immediately**, not plasma. **No bleeding → do not reverse.**",s:"NICE NG39 · Pocket cards"},
{d:"Trauma",q:"Major haemorrhage volume strategy — exception to restrictive resuscitation?",a:"Restrictive until bleeding controlled **unless TBI dominant** → less restrictive. Plasma:RBC **1:1**.",s:"NICE NG39 · Pocket cards"},
{d:"Trauma",q:"Major trauma — RSI timing; bypass to MTC?",a:"RSI **within 45 min** of the call. Direct to MTC if journey **≤60 min**.",s:"NICE NG39/NG40 · Pocket cards"},
{d:"Trauma",q:"Last tetanus dose >10 years ago (primed) — tetanus-prone vs high-risk wound?",a:"**Prone** → vaccine. **High-risk** → vaccine **+ TIG**. Clean → nothing.",s:"UKHSA Green Book · Pocket cards"},
{d:"Trauma",q:"Who is treated as tetanus-unimmunised regardless of history?",a:"**PWID** where there's doubt · **severely immunosuppressed** even if fully vaccinated.",s:"UKHSA Green Book · Pocket cards"},
{d:"Trauma",q:"Parkland — formula and when the clock starts?",a:"**4 mL × kg × %TBSA** over 24 h; half in first **8 h from the time of burn**, not arrival.\nDon't count simple erythema; palm incl. fingers ≈ 1%.",s:"Pocket cards"},
{d:"Trauma",q:"Rule of nines — child vs adult differences?",a:"Adult: head 9, each leg 18. **Child: head 18, each leg 14.** Lund & Browder more accurate.",s:"Pocket cards"},
{d:"Sepsis",f:"c",q:"Paediatric sepsis bolus (NG254)?",a:"**10 mL/kg over <10 min, max 250 mL**, glucose-free, Na 130–154. <28 days: 10–20 mL/kg.\nOlder RCEMLearning pages say **20 mL/kg** — they predate NG254. Answer NICE.\n2 boluses no better → consultant in person.",s:"NICE NG254 · Pocket cards"},
{d:"Sepsis",q:"Paed sepsis: 2+ moderate criteria — what next, and what upgrades to high risk?",a:"Clinician review + **venous lactate within 1 h**.\n2+ moderate **AND lactate >2 or AKI → treat as HIGH**.\n1 moderate, lactate <2, no AKI → senior decision-maker within 3 h.",s:"NICE NG254 · Pocket cards"},
{d:"Sepsis",q:"RR 25 in a 6-year-old vs a 9-year-old?",a:"**6 y: moderate** (24–26). **8–11 y: HIGH** (≥25). Read the age first.",s:"NICE NG254 · Pocket cards"},
{d:"Sepsis",q:"Paed sepsis 12–15 y: which table uses BP, and what's missing?",a:"Only 12–15 y uses **systolic BP** (high ≤90 or >40 below normal; moderate 91–100). **No capillary refill** criterion here.",s:"NICE NG254 · Pocket cards"},
{d:"Sepsis",q:"Paed sepsis — who gets referred to paediatrics?",a:"**Any high criterion**, OR **immunosuppressed + any moderate**. Lactate >4 (<12 y) → + critical care.",s:"NICE NG254 · Pocket cards"},
{d:"Resus",f:"c",q:"IO access timing: adult vs child (RCUK 2025)?",a:"Adult: IV first, IO after **2 failed attempts**. Child: IO after **5 min**.",s:"RCUK 2025 · Pocket cards"},
{d:"Resus",q:"Shockable arrest — first shock energy; after 3 failed shocks?",a:"First shock **≥150 J** (unknown → highest). After 3 failed → **fresh pads, antero-posterior**. No routine dual sequential.",s:"RCUK ALS 2025 · Pocket cards"},
{d:"Resus",q:"Routine drugs NOT given in adult arrest?",a:"No routine **calcium, bicarbonate or steroids**.",s:"RCUK ALS 2025 · Pocket cards"},
{d:"Resus",q:"Ventilator during CPR — settings?",a:"Volume control **6–8 mL/kg IBW**, rate **10**, max FiO2, Ti 1–2 s, PEEP 0–5, peak alarm 60–70, **flow trigger OFF**. Not effective → manual.",s:"RCUK 2025 · Pocket cards"},
{d:"Resus",q:"Failed intubation in arrest?",a:"**2 attempts** (operator >95% success) → SGA or bag-mask. Interruption <5 s. Cric only if can't oxygenate. SGA big leak → pause, 30:2.",s:"RCUK 2025 · Pocket cards"},
{d:"Resus",q:"Paediatric adrenaline: arrest vs bradycardia dose?",a:"Arrest **10 mcg/kg**; bradycardia **1–2 mcg/kg**. Tenfold apart. Obese child → ideal body weight.",s:"RCUK PLS 2025 · Pocket cards"},
{d:"Resus",q:"Paediatric defib energy?",a:"**4 J/kg**, escalating to max **8 J/kg** after 5 shocks.",s:"RCUK PLS 2025 · Pocket cards"},
{d:"Resus",q:"HOTT — paediatric traumatic arrest?",a:"**H**ypovolaemia · **O**xygenation · **T**ension · **T**amponade — address before pads.",s:"RCUK PLS 2025 · Pocket cards"},
{d:"Resus",q:"Hypothermic arrest below 30 °C — shocks and adrenaline?",a:"Max **3 shocks** then delay until >30 °C. Adults: **withhold adrenaline**, give 1 mg once 30 °C reached. 30–35 °C: adrenaline every **6–10 min**.",s:"RCUK Special Circs 2025 · Pocket cards"},
{d:"Resus",q:"Hypothermia — direct to ECPR centre if?",a:"HR <45 · SBP <90 · ventricular arrhythmia · core temp <30 °C.",s:"RCUK 2025 · Pocket cards"},
{d:"Resus",q:"Maternal arrest — uterine displacement method and where to do hysterotomy?",a:"**Manual left uterine displacement**, not tilt. Hysterotomy **at the site of arrest**.\n4Ps: pre-eclampsia · puerperal sepsis · placental/uterine · peripartum cardiomyopathy.",s:"RCUK 2025 · Pocket cards"},
{d:"Trauma",q:"Facial burn with hoarse voice and soot — airway?",a:"**Early intubation with an uncut tube.**",s:"Pocket cards"},
// ---------- added 25/09/2026: OBS1 + MIX11 misses, sepsis triad ----------
{d:"Obstetric",f:"p",q:"Ectopic: the FOUR criteria that must ALL hold to offer systemic methotrexate.",a:"No significant pain · adnexal mass **<35 mm** · **no** fetal heartbeat · hCG **<1,500 IU/L**.\nPlus: no intrauterine pregnancy on scan, and she can attend follow-up.",s:"NICE NG126 · missed OBS1 Q3"},
{d:"Obstetric",f:"p",q:"Ectopic: what pushes you to SURGERY first line?",a:"**Any one** of: significant pain · mass **\u226535 mm** · fetal heartbeat visible · hCG **\u22655,000 IU/L**.\nAlso if she cannot attend follow-up. Laparoscopic wherever possible.",s:"NICE NG126 · missed OBS1 Q4"},
{d:"Obstetric",f:"p",q:"Rhesus-negative, SURGICAL management of miscarriage or ectopic \u2014 anti-D dose?",a:"**250 IU (50 micrograms)**.\nNot 500, not 1,500 \u2014 those are the antenatal/postnatal obstetric doses. No Kleihauer gate for this indication.",s:"NICE NG126 · missed OBS1 Q6"},
{d:"Obstetric",f:"p",q:"NG255 \u2014 how long does someone count as \u201crecently pregnant\u201d?",a:"**4 weeks** after giving birth.\n**24 hours** after a miscarriage or termination.\nNG253 (adult sepsis) explicitly EXCLUDES these people.",s:"NICE NG255 19/11/2025 · missed OBS1 Q15"},
{d:"Obstetric",f:"p",q:"Pregnant/recently pregnant, high-risk sepsis criterion \u2014 initial fluid bolus?",a:"**500 mL crystalloid (Na\u207a 130\u2013154 mmol/L) over <15 min**, within 1 hour.\nThe 250 mL bolus with a 1,000 mL cap is NG253 \u2014 non-pregnant adults.",s:"NICE NG255 19/11/2025 · missed OBS1 Q16"},
{d:"Obstetric",f:"p",q:"NG255: no response 1 hour after intervention, still high-risk \u2014 who comes?",a:"**Alert a consultant to attend IN PERSON.**\nNot a phone call, not the registrar.",s:"NICE NG255 19/11/2025 · missed OBS1 Q18"},
{d:"Obstetric",f:"p",q:"Postpartum sepsis with retained products / infected collection \u2014 source control?",a:"**Involve the obstetrician and the relevant surgical team EARLY** \u2014 do not wait for microbiology or repeat imaging.",s:"NICE NG255 19/11/2025 · missed OBS1 Q20"},
{d:"Sepsis",f:"p",q:"The three 2025 sepsis guidelines \u2014 which applies to whom?",a:"**NG253** \u2014 adults & young people 16+, NOT pregnant/recently pregnant.\n**NG254** \u2014 under 16s.\n**NG255** \u2014 pregnant, or recently pregnant (4 weeks post-birth / 24 h post-miscarriage or TOP).\nScope first, then the numbers.",s:"NICE NG253/254/255 · missed MIX9, MIX11, OBS1",v:`<svg viewBox="0 0 460 210" role="img" aria-label="NG253, NG254 and NG255 compared by scope, fluid bolus and escalation"><g font-size="11"><rect x="4" y="4" width="144" height="200" rx="8" fill="none" stroke="var(--slo3)" stroke-width="2"/><rect x="158" y="4" width="144" height="200" rx="8" fill="none" stroke="var(--slo5)" stroke-width="2"/><rect x="312" y="4" width="144" height="200" rx="8" fill="none" stroke="var(--slo1)" stroke-width="2"/><text x="76" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--slo3)">NG253</text><text x="230" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--slo5)">NG254</text><text x="384" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--slo1)">NG255</text><text x="76" y="44" text-anchor="middle" fill="var(--fig-ink)">adults 16+</text><text x="76" y="58" text-anchor="middle" fill="var(--fig-ink)">NOT pregnant</text><text x="230" y="44" text-anchor="middle" fill="var(--fig-ink)">under 16s</text><text x="384" y="44" text-anchor="middle" fill="var(--fig-ink)">pregnant, or</text><text x="384" y="58" text-anchor="middle" fill="var(--fig-ink)">4 wks post-birth</text><text x="384" y="72" text-anchor="middle" fill="var(--fig-ink)">24 h post-TOP</text><line x1="14" y1="92" x2="138" y2="92" stroke="var(--fig-line)" stroke-dasharray="3 3"/><line x1="168" y1="92" x2="292" y2="92" stroke="var(--fig-line)" stroke-dasharray="3 3"/><line x1="322" y1="92" x2="446" y2="92" stroke="var(--fig-line)" stroke-dasharray="3 3"/><text x="76" y="108" text-anchor="middle" font-size="9" fill="var(--fig-line)">BOLUS</text><text x="230" y="108" text-anchor="middle" font-size="9" fill="var(--fig-line)">BOLUS</text><text x="384" y="108" text-anchor="middle" font-size="9" fill="var(--fig-line)">BOLUS</text><text x="76" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="var(--slo3)">250 mL</text><text x="76" y="140" text-anchor="middle" font-size="10" fill="var(--fig-ink)">10&#8211;15 min</text><text x="76" y="153" text-anchor="middle" font-size="10" fill="var(--fig-ink)">max 1000 mL</text><text x="230" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="var(--slo5)">10 mL/kg</text><text x="230" y="140" text-anchor="middle" font-size="10" fill="var(--fig-ink)">&lt;10 min</text><text x="230" y="153" text-anchor="middle" font-size="10" fill="var(--fig-ink)">max 250 mL</text><text x="384" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="var(--slo1)">500 mL</text><text x="384" y="140" text-anchor="middle" font-size="10" fill="var(--fig-ink)">&lt;15 min</text><text x="384" y="153" text-anchor="middle" font-size="10" fill="var(--fig-ink)">Na 130&#8211;154</text><line x1="14" y1="170" x2="446" y2="170" stroke="var(--fig-line)"/><text x="230" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-ink)">no response at 1 hour &#8594; consultant in person</text><text x="230" y="201" text-anchor="middle" font-size="9" fill="var(--fig-line)">same in all three</text></g></svg>`,vc:"Scope differs · bolus differs · escalation is identical"},
{d:"Sepsis",f:"p",q:"High-risk criterion met \u2014 fluid bolus for adult vs pregnant?",a:"**Adult (NG253): 250 mL over 10\u201315 min**, reassess, max **1,000 mL** before senior review.\n**Pregnant (NG255): 500 mL over <15 min.**\nThis is the discriminator examiners love.",s:"NICE NG253 / NG255 · missed OBS1 Q16"},
{d:"Sepsis",f:"p",q:"No response 1 hour after intervention \u2014 escalation in each guideline?",a:"All three: **consultant to attend in person**.\nThe scope and the bolus differ; the escalation does not.",s:"NICE NG253/254/255"},
{d:"Paediatrics",f:"p",q:"NG143 traffic light \u2014 which age row does a red RR of \u226560 belong to?",a:"**0\u20135 months only.**\n6\u201312 months: \u226550. Over 12 months: no RR red \u2014 >40 is AMBER.\n**Read the age column before the number.**",s:"NICE NG143 26/11/2021 · missed PAED-M1 Q15 AND MIX11 Q4"},
{d:"Paediatrics",f:"p",q:"NG143 \u2014 name three RED features that mandate 999 referral.",a:"Mottled/pale/ashen/blue · **no response to social cues** / does not wake / weak or continuous cry · **grunting** · moderate\u2013severe chest indrawing · RR by age · reduced skin turgor · non-blanching rash · bulging fontanelle · neck stiffness · status epilepticus · focal neurology or seizures.\nRed = immediate emergency care, usually 999.",s:"NICE NG143 26/11/2021"},
// ---------- added 27/09/2026: MOCK2 Part B misses ----------
{d:"Sedation",f:"p",q:"RCEM procedural sedation \u2014 minimum staffing?",a:"**Three clinicians**: a **sedationist whose sole responsibility is sedation and monitoring**, a trained nurse, and a proceduralist.\nThe sedationist doing nothing else is the whole point \u2014 one doctor sedating AND operating is what the standard exists to prevent.\nAll need ILS/ALS and level-appropriate sedation sign-off.",s:"RCEM Procedural Sedation BPG Aug 2022 · missed MOCK2 Q43"},
{d:"Sedation",f:"p",q:"Ketamine \u2014 the three dose ranges and which is which?",a:"**IV dissociative: 10\u201330 mg initially**, then **1 mg/kg every 5\u201310 min**.\n**IM dissociative: 4\u20135 mg/kg**, repeats 2\u20132.5 mg/kg (no IV access).\n**Sub-dissociative analgesia: 0.3 mg/kg** \u2014 different indication entirely.\nThe commonest confusion in this area, and all three appear as distractors together.",s:"RCEM Procedural Sedation BPG Aug 2022 · missed MOCK2 Q44"},
{d:"Sedation",f:"p",q:"Propofol for procedural sedation — adult vs elderly dose?",a:"**Adult: 0.5–1.0 mg/kg slowly**, then **0.5 mg/kg every 3–5 min**.\n**Elderly or debilitated: 10–20 mg initially**, repeated in 10–20 mg increments — the guideline says halving the dose is safe and effective.\n**Do not invert these.** The mg/kg figure is the ADULT dose; the absolute 10–20 mg is the ELDERLY one. 1.5–2.5 mg/kg is GA induction, not sedation.",s:"RCEM Procedural Sedation BPG Aug 2022 · verified at source 29/09/2026 — CORRECTED (was inverted)"},
{d:"Sedation",q:"Fasting before ED procedural sedation?",a:"**Individual risk assessment \u2014 strict elective fasting is NOT required in the ED.**\nDon't delay for 6 hours, and don't demand an anaesthetist just because the patient ate.",s:"RCEM Procedural Sedation BPG Aug 2022"},
{d:"Trauma",f:"p",q:"NG232 \u2014 the ADULT 8-hour CT head list (all four)?",a:"**Age 65 or over** \u00b7 **any current bleeding or clotting disorder** \u00b7 **dangerous mechanism of injury** \u00b7 **more than 30 min retrograde amnesia**.\nDangerous mechanism includes a fall of **>1 metre or 5 stairs** [C].\nAnticoagulant/antiplatelet (not aspirin alone) with nothing else: consider CT within 8 h \u2014 or within 1 h if they present >8 h after injury.",s:"NICE NG232 18/05/2023 · missed MOCK2 Q40",v:`<svg viewBox="0 0 460 200" role="img" aria-label="NG232 adult CT head: the one-hour list versus the eight-hour list"><rect x="4" y="4" width="220" height="192" rx="8" fill="none" stroke="var(--slo3)" stroke-width="2"/><rect x="236" y="4" width="220" height="192" rx="8" fill="none" stroke="var(--slo4)" stroke-width="2"/><text x="114" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--slo3)">WITHIN 1 HOUR</text><text x="114" y="40" text-anchor="middle" font-size="9" fill="var(--fig-line)">GCS &amp; signs</text><text x="346" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--slo4)">WITHIN 8 HOURS</text><text x="346" y="40" text-anchor="middle" font-size="9" fill="var(--fig-line)">risk factors</text><g font-size="10.5" fill="var(--fig-ink)"><text x="18" y="62">GCS &#8804;12 initially</text><text x="18" y="80">GCS &lt;15 at 2 hours</text><text x="18" y="98">open / depressed fracture</text><text x="18" y="116">basal skull fracture sign</text><text x="18" y="134">post-traumatic seizure</text><text x="18" y="152">focal neuro deficit</text><text x="18" y="170">&gt;1 episode of vomiting</text><text x="250" y="62">age &#8805;65</text><text x="250" y="80">bleeding / clotting disorder</text><text x="250" y="98">dangerous mechanism</text><text x="250" y="116">&gt;30 min retrograde amnesia</text></g><text x="250" y="142" font-size="10.5" font-weight="700" fill="var(--slo4)">on anticoagulant, nothing else:</text><text x="250" y="158" font-size="10" fill="var(--fig-ink)">consider CT within 8 h &#8212; or</text><text x="250" y="172" font-size="10" fill="var(--fig-ink)">within 1 h if presenting &gt;8 h after</text><text x="114" y="190" text-anchor="middle" font-size="9" fill="var(--fig-line)">any ONE is enough</text><text x="346" y="190" text-anchor="middle" font-size="9" fill="var(--fig-line)">any ONE is enough</text></svg>`,vc:"One list is GCS-driven, the other risk-factor-driven"},
{d:"Trauma",q:"NG232 \u2014 the ADULT 1-hour CT head list?",a:"GCS **\u226412 initially** \u00b7 GCS **<15 at 2 hours** \u00b7 suspected **open or depressed** skull fracture \u00b7 any **basal skull fracture** sign \u00b7 **post-traumatic seizure** \u00b7 **focal neurological deficit** \u00b7 **more than one** episode of vomiting.\nThis list is GCS- and sign-driven. The 8-hour list is risk-factor-driven.",s:"NICE NG232 18/05/2023"},
{d:"Paediatrics",f:"p",q:"NG232 children \u2014 which features need MORE THAN ONE to trigger a 1-hour CT?",a:"**LOC >5 min** \u00b7 **abnormal drowsiness** \u00b7 **\u22653 discrete vomits** \u00b7 **dangerous mechanism** \u00b7 **amnesia >5 min** \u00b7 **bleeding or clotting disorder**.\nTwo or more of these \u2192 CT within 1 hour. Count them before you decide.",s:"NICE NG232 rec 1.5.11 · missed MOCK2 Q52"},
{d:"Paediatrics",q:"NG232 children \u2014 which features trigger a 1-hour CT on their OWN?",a:"Suspected **non-accidental injury** \u00b7 **post-traumatic seizure** \u00b7 GCS **<14** (**<15 if under 1 year**) \u00b7 GCS **<15 at 2 hours** \u00b7 skull fracture signs or **tense fontanelle** \u00b7 **focal deficit** \u00b7 under 1 year with bruise/swelling/laceration **>5 cm**.\nOne is enough here; the other list needs two.",s:"NICE NG232 rec 1.5.10"},
{d:"Trauma",f:"p",q:"Catastrophic limb bleeding not controlled by direct pressure \u2014 and the pelvis?",a:"**Tourniquet** once direct pressure has failed to control life-threatening haemorrhage.\n**Purpose-made pelvic binder** \u2014 improvised ONLY if a purpose-made one does not fit. **The order matters.**\nHaemorrhage control comes before imaging, not after.",s:"NICE NG39 recs 1.5.2\u20131.5.3 · missed MOCK2 Q34"},
{d:"Trauma",f:"p",q:"Patient at risk of compartment syndrome \u2014 how often assessed?",a:"**Hourly, with the findings documented** \u2014 positive or negative \u2014 plus an interpretation and the rationale for management.\nRecord the **analgesia dose, rate and response**; a rising opiate requirement is part of the assessment.\nPressure monitoring is for inconclusive or impossible clinical assessment (unconscious, regional block), not routine use.",s:"BOASt compartment syndrome updated Jul 2025 · missed MOCK2 Q39",v:`<svg viewBox="0 0 460 165" role="img" aria-label="Compartment pressure thresholds: differential under 30 and absolute over 40 mmHg"><text x="8" y="18" font-size="9" fill="var(--fig-line)">DIFFERENTIAL = diastolic BP &#8722; compartment pressure</text><line x1="30" y1="46" x2="430" y2="46" stroke="var(--fig-line)" stroke-width="2"/><rect x="30" y="38" width="150" height="16" fill="var(--slo3)" opacity="0.28"/><line x1="180" y1="32" x2="180" y2="60" stroke="var(--slo3)" stroke-width="2"/><text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--slo3)">30</text><text x="105" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="var(--slo3)">&lt;30 = increased risk</text><text x="105" y="89" text-anchor="middle" font-size="9" fill="var(--fig-line)">consultant decides</text><text x="300" y="76" text-anchor="middle" font-size="10" fill="var(--fig-ink)">&#8805;30 mmHg</text><text x="8" y="118" font-size="9" fill="var(--fig-line)">ABSOLUTE compartment pressure</text><line x1="30" y1="140" x2="430" y2="140" stroke="var(--fig-line)" stroke-width="2"/><rect x="250" y="132" width="180" height="16" fill="var(--slo3)" opacity="0.28"/><line x1="250" y1="126" x2="250" y2="154" stroke="var(--slo3)" stroke-width="2"/><text x="250" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="var(--slo3)">40</text><text x="345" y="163" text-anchor="middle" font-size="10" font-weight="700" fill="var(--slo3)">&gt;40 &#8594; consider fasciotomy</text><text x="130" y="163" text-anchor="middle" font-size="10" fill="var(--fig-ink)">&#8804;40 mmHg</text></svg>`,vc:"Both thresholds crossed in the exam stem: differential 18, absolute 52"},
{d:"Cardio",f:"p",q:"Platelet transfusion \u2014 the bleeding threshold vs the prophylactic one?",a:"**Clinically significant bleeding + platelets <30 \u00d7 10\u2079/L \u2192 offer platelets.**\n**<10 \u00d7 10\u2079/L** is the PROPHYLACTIC threshold in a patient who is not bleeding [C].\nDo not routinely give more than a **single dose**.\nRed cells for comparison: 70 g/L (target 70\u201390); **80 g/L (target 80\u2013100) in ACS**.",s:"NICE NG24 recs 1.7.1, 1.8.1, 1.5.2\u20131.5.3 · missed MOCK2 Q56 & Q10",v:`<svg viewBox="0 0 460 160" role="img" aria-label="Red cell and platelet transfusion thresholds"><text x="8" y="18" font-size="9" fill="var(--fig-line)">RED CELLS &#8212; haemoglobin g/L</text><line x1="40" y1="52" x2="430" y2="52" stroke="var(--fig-line)" stroke-width="2"/><line x1="150" y1="40" x2="150" y2="64" stroke="var(--slo1)" stroke-width="2"/><text x="150" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--slo1)">70</text><rect x="150" y="45" width="80" height="14" fill="var(--slo1)" opacity="0.3"/><text x="190" y="76" text-anchor="middle" font-size="9" fill="var(--fig-ink)">target 70&#8211;90</text><text x="190" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="var(--slo1)">everyone else</text><line x1="270" y1="40" x2="270" y2="64" stroke="var(--slo3)" stroke-width="2"/><text x="270" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--slo3)">80</text><rect x="270" y="45" width="90" height="14" fill="var(--slo3)" opacity="0.3"/><text x="315" y="76" text-anchor="middle" font-size="9" fill="var(--fig-ink)">target 80&#8211;100</text><text x="315" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="var(--slo3)">acute coronary syndrome</text><text x="8" y="118" font-size="9" fill="var(--fig-line)">PLATELETS &#8212; count &#215;10&#8313;/L</text><line x1="40" y1="140" x2="430" y2="140" stroke="var(--fig-line)" stroke-width="2"/><line x1="120" y1="130" x2="120" y2="150" stroke="var(--fig-line)" stroke-width="2"/><text x="120" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-ink)">10</text><text x="120" y="158" text-anchor="middle" font-size="9" fill="var(--fig-line)">prophylaxis, not bleeding</text><line x1="300" y1="130" x2="300" y2="150" stroke="var(--slo3)" stroke-width="2"/><text x="300" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="var(--slo3)">30</text><text x="300" y="158" text-anchor="middle" font-size="9" font-weight="700" fill="var(--slo3)">bleeding &#8594; transfuse</text></svg>`,vc:"Four numbers, two products — learn them as a block"},
// ---------- RCEMLearning batch 1, added 27/09/2026 ----------
{d:"Endocrine",q:"Thyroid storm — which antithyroid drug goes first, and when is iodine given?",a:"**Propylthiouracil 150–300 mg QDS first**, then **Lugol's iodine ~1 hour later**. Giving iodine first can fuel more hormone production.",s:"RCEMLearning: Thyroid Storm (no UK guideline verified)"},
{d:"Endocrine",q:"Thyroid storm — beta-blocker of choice, steroid, and which antipyretic to avoid?",a:"**Propranolol** (also blocks T4→T3), e.g. 1 mg IV repeated to max 10 mg; target HR ~100. **Hydrocortisone 200 mg IV.** **Avoid aspirin** — it raises free thyroxine.",s:"RCEMLearning: Thyroid Storm \\u2014 no UK guideline verified"},
{d:"Endocrine",q:"Burch–Wartofsky score cut-offs?",a:"**≥45 highly suggestive · 25–44 impending · <25 unlikely.** Diagnosis is clinical — no hormone level defines storm.",s:"RCEMLearning: Thyroid Storm \\u2014 no UK guideline verified"},
{d:"Endocrine",q:"Suspected phaeochromocytoma crisis — first drug class, and what must never be given alone?",a:"**Alpha-blockade first** (phenoxybenzamine; phentolamine 5–10 mg for paroxysms). **Never a beta-blocker alone** — unopposed alpha → worse hypertension.",s:"RCEMLearning: Phaeochromocytoma \\u2014 no UK guideline verified"},
{d:"Endocrine",q:"Hypercalcaemia of malignancy — first step and the main drug? Role of furosemide?",a:"**IV 0.9% saline first** (1–2 L then 200–500 mL/h), then **bisphosphonate** (zoledronate/pamidronate — takes 2–4 days). Furosemide **only if fluid overloaded**.",s:"RCEMLearning: Hypercalcaemia in Malignancy \\u2014 no UK guideline verified"},
{d:"Endocrine",q:"Hyperkalaemia: is salbutamol ever a sole agent? Which fluid?",a:"**Never alone** \u2014 a substantial minority do not respond; it is an adjuvant only.\n**Calcium stabilises the myocardium but does NOT lower potassium.**\nBalanced crystalloid over 0.9% saline is RCEMLearning teaching \u2014 UKKA 2023 states no fluid preference, so do not attribute it to UKKA.",s:"UKKA Oct 2023 (salbutamol, calcium) \u00b7 fluid point RCEMLearning only"},
{d:"Endocrine",f:"c",q:"Hyperkalaemia with ECG changes \u2014 calcium and insulin doses?",a:"**Calcium gluconate 10% 30 mL over 10 min**, or **calcium chloride 10% 10 mL over 5 min** (chloride preferred in resuscitation). Both give 6.8 mmol calcium.\n**Insulin 10 units in 25 g glucose** IV \u2014 then **monitor glucose for 6 hours**.\nBands: mild 5.5\u20135.9 \u00b7 moderate 6.0\u20136.4 \u00b7 severe \u22656.5.\nAn older RCEMLearning page quotes 10\u201320 mL gluconate \u2014 use UKKA.",s:"UKKA Oct 2023, verified at source 27/09/2026"},
{d:"Endocrine",q:"Rhabdomyolysis — bicarbonate and mannitol? Does CK predict prognosis?",a:"Mainstay: **aggressive IV fluids** (can be up to 10 L). Bicarbonate and mannitol are **unproven**. **CK doesn't predict prognosis.** Be cautious giving calcium for hyperkalaemia (Ca may be low or high).",s:"RCEMLearning: Rhabdomyolysis \\u2014 no UK guideline verified"},
{d:"Haem",f:"c",q:"Sickle cell acute painful episode — analgesia time standard?",a:"**Offer analgesia within 30 MINUTES of presentation.** Then assess pain relief **every 30 min** until satisfactory, and at least **4-hourly** thereafter.\nA 15-minute figure circulates in teaching material — the guideline says 30.",s:"NICE CG143 recs 1.1.4, 1.1.12 · verified at source 28/09/2026 — CORRECTED"},
{d:"Haem",q:"Acute chest syndrome \u2014 antibiotic cover and transfusion trigger?",a:"Broad spectrum **plus atypical cover** (Chlamydia in adults, Mycoplasma in children).\nDiscuss transfusion if **PaO\u2082 below 70 mmHg (~9.3 kPa) on air**, or a **drop of more than 10% from baseline**.\nNo transfusion for asymptomatic anaemia in a simple vaso-occlusive crisis.",s:"RCEMLearning \u2014 no UK guideline verified"},
{d:"Haem",q:"Known ITP, platelets 40, no significant bleeding?",a:"**No ED treatment** — discuss with haematology, follow-up within 48 h.\nTreat (steroids, or IVIG) if **<30** with none/minor bleeding, or **<50 with significant bleeding**. Admit if **<10**.",s:"RCEMLearning: ITP \\u2014 no UK guideline verified"},
{d:"Haem",q:"ITP with life-threatening bleeding?",a:"**Platelet transfusion + corticosteroids + IVIG** together, with early haematology input.",s:"RCEMLearning: ITP \\u2014 no UK guideline verified"},
{d:"Haem",q:"Mild febrile transfusion reaction (T ≥38 or rise of 1–2 °C, no other symptoms)?",a:"**Paracetamol and continue** with close observation.\nFever **plus rigors/hypotension/systemic symptoms** → **stop**; think bacterial contamination or haemolysis.",s:"BSH via RCEMLearning ref: Transfusion Reactions"},
{d:"Haem",q:"Which transfusion reactions must be reported to SHOT/MHRA?",a:"**All except mild febrile and mild allergic** — reported via SABRE (a legal requirement).",s:"RCEMLearning ref: Transfusion Reactions"},
{d:"Environment",q:"Heat stroke — definition and target cooling temperature?",a:"Core **>40 °C + encephalopathy** (SIRS picture). Cool with **tepid spray + fans**, stop at **38.5 °C** (avoid overshoot). Benzodiazepines for shivering/seizures. **No dantrolene.**",s:"RCEMLearning: Heat-Related Illness \\u2014 no UK guideline verified"},
{d:"Environment",q:"Drug-induced hyperthermia — which one gets dantrolene?",a:"**Malignant hyperthermia → dantrolene.**\n**Serotonin syndrome** → fluids + **benzodiazepines**, cyproheptadine if severe; dantrolene unhelpful; avoid physical restraint.\n**NMS** → stop drug; bromocriptine/dantrolene if severe.",s:"RCEMLearning: Drug-Induced Hyperthermia \\u2014 no UK guideline verified"},
{d:"Environment",q:"Serotonin syndrome — the key examination finding?",a:"**Clonus** (inducible, spontaneous, ocular) — plus mydriasis, diaphoresis, hyperactive bowel sounds.",s:"RCEMLearning: Drug-Induced Hyperthermia \\u2014 no UK guideline verified"},
{d:"Environment",q:"Hypothermia: correct the ABG for temperature? Treat coagulopathy with factors?",a:"**Don't temperature-correct** the ABG. Coagulopathy → **rewarm**, not clotting factors. Handle gently (VF risk).",s:"RCEMLearning: Severe Hypothermia \\u2014 no UK guideline verified"},
{d:"Environment",q:"Diver with suspected decompression illness — oxygen, analgesia, what to avoid?",a:"**15 L/min via non-rebreather regardless of SpO2**; call the **national diving helpline**. **No Entonox.** Avoid NSAIDs (and opioids where possible). CXR for pneumothorax.",s:"RCEMLearning: Decompression Illness \\u2014 no UK guideline verified"},
{d:"Infection",q:"Severe falciparum malaria — first-line treatment? Quinine caveat?",a:"**IV artesunate.** If unavailable → IV quinine (+ doxycycline/clindamycin) — watch for **hypoglycaemia**.",s:"RCEMLearning: Malaria \\u2014 no UK guideline verified"},
{d:"Infection",q:"Some WHO criteria for severe malaria?",a:"Any one: **GCS <11** (cerebral), shock, **bicarbonate <15**, severe anaemia, hypoglycaemia, AKI, pulmonary oedema, bleeding/DIC, jaundice, hyperparasitaemia.",s:"RCEMLearning: Malaria \\u2014 no UK guideline verified"},
{d:"Infection",f:"c",q:"Suspected bacterial meningitis — empirical antibiotics by age?",a:"**IV ceftriaxone first line at ALL ages** (cefotaxime if ceftriaxone contraindicated), **plus IV amoxicillin where Listeria is a risk** — babies under 3 months, and older people.\nNG240 does NOT give mg/kg figures: **use the highest doses in the BNF/BNFC** or local policy.\nOLD (CG102): cefotaxime-first under 3 months, ceftriaxone 80 mg/kg over. Superseded.",s:"NICE NG240, March 2024 · verified at source 28/09/2026 — CORRECTED"},
{d:"Infection",f:"c",q:"Bacterial meningitis — when is dexamethasone given?",a:"**Over 3 months, with strongly suspected or confirmed bacterial meningitis** — give IV dexamethasone, **first dose with or before the first antibiotic dose** if possible.\n**Continue** for pneumococcus or Hib; **stop** for any other organism. Doses per BNF/BNFC (off-label).\nOLD (CG102): gated on CSF appearance, WCC >1000, protein >1 g/L or organisms on Gram stain. **Those CSF triggers are GONE** — do not answer them.",s:"NICE NG240, March 2024 · verified at source 28/09/2026 — CORRECTED"},
{d:"Infection",q:"Kawasaki disease — IVIG dose and timing; aspirin dose?",a:"**IVIG 2 g/kg single dose**, best **within 10 days** of fever onset. **Aspirin 30–50 mg/kg/day**, then 3–5 mg/kg for 6–8 weeks.\nNormal echo does NOT exclude it.",s:"RCEMLearning: Kawasaki \\u2014 no UK guideline verified"},
{d:"Eye",q:"GCA without visual symptoms — steroid? With visual symptoms?",a:"No visual loss: **prednisolone 40–60 mg** daily.\nVisual symptoms: **IV glucocorticoids** (or pred 1 mg/kg if IV not possible) + same-day ophthalmology. Never wait for biopsy/ESR.",s:"RCEMLearning ref: GCA (2025)"},
{d:"Eye",q:"GCA — most specific symptom? Does a normal ESR exclude it?",a:"**Jaw claudication.** **No** — check CRP too; a negative biopsy doesn't exclude it either (skip lesions).",s:"RCEMLearning ref: GCA"},
{d:"Eye",q:"Acute angle-closure glaucoma — definitive treatment?",a:"**Laser/surgery.** Medical therapy (acetazolamide, topical miotic/antihypertensives) only controls symptoms until then.",s:"RCEMLearning: Sudden Visual Loss \\u2014 no UK guideline verified"},
{d:"Eye",q:"Corneal abrasion — eye pad, mydriatic, topical steroid, LA drops to take home?",a:"**None of them.** Topical antibiotic + analgesia. Contact lens wearer → **anti-pseudomonal** antibiotic. No routine tetanus.",s:"RCEMLearning: Corneal Injuries \\u2014 no UK guideline verified"},
{d:"Eye",q:"Chemical eye splash vs CS spray — irrigate?",a:"Chemical: **irrigate until pH neutral.**\n**CS spray: irrigation worsens it — don't.**",s:"RCEMLearning: Corneal Injuries \\u2014 no UK guideline verified"},
{d:"Eye",q:"Angle-grinder injury, no visible foreign body?",a:"Suspect an **intraocular FB** → imaging. A missed **ferrous** IOFB causes late visual loss (siderosis).",s:"RCEMLearning: Ocular Trauma \\u2014 no UK guideline verified"},
{d:"Eye",q:"Pre-septal or orbital cellulitis — unsure?",a:"Treat as **orbital cellulitis**: IV antibiotics + urgent ophthalmology; get a senior/ophthalmology opinion.",s:"RCEMLearning: Eye Infections \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Severe hypertension in pregnancy — threshold and first-line drug?",a:"**≥160/110** → urgent treatment. **Labetalol first**, nifedipine MR second (e.g. oral nifedipine MR 10 mg or labetalol 200 mg, then IV labetalol/hydralazine).",s:"NICE NG133 via RCEMLearning ref"},
{d:"Obstetric",q:"Eclampsia — magnesium regimen?",a:"**4 g IV over 5–10 min**, then **1 g/h for 24 h**; recurrent seizure → further **2 g** bolus. Not responding → think other diagnosis (e.g. venous sinus thrombosis).",s:"RCEMLearning: Hypertensive Disorders \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Seizure at 30 weeks in a woman without known epilepsy?",a:"**Treat as eclampsia — magnesium sulphate**, whatever the BP.",s:"RCEMLearning: Hypertensive Disorders \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Rh-negative, bleeding at 9 weeks (threatened miscarriage, light) — anti-D?",a:"**Not needed** <12 weeks unless ectopic, molar, therapeutic termination, or heavy/repeated bleeding or bleeding with pain.",s:"RCEMLearning: Bleeding in Pregnancy \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Anti-D dose and FMH test by gestation; deadline?",a:"**Before 20 weeks: minimum 250 IU**, no fetomaternal haemorrhage test needed.\n**At or after 20 weeks: minimum 500 IU PLUS an FMH test** to calculate any additional dose.\nWithin **72 hours** of the event; some protection up to 10 days. **IM deltoid** — IV or SC if platelets ≤30.",s:"BSH/BCSH anti-D guideline 2014 · verified at source 28/09/2026"},
{d:"Obstetric",q:"PV bleeding after 24 weeks — vaginal examination?",a:"**No digital VE** — may precipitate catastrophic haemorrhage (placenta praevia).",s:"RCEMLearning: Bleeding in Pregnancy \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Early pregnancy loss with bradycardia and hypotension?",a:"**Cervical shock** — remove products from the os with speculum + sponge forceps.",s:"RCEMLearning: Bleeding in Pregnancy \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"Pregnant trauma patient — when to use manual uterine displacement? Chest drain site?",a:"Uterus **at/above umbilicus (≈>20 weeks)** → continuous manual displacement. Chest drain **one or two spaces higher (3rd–4th ICS)**. A 'normal' PaCO2 = impending respiratory failure.",s:"RCEMLearning: Trauma in Pregnancy \\u2014 no UK guideline verified"},
{d:"Obstetric",f:"c",q:"Hyperemesis \u2014 IV fluid, why not dextrose, and urine ketones?",a:"**0.9% saline with added KCl in each bag**, guided by daily electrolytes (Grade C).\n**Dextrose is not recommended** \u2014 it can precipitate **Wernicke's** in thiamine deficiency.\n**Ketonuria is NOT an indicator of dehydration and must not be used to assess severity** (Grade A) \u2014 it may actively mislead.",s:"RCOG Green-top 69, 2nd edition 04/02/2024, verified at source"},
{d:"Obstetric",q:"Hyperemesis \u2014 first- vs second-line antiemetics?",a:"**1st line:** doxylamine/pyridoxine (Xonvea), cyclizine, prochlorperazine, promethazine, chlorpromazine.\n**2nd line:** metoclopramide (extrapyramidal caution), domperidone, ondansetron.\n**3rd line (O&G only):** corticosteroids.",s:"RCOG Green-top 69, 2nd edition 04/02/2024, verified at source"},
{d:"Obstetric",q:"IVF patient with severe pain, peritonism and fever — OHSS?",a:"OHSS **rarely** causes severe pain, peritonism or pyrexia → exclude **torsion, ectopic, sepsis**. All admitted OHSS → thromboprophylaxis.",s:"RCEMLearning: OHSS \\u2014 no UK guideline verified"},
{d:"Obstetric",q:"PID outpatient regimen? IUD?",a:"**Ceftriaxone 1 g IM stat + doxycycline 100 mg BD + metronidazole 400 mg BD × 14 days.** IUD can stay — remove if not improving by **72 h**.",s:"BASHH via RCEMLearning ref: PID"},
{d:"Resus",q:"Hereditary angioedema airway attack — do adrenaline, antihistamine, steroids work?",a:"**Largely ineffective** (bradykinin, not histamine). Give **C1-esterase inhibitor concentrate** or **icatibant 30 mg SC**; FFP only if neither available. Secure airway early.",s:"RCEMLearning ref: Hereditary Angioedema"},
// ---------- SLO6 procedural sedation, from RCEM BPG Aug 2022, added 29/09/2026 ----------
{d:"Sedation",f:"p",q:"The four levels of sedation \u2014 and where does ketamine sit?",a:"**Minimal (anxiolysis)** \u2014 responds normally to voice.\n**Moderate (\u201cconscious\u201d)** \u2014 purposeful response to voice \u00b1 light touch.\n**Deep** \u2014 not easily roused; purposeful response only to repeated or painful stimulus.\n**General anaesthesia** \u2014 not arousable even by pain.\n**Dissociative (ketamine) sits OUTSIDE the continuum**: trance-like cataleptic state, profound analgesia and amnesia, with airway reflexes, spontaneous respiration and cardiopulmonary stability retained.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source",v:`<svg viewBox="0 0 460 170" role="img" aria-label="The four levels of sedation as a continuum, with dissociative sedation outside it"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--fig-line)"/></marker></defs><line x1="20" y1="44" x2="430" y2="44" stroke="var(--fig-line)" stroke-width="2" marker-end="url(#ar)"/><text x="20" y="22" font-size="9" fill="var(--fig-line)">LIGHTER</text><text x="430" y="22" font-size="9" text-anchor="end" fill="var(--fig-line)">DEEPER</text><g font-size="10"><circle cx="60" cy="44" r="5" fill="var(--slo6)"/><text x="60" y="68" text-anchor="middle" font-weight="700" fill="var(--fig-ink)">Minimal</text><text x="60" y="81" text-anchor="middle" font-size="9" fill="var(--fig-line)">normal reply</text><text x="60" y="92" text-anchor="middle" font-size="9" fill="var(--fig-line)">to voice</text><circle cx="170" cy="44" r="5" fill="var(--slo6)"/><text x="170" y="68" text-anchor="middle" font-weight="700" fill="var(--fig-ink)">Moderate</text><text x="170" y="81" text-anchor="middle" font-size="9" fill="var(--fig-line)">purposeful to</text><text x="170" y="92" text-anchor="middle" font-size="9" fill="var(--fig-line)">voice &#177; touch</text><circle cx="285" cy="44" r="5" fill="var(--slo6)"/><text x="285" y="68" text-anchor="middle" font-weight="700" fill="var(--fig-ink)">Deep</text><text x="285" y="81" text-anchor="middle" font-size="9" fill="var(--fig-line)">only to repeated</text><text x="285" y="92" text-anchor="middle" font-size="9" fill="var(--fig-line)">or painful stimulus</text><circle cx="400" cy="44" r="5" fill="var(--slo3)"/><text x="400" y="68" text-anchor="middle" font-weight="700" fill="var(--fig-ink)">GA</text><text x="400" y="81" text-anchor="middle" font-size="9" fill="var(--fig-line)">not rousable</text><text x="400" y="92" text-anchor="middle" font-size="9" fill="var(--fig-line)">even by pain</text></g><rect x="110" y="112" width="240" height="48" rx="8" fill="none" stroke="var(--slo4)" stroke-width="2" stroke-dasharray="5 3"/><text x="230" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="var(--slo4)">DISSOCIATIVE (ketamine)</text><text x="230" y="150" text-anchor="middle" font-size="9" fill="var(--fig-ink)">outside the continuum &#8212; reflexes, breathing, BP kept</text></svg>`,vc:"Dissociative is not a depth — it is a different state"},
{d:"Sedation",f:"p",q:"The four monitoring components required during AND after sedation?",a:"**3-lead ECG \u00b7 oxygen saturations \u00b7 continuous capnography \u00b7 non-invasive BP.**\nOmitting any one must be **justifiable on patient-safety grounds** given the depth and length of sedation and whether oxygen is running.\nMonitoring continues at the same level, with the same staff, **until the patient has regained consciousness**.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Ketamine \u2014 paediatric IV and IM doses, and the age floor?",a:"**Age over 3 months only.**\n**IV: 1.0 mg/kg**, repeats **0.5 mg/kg** every 5\u201310 min.\n**IM: 4\u20135 mg/kg**, repeats 2\u20132.5 mg/kg.\nAdult IV is an absolute **10\u201330 mg**, not mg/kg \u2014 that is the discriminator.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Midazolam IV for adult procedural sedation \u2014 dose?",a:"**1\u20132 mg over 1\u20132 min** (single dose max 2.5 mg), then **0.5 mg after 2\u20135 min**.\nOnset 1\u20132 min, **peak 3\u20134 min** \u2014 slower than propofol or ketamine, so wait before redosing.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Fentanyl as an adjunct \u2014 dose and peak effect?",a:"**Up to 0.5 micrograms/kg**, repeated up to 0.5 micrograms/kg every 2 min, for analgesia alongside a sedative.\nOnset 1\u20132 min, **peak 3\u20135 min**.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",f:"p",q:"Discharge criteria after procedural sedation \u2014 all of them?",a:"**Vital signs back to baseline with no added oxygen** \u00b7 **alert and orientated** \u00b7 **tolerating oral fluids** \u00b7 **adequate analgesia** \u00b7 **no or minimal nausea** \u00b7 **appropriate care at home**.\nPlus: **2 hours since any reversal agent** \u2014 flumazenil and naloxone are shorter-acting than what they reverse, so those patients are watched longer.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Flumazenil and naloxone \u2014 adult doses?",a:"**Flumazenil 100\u2013200 mcg over 15 s**, repeat every minute, **max 1 mg**. Caution in long-term benzodiazepine users (seizures).\n**Naloxone 100\u2013200 mcg every 1\u20132 min**, titrated to reverse respiratory depression **without reversing analgesia**. Duration only ~20 min.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"ASA grade \u2014 at what point is senior involvement required?",a:"**ASA III and above**, if the sedation cannot be deferred.\nI normal health \u00b7 II mild systemic disease \u00b7 III severe systemic disease \u00b7 IV severe disease that is a constant threat to life \u00b7 V moribund.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Ketofol \u2014 what is it and the dose?",a:"A **1:1 mixture of ketamine and propofol**. Adult **0.5\u20130.75 mg/kg of each**; paediatric (over 6 months) **0.5 mg/kg of each**.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Sedating a woman in the 2nd or 3rd trimester \u2014 what changes?",a:"High risk: **senior involvement**, **left lateral positioning**, attention to oxygenation, and **consider a pre-procedure antacid plus an anti-emetic such as metoclopramide**.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
{d:"Sedation",q:"Sedation governance \u2014 what must every ED have?",a:"A **named Sedation Lead**; a **separate paediatric Sedation Lead** if the ED sedates children; a **sedation proforma** (strongly recommended); documented individual competencies; adverse-incident reporting.\nAudit: **6-monthly, 20\u201330 patients**, 100% targets for proforma, consent, adverse events, reversal agents and pre-procedure assessment.",s:"RCEM Procedural Sedation BPG Aug 2022 \u00b7 verified at source"},
// ---------- BOASt fracture standards, verified at source 29/09/2026 ----------
{d:"Fractures",f:"p",q:"Limb injury with suspected arterial injury — the time limit and the imaging?",a:"**Revascularisation is an emergency (NCEPOD 1) and must be COMMENCED WITHIN 1 HOUR OF ARRIVAL.**\n**CT angiogram** if arterial injury is suspected — done **concurrently with the whole-body CT**, not after it.\nA **temporary vascular shunt** to restore flow fast is recommended.",s:"BOASt arterial injuries in MSK trauma, June 2026 · verified at source"},
{d:"Fractures",q:"After revascularising a limb — what must always be considered?",a:"**Fasciotomy — always considered after revascularisation.**\nAny decision NOT to do it must be documented **with the name of the senior decision maker**.",s:"BOASt arterial injuries in MSK trauma, June 2026 · verified at source"},
{d:"Fractures",f:"p",q:"Spine imaging in blunt trauma — modality, slice thickness and extent?",a:"**Multidetector CT is the primary modality**: **0.5 mm** for cervical spine, **0.5–1.0 mm** elsewhere.\nA head CT should extend **occiput to T4** with **sagittal and coronal reconstructions**.\n**CT angiography** for any cervical fracture or subluxation — to exclude blunt cerebrovascular injury.",s:"BOASt assessment of the spine in the trauma patient, April 2025 · verified at source"},
{d:"Fractures",q:"Spine CT in trauma — the two reporting deadlines?",a:"**Initial radiologist report within 1 HOUR.**\n**Definitive report within 24 HOURS.**",s:"BOASt assessment of the spine in the trauma patient, April 2025 · verified at source"},
{d:"Fractures",q:"When is MRI used instead of CT for the trauma spine?",a:"**Pregnancy · the unconscious patient · ambiguous CT findings · neurological symptoms · suspected spinal cord injury.**",s:"BOASt assessment of the spine in the trauma patient, April 2025 · verified at source"},
{d:"Fractures",f:"p",q:"Trauma patient with ankylosing spondylitis and a fixed cervical kyphosis — how do you immobilise?",a:"**Maintain their USUAL spinal position.** Do not force the neck to neutral — that is how you create or worsen a cord injury in a fused spine.",s:"BOASt assessment of the spine in the trauma patient, April 2025 · verified at source"},
{d:"Fractures",f:"p",q:"Pelvic binder — when on, when off, and during laparotomy?",a:"**On prehospitally** whenever active bleeding is suspected.\n**Kept on during damage-control laparotomy.**\n**Off ideally within 24 HOURS of injury**, to a network protocol.\nA **post-binder X-ray after resuscitation is still required even if the CT was negative.**",s:"BOASt management of patients with pelvic fractures, Jan 2018 · verified at source"},

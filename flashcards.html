{d:"Fractures",q:"Pelvic fracture — the three time limits after the binder?",a:"**TXA within 1 hour.**\n**Transfer to a specialist centre for stabilisation within 24 hours.**\n**Pelvic ring reconstruction within 72 hours** of the patient’s physiology being stabilised.\nHaemodynamically unstable → straight to a **Major Trauma Centre**.",s:"BOASt management of patients with pelvic fractures, Jan 2018 · verified at source"},
{d:"Fractures",q:"Pelvic fracture still bleeding despite binder and transfusion?",a:"**Surgical packing or interventional radiology embolisation.**\nAn open pelvic fracture with a **perineal or rectal wound** needs urgent surgical assessment and debridement — a **defunctioning stoma** may be required.\nSuspect bladder and urethral injury; manage per the urological trauma BOASt.",s:"BOASt management of patients with pelvic fractures, Jan 2018 · verified at source"},
{d:"Fractures",f:"p",q:"Manipulating a distal radial fracture — which anaesthesia?",a:"**Regional anaesthesia — NOT a local haematoma block**, and by a suitably qualified, trained practitioner.\nThis is a favourite discriminator: the haematoma block is the wrong answer.",s:"BOASt management of distal radial fractures, Dec 2017 · verified at source"},
{d:"Fractures",f:"p",q:"Distal radial fracture — the three surgical timings?",a:"**Intra-articular: within 72 hours of injury.**\n**Extra-articular: within 1 week of injury.**\n**Re-displacement: within 72 hours of the DECISION to operate** — not of the injury.",s:"BOASt management of distal radial fractures, Dec 2017 · verified at source"},
{d:"Fractures",q:"Distal radial fracture — follow-up, and the over-65 rule?",a:"**Fracture clinic within 72 hours.** Repeat radiographs at **1–2 weeks** for unstable patterns that might need surgery. Radiographs at cast removal are **not needed** without clinical concern.\n**Age 65 or over:** non-operative treatment is acceptable for a dorsally displaced fracture **unless** there is significant deformity or neurological compromise.\nAssess falls risk and bone health in everyone.",s:"BOASt management of distal radial fractures, Dec 2017 · verified at source"},
{d:"Fractures",f:"p",q:"Suspected necrotising fasciitis — what must NOT delay surgery?",a:"**Surgery is urgent and must NOT be delayed by** medical or intensive-care management, **imaging**, or **inter-hospital transfer**.\n**Sepsis six immediately.** **Broad-spectrum parenteral antibiotics without delay**, guided by microbiology.\nWaiting for a scan is the classic wrong answer.",s:"BOASt musculoskeletal soft tissue infections, July 2025 · verified at source"},
{d:"Fractures",q:"Necrotising infection — the two governance numbers?",a:"**Amputation decision: by at least TWO consultants.**\n**Review by the treating team within 6 HOURS** of diagnosis or of surgery.\nSurgery includes a documented systematic assessment of skin, fat, fascial planes, neurovascular structures and **all** muscle groups, with **multiple deep tissue samples**.\nFailure to improve → further surgical exploration.",s:"BOASt musculoskeletal soft tissue infections, July 2025 · verified at source"},
{d:"Fractures",q:"Paediatric forearm fracture — what is documented, and when twice?",a:"**Radial pulse · capillary refill · individual radial, median and ulnar nerve function** — at initial assessment **and again before discharge**.\nOrthogonal X-rays before and **after** any manipulation.",s:"BOASt early management of the paediatric forearm fracture, May 2021 · verified at source"},
{d:"Fractures",q:"Paediatric forearm fracture — the two follow-up deadlines?",a:"**Clinic appointment within 7 DAYS of injury.**\n**Documented consultant review of the case and images within 48 HOURS of injury.**\nUnits should have protocols allowing early definitive manipulation and casting **without admission**.",s:"BOASt early management of the paediatric forearm fracture, May 2021 · verified at source"},
{d:"Fractures",f:"p",q:"Ankle fracture — views, and when do you film the whole leg?",a:"**A true lateral and a mortise view**, centred on the ankle.\n**Whole-leg radiographs when examination suggests a more proximal fibular fracture** — a Maisonneuve injury.\nDeformed ankle: **reduce and splint urgently**; image first unless that causes unacceptable delay.",s:"BOASt management of ankle fractures, Aug 2016 · verified at source"},
{d:"Fractures",q:"Ankle fracture — weight bearing and follow-up?",a:"**Weight bearing as tolerated in a splint or cast** after fixation, unless there are concerns about the fixation, soft tissues, or peripheral neuropathy.\n**Stability uncertain → review within 2 weeks** with further radiographs, weight-bearing if possible.\n**After surgery → fracture clinic within 6 weeks.**",s:"BOASt management of ankle fractures, Aug 2016 · verified at source"},
{d:"Fractures",f:"p",q:"Open fracture — the three debridement windows?",a:"**Immediately** — highly contaminated wounds (agricultural, aquatic, sewage) or associated vascular compromise.\n**Within 12 hours** — other solitary high-energy open fractures.\n**Within 24 hours** — all other low-energy open fractures.\nThe old six-hour rule is not current UK practice.",s:"BOASt open fractures, Dec 2017 · verified at source"},
{d:"Fractures",q:"Open fracture in the ED — what do you do to the wound?",a:"**IV antibiotics as soon as possible, ideally within 1 hour of injury.**\nHandle the wound only to **remove gross contamination and allow photography**, then **saline-soaked gauze under an occlusive film**.\n**“Mini-washouts” outside theatre are not indicated.** Photograph when first exposed, before debridement.",s:"BOASt open fractures, Dec 2017 · verified at source"},
{d:"Fractures",f:"p",q:"Every BOASt time limit on one clock",a:"See the figure. The pattern: **1 hour** is drugs and reperfusion, **12–24 hours** is debridement and transfer, **72 hours** is definitive reconstruction.\nLearn them as a ladder, not as twelve separate facts.",s:"BOASt open fractures · pelvic · arterial injuries · spine · distal radius · soft tissue infection",v:`<svg viewBox="0 0 460 250" role="img" aria-label="BOASt time limits from injury or arrival, on one scale"><line x1="60" y1="24" x2="60" y2="236" stroke="var(--fig-line)" stroke-width="2"/><g font-size="10.5"><circle cx="60" cy="42" r="6" fill="var(--slo3)"/><text x="46" y="46" text-anchor="end" font-size="13" font-weight="700" fill="var(--slo3)">1 h</text><text x="76" y="38" fill="var(--fig-ink)">IV antibiotics — open fracture</text><text x="76" y="52" fill="var(--fig-ink)">TXA — pelvic fracture</text><text x="76" y="66" fill="var(--fig-ink)">revascularisation started (NCEPOD 1)</text><text x="76" y="80" fill="var(--fig-ink)">initial radiologist report — spine CT</text><circle cx="60" cy="102" r="6" fill="var(--slo4)"/><text x="46" y="106" text-anchor="end" font-size="13" font-weight="700" fill="var(--slo4)">6 h</text><text x="76" y="106" fill="var(--fig-ink)">team review after necrotising infection</text><circle cx="60" cy="128" r="6" fill="var(--slo4)"/><text x="46" y="132" text-anchor="end" font-size="13" font-weight="700" fill="var(--slo4)">12 h</text><text x="76" y="132" fill="var(--fig-ink)">debridement — high-energy open fracture</text><circle cx="60" cy="160" r="6" fill="var(--slo1)"/><text x="46" y="164" text-anchor="end" font-size="13" font-weight="700" fill="var(--slo1)">24 h</text><text x="76" y="156" fill="var(--fig-ink)">debridement — low-energy open fracture</text><text x="76" y="170" fill="var(--fig-ink)">pelvic binder off · transfer for fixation</text><text x="76" y="184" fill="var(--fig-ink)">definitive spine CT report</text><circle cx="60" cy="210" r="6" fill="var(--slo5)"/><text x="46" y="214" text-anchor="end" font-size="13" font-weight="700" fill="var(--slo5)">72 h</text><text x="76" y="206" fill="var(--fig-ink)">intra-articular distal radius surgery</text><text x="76" y="220" fill="var(--fig-ink)">pelvic ring reconstruction · DRF clinic</text><text x="76" y="234" fill="var(--fig-ink)">paediatric forearm: consultant review 48 h</text></g><text x="60" y="16" text-anchor="middle" font-size="9" fill="var(--fig-line)">INJURY / ARRIVAL</text></svg>`,vc:"Times run from injury, except revascularisation and the radiology report, which run from arrival"},
];


/* Deck -> RCEM SLO. Colour encodes which slice of the 180-question paper a card
   belongs to, so the palette carries information rather than decoration.
   Six hues (dataviz-validated, light + dark); every chip also names its deck,
   so identity is never colour-alone. */
const SLO_OF={
  Cardio:"1",Arrhythmia:"1",Stroke:"1",Respiratory:"1",GI:"1",Endocrine:"1",Eye:"1",
  Tox:"1",Obstetric:"1",Haem:"1",Infection:"1",Environment:"1",
  Resus:"3",Sepsis:"3",
  Trauma:"4",Fractures:"4",
  Paediatrics:"5",
  Sedation:"6",
  Scores:"X"
};
const SLO_NAME={"1":"SLO1 \u00b7 stable adults \u00b7 35 Q","3":"SLO3 \u00b7 resuscitation \u00b7 35 Q",
  "4":"SLO4 \u00b7 injured patients \u00b7 35 Q","5":"SLO5 \u00b7 children \u00b7 30 Q",
  "6":"SLO6 \u00b7 procedural skills \u00b7 20 Q","X":"cross-cutting"};
function sloOf(d){return SLO_OF[d]||"X"}
function sloVar(d){return "var(--slo"+sloOf(d)+")"}
function deckSlo(d){
  if(d==="All"||d==="Missed \u2265\u0032"||d==="Changed")return null;
  return sloOf(d);
}

const DECKS=["All","Missed ≥2","Changed",...[...new Set(CARDS.map(c=>c.d))]];
CARDS.forEach((c,i)=>c.id=i+1);
let deck="All",queue=[],pos=0,flipped=false,known=[],again=[],againRound=false;

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
function inDeck(c,d){return d==="All"||(d==="Missed ≥2"&&(c.f||"").includes("p"))||(d==="Changed"&&(c.f||"").includes("c"))||c.d===d}
function code(d){return d==="All"?"ALL":d==="Missed ≥2"?"PRI":d==="Changed"?"CHG":d.slice(0,4).toUpperCase()}

function chips(){
  $("#chips").innerHTML=DECKS.map(d=>{
    const s=deckSlo(d);
    const style=s?` style="--slo:var(--slo${s})"`:"";
    return `<button class="chip${d==="Missed ≥2"?" pri":""}"${style} aria-pressed="${d===deck}" data-d="${d}">${d}<b>${CARDS.filter(c=>inDeck(c,d)).length}</b></button>`;
  }).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{deck=b.dataset.d;chips();start()});
}
function start(list){
  let cards=list||CARDS.filter(c=>inDeck(c,deck));
  againRound=!!list;
  if(!list){const n=Math.max(1,Math.min(cards.length,parseInt($("#startN").value)||1));cards=cards.slice(n-1);known=[];again=[]}
  else{again=[]}
  if($("#shuffle").checked){cards=[...cards];for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}}
  queue=cards;pos=0;flipped=false;render();
}
function render(){
  const total=queue.length;
  $("#count").textContent=`${Math.min(pos+1,total)} / ${total}${againRound?" · again pile":""}`;
  const kn=known.length,ag=again.length,seenN=kn+ag;
  $("#progK").style.width=(total?kn/total*100:0)+"%";
  $("#progA").style.width=(total?ag/total*100:0)+"%";
  $("#tally").innerHTML=`<span class="kk">got it <b>${kn}</b></span><span class="aa">again <b>${ag}</b></span>`
    +`<span>left <b>${Math.max(0,total-seenN)}</b></span>`
    +(seenN?`<span>${Math.round(kn/seenN*100)}% known</span>`:"");
  if(pos>=total)return end();
  const c=queue[pos],f=c.f||"";
  const s=sloOf(c.d);
  const tags=`<span class="tag">${c.d}</span><span class="tag slo">${SLO_NAME[s]}</span>${f.includes("p")?'<span class="tag pri">Missed ≥2</span>':""}${f.includes("c")?'<span class="tag chg">Changed</span>':""}<span class="num">#${c.id}</span>`;
  $("#stage").innerHTML=`
   <div class="card${flipped?" back":""}" id="card" style="--slo:var(--slo${s})" tabindex="0" role="button" aria-label="${flipped?"Answer shown":"Tap to show answer"}">
     <div class="meta">${tags}</div>
     <p class="q">${fmt(c.q)}</p>
     ${flipped?`<div class="a">${fmt(c.a)}</div>${c.v?`<div class="fig">${c.v}${c.vc?`<div class="figcap">${esc(c.vc)}</div>`:""}</div>`:""}<div class="src">${esc(c.s)}</div>`:`<div class="hint">Tap card or press Space to reveal</div>`}
   </div>
   ${flipped?`<div class="grade"><button class="btn again" id="bAgain">Again <span class="count">1</span></button><button class="btn gotit" id="bGot">Got it <span class="count">2</span></button></div>`:""}
   <div class="nav"><button class="btn" id="bPrev" ${pos===0?"disabled":""}>← Back</button><button class="btn" id="bStop">Stop &amp; see summary</button></div>`;
  $("#card").onclick=()=>{flipped=!flipped;render()};
  if(flipped){$("#bAgain").onclick=()=>grade(false);$("#bGot").onclick=()=>grade(true)}
  $("#bPrev").onclick=()=>{if(pos>0){pos--;const id=queue[pos].id;known=known.filter(x=>x!==id);again=again.filter(x=>x!==id);flipped=false;render()}};
  $("#bStop").onclick=()=>{queue=queue.slice(0,pos);render()};
}
function grade(ok){const id=queue[pos].id;(ok?known:again).push(id);pos++;flipped=false;render()}
function end(){
  const seen=known.length+again.length;
  const lo=queue.length?queue[0].id:0;
  const c=`FC ${code(deck)} ${known.length}/${seen}${again.length?" A:"+again.join(","):""}`;
  $("#stage").innerHTML=`<div class="end">
    <h2>${seen?`${known.length} of ${seen} known`:"No cards graded"}</h2>
    <div>Paste this code into chat to log your weak cards:</div>
    <div class="code" id="code">${c}</div>
    <div class="grade"><button class="btn" id="bCopy">Copy code</button>${again.length?`<button class="btn again" id="bRedo">Redo ${again.length} again-card${again.length>1?"s":""}</button>`:`<button class="btn gotit" id="bRestart">Restart deck</button>`}</div>
    ${again.length?`<ol class="misslist">${again.map(id=>{const k=CARDS[id-1];return`<li><strong>#${id}</strong> ${esc(k.q)}</li>`}).join("")}</ol>`:""}
  </div>`;
  $("#bCopy").onclick=e=>{
    const b=e.currentTarget,t=$("#code").textContent;
    const sel=()=>{const r=document.createRange();r.selectNodeContents($("#code"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected — copy it"};
    try{navigator.clipboard.writeText(t).then(()=>b.textContent="Copied",sel)}catch(_){sel()}
  };
  if(again.length)$("#bRedo").onclick=()=>start(again.map(id=>CARDS[id-1]));else $("#bRestart").onclick=()=>start();
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key===" "||e.key==="Enter"){if(document.getElementById("card")){e.preventDefault();flipped=!flipped;render()}}
  else if(flipped&&e.key==="1")grade(false);
  else if(flipped&&e.key==="2")grade(true);
});
$("#restart").onclick=()=>start();
$("#shuffle").onchange=()=>start();
chips();start();
</script>
</body></html>

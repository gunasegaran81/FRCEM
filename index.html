rrives 3 hours after her SSRI dose was increased and she took an additional herbal remedy. She is agitated and sweating, temp 38.9°C, HR 122, with marked lower-limb clonus and hyperreflexia. Most likely diagnosis?", "options": ["Neuroleptic malignant syndrome", "Serotonin syndrome", "Anticholinergic toxicity", "Malignant hyperthermia", "Thyroid storm"], "answer": 1, "exp": "Serotonin syndrome. Hunter criteria emphasise neuromuscular hyperactivity — spontaneous/inducible/ocular clonus, hyperreflexia (lower > upper limbs), tremor, rigidity — with autonomic instability and altered mental state, developing rapidly (usually <24h) after starting/increasing a serotonergic agent. Clonus + hyperreflexia are the key discriminators from NMS.", "type": "mcq"}, {"n": 8, "topic": "Mental Health Act", "stem": "A 40-year-old man on citalopram attends with renal colic. Shortly after an opioid analgesic in the ED he develops agitation, tremor, clonus and hyperthermia consistent with serotonin syndrome. Which opioid is the most likely precipitant?", "options": ["Morphine", "Codeine", "Oxycodone", "Tramadol", "Dihydrocodeine"], "answer": 3, "exp": "Tramadol has serotonergic activity (serotonin/noradrenaline reuptake inhibition); with an SSRI it is a well-recognised precipitant and should be avoided. Pure mu-agonists (morphine, codeine, oxycodone, dihydrocodeine) carry little/no serotonergic risk. Pethidine — and, weakly, fentanyl — also have serotonergic potential.", "type": "mcq"}, {"n": 9, "topic": "Mental Health Act", "stem": "A patient with moderate-to-severe serotonin syndrome remains agitated and hyperthermic despite stopping the offending drug, IV fluids, active cooling and benzodiazepines. Which specific pharmacological agent is most appropriate?", "options": ["Dantrolene", "Bromocriptine", "Cyproheptadine", "Procyclidine", "Activated charcoal"], "answer": 2, "exp": "Cyproheptadine (oral 5-HT2A antagonist) is the specific agent (TOXBASE/UK practice) for moderate-to-severe serotonin syndrome not controlled by supportive care + benzodiazepines. Dantrolene/bromocriptine belong to NMS/malignant hyperthermia. Antipyretics are ineffective — the hyperthermia is muscular in origin.", "type": "mcq"}, {"n": 10, "topic": "Mental Health Act", "stem": "A 55-year-old man on long-term haloperidol is brought in after 2 days of confusion. Temp 39.8°C, generalised 'lead-pipe' rigidity, fluctuating BP, CK 8,000 U/L. Most likely diagnosis?", "options": ["Serotonin syndrome", "Neuroleptic malignant syndrome", "Sepsis with rigors", "Encephalitis", "Catatonia"], "answer": 1, "exp": "Neuroleptic malignant syndrome — subacute (1–3 day) reaction to dopamine antagonists: hyperthermia, generalised lead-pipe rigidity, altered consciousness, autonomic instability, markedly raised CK, leucocytosis. Slow onset, lead-pipe rigidity (not clonus) and dopamine-antagonist exposure distinguish it from serotonin syndrome.", "type": "mcq"}, {"n": 11, "topic": "Mental Health Act", "stem": "Which clinical feature most strongly favours serotonin syndrome over neuroleptic malignant syndrome?", "options": ["Lead-pipe rigidity", "Onset over several days", "Inducible clonus with hyperreflexia", "Markedly raised creatine kinase", "Recent use of a dopamine-antagonist antipsychotic"], "answer": 2, "exp": "Clonus and hyperreflexia (neuromuscular hyperactivity, lower-limb predominant) are hallmarks of serotonin syndrome. NMS instead causes lead-pipe rigidity with normo-/hyporeflexia, evolves over days, follows dopamine-antagonist exposure, and typically raises CK markedly.", "type": "mcq"}, {"n": 12, "topic": "Mental Health Act", "stem": "A patient with severe NMS has persistent hyperthermia and rigidity despite stopping the antipsychotic, IV fluids and cooling. Which specific agent is most appropriate to reduce muscle rigidity and hyperthermia?", "options": ["Cyproheptadine", "Dantrolene", "Flumazenil", "Naloxone", "Physostigmine"], "answer": 1, "exp": "Dantrolene (skeletal muscle relaxant) reduces rigidity and heat generation in severe NMS/malignant hyperthermia; dopamine agonists (bromocriptine, amantadine) are alternatives/adjuncts. Cyproheptadine is the serotonin-syndrome antidote. Fluids (rhabdomyolysis/AKI prevention), cooling and benzodiazepines underpin care.", "type": "mcq"}, {"n": 13, "topic": "Mental Health Act", "stem": "Since the Policing and Crime Act 2017 amended Section 136, from where may a police officer now exercise the power to remove a person who appears to have a mental disorder and to be in immediate need of care or control to a place of safety?", "options": ["Only from a place to which the public have access", "From anywhere except a private dwelling", "From any location including a person's own home", "Only from the street or a public highway", "Only after a warrant has been obtained under Section 135"], "answer": 1, "exp": "Since 2017, Section 136 may be exercised anywhere except a private dwelling (a house/flat and its private garden/yard). Previously it was limited to 'a place to which the public have access.' Entry to a private home still needs a Section 135 warrant. Where practicable, consult a mental health professional before using the power.", "type": "mcq"}, {"n": 14, "topic": "Mental Health Act", "stem": "A 28-year-old woman is brought to the ED having taken a staggered paracetamol overdose. She is assessed as needing treatment but says she wants to leave. She appears low in mood; her capacity to refuse treatment is uncertain. Most appropriate initial action?", "options": ["Detain her under Section 136", "Detain her under Section 2 to enable the overdose to be treated", "Assess her mental capacity; if she lacks capacity for the decision, treat the overdose in her best interests under the Mental Capacity Act", "Complete a Section 5(2) to keep her in the department", "Respect her autonomy and allow her to leave immediately"], "answer": 2, "exp": "The MHA cannot authorise treatment of the physical consequences of an overdose (it treats mental disorder, not self-poisoning). Do a decision-specific capacity assessment; if she lacks capacity — which overdose effects/fluctuating state may cause — treat in her best interests under the MCA (or common law in emergency). If she retains capacity and refuses, respect it while arranging a parallel mental health assessment. Section 5(2) does not apply in the ED.", "type": "mcq"}]}, {"code": "MIX2", "title": "Mixed Weak-Area Drill 2", "source": "NICE NG95 · RCUK 2025 · MHA · BSPED", "hue": "#f472b6", "questions": [{"n": 1, "topic": "Lyme serology", "stem": "A 34-year-old returns from hiking in the New Forest with a spreading annular rash. Lyme ELISA returns NEGATIVE, clinical suspicion remains high, symptoms began 9 days ago. Next step?", "options": ["Report ELISA as excluding Lyme", "Send immunoblot to confirm the negative", "Repeat ELISA in 4–6 weeks if symptoms persist", "Start doxycycline, no further serology", "Paired convalescent immunoblots 2 weeks apart"], "answer": 2, "exp": "[G] NICE NG95: a NEGATIVE ELISA with persisting suspicion is rescued by a repeat ELISA at 4–6 weeks (early testing predates antibody development). The immunoblot confirms a POSITIVE/equivocal ELISA — it does not rescue a negative one. If erythema migrans is present, diagnose clinically and treat with no serology.", "type": "mcq"}, {"n": 2, "topic": "Envenomation", "stem": "A 28-year-old stands on something wading at a UK beach — excruciating foot pain out of proportion to a small puncture. Weever fish suspected. First-line pain management?", "options": ["IV morphine as priority", "Immerse in hot water 40–45°C", "Cold pack and elevate", "LA infiltration first", "Iced water 5–10°C"], "answer": 1, "exp": "[C] Weever venom is thermolabile — hot water immersion at 40–45°C for 30–90 min is first-line and usually relieves pain faster than opioids. Morphine is an adjunct; cold worsens it.", "type": "mcq"}, {"n": 3, "topic": "Section 136", "stem": "Police called to a shopping centre; a man with apparent mental disorder stands on a ledge, in immediate danger. No mental health professional immediately contactable. Lawful position on s136?", "options": ["Must consult a professional first, cannot act yet", "May use s136 immediately; consultation required only where practicable", "Must obtain a s135 warrant first", "Cannot use s136 (private property)", "Must use common law instead"], "answer": 1, "exp": "[G] MHA 1983 / RCEM s136 guide: consultation is required WHERE PRACTICABLE. In a time-critical, imminent-risk situation, immediate use without prior consultation is lawful — a duty to attempt, not an absolute precondition. It doesn't force s135 or common law. s136 applies anywhere other than a private dwelling.", "type": "mcq"}, {"n": 4, "topic": "MCA vs MHA (Sessay)", "stem": "A 45-year-old with depression attends after a small overdose, now medically fit, wants to leave before the MH team arrives, and has capacity at this moment. Correct statement?", "options": ["MCA can detain her until the MHA assessment is complete", "Common law can hold her indefinitely as a suicide risk", "MCA cannot be used solely to detain her to await MHA assessment; that needs the MHA route", "Having capacity, staff have no lawful means to prevent immediate serious harm", "A doctor can complete s5(2) as she is an ED attender"], "answer": 2, "exp": "[Sessay] The MCA/common law cannot be used solely to detain someone to await an MHA assessment — that needs the MHA (s2/s3, or s136 in the community). The MCA applies only to those lacking capacity and only briefly to prevent immediate harm; she currently has capacity. s5(2) is an inpatient holding power, not for the ED.", "type": "mcq"}, {"n": 5, "topic": "Paediatric resus", "stem": "A 10-year-old in cardiac arrest, tracheal tube confirmed, continuous compressions. Ventilation rate?", "options": ["10", "15", "20", "25", "30 breaths/min"], "answer": 1, "exp": "[G] RCUK 2025: advanced airway in place → ventilate at the lower limit of normal for age — infants 25, 1–8y 20, 8–12y 15, >12y 10. A 10-year-old is in the 8–12y band → 15/min. Rates step down with age.", "type": "mcq"}, {"n": 6, "topic": "Paediatric resus", "stem": "An 8-year-old (25 kg) achieves ROSC after witnessed VF and goes to PICU. BP target for ≥24 h?", "options": ["Systolic >5th percentile", "Systolic and mean >10th percentile", "Mean >50th percentile", "Systolic >90th percentile", "Fixed MAP 65 mmHg"], "answer": 1, "exp": "[G] Post-ROSC target: systolic AND mean arterial pressure above the 10th percentile for ≥24 h. Distinguish from the 5th centile systolic used to define decompensation acutely.", "type": "mcq"}, {"n": 7, "topic": "Paediatric resus", "stem": "During CPR on a 4-year-old in asystole, a rhythm check shows an organised narrow-complex rhythm. Maximum duration to check signs of life and a central pulse?", "options": ["No pulse check", "Up to 5 s", "Up to 10 s", "Up to 15 s", "Up to 30 s"], "answer": 1, "exp": "[G] Within ALS every check is a maximum of 5 s — rhythm check <5 s, pulse/signs-of-life ≤5 s. The 10-second figure is BLS-only (initial breathing assessment).", "type": "mcq"}, {"n": 8, "topic": "Paediatric resus", "stem": "A 6-year-old pulled from an icy lake in arrest, core temp 31°C, shockable rhythm. Adrenaline and defibrillation?", "options": ["Adrenaline every 3–5 min, shock every 2 min as normal", "Single adrenaline, max 3 shocks, withhold both until >30°C", "Adrenaline every 8 min (6–10), defibrillate at normal 2-min intervals", "Withhold adrenaline until >35°C, shock without limit", "Double adrenaline, shock at 8 J/kg"], "answer": 2, "exp": "[G] 30–35°C band: adrenaline every ~8 min (6–10), defibrillate at normal 2-min intervals. Below 30°C is the different rule (single adrenaline, max 3 shocks, hold until >30°C, start ECLS). At 31°C this child is in the 30–35°C band.", "type": "mcq"}, {"n": 9, "topic": "DKA fluids", "stem": "A 25 kg child in DKA, dehydrated and vomiting but NOT shocked (CRT 2 s, normal BP). Initial fluid?", "options": ["10 mL/kg over 30 min, subtracted from the requirement", "20 mL/kg over 10 min, not subtracted", "10 mL/kg over 5–10 min, repeated to 40 mL/kg", "No bolus; deficit over 48 h only", "20 mL/kg 0.45% saline over 1 h"], "answer": 0, "exp": "[G NICE NG18 / BSPED 2024] Dehydrated but NOT shocked: 10 mL/kg over 30 min, and subtract that volume from the fluid requirement. Shocked = 10 mL/kg over 5–10 min, repeat to 40 mL/kg, NOT subtracted. Not shocked = slower + subtracted.", "type": "mcq"}, {"n": 10, "topic": "Pre-arrest adrenaline", "stem": "A 3-year-old during anaesthetic induction becomes profoundly bradycardic and hypotensive but has NOT lost cardiac output. Initial adrenaline dose?", "options": ["10 mcg/kg IV immediately", "1–2 mcg/kg IV incremental, escalating to 10 mcg/kg only if arrest", "100 mcg/kg IV", "500 mcg IM", "Withhold until asystole confirmed"], "answer": 1, "exp": "[G] Pre-arrest bradycardia/hypotension: incremental 1–2 mcg/kg IV, escalating to the 10 mcg/kg arrest dose only if arrest occurs. The pre-arrest dose is one tenth of the arrest dose.", "type": "mcq"}]}, {"code": "MIX3", "title": "Mixed Weak-Area Drill 3", "source": "MHA · RCUK · NICE NG84/NG20/NG98/NG240", "hue": "#e879f9", "questions": [{"n": 1, "topic": "Interleaved weak areas", "stem": "Police find a man behaving erratically and in apparent mental distress on a motorway footbridge, attempting to climb over the railing. He appears to have a mental disorder and is in immediate danger. No mental health professional is contactable in the time available. What is the lawful position on using section 136?", "options": ["They must wait until a mental health professional can be consulted before acting", "They may use s136 immediately; consultation is required only where practicable, and imminent risk makes it impracticable", "They must obtain a section 135 warrant first", "They cannot use s136 on a bridge as it is not a 'public place'", "They must rely on common law rather than s136 in any emergency"], "answer": 1, "exp": "[G] MHA 1983 (as amended) / RCEM s136 guidance: an officer must, WHERE PRACTICABLE, consult a mental health professional before using s136 — but 'where practicable' is a qualifier, not an absolute precondition.\n\n[G] In a time-critical, imminent-risk situation, immediate use of s136 without prior consultation is lawful. It does not force a switch to s135 (warrant for a private dwelling) or common law.\n\nThis is the flashcard item missed three times: consultation is a duty to attempt when there is time, not a lock that disables the power when there isn't.", "type": "mcq"}, {"n": 2, "topic": "Interleaved weak areas", "stem": "A man is brought to the ED by ambulance after a friend raised concerns. He is medically fit for discharge, has capacity for the decision, and wants to leave before the crisis team arrives to assess him. Staff are concerned he may be at risk. Which statement is correct?", "options": ["He can be held under the Mental Capacity Act until the crisis team completes their assessment", "The MCA cannot be used solely to detain a capacitous patient to await a Mental Health Act assessment; that requires the MHA route", "A doctor can place him on a section 5(2) as an ED attender", "Common law allows indefinite detention because he is a possible risk to himself", "Security can restrain him under the MCA regardless of capacity"], "answer": 1, "exp": "[Sessay principle] The MCA (and common law) is NOT a lawful vehicle to detain someone purely to hold them for an MHA assessment. Detention for assessment must go through the MHA — s2/s3, or s136 if they leave into a public place.\n\n[C] The MCA applies only to people who LACK capacity for the relevant decision, and only to prevent immediate harm in their best interests. He currently has capacity.\n\n[C] s5(2) is a holding power for a patient already admitted to a ward, not for the ED. The trap answer is A — 'MCA detains until the assessment is done'.", "type": "mcq"}, {"n": 3, "topic": "Interleaved weak areas", "stem": "A 3-year-old is in cardiac arrest with a tracheal tube confirmed by waveform capnography and continuous compressions running. At what rate should he be ventilated?", "options": ["10 breaths/min", "15 breaths/min", "20 breaths/min", "25 breaths/min", "30 breaths/min"], "answer": 2, "exp": "[G] RCUK 2025: with an advanced airway in place, ventilate at the lower limit of normal for age — infants 25, 1–8y 20, 8–12y 15, over 12y 10 breaths/min. A 3-year-old is in the 1–8y band: 20/min.\n\nThe full descending ladder is 25 / 20 / 15 / 10 — rates step DOWN with age. This is the flashcard item missed twice (a 4-month-old and a 10-year-old previously).\n\nFresh age point to consolidate the middle of the table.", "type": "mcq"}, {"n": 4, "topic": "Interleaved weak areas", "stem": "A 12-year-old with a sore throat scores highly on FeverPAIN and warrants an antibiotic. There is no penicillin allergy. What is the correct first-line antibiotic?", "options": ["Amoxicillin", "Phenoxymethylpenicillin (penicillin V)", "Co-amoxiclav", "Clarithromycin", "Cefalexin"], "answer": 1, "exp": "[G] NICE NG84 (acute sore throat): first-line for a sore throat needing an antibiotic is phenoxymethylpenicillin (penicillin V) for 5–10 days; a macrolide such as clarithromycin is used only for penicillin allergy.\n\n[C] Amoxicillin is deliberately NOT first-line, because if the illness is actually glandular fever (EBV), amoxicillin/ampicillin commonly precipitate a florid maculopapular rash.\n\nThis pairs the two PAED2 items you missed together: sore-throat antibiotic = penicillin V, precisely to avoid the amoxicillin/EBV rash.", "type": "mcq"}, {"n": 5, "topic": "Interleaved weak areas", "stem": "A 9-year-old with type 1 diabetes and poor growth is being investigated for coeliac disease. The family, trying to help, has already removed all gluten from the diet for the past 3 weeks. What is the correct advice before serological testing?", "options": ["Proceed with serology now, as the diet does not affect results", "Reintroduce gluten in more than one meal a day for at least 6 weeks before testing, or the result may be falsely negative", "Test for IgG anti-gliadin instead, which is unaffected by diet", "Start a gluten-free diet permanently and treat empirically", "Arrange duodenal biopsy without any serology or gluten"], "answer": 1, "exp": "[G] NICE NG20: coeliac serology is only valid on a gluten-containing diet. If gluten has been removed, advise reintroducing it in more than one meal every day for at least 6 weeks before testing, otherwise the result may be falsely negative.\n\n[G] First-line serology is total IgA plus IgA tissue transglutaminase (tTG). Checking total IgA matters because IgA deficiency causes a false-negative tTG.\n\nThis is the coeliac flashcard: don't remove gluten before testing — and if already removed, reintroduce before you test.", "type": "mcq"}, {"n": 6, "topic": "Interleaved weak areas", "stem": "A severely malnourished 15-year-old with a restrictive eating disorder is admitted and started on nutritional rehabilitation. Two days in, which biochemical change should you actively monitor for as the hallmark of refeeding syndrome?", "options": ["Rising sodium", "Falling phosphate, potassium and magnesium", "Rising calcium", "Falling glucose alone", "Rising urea"], "answer": 1, "exp": "[C, UK practice — MEED / NICE NG69] Refeeding syndrome is the dangerous electrolyte shift when nutrition is reintroduced to a starved patient: hypophosphataemia, hypokalaemia and hypomagnesaemia, with thiamine depletion.\n\n[C] Monitor electrolytes closely, replace them, and give thiamine before or with refeeding. Falling phosphate is the classic marker.\n\n[C] Note that under-feeding out of excessive caution is also harmful, so refeeding must be adequate as well as cautiously monitored.", "type": "mcq"}, {"n": 7, "topic": "Interleaved weak areas", "stem": "A 10-day-old boy presents collapsed with vomiting and dehydration. Bloods show hyponatraemia, hyperkalaemia and hypoglycaemia, and a salt-losing crisis from congenital adrenal hyperplasia is suspected. What is the correct immediate treatment?", "options": ["Treat the hyperkalaemia with calcium gluconate alone and observe", "IV 0.9% sodium chloride with glucose AND IV hydrocortisone", "Oral rehydration solution and routine feeds", "Insulin–dextrose infusion as the priority", "Withhold all treatment until the diagnosis is biochemically confirmed"], "answer": 1, "exp": "[C, UK practice] A salt-losing adrenal crisis (classically salt-wasting CAH) presents in the second week of life with vomiting, dehydration, hyponatraemia, hyperkalaemia and hypoglycaemia. Treat with IV 0.9% saline and glucose to correct volume and hypoglycaemia, AND IV hydrocortisone to replace the missing cortisol.\n\n[C] The trap is treating the potassium alone and missing the underlying cortisol deficiency — hydrocortisone is the definitive step.\n\n[C] Take a critical sample (cortisol, 17-OHP, glucose, U&E) where feasible, but do not delay treatment to confirm the diagnosis.", "type": "mcq"}, {"n": 8, "topic": "Interleaved weak areas", "stem": "A child with suspected meningitis has a fluctuating conscious level, focal neurological signs and signs of shock. According to NICE NG240, what is the correct approach to lumbar puncture and antibiotics?", "options": ["Perform an immediate LP before giving antibiotics", "Do not perform an LP now; give antibiotics without delay, as these features contraindicate immediate LP", "Delay antibiotics until a CT has been done and reported", "Perform the LP only once the child is fully alert", "Give antibiotics only after the LP, whatever the delay"], "answer": 1, "exp": "[G] NICE NG240: do NOT delay antibiotics to perform an LP. Contraindications to immediate LP include reduced or fluctuating consciousness, focal neurological signs, shock, extensive or spreading purpura, seizures until stabilised, and coagulopathy.\n\n[C] Give antibiotics first, stabilise, and perform the LP later once it is safe. A normal CT does not by itself confirm it is safe to proceed.\n\nThe examinable principle: treatment is never delayed for the LP.", "type": "mcq"}, {"n": 9, "topic": "Interleaved weak areas", "stem": "A 3-week-old, breastfed and otherwise thriving, remains visibly jaundiced. According to NICE NG98, what is the essential investigation to exclude a serious cause?", "options": ["No investigation is needed for breast-milk jaundice", "Measure the conjugated (direct) bilirubin fraction to exclude biliary atresia", "Repeat a transcutaneous bilirubin only", "Start phototherapy empirically", "Reassure and review in one month"], "answer": 1, "exp": "[G] NICE NG98: in prolonged jaundice (over 14 days in a term baby, 21 days if preterm), measure the CONJUGATED bilirubin. A raised conjugated fraction suggests a serious hepatobiliary cause such as biliary atresia, where the Kasai procedure is time-critical.\n\n[C] Also check for pale stools and dark urine, which point to obstructive/conjugated jaundice.\n\n[C] Unconjugated prolonged jaundice in a thriving breastfed baby is often benign breast-milk jaundice — but conjugated jaundice is never assumed benign.", "type": "mcq"}, {"n": 10, "topic": "Interleaved weak areas", "stem": "A child with atopic eczema presents with a rapidly worsening, painful rash showing clustered vesicles and punched-out erosions, together with fever and malaise. What is the diagnosis and correct management?", "options": ["Infected eczema — oral flucloxacillin", "Eczema herpeticum — urgent systemic aciclovir and same-day specialist advice", "A simple eczema flare — increase emollients and topical steroid", "Contact dermatitis — potent topical steroid", "Chickenpox — supportive care only"], "answer": 1, "exp": "[C, UK practice — NICE CG57] Eczema herpeticum (disseminated herpes simplex on eczematous skin) presents with rapidly worsening, painful eczema, clustered blisters, punched-out erosions and systemic upset. It is a dermatological emergency needing urgent systemic aciclovir and same-day specialist involvement.\n\n[C] If it is near the eyes, arrange same-day ophthalmology assessment.\n\n[C] The discriminator from bacterially infected eczema (golden crusting, weeping → antibiotics) is the painful, punched-out, vesicular pattern with systemic upset.", "type": "mcq"}]}, {"code": "MIX4", "title": "Mixed Weak-Area Drill 4", "source": "TOX/TOX2/SEIZ · NG217 · TOXBASE", "hue": "#d8b4fe", "questions": [{"n": 1, "topic": "Interleaved weak areas", "stem": "A 19-year-old reports taking paracetamol repeatedly over about 8 hours in a suicide attempt — roughly 15 g in total. She arrives 6 hours after the last tablets. What is the most appropriate management?", "options": ["Start intravenous N-acetylcysteine now, regardless of the paracetamol level", "Take a level 4 hours after the last dose and plot it on the nomogram", "Treat only if the 4-hour level is above the treatment line", "Wait until 15 hours post-ingestion, then check the level", "Discharge if the first paracetamol level is below the treatment line"], "answer": 0, "exp": "Staggered ingestion (tablets taken over more than 1 hour) or uncertain timing invalidates the treatment nomogram — it applies only to a single acute ingestion with a known time and a level ≥4 hours post. Treat with NAC regardless of the level. [G RCEM/NPIS]", "type": "mcq"}, {"n": 2, "topic": "Interleaved weak areas", "stem": "A man is pulled from a house fire, drowsy and confused. On room air his SpO2 reads 99%. What is the most appropriate immediate oxygen management?", "options": ["Titrate oxygen to keep SpO2 94–98%", "High-flow 100% oxygen via a non-rebreather mask, disregarding the SpO2 reading", "Give oxygen only if the SpO2 falls below 94%", "Nebulised salbutamol and observation", "Hyperbaric oxygen for every case before anything else"], "answer": 1, "exp": "Carbon monoxide poisoning: pulse oximetry cannot distinguish carboxyhaemoglobin from oxyhaemoglobin, so the SpO2 is falsely reassuring. Give high-flow 100% oxygen regardless of the reading to shorten the CO half-life. Hyperbaric O2 is reserved for LOC, neurological or cardiac signs, pregnancy, or very high COHb. Also consider concurrent cyanide toxicity. [C TOXBASE]", "type": "mcq"}, {"n": 3, "topic": "Interleaved weak areas", "stem": "A woman at 38 weeks' gestation has a witnessed generalised tonic-clonic seizure in resus; BP 170/115, no known epilepsy. What is the most appropriate first-line drug?", "options": ["IV lorazepam 4 mg", "IV diazepam 10 mg", "IV magnesium sulfate 4 g over 5–15 minutes", "IV levetiracetam 60 mg/kg", "IV phenytoin 20 mg/kg"], "answer": 2, "exp": "Eclampsia — magnesium sulfate 4 g IV loading then 1 g/hr is first-line for the eclamptic seizure, not a benzodiazepine. NG217 7.1.4 flags eclampsia as a specific reversible cause. Treat the BP and involve obstetrics urgently. [C RCOG/MBRRACE; NG217]", "type": "mcq"}, {"n": 4, "topic": "Interleaved weak areas", "stem": "An 80-year-old on gliclazide is admitted with hypoglycaemia. Despite repeated boluses of IV glucose her capillary glucose keeps falling again within the hour. What is the most appropriate next step?", "options": ["Continue repeated boluses of IV glucose alone", "IV glucagon", "IV hydrocortisone", "Octreotide", "IV insulin with dextrose"], "answer": 3, "exp": "Sulfonylurea toxicity: giving glucose alone stimulates further insulin release, driving rebound hypoglycaemia. Octreotide suppresses pancreatic insulin secretion and breaks the cycle. Glucagon is unreliable when hepatic glycogen is depleted. [C TOXBASE]", "type": "mcq"}, {"n": 5, "topic": "Interleaved weak areas", "stem": "A 30-year-old known epileptic who has run out of medication is having a generalised tonic-clonic seizure that has lasted 6 minutes in the ED. IV access is in place and resus facilities are available. He has no personal emergency plan. What is the most appropriate first-line drug?", "options": ["Buccal midazolam 10 mg", "Rectal diazepam 10 mg", "IV levetiracetam 60 mg/kg", "IV phenytoin 20 mg/kg", "IV lorazepam 4 mg"], "answer": 4, "exp": "NG217 7.1.3: in hospital with IV access and resus facilities, IV lorazepam is first-line. Buccal midazolam and rectal diazepam are the community/no-access routes. Levetiracetam and phenytoin are second-line, only after two failed benzodiazepine doses. [G NG217]", "type": "mcq"}, {"n": 6, "topic": "Interleaved weak areas", "stem": "A firefighter is brought in after prolonged smoke exposure in an enclosed space: soot around the mouth, reduced consciousness, hypotension, and a lactate of 12 mmol/L. What is the most appropriate specific antidote?", "options": ["IV hydroxocobalamin", "IV dicobalt edetate", "IV methylene blue", "IV sodium thiosulfate alone", "Digoxin-specific antibody fragments"], "answer": 0, "exp": "The picture suggests cyanide toxicity from smoke inhalation (high lactate, cardiovascular collapse). Hydroxocobalamin is first-line and safest — it binds cyanide and is safe to give even if cyanide is later excluded. Dicobalt edetate is itself toxic if no cyanide is present. Methylene blue treats methaemoglobinaemia, not cyanide. [C TOXBASE]", "type": "mcq"}, {"n": 7, "topic": "Interleaved weak areas", "stem": "An asymptomatic passenger is detained at the airport; CT abdomen shows multiple wrapped packages of cocaine in the gut (a 'body packer'). Observations are normal. What is the most appropriate management?", "options": ["Endoscopic retrieval of the packages", "Whole-bowel irrigation with polyethylene glycol and observation", "Oral activated charcoal", "Immediate laparotomy", "Discharge with outpatient follow-up"], "answer": 1, "exp": "Asymptomatic body packer: whole-bowel irrigation with polyethylene glycol plus close observation until packages have passed. Endoscopy risks rupturing a package and causing catastrophic overdose. Surgery is reserved for obstruction, rupture, or signs of toxicity. [C TOXBASE]", "type": "mcq"}, {"n": 8, "topic": "Interleaved weak areas", "stem": "A 2-year-old has a prolonged convulsive seizure at triage; there is no IV access. What is the correct dose of buccal midazolam?", "options": ["2.5 mg", "7.5 mg", "5 mg", "10 mg", "0.15 mg/kg"], "answer": 2, "exp": "BNFc buccal midazolam by age band: 3–11 months 2.5 mg; 1–4 years 5 mg; 5–9 years 7.5 mg; 10–17 years and adult 10 mg. A 2-year-old falls in the 5 mg band. [C BNFc]", "type": "mcq"}, {"n": 9, "topic": "Interleaved weak areas", "stem": "A patient presents after a deliberate overdose of long-acting insulin, with recurrent hypoglycaemia. What is the most appropriate management?", "options": ["Octreotide", "A single 50 mL bolus of 50% glucose, then discharge", "IV glucagon infusion", "Prolonged IV glucose infusion with frequent glucose monitoring", "IV hydrocortisone"], "answer": 3, "exp": "Insulin overdose — especially long-acting preparations — needs a sustained IV glucose infusion titrated with frequent glucose checks until the insulin effect wanes, which can take many hours. Octreotide is the answer for sulfonylurea toxicity, not insulin — the classic swap distractor. A single bolus and discharge is unsafe. [C TOXBASE]", "type": "mcq"}, {"n": 10, "topic": "Interleaved weak areas", "stem": "A young adult collapses at a nightclub. GCS is 6, but he is breathing spontaneously with good saturations, an intact gag reflex, and rouses briefly to painful stimulus. Bystanders mention 'liquid ecstasy'. What is the most appropriate management?", "options": ["Immediate rapid sequence intubation", "IV flumazenil", "IV naloxone as the definitive treatment", "Oral activated charcoal", "Supportive care with close airway and consciousness monitoring"], "answer": 4, "exp": "GHB/GBL toxicity classically causes deep coma with preserved airway reflexes and rapid, spontaneous recovery. Manage supportively with close monitoring; intubate only if the airway is genuinely compromised or the patient deteriorates. There is no specific antidote — flumazenil and naloxone do not reverse GHB. [C TOXBASE]", "type": "mcq"}]}, {"code": "SIM1", "title": "Mock Paper 1 (timed)", "source": "Full-blueprint 40Q · mixed topics", "hue": "#94a3b8", "questions": [{"n": 1, "topic": "Resus", "stem": "A 68-year-old man collapses in the ED waiting room. CPR is in progress and the rhythm is ventricular fibrillation. He has now received five shocks, adrenaline 1 mg after the third shock, and amiodarone 300 mg after the third shock. He remains in VF after the fifth shock.\n\nWhich is the most appropriate next drug step?", "options": ["Amiodarone 150 mg IV", "Amiodarone 300 mg IV repeated", "Lidocaine 100 mg IV in addition to amiodarone", "Magnesium sulfate 2 g IV", "Sodium bicarbonate 50 mmol IV"], "answer": 0, "exp": "Amiodarone 150 mg IV is given after the fifth shock, following the 300 mg dose after the third shock. [G]\n\nLidocaine 100 mg is an alternative only where amiodarone is unavailable — never an add-on. Magnesium is reserved for torsades, hypomagnesaemia or digoxin toxicity, and bicarbonate for hyperkalaemia or tricyclic overdose. [G]Resuscitation Council UK Adult Advanced Life Support (2021)", "type": "mcq"}, {"n": 2, "topic": "Resus", "stem": "A 55-year-old woman achieves ROSC after an out-of-hospital VF arrest. She is intubated and ventilated, GCS 3T, BP 105/62. The nurse asks what oxygen target to set on the ventilator.\n\nWhat is the most appropriate arterial oxygen saturation target?", "options": ["Highest achievable FiO₂ until arrival in ICU", "SpO₂ 88–92%", "SpO₂ 90–94%", "SpO₂ 94–98%", "SpO₂ 99–100%"], "answer": 3, "exp": "Once oxygen saturation can be measured reliably after ROSC, titrate inspired oxygen to SpO₂ 94–98% (or PaO₂ 10–13 kPa). Both hypoxaemia and hyperoxaemia worsen outcome. [G]\n\n100% oxygen is correct only during CPR and in the moments immediately after ROSC before saturations are reliable — the trap is carrying it on. 88–92% is the COPD target, not a post-arrest target. [C]Resuscitation Council UK Post-Resuscitation Care (2021)", "type": "mcq"}, {"n": 3, "topic": "Cardiology", "stem": "A 61-year-old man has ischaemic chest pain that settled with GTN. ECG shows 1 mm ST depression in V4–V6. Troponin is raised. He is pain-free, BP 138/80, HR 76. His GRACE score predicts a 6-month mortality of 5%.\n\nWithin what timeframe should coronary angiography be offered?", "options": ["Immediately", "Within 24 hours of admission", "Within 72 hours of admission", "Within 7 days of admission", "Only after a positive functional ischaemia test"], "answer": 2, "exp": "For NSTEMI/unstable angina with an intermediate or higher predicted 6-month mortality (GRACE above 3%), offer coronary angiography with follow-on PCI within 72 hours of first admission. [G]\n\nImmediate angiography is for haemodynamic instability, ongoing refractory ischaemia or cardiogenic shock — he is pain-free and stable, so 24 hours/immediate over-treats and 7 days under-treats. [G]NICE NG185 — Acute coronary syndromes", "type": "mcq"}, {"n": 4, "topic": "Cardiology", "stem": "A 58-year-old woman presents to a rural ED 4 hours after the onset of crushing chest pain. ECG shows 3 mm ST elevation in II, III and aVF. The nearest PCI centre confirms that the earliest possible balloon time is 155 minutes from now. Fibrinolysis could be delivered in this ED within 15 minutes.\n\nWhat is the most appropriate reperfusion strategy?", "options": ["Transfer for primary PCI regardless of the delay", "Fibrinolysis now, with transfer for angiography afterwards", "Fibrinolysis now, repeating it if ST elevation persists at 90 minutes", "Treat medically and arrange angiography within 72 hours", "Await a second troponin before deciding"], "answer": 1, "exp": "Primary PCI is preferred when presentation is within 12 hours of symptom onset and PCI can be delivered within 120 minutes of the time fibrinolysis could have been given. Here that window is exceeded, so offer fibrinolysis. [G]\n\nAfter fibrinolysis, assess for residual ST elevation at 60–90 minutes: failure means rescue PCI, not a second dose of lytic. All fibrinolysed patients are transferred for angiography. [G]NICE NG185 — Acute coronary syndromes", "type": "mcq"}, {"n": 5, "topic": "Cardiology", "stem": "A 72-year-old man has a broad-complex tachycardia at 190/min. BP is 76/44 with cool peripheries and he is drowsy. Three synchronised DC shocks under sedation have failed to restore sinus rhythm.\n\nWhat is the most appropriate next step?", "options": ["A fourth synchronised shock at maximum energy", "Amiodarone 300 mg IV over 10–20 minutes, then repeat the synchronised shock", "Amiodarone 900 mg IV over 24 hours before any further shock", "Adenosine 6 mg IV rapid bolus", "Digoxin 500 micrograms IV over 30 minutes"], "answer": 1, "exp": "In unstable tachycardia, after up to three synchronised shocks give amiodarone 300 mg IV over 10–20 minutes and repeat the shock; then a 900 mg infusion over 24 hours. [G]\n\nThe near-miss here is the 900 mg maintenance infusion — right drug, right total, wrong step. Adenosine is for regular narrow-complex (or regular monomorphic broad-complex thought to be SVT) in the stable patient. [G]Resuscitation Council UK Peri-arrest Arrhythmias / Adult ALS (2021)", "type": "mcq"}, {"n": 6, "topic": "Respiratory", "stem": "A 24-year-old woman with asthma is tachypnoeic and unable to complete sentences. PEF is 38% predicted, SpO₂ 93% on air, HR 124. She has had back-to-back salbutamol nebulisers. ABG on air: pH 7.38, PaO₂ 9.4 kPa, PaCO₂ 5.2 kPa.\n\nHow should this attack be classified?", "options": ["Moderate exacerbation", "Acute severe asthma", "Life-threatening asthma", "Near-fatal asthma", "Brittle asthma"], "answer": 2, "exp": "A normal PaCO₂ (4.6–6.0 kPa) in an acute attack is a life-threatening feature — the patient should be blowing it off, and failure to do so signals exhaustion. [G]\n\nHer PEF 38% and inability to complete sentences alone would be acute severe (PEF 33–50%); the gas upgrades her. Near-fatal requires a raised PaCO₂ or the need for ventilation with raised airway pressures. This is the classic near-miss pair. [G]BTS/SIGN Acute Asthma severity classification (carried into BTS/NICE/SIGN NG245, 2024)", "type": "mcq"}, {"n": 7, "topic": "Respiratory", "stem": "A 70-year-old man with known COPD is breathless and drowsy. After 60 minutes of controlled oxygen to a target of 88–92%, back-to-back nebulisers, steroid and antibiotic, repeat ABG shows pH 7.28, PaCO₂ 8.4 kPa, PaO₂ 8.1 kPa, HCO₃ 31. He is not for intubation.\n\nWhat is the most appropriate next step?", "options": ["Continue medical therapy and repeat the gas in 2 hours", "Start non-invasive ventilation", "Start high-flow nasal oxygen at 60 L/min", "Give a doxapram infusion", "Increase oxygen to achieve SpO₂ above 94%"], "answer": 1, "exp": "NIV is indicated for persistent respiratory acidosis — pH below 7.35 with PaCO₂ above 6.0 kPa — despite maximal medical therapy and controlled oxygen for no more than one hour. He meets it. [G]\n\nWaiting a further 2 hours is the timing trap: the one-hour window has already elapsed. Doxapram is only for when NIV is unavailable or not tolerated. Raising the oxygen target worsens the hypercapnia. [G]BTS/ICS Ventilatory Management of Acute Hypercapnic Respiratory Failure (2016); BTS Emergency Oxygen (2017)", "type": "mcq"}, {"n": 8, "topic": "Respiratory", "stem": "A 78-year-old woman has pleuritic chest pain and mild breathlessness. She is haemodynamically stable. Her two-level PE Wells score is 3. D-dimer returns at 640 ng/mL (laboratory cut-off 500 ng/mL).\n\nWhat is the most appropriate next step?", "options": ["CTPA now, as the D-dimer is above the laboratory cut-off", "Apply an age-adjusted D-dimer threshold and, if below it, consider an alternative diagnosis", "Start treatment-dose anticoagulation and arrange outpatient CTPA", "Repeat the D-dimer in 24 hours", "Proceed to V/Q scanning as first-line imaging"], "answer": 1, "exp": "Wells 4 or less is 'PE unlikely', so D-dimer is the correct next test — and in people over 50 an age-adjusted threshold (age × 10 ng/mL) may be applied. At 78 that is 780 ng/mL, so 640 is negative and PE is effectively excluded. [G]\n\nThe near-miss is reading any result above 500 as positive. V/Q (or V/Q SPECT) is reserved for renal impairment, contrast allergy or pregnancy. [G]NICE NG158 — Venous thromboembolic diseases", "type": "mcq"}, {"n": 9, "topic": "Respiratory", "stem": "A 27-year-old man, non-smoker with no lung disease, has sudden right-sided pleuritic pain. He is comfortable at rest, SpO₂ 98% on air, HR 82, BP 126/74. Chest X-ray shows a right primary spontaneous pneumothorax with a 3 cm interpleural distance at the hilum. Symptoms are minimal and he is keen to avoid a drain.\n\nWhat is the most appropriate management?", "options": ["Needle aspiration, then chest drain if unsuccessful", "Immediate small-bore chest drain because the rim exceeds 2 cm", "Conservative management with review, as there are no high-risk characteristics", "Ambulatory device only if the rim is under 2 cm", "Video-assisted thoracoscopic surgery referral at first presentation"], "answer": 2, "exp": "Current BTS practice is driven by symptoms and high-risk characteristics, not by a 2 cm rule. With no high-risk features (haemodynamic compromise, significant hypoxia, bilateral or underlying lung disease, haemothorax, age over 50 with significant smoking history) and tolerable symptoms, conservative care is a valid option. [G]\n\nThe 2 cm threshold is the superseded-but-plausible distractor carried over from the 2010 guideline. [C]BTS Pleural Disease Guideline (2023)", "type": "mcq"}, {"n": 10, "topic": "Head injury", "stem": "A 71-year-old woman on apixaban for atrial fibrillation trips on a kerb and strikes her forehead. She has no loss of consciousness, no vomiting, no amnesia and no focal deficit. GCS is 15 throughout. She arrives 1 hour after the injury.\n\nWhat is the most appropriate imaging plan?", "options": ["No CT head is required as GCS is 15 with no other risk factors", "CT head within 1 hour of risk factor identification", "CT head within 8 hours of the injury", "Skull X-ray, with CT only if a fracture is seen", "Admit for 24 hours of neurological observation without imaging"], "answer": 2, "exp": "Anticoagulation is on its own an indication for imaging: for a head injury with no other risk factors in someone on a DOAC or warfarin, perform CT head within 8 hours of the injury. [G]\n\nThe 1-hour rule applies to GCS below 13 on arrival, GCS below 15 at 2 hours, suspected open/depressed or basal skull fracture, post-traumatic seizure, focal deficit, or more than one vomit. Note the reciprocal trap: if an anticoagulated patient presents more than 8 hours after injury, the CT is done within 1 hour. [G]NICE NG232 — Head injury: assessment and early management", "type": "mcq"}, {"n": 11, "topic": "Head injury", "stem": "A 68-year-old man is brought in after a simple fall from standing. He has central neck pain and no neurological symptoms or signs. GCS 15. He is otherwise well and not anticoagulated.\n\nWhat is the most appropriate cervical spine imaging?", "options": ["No imaging, as this is a low-energy mechanism", "Three-view plain cervical spine radiographs", "CT cervical spine", "MRI cervical spine", "Plain radiographs, with CT only if inadequate"], "answer": 2, "exp": "Age 65 or over is a Canadian C-spine rule high-risk factor in its own right, and in adults the required investigation is CT of the cervical spine. [G]\n\nPlain films no longer have a routine role in adult C-spine clearance — that is the superseded-practice distractor. MRI is added where there is neurological deficit or suspected ligamentous/cord injury. In children under 16, plain films are the first-line study. [G]NICE NG232 — Head injury", "type": "mcq"}, {"n": 12, "topic": "Spinal injury", "stem": "A 30-year-old woman was a restrained driver in a low-speed rear-end collision in a car park. She walked into the ED, has no midline cervical tenderness, no distracting injury, no paraesthesia, is fully alert, and her neck pain began about an hour after the crash.\n\nWhat is the most appropriate next assessment step?", "options": ["Apply a hard collar and arrange CT cervical spine", "Assess active neck rotation to 45 degrees in each direction", "Arrange plain cervical spine radiographs before any movement", "Apply full in-line spinal immobilisation and transfer to a major trauma centre", "Discharge without any range of movement assessment"], "answer": 1, "exp": "She has a low-risk factor (simple rear-end collision, ambulatory, delayed-onset pain, no midline tenderness) and no high-risk factor, so it is safe to assess active rotation to 45° each way. If she achieves it, imaging is not needed. [G]\n\nImmobilising first and imaging regardless is the over-triage trap; the rule exists specifically to avoid collars and CT in this group. [G]NICE NG41 — Spinal injury: assessment and initial management; NG232", "type": "mcq"}, {"n": 13, "topic": "Trauma", "stem": "A 34-year-old motorcyclist arrives 3 hours 40 minutes after a high-speed collision. BP 88/52, HR 128, with a positive FAST and an obvious pelvic injury. Blood products are running.\n\nWhat is the most appropriate approach to tranexamic acid?", "options": ["Give 1 g over 10 minutes then 1 g over 8 hours", "Give 1 g over 10 minutes only, omitting the infusion", "Give 2 g as a single bolus to compensate for the delay", "Do not give tranexamic acid", "Give tranexamic acid only if fibrinogen is below 1.5 g/L"], "answer": 3, "exp": "Tranexamic acid is given as soon as possible and within 3 hours of injury in major trauma with active or suspected active bleeding. At 3 hours 40 minutes that window has closed, and beyond it TXA is associated with harm. [G]\n\nKnow the regimen anyway — 1 g IV over 10 minutes, then 1 g over 8 hours. Every distractor here is a plausible dose; the discriminator is the clock. [G]NICE NG39 — Major trauma; CRASH-2", "type": "mcq"}, {"n": 14, "topic": "Trauma", "stem": "A 45-year-old man is hypotensive after a fall from height. He has pelvic tenderness and a binder has been applied. He responds transiently to blood products. The trauma team leader asks about imaging.\n\nWhat is the most appropriate imaging strategy?", "options": ["Pelvic radiograph first, then CT if abnormal", "Whole-body CT without a prior pelvic radiograph", "Pelvic radiograph and chest radiograph only, then straight to theatre", "MRI pelvis", "Repeat FAST every 15 minutes and image only once stable"], "answer": 1, "exp": "In adults (16 and over) with suspected major trauma who are going to have CT, do not perform plain radiographs of the pelvis or chest first — go directly to whole-body CT. [G]\n\nPlain films before CT delay definitive imaging without changing management. In children, limited-region CT is preferred and whole-body CT is avoided where possible. [G]NICE NG39 — Major trauma: assessment and initial management", "type": "mcq"}, {"n": 15, "topic": "Trauma", "stem": "A 22-year-old man sustains an open tibial fracture in a football tackle. He arrives 30 minutes after injury. The wound is grossly contaminated with soil. He is haemodynamically normal.\n\nWhich is the most important immediate intervention in the ED?", "options": ["Intravenous antibiotics as soon as possible and within 1 hour of injury", "Wound irrigation with several litres of saline in the ED", "Photograph the wound, cover with a saline-soaked dressing and give antibiotics within 6 hours", "Immediate operative debridement within 6 hours regardless of contamination", "Delay antibiotics until wound swabs have been taken"], "answer": 0, "exp": "For open fractures, give IV antibiotics as soon as possible and within 1 hour of injury, alongside splinting and a saline-soaked dressing sealed with an occlusive layer. [G]\n\nDo not irrigate in the ED — irrigation belongs in theatre. Debridement timing is by contamination: immediate for highly contaminated wounds (marine, agricultural, sewage), within 12 hours for other high-energy injuries and within 24 hours for low-energy ones. Swabs do not guide initial therapy and must not delay it. [G]NICE NG37 — Fractures (complex); BOAST Open Fracture Management", "type": "mcq"}, {"n": 16, "topic": "Trauma", "stem": "An 84-year-old woman with a fractured neck of femur is in severe pain in the ED. She has had paracetamol and a small dose of IV morphine but remains in pain on movement. She has stage 3 chronic kidney disease.\n\nWhat is the most appropriate additional analgesic step?", "options": ["Add oral ibuprofen 400 mg three times daily", "Offer a fascia iliaca or femoral nerve block", "Add oral codeine 30 mg four-hourly", "Start a fentanyl patch", "Withhold further analgesia until the anaesthetist reviews"], "answer": 1, "exp": "Where paracetamol plus titrated opioid gives insufficient relief in hip fracture, offer a nerve block (fascia iliaca or femoral). [G]\n\nNSAIDs are not recommended in hip fracture, and are doubly wrong with CKD. Adding codeine to morphine is pharmacologically redundant, and transdermal fentanyl has far too slow an onset for acute pain. [G]NICE CG124 — Hip fracture management", "type": "mcq"}, {"n": 17, "topic": "Toxicology", "stem": "A 29-year-old woman took approximately 20 g of paracetamol as a single ingestion 10 hours ago. She is asymptomatic, weighs 60 kg, and the paracetamol level is not yet back from the laboratory.\n\nWhat is the most appropriate action?", "options": ["Wait for the level and treat only if above the treatment line", "Start acetylcysteine now", "Give activated charcoal 50 g and await the level", "Repeat the level at 4 hours after the first and treat if rising", "Treat only if ALT is raised on arrival"], "answer": 1, "exp": "Beyond 8 hours from a significant single ingestion, start acetylcysteine immediately and do not wait for the level — efficacy falls sharply with delay after 8 hours. Stop later if the level is below the line and the patient is well with normal ALT/INR. [G]\n\nActivated charcoal is only useful within about 1 hour. Staggered ingestion or an uncertain time also mandates treatment regardless of level. [G]TOXBASE/NPIS; MHRA acetylcysteine guidance", "type": "mcq"}, {"n": 18, "topic": "Toxicology", "stem": "A 35-year-old man is drowsy 2 hours after a deliberate amitriptyline overdose. BP 88/50, HR 118. ECG shows sinus tachycardia with a QRS duration of 140 ms and a dominant R wave in aVR.\n\nWhat is the most appropriate immediate treatment?", "options": ["Sodium bicarbonate 8.4% IV", "Amiodarone 300 mg IV", "Flumazenil 200 micrograms IV", "Magnesium sulfate 2 g IV", "Intravenous lipid emulsion 100 mL of 20%"], "answer": 0, "exp": "QRS above 100–120 ms, arrhythmia or hypotension in tricyclic poisoning is treated with sodium bicarbonate 8.4% (commonly 50 mL boluses, roughly 1–2 mmol/kg) titrated to QRS narrowing and arterial pH around 7.45–7.55. [G]\n\nClass Ia/Ic and III antiarrhythmics including amiodarone are contraindicated — they worsen sodium channel blockade. Flumazenil is dangerous where a tricyclic is co-ingested (seizure risk). Lipid emulsion is a rescue therapy, not first line. [G]TOXBASE/NPIS — Tricyclic antidepressants", "type": "mcq"}, {"n": 19, "topic": "Toxicology", "stem": "A 48-year-old man has taken a large quantity of propranolol. He is bradycardic at 38/min with BP 74/40. Atropine 600 micrograms twice and a fluid bolus have had no effect.\n\nWhat is the most appropriate next specific treatment?", "options": ["Calcium chloride 10 mL of 10% IV", "Glucagon 5–10 mg IV bolus followed by an infusion", "Sodium bicarbonate 8.4% 50 mL IV", "Isoprenaline infusion at 0.5 micrograms/min", "Digoxin-specific antibody fragments"], "answer": 1, "exp": "In beta-blocker poisoning unresponsive to atropine and fluid, give glucagon 5–10 mg IV as a bolus (adult) followed by an infusion — it bypasses the beta receptor to raise intracellular cAMP. High-dose insulin euglycaemic therapy is the next escalation. [G]\n\nThe near-miss is calcium, which is the first-line antidote for calcium channel blocker toxicity. Sodium bicarbonate has a role only for the sodium-channel-blocking beta-blockers such as propranolol with a broad QRS — not for the bradycardia itself. [G]TOXBASE/NPIS — Beta-blockers", "type": "mcq"}, {"n": 20, "topic": "Environmental", "stem": "A 26-year-old man is pulled from a mountain river in cardiac arrest. Core oesophageal temperature is 27°C. The rhythm is VF. He has received one shock without effect.\n\nHow should drugs and defibrillation be managed?", "options": ["Continue the standard ALS algorithm unchanged", "Withhold adrenaline and limit defibrillation to a maximum of three shocks until core temperature exceeds 30°C", "Give adrenaline at double the usual dose and shock every 2 minutes", "Give adrenaline at the usual dose but at double the usual interval", "Stop resuscitation, as survival below 28°C is not recorded"], "answer": 1, "exp": "Below 30°C, withhold adrenaline and limit defibrillation to a maximum of three shocks until the core temperature rises above 30°C. [G]\n\nBetween 30 and 35°C, give adrenaline at the normal dose but at double the usual interval — that is the adjacent-band distractor. Rewarming, ideally with ECLS, drives outcome, and prolonged resuscitation in hypothermic arrest is justified: nobody is dead until warm and dead. [G]Resuscitation Council UK — Special Circumstances (2021)", "type": "mcq"}, {"n": 21, "topic": "Paediatrics", "stem": "A 7-year-old boy develops facial swelling, widespread urticaria, stridor and wheeze minutes after eating a biscuit containing peanut. He weighs 24 kg.\n\nWhat dose of intramuscular adrenaline 1 mg/mL (1:1000) should be given?", "options": ["150 micrograms (0.15 mL)", "300 micrograms (0.3 mL)", "500 micrograms (0.5 mL)", "240 micrograms (0.24 mL), calculated at 10 micrograms/kg", "1 mg (1 mL)"], "answer": 1, "exp": "The IM adrenaline bands are: under 6 months 100–150 mcg; 6 months to 6 years 150 mcg; 6 to 12 years 300 mcg; over 12 years and adults 500 mcg. A 7-year-old gets 300 micrograms. [G]\n\nWeight-based calculation is the trap — the UK guideline uses age bands for IM adrenaline in anaphylaxis, not 10 mcg/kg. Repeat after 5 minutes if there is no improvement. [G]Resuscitation Council UK — Emergency treatment of anaphylaxis (2021)", "type": "mcq"}, {"n": 22, "topic": "Paediatrics", "stem": "A 4-month-old term infant has 3 days of coryza followed by cough, wheeze and crackles. He is feeding at about 70% of normal volumes, has mild subcostal recession, RR 52, and oxygen saturation persistently 89% on air.\n\nWhat is the most appropriate management?", "options": ["Discharge with safety-netting, as feeding is above 50%", "Admit and give supplemental oxygen", "Admit for nebulised hypertonic saline", "Trial of nebulised salbutamol and reassess", "Oral prednisolone and discharge if improved"], "answer": 1, "exp": "Admit an infant with bronchiolitis whose oxygen saturation is persistently below 90% (in babies 6 weeks and older without comorbidity), and give supplemental oxygen at that threshold. [G]\n\nThe band trap is the 92% figure, which applies to infants under 6 weeks or with underlying conditions. Feeding at 70% is reassuring in isolation — the referral trigger is 50–75% of usual intake with other features. Bronchodilators, steroids, hypertonic saline and antibiotics have no role. [G]NICE NG9 — Bronchiolitis in children", "type": "mcq"}, {"n": 23, "topic": "Paediatrics", "stem": "A 4-month-old girl was treated in the ED for a first febrile UTI. Urine culture grew Escherichia coli and she defervesced within 36 hours of starting oral antibiotics. There was a good urinary stream and no palpable mass. She is now well.\n\nWhat imaging should be arranged?", "options": ["No imaging is required", "Ultrasound of the urinary tract during the acute infection", "Ultrasound of the urinary tract within 6 weeks", "DMSA scan within 6 weeks", "Micturating cystourethrogram before discharge"], "answer": 2, "exp": "This is a typical UTI (organism E. coli, responded within 48 hours, no septicaemia, no poor urine flow, no raised creatinine or abdominal mass) in an infant under 6 months, so the recommendation is an ultrasound within 6 weeks. [G]\n\nUltrasound during the acute infection is reserved for atypical UTI. DMSA and MCUG follow only in defined atypical or recurrent patterns. The clean discriminator is 'typical vs atypical', not age alone. [G]NICE NG224 — Urinary tract infection in under 16s", "type": "mcq"}, {"n": 24, "topic": "Paediatrics", "stem": "A 14-month-old is brought in with a 2-day fever of 39.1°C. He is alert and smiling, has moist mucous membranes, normal skin turgor, no rash, RR 32, HR 148 and a capillary refill time of 3 seconds. No source is apparent.\n\nUsing the NICE traffic light system, how should he be categorised and managed?", "options": ["Green — manage at home with safety-netting", "Amber — provide a safety net or observe in a facility with paediatric input", "Red — refer urgently for immediate specialist assessment", "Red — give parenteral antibiotics within 1 hour", "Green — no investigations and no follow-up required"], "answer": 1, "exp": "A capillary refill time of 3 seconds or more is an amber feature, as is tachycardia by age band. Amber children with no diagnosis need a safety net (written advice, planned follow-up, or arranged review) or a period of observation where paediatric assessment is available. [G]\n\nRed features include non-blanching rash, bulging fontanelle, neck stiffness, status epilepticus, focal neurology, reduced skin turgor, grunting, or age under 3 months with fever 38°C or above. He has none. [G]NICE NG143 — Fever in under 5s", "type": "mcq"}, {"n": 25, "topic": "Safeguarding", "stem": "A 5-month-old, not yet rolling or crawling, is brought in with a spiral fracture of the mid-shaft of the humerus. The parents describe the arm catching in the cot bars. The infant is otherwise well and there are no other visible marks.\n\nWhat is the most appropriate immediate course of action?", "options": ["Treat the fracture and arrange routine outpatient orthopaedic follow-up", "Discuss with the safeguarding lead and admit for child protection assessment", "Arrange a skeletal survey as an outpatient in 2 weeks", "Accept the mechanism if it is consistent when the parents are asked separately", "Refer for genetic testing for osteogenesis imperfecta before raising concerns"], "answer": 1, "exp": "Any fracture in a non-mobile infant is a high-index safeguarding presentation, and a long-bone spiral fracture attributed to a low-energy mechanism compounds it. The correct step is immediate discussion with the safeguarding lead and admission for assessment, including skeletal survey and referral to children's social care. [G]\n\nDeferring the survey, or attempting to verify the history by interrogating parents, delays protection. Investigating bone fragility does not replace safeguarding action and can proceed in parallel. [C]NICE NG76 — Child abuse and neglect; RCPCH Child Protection Companion", "type": "mcq"}, {"n": 26, "topic": "Gastro", "stem": "A 52-year-old man has severe epigastric pain radiating to the back. Serum amylase is 1400 U/L and CT confirms acute pancreatitis with no necrosis. He is tachycardic at 112 with a lactate of 3.1 mmol/L. There is no cholangitis and LFTs are normal.\n\nWhich is the most appropriate management step?", "options": ["Prophylactic intravenous antibiotics", "Aggressive intravenous fluid resuscitation and analgesia", "Keep nil by mouth for 5 days", "Urgent ERCP within 24 hours", "Immediate surgical referral for necrosectomy"], "answer": 1, "exp": "The core of early management is fluid resuscitation, analgesia and organ support, with severity assessment and monitoring. [G]\n\nProphylactic antibiotics are not recommended in acute pancreatitis without evidence of infection. Early enteral feeding is encouraged rather than prolonged starvation. Urgent ERCP belongs to gallstone pancreatitis with cholangitis or biliary obstruction — absent here. [G]NICE NG104 — Pancreatitis", "type": "mcq"}, {"n": 27, "topic": "Gastro", "stem": "A 60-year-old man with known alcoholic cirrhosis has a large haematemesis. BP 92/56, HR 116, Hb 74 g/L. He is resuscitated with blood.\n\nWhich combination is most appropriate before endoscopy?", "options": ["Terlipressin and prophylactic broad-spectrum antibiotics", "Proton pump inhibitor infusion and prophylactic antibiotics", "Terlipressin alone, with antibiotics only if pyrexial", "Tranexamic acid and a proton pump inhibitor infusion", "Octreotide and a Sengstaken–Blakemore tube"], "answer": 0, "exp": "Where variceal bleeding is suspected, offer terlipressin at presentation (stopping after haemostasis or 5 days) and prophylactic antibiotics to all patients with cirrhosis and upper GI bleeding — not just the febrile. [G]\n\nPPIs are not given before endoscopy in non-variceal bleeding either. Balloon tamponade is a rescue measure for uncontrolled haemorrhage, not routine pre-endoscopic care. Endoscopy is offered immediately after resuscitation in unstable severe bleeding, and within 24 hours for everyone else. [G]NICE CG141 — Acute upper gastrointestinal bleeding", "type": "mcq"}, {"n": 28, "topic": "Urology", "stem": "A 41-year-old man has severe left loin-to-groin colic. He is afebrile, observations are normal, and urine dip shows blood. Renal function is normal and he has no contraindication to non-steroidal drugs.\n\nWhat is the most appropriate analgesia and imaging plan?", "options": ["IV paracetamol, with non-contrast CT KUB within 24 hours", "NSAID by a suitable route, with non-contrast CT KUB within 24 hours", "IV morphine, with ultrasound as first-line imaging", "NSAID, with non-contrast CT KUB only if symptoms persist beyond 48 hours", "IV morphine, with CT urogram with contrast within 24 hours"], "answer": 1, "exp": "Offer an NSAID as first-line analgesia in renal colic (for example diclofenac IM or PR), with IV paracetamol second-line and opioids only if both are contraindicated or ineffective. [G]\n\nOffer non-contrast CT KUB within 24 hours of presentation to adults. Ultrasound is first-line for pregnancy and for those under 16. [G]NICE NG118 — Renal and ureteric stones", "type": "mcq"}, {"n": 29, "topic": "Infection", "stem": "A 58-year-old man has a cough with purulent sputum and fever. He is newly confused, RR 32, BP 96/58, HR 104. Urea is 6.2 mmol/L and creatinine is normal. Chest X-ray shows right lower lobe consolidation.\n\nWhat is his CURB-65 score and the disposition it indicates?", "options": ["1 — low risk, suitable for treatment at home", "2 — intermediate risk, consider hospital-supervised treatment", "3 — high risk, urgent admission with critical care review considered", "4 — high risk, but ward-level care is sufficient at this age", "2 — but admit anyway because of the confusion alone"], "answer": 2, "exp": "He scores 3: Confusion (new), Respiratory rate 30 or more, and Blood pressure (systolic under 90 or diastolic 60 or less — his is 58). Urea is 6.2, below the 7 mmol/L cut-off, and he is under 65. [G]\n\nThe commonly missed component is the diastolic limb of the BP criterion — a systolic of 96 alone looks reassuring. A score of 3 or more is high risk, warranting urgent admission and consideration of critical care assessment. [G]NICE NG138 — Pneumonia (community-acquired); BTS CAP guideline", "type": "mcq"}, {"n": 30, "topic": "Infection", "stem": "A 58-year-old woman who received chemotherapy 10 days ago presents with a temperature of 38.6°C and rigors. She looks unwell but is normotensive. Neutrophil count is 0.4 × 10⁹/L.\n\nWhat is the most appropriate immediate management?", "options": ["Take cultures and await the result before starting antibiotics", "Start beta-lactam monotherapy such as piperacillin with tazobactam within 1 hour", "Start an aminoglycoside as dual therapy in all patients", "Give oral co-amoxiclav and ciprofloxacin and discharge with review in 24 hours", "Give granulocyte colony-stimulating factor as the primary treatment"], "answer": 1, "exp": "Treat suspected neutropenic sepsis as an emergency: empiric beta-lactam monotherapy — piperacillin with tazobactam — within 1 hour, after taking cultures but never delayed for them. [G]\n\nDo not routinely add an aminoglycoside. Outpatient oral therapy is only considered after formal risk assessment (for example MASCC) identifies low risk — not in a rigoring, unwell patient at first contact. [G]NICE CG151 — Neutropenic sepsis; NICE NG51 — Sepsis", "type": "mcq"}, {"n": 31, "topic": "Endocrine", "stem": "A 24-year-old woman with type 1 diabetes has DKA: pH 7.08, ketones 5.4 mmol/L, glucose 27 mmol/L. She weighs 60 kg. Initial venous potassium is 3.2 mmol/L. A litre of sodium chloride 0.9% is running.\n\nWhat is the most appropriate approach to insulin and potassium?", "options": ["Start fixed-rate insulin at 0.1 units/kg/hour with 40 mmol/L potassium in the fluid", "Start fixed-rate insulin at 0.1 units/kg/hour with no potassium until the level exceeds 3.5 mmol/L", "Withhold insulin, replace potassium and seek senior/critical care review", "Give a 0.1 units/kg insulin bolus then start the infusion with 20 mmol/L potassium", "Start a variable-rate insulin infusion titrated to glucose with 40 mmol/L potassium"], "answer": 2, "exp": "Potassium below 3.5 mmol/L is the one situation where insulin is withheld: insulin drives potassium intracellularly and can precipitate fatal arrhythmia. Replace potassium first, in a higher-care setting, with senior involvement. [G]\n\nOtherwise: fixed rate 0.1 units/kg/hour, potassium 40 mmol/L when K is 3.5–5.5, none when above 5.5, and add 10% glucose alongside saline once glucose falls below 14 mmol/L. Routine bolus insulin is no longer recommended. [G]JBDS-IP — Management of DKA in adults", "type": "mcq"}, {"n": 32, "topic": "Endocrine", "stem": "A 66-year-old man on ramipril and spironolactone has a potassium of 6.8 mmol/L. ECG shows tented T waves and a QRS of 118 ms. He is haemodynamically stable and passing urine.\n\nWhat is the correct first intervention?", "options": ["Insulin 10 units with 25 g glucose IV", "Calcium gluconate 10% 30 mL IV", "Nebulised salbutamol 10–20 mg", "Sodium zirconium cyclosilicate orally", "Urgent referral for haemodialysis before any drug therapy"], "answer": 1, "exp": "With ECG changes, cardiac protection comes first: calcium gluconate 10% (commonly 30 mL, or calcium chloride 10% 10 mL), repeated if changes persist. It stabilises the myocardium without lowering potassium. [G]\n\nInsulin–glucose (10 units soluble insulin in 25 g glucose over 15 minutes) and salbutamol shift potassium and follow immediately after — right drugs, wrong order. Binders and dialysis remove potassium but are not the emergency first move. [G]UK Kidney Association — Treatment of Acute Hyperkalaemia in Adults", "type": "mcq"}, {"n": 33, "topic": "Neurology", "stem": "A 68-year-old woman developed right hemiplegia and aphasia. Symptom onset was 5 hours ago. CT head excludes haemorrhage; CT angiography shows a proximal M1 occlusion. NIHSS is 17 and her pre-stroke modified Rankin score is 1.\n\nWhat is the most appropriate treatment?", "options": ["Intravenous thrombolysis alone", "Mechanical thrombectomy, with thrombolysis if within the licensed window", "Aspirin 300 mg and admission to the stroke unit", "Thrombolysis only if perfusion imaging shows salvageable tissue", "Neither reperfusion therapy, as she is beyond 4.5 hours"], "answer": 1, "exp": "Thrombolysis is limited to 4.5 hours from known onset, so she has missed it — but mechanical thrombectomy should be offered as soon as possible for confirmed proximal anterior circulation occlusion within 6 hours, together with thrombolysis where that is also within window. [G]\n\nBeyond 6 hours and up to 24 hours, thrombectomy may still be offered where CT/MR perfusion or diffusion imaging shows salvageable tissue. Assuming the thrombolysis clock ends the discussion is the classic error. [G]NICE NG128 — Stroke and transient ischaemic attack", "type": "mcq"}, {"n": 34, "topic": "Neurology", "stem": "A 44-year-old man has a severe occipital headache that peaked instantaneously 4 hours ago. He is now neurologically intact with a GCS of 15. A non-contrast CT head performed 30 minutes after arrival is reported as normal by a neuroradiologist.\n\nWhat is the most appropriate next step?", "options": ["Lumbar puncture at 12 hours from headache onset", "Discharge with advice, as the CT was performed within 6 hours of onset", "CT angiography of the intracranial vessels", "Repeat CT head at 24 hours", "Admit for observation and MRI in the morning"], "answer": 1, "exp": "A technically adequate non-contrast CT performed within 6 hours of headache onset and reported by an experienced reader effectively excludes aneurysmal subarachnoid haemorrhage; lumbar puncture is not required. [G]\n\nThe 12-hour LP rule applies when the CT was done after 6 hours (allowing xanthochromia to develop), and is the near-miss answer here. Discharge must still include safety-netting and consideration of other causes. [C]RCEM guidance on suspected subarachnoid haemorrhage (see also NICE CG150, headaches in over 12s)", "type": "mcq"}, {"n": 35, "topic": "Oncology", "stem": "A 63-year-old man with known metastatic prostate cancer has 4 days of progressive thoracic back pain, now with bilateral leg weakness and difficulty initiating micturition. Power is 3/5 bilaterally with a sensory level at T10.\n\nWhat is the most appropriate immediate ED management?", "options": ["Dexamethasone 16 mg orally or IV and urgent MRI of the whole spine within 24 hours", "Analgesia and outpatient MRI within 1 week", "Immediate CT thoracic spine and neurosurgical referral only if unstable", "Dexamethasone 8 mg daily and a plain radiograph of the thoracic spine", "Radiotherapy referral without imaging"], "answer": 0, "exp": "Suspected metastatic spinal cord compression is a time-critical emergency: give dexamethasone 16 mg (unless spinal lymphoma is suspected) with gastric protection, and arrange MRI of the whole spine within 24 hours — sooner where there is a rapidly progressive deficit. [G]\n\nThe dose distractor is 8 mg. CT and plain films are insufficient. Definitive treatment (radiotherapy or surgery) follows imaging, ideally within 24 hours of the diagnosis. [G]NICE NG234 / CG75 — Metastatic spinal cord compression", "type": "mcq"}, {"n": 36, "topic": "Obstetrics", "stem": "A 26-year-old woman at 9 weeks' gestation has light vaginal bleeding and mild cramping. Her blood group is O RhD negative. Ultrasound shows an intrauterine pregnancy with fetal heart activity. She is stable and no instrumentation is planned.\n\nWhat is the most appropriate approach to anti-D immunoglobulin?", "options": ["Give anti-D immunoglobulin 250 IU now", "Give anti-D immunoglobulin 500 IU with a Kleihauer test", "Anti-D immunoglobulin is not indicated", "Give anti-D only if the bleeding becomes heavy or recurrent within this episode", "Give anti-D and repeat in 6 weeks regardless of events"], "answer": 2, "exp": "Anti-D is not required for a threatened miscarriage before 12 weeks where the pregnancy continues and there has been no instrumentation. [G]\n\nBefore 12 weeks it is given for ectopic pregnancy, molar pregnancy, therapeutic termination, and for uterine evacuation or instrumentation. From 12 weeks onwards, any sensitising event warrants anti-D, with a Kleihauer to quantify from 20 weeks. [G]BSH/RCOG guidance on anti-D immunoglobulin prophylaxis; NICE NG126", "type": "mcq"}, {"n": 37, "topic": "Obstetrics", "stem": "A 31-year-old woman at 34 weeks' gestation has a generalised tonic-clonic seizure in the ED. BP is 178/112 and urinalysis shows 3+ protein. The seizure is ongoing at 90 seconds. Obstetrics is on the way.\n\nWhat is the most appropriate anticonvulsant treatment?", "options": ["Lorazepam 4 mg IV, repeated once after 10 minutes", "Magnesium sulfate 4 g IV over 5–15 minutes, then 1 g/hour infusion", "Magnesium sulfate 2 g IV over 5 minutes, then 0.5 g/hour infusion", "Levetiracetam 60 mg/kg IV over 10 minutes", "Phenytoin 20 mg/kg IV over 20 minutes"], "answer": 1, "exp": "Eclampsia is treated with magnesium sulfate: a 4 g loading dose IV over 5–15 minutes, followed by 1 g/hour for 24 hours. Recurrent seizures get a further 2 g bolus. [G]\n\nOption C is the halved-dose near-miss. Benzodiazepines and standard second-line antiepileptics are inferior to magnesium here and delay the correct drug — this is one of the few settings where the generic status epilepticus ladder does not apply. Blood pressure also needs urgent treatment (labetalol first-line). [G]NICE NG133 — Hypertension in pregnancy", "type": "mcq"}, {"n": 38, "topic": "Legal", "stem": "A 22-year-old man has taken a large paracetamol overdose 2 hours ago and now says he regrets nothing and refuses acetylcysteine. He is fully alert, understands that he may die of liver failure, can weigh this up and communicates a clear, consistent refusal. He has no diagnosed mental disorder and psychiatric assessment finds no impairment of decision-making.\n\nWhat is the most appropriate course of action?", "options": ["Treat under the Mental Capacity Act as the refusal is inherently irrational", "Detain under section 5(2) of the Mental Health Act to allow treatment", "Respect the refusal, continue to offer treatment and document the capacity assessment", "Obtain consent from his next of kin", "Treat under common law necessity because the situation is life-threatening"], "answer": 2, "exp": "A capacitous adult may refuse life-sustaining treatment. Where the four-stage test is satisfied — understand, retain, weigh, communicate — the refusal must be respected, with careful documentation, continued offering of treatment, and re-assessment if his condition or presentation changes. [G]\n\nAn unwise decision is not incapacity. The MCA cannot be used to override a capacitous refusal, next of kin cannot consent for an adult in England and Wales, and section 5(2) applies only to an inpatient with suspected mental disorder — and even then does not authorise treatment of the physical consequences of overdose. [C]Mental Capacity Act 2005; Mental Health Act 1983 (as amended); RCEM Mental Health guidance", "type": "mcq"}, {"n": 39, "topic": "Haematology", "stem": "A 79-year-old woman on warfarin for a metallic mitral valve presents after a fall with a GCS of 13 and a large acute subdural haematoma on CT. INR is 5.6.\n\nWhat is the most appropriate reversal strategy?", "options": ["Vitamin K 5 mg IV alone", "Prothrombin complex concentrate and vitamin K 5 mg IV", "Fresh frozen plasma 15 mL/kg alone", "Stop warfarin and recheck the INR in 6 hours", "Idarucizumab 5 g IV"], "answer": 1, "exp": "Major bleeding on warfarin is reversed with prothrombin complex concentrate (dose by weight and INR) plus vitamin K 5 mg IV. PCC works within minutes but is short-lived; vitamin K sustains the reversal. [G]\n\nVitamin K alone takes 6–12 hours — too slow for intracranial haemorrhage. FFP is inferior and volume-heavy, reserved for when PCC is unavailable. Idarucizumab reverses dabigatran, not warfarin — the right-antidote-wrong-drug trap. [G]BSH Guidelines on oral anticoagulation reversal; NICE NG232", "type": "mcq"}, {"n": 40, "topic": "Older people", "stem": "An 82-year-old man is brought in with a 2-day history of fluctuating confusion, worse at night, with visual hallucinations and inattention. He is usually independent with no cognitive diagnosis. He is apyrexial, and examination reveals a distended bladder.\n\nWhat is the single most appropriate initial management priority?", "options": ["Prescribe regular oral haloperidol to control the hallucinations", "Identify and treat the precipitant, starting with urinary catheterisation", "Arrange urgent CT head before any other intervention", "Start an anticholinergic to reduce bladder spasm", "Arrange a memory clinic referral and discharge with a carer"], "answer": 1, "exp": "Delirium management is identify and treat the underlying cause plus supportive, non-pharmacological measures — here, relieving acute urinary retention. [G]\n\nAntipsychotics are reserved for the distressed or at-risk patient when de-escalation has failed, used at the lowest dose for the shortest time (and avoided in Parkinson's disease and Lewy body dementia). Anticholinergics worsen delirium. CT head is indicated for focal neurology, head injury or anticoagulation, not routinely. [G]NICE CG103 — Delirium: prevention, diagnosis and management", "type": "mcq"}]}, {"code": "SIM2", "title": "Mock Paper 2 (timed)", "source": "Full-blueprint 40Q · mixed topics", "hue": "#cbd5e1", "questions": [{"n": 1, "topic": "Resus", "stem": "A 76-year-old man has a heart rate of 34/min with complete heart block and a broad QRS escape rhythm. BP 82/48 and he is clammy and confused. He has received atropine 500 micrograms IV twice with no response.\n\nWhat is the most appropriate next step?", "options": ["Continue atropine to a total of 3 mg before considering anything else", "Transcutaneous pacing, with adrenaline 2–10 micrograms/min as an alternative or bridge", "Dopamine infusion at 5 micrograms/kg/min", "Isoprenaline 5 micrograms/min as the sole intervention", "Immediate transvenous pacing wire insertion in the ED before any drug therapy"], "answer": 1, "exp": "With adverse features unresponsive to atropine, move to transcutaneous pacing or an adrenaline infusion 2–10 micrograms/min, titrated to response, while arranging expert help for transvenous pacing. [G]\n\nAtropine to 3 mg is correct in principle, but broad-complex complete heart block is one of the situations where atropine is unlikely to work and where a risk of asystole exists — do not keep pushing it while the patient decompensates. The asystole risk factors to memorise: recent asystole, Mobitz II AV block, complete heart block with broad QRS, and a ventricular pause over 3 seconds. [G]Resuscitation Council UK — Adult Bradycardia algorithm (2021)", "type": "mcq"}, {"n": 2, "topic": "Resus", "stem": "A 24-year-old man is stabbed in the left chest and arrests in the resus room. There were signs of life on arrival 6 minutes ago. The team is performing chest compressions.\n\nWhat is the most appropriate priority?", "options": ["Pericardiocentesis under ultrasound guidance", "Bilateral finger thoracostomies, then reassess before any thoracotomy decision", "Rapid infusion of 2 litres of crystalloid", "Immediate resuscitative thoracotomy", "Continue high-quality compressions and give adrenaline 1 mg every 3–5 minutes"], "answer": 3, "exp": "In traumatic cardiac arrest from penetrating chest or epigastric trauma with less than 15 minutes since loss of vital signs, immediate resuscitative thoracotomy is indicated. He is 6 minutes in with a witnessed arrest. [G]\n\nChest compressions and adrenaline are of limited value until the reversible cause is corrected — traumatic arrest is managed by treating hypovolaemia, tension pneumothorax, tamponade and hypoxia simultaneously, not by running the medical algorithm. Thoracostomies are right for a blunt or non-penetrating arrest, and needle pericardiocentesis is inferior to thoracotomy where thoracotomy is available. [G]Resuscitation Council UK — Special Circumstances: Traumatic Cardiac Arrest (2021)", "type": "mcq"}, {"n": 3, "topic": "Cardiology", "stem": "A 64-year-old woman has palpitations. ECG confirms atrial fibrillation at 128/min. She is comfortable, BP 128/76, with no chest pain or heart failure. She thinks the palpitations started 'about three days ago' but is not certain. She takes no anticoagulant.\n\nW

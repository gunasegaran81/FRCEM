 "[G] 30–35°C band: adrenaline every ~8 min (6–10), defibrillate at normal 2-min intervals. Below 30°C is the different rule (single adrenaline, max 3 shocks, hold until >30°C, start ECLS). At 31°C this child is in the 30–35°C band.", "type": "mcq"}, {"n": 9, "topic": "DKA fluids", "stem": "A 25 kg child in DKA, dehydrated and vomiting but NOT shocked (CRT 2 s, normal BP). Initial fluid?", "options": ["10 mL/kg over 30 min, subtracted from the requirement", "20 mL/kg over 10 min, not subtracted", "10 mL/kg over 5–10 min, repeated to 40 mL/kg", "No bolus; deficit over 48 h only", "20 mL/kg 0.45% saline over 1 h"], "answer": 0, "exp": "[G NICE NG18 / BSPED 2024] Dehydrated but NOT shocked: 10 mL/kg over 30 min, and subtract that volume from the fluid requirement. Shocked = 10 mL/kg over 5–10 min, repeat to 40 mL/kg, NOT subtracted. Not shocked = slower + subtracted.", "type": "mcq"}, {"n": 10, "topic": "Pre-arrest adrenaline", "stem": "A 3-year-old during anaesthetic induction becomes profoundly bradycardic and hypotensive but has NOT lost cardiac output. Initial adrenaline dose?", "options": ["10 mcg/kg IV immediately", "1–2 mcg/kg IV incremental, escalating to 10 mcg/kg only if arrest", "100 mcg/kg IV", "500 mcg IM", "Withhold until asystole confirmed"], "answer": 1, "exp": "[G] Pre-arrest bradycardia/hypotension: incremental 1–2 mcg/kg IV, escalating to the 10 mcg/kg arrest dose only if arrest occurs. The pre-arrest dose is one tenth of the arrest dose.", "type": "mcq"}]}, {"code": "MIX3", "title": "Mixed Weak-Area Drill 3", "source": "MHA · RCUK · NICE NG84/NG20/NG98/NG240", "hue": "#e879f9", "questions": [{"n": 1, "topic": "Interleaved weak areas", "stem": "Police find a man behaving erratically and in apparent mental distress on a motorway footbridge, attempting to climb over the railing. He appears to have a mental disorder and is in immediate danger. No mental health professional is contactable in the time available. What is the lawful position on using section 136?", "options": ["They must wait until a mental health professional can be consulted before acting", "They may use s136 immediately; consultation is required only where practicable, and imminent risk makes it impracticable", "They must obtain a section 135 warrant first", "They cannot use s136 on a bridge as it is not a 'public place'", "They must rely on common law rather than s136 in any emergency"], "answer": 1, "exp": "[G] MHA 1983 (as amended) / RCEM s136 guidance: an officer must, WHERE PRACTICABLE, consult a mental health professional before using s136 — but 'where practicable' is a qualifier, not an absolute precondition.\n\n[G] In a time-critical, imminent-risk situation, immediate use of s136 without prior consultation is lawful. It does not force a switch to s135 (warrant for a private dwelling) or common law.\n\nThis is the flashcard item missed three times: consultation is a duty to attempt when there is time, not a lock that disables the power when there isn't.", "type": "mcq"}, {"n": 2, "topic": "Interleaved weak areas", "stem": "A man is brought to the ED by ambulance after a friend raised concerns. He is medically fit for discharge, has capacity for the decision, and wants to leave before the crisis team arrives to assess him. Staff are concerned he may be at risk. Which statement is correct?", "options": ["He can be held under the Mental Capacity Act until the crisis team completes their assessment", "The MCA cannot be used solely to detain a capacitous patient to await a Mental Health Act assessment; that requires the MHA route", "A doctor can place him on a section 5(2) as an ED attender", "Common law allows indefinite detention because he is a possible risk to himself", "Security can restrain him under the MCA regardless of capacity"], "answer": 1, "exp": "[Sessay principle] The MCA (and common law) is NOT a lawful vehicle to detain someone purely to hold them for an MHA assessment. Detention for assessment must go through the MHA — s2/s3, or s136 if they leave into a public place.\n\n[C] The MCA applies only to people who LACK capacity for the relevant decision, and only to prevent immediate harm in their best interests. He currently has capacity.\n\n[C] s5(2) is a holding power for a patient already admitted to a ward, not for the ED. The trap answer is A — 'MCA detains until the assessment is done'.", "type": "mcq"}, {"n": 3, "topic": "Interleaved weak areas", "stem": "A 3-year-old is in cardiac arrest with a tracheal tube confirmed by waveform capnography and continuous compressions running. At what rate should he be ventilated?", "options": ["10 breaths/min", "15 breaths/min", "20 breaths/min", "25 breaths/min", "30 breaths/min"], "answer": 2, "exp": "[G] RCUK 2025: with an advanced airway in place, ventilate at the lower limit of normal for age — infants 25, 1–8y 20, 8–12y 15, over 12y 10 breaths/min. A 3-year-old is in the 1–8y band: 20/min.\n\nThe full descending ladder is 25 / 20 / 15 / 10 — rates step DOWN with age. This is the flashcard item missed twice (a 4-month-old and a 10-year-old previously).\n\nFresh age point to consolidate the middle of the table.", "type": "mcq"}, {"n": 4, "topic": "Interleaved weak areas", "stem": "A 12-year-old with a sore throat scores highly on FeverPAIN and warrants an antibiotic. There is no penicillin allergy. What is the correct first-line antibiotic?", "options": ["Amoxicillin", "Phenoxymethylpenicillin (penicillin V)", "Co-amoxiclav", "Clarithromycin", "Cefalexin"], "answer": 1, "exp": "[G] NICE NG84 (acute sore throat): first-line for a sore throat needing an antibiotic is phenoxymethylpenicillin (penicillin V) for 5–10 days; a macrolide such as clarithromycin is used only for penicillin allergy.\n\n[C] Amoxicillin is deliberately NOT first-line, because if the illness is actually glandular fever (EBV), amoxicillin/ampicillin commonly precipitate a florid maculopapular rash.\n\nThis pairs the two PAED2 items you missed together: sore-throat antibiotic = penicillin V, precisely to avoid the amoxicillin/EBV rash.", "type": "mcq"}, {"n": 5, "topic": "Interleaved weak areas", "stem": "A 9-year-old with type 1 diabetes and poor growth is being investigated for coeliac disease. The family, trying to help, has already removed all gluten from the diet for the past 3 weeks. What is the correct advice before serological testing?", "options": ["Proceed with serology now, as the diet does not affect results", "Reintroduce gluten in more than one meal a day for at least 6 weeks before testing, or the result may be falsely negative", "Test for IgG anti-gliadin instead, which is unaffected by diet", "Start a gluten-free diet permanently and treat empirically", "Arrange duodenal biopsy without any serology or gluten"], "answer": 1, "exp": "[G] NICE NG20: coeliac serology is only valid on a gluten-containing diet. If gluten has been removed, advise reintroducing it in more than one meal every day for at least 6 weeks before testing, otherwise the result may be falsely negative.\n\n[G] First-line serology is total IgA plus IgA tissue transglutaminase (tTG). Checking total IgA matters because IgA deficiency causes a false-negative tTG.\n\nThis is the coeliac flashcard: don't remove gluten before testing — and if already removed, reintroduce before you test.", "type": "mcq"}, {"n": 6, "topic": "Interleaved weak areas", "stem": "A severely malnourished 15-year-old with a restrictive eating disorder is admitted and started on nutritional rehabilitation. Two days in, which biochemical change should you actively monitor for as the hallmark of refeeding syndrome?", "options": ["Rising sodium", "Falling phosphate, potassium and magnesium", "Rising calcium", "Falling glucose alone", "Rising urea"], "answer": 1, "exp": "[C, UK practice — MEED / NICE NG69] Refeeding syndrome is the dangerous electrolyte shift when nutrition is reintroduced to a starved patient: hypophosphataemia, hypokalaemia and hypomagnesaemia, with thiamine depletion.\n\n[C] Monitor electrolytes closely, replace them, and give thiamine before or with refeeding. Falling phosphate is the classic marker.\n\n[C] Note that under-feeding out of excessive caution is also harmful, so refeeding must be adequate as well as cautiously monitored.", "type": "mcq"}, {"n": 7, "topic": "Interleaved weak areas", "stem": "A 10-day-old boy presents collapsed with vomiting and dehydration. Bloods show hyponatraemia, hyperkalaemia and hypoglycaemia, and a salt-losing crisis from congenital adrenal hyperplasia is suspected. What is the correct immediate treatment?", "options": ["Treat the hyperkalaemia with calcium gluconate alone and observe", "IV 0.9% sodium chloride with glucose AND IV hydrocortisone", "Oral rehydration solution and routine feeds", "Insulin–dextrose infusion as the priority", "Withhold all treatment until the diagnosis is biochemically confirmed"], "answer": 1, "exp": "[C, UK practice] A salt-losing adrenal crisis (classically salt-wasting CAH) presents in the second week of life with vomiting, dehydration, hyponatraemia, hyperkalaemia and hypoglycaemia. Treat with IV 0.9% saline and glucose to correct volume and hypoglycaemia, AND IV hydrocortisone to replace the missing cortisol.\n\n[C] The trap is treating the potassium alone and missing the underlying cortisol deficiency — hydrocortisone is the definitive step.\n\n[C] Take a critical sample (cortisol, 17-OHP, glucose, U&E) where feasible, but do not delay treatment to confirm the diagnosis.", "type": "mcq"}, {"n": 8, "topic": "Interleaved weak areas", "stem": "A child with suspected meningitis has a fluctuating conscious level, focal neurological signs and signs of shock. According to NICE NG240, what is the correct approach to lumbar puncture and antibiotics?", "options": ["Perform an immediate LP before giving antibiotics", "Do not perform an LP now; give antibiotics without delay, as these features contraindicate immediate LP", "Delay antibiotics until a CT has been done and reported", "Perform the LP only once the child is fully alert", "Give antibiotics only after the LP, whatever the delay"], "answer": 1, "exp": "[G] NICE NG240: do NOT delay antibiotics to perform an LP. Contraindications to immediate LP include reduced or fluctuating consciousness, focal neurological signs, shock, extensive or spreading purpura, seizures until stabilised, and coagulopathy.\n\n[C] Give antibiotics first, stabilise, and perform the LP later once it is safe. A normal CT does not by itself confirm it is safe to proceed.\n\nThe examinable principle: treatment is never delayed for the LP.", "type": "mcq"}, {"n": 9, "topic": "Interleaved weak areas", "stem": "A 3-week-old, breastfed and otherwise thriving, remains visibly jaundiced. According to NICE NG98, what is the essential investigation to exclude a serious cause?", "options": ["No investigation is needed for breast-milk jaundice", "Measure the conjugated (direct) bilirubin fraction to exclude biliary atresia", "Repeat a transcutaneous bilirubin only", "Start phototherapy empirically", "Reassure and review in one month"], "answer": 1, "exp": "[G] NICE NG98: in prolonged jaundice (over 14 days in a term baby, 21 days if preterm), measure the CONJUGATED bilirubin. A raised conjugated fraction suggests a serious hepatobiliary cause such as biliary atresia, where the Kasai procedure is time-critical.\n\n[C] Also check for pale stools and dark urine, which point to obstructive/conjugated jaundice.\n\n[C] Unconjugated prolonged jaundice in a thriving breastfed baby is often benign breast-milk jaundice — but conjugated jaundice is never assumed benign.", "type": "mcq"}, {"n": 10, "topic": "Interleaved weak areas", "stem": "A child with atopic eczema presents with a rapidly worsening, painful rash showing clustered vesicles and punched-out erosions, together with fever and malaise. What is the diagnosis and correct management?", "options": ["Infected eczema — oral flucloxacillin", "Eczema herpeticum — urgent systemic aciclovir and same-day specialist advice", "A simple eczema flare — increase emollients and topical steroid", "Contact dermatitis — potent topical steroid", "Chickenpox — supportive care only"], "answer": 1, "exp": "[C, UK practice — NICE CG57] Eczema herpeticum (disseminated herpes simplex on eczematous skin) presents with rapidly worsening, painful eczema, clustered blisters, punched-out erosions and systemic upset. It is a dermatological emergency needing urgent systemic aciclovir and same-day specialist involvement.\n\n[C] If it is near the eyes, arrange same-day ophthalmology assessment.\n\n[C] The discriminator from bacterially infected eczema (golden crusting, weeping → antibiotics) is the painful, punched-out, vesicular pattern with systemic upset.", "type": "mcq"}]}]</script>
<script>
const SETS = JSON.parse(document.getElementById('data').textContent);
const LTR = ['A','B','C','D','E'];
const app = document.getElementById('app');
let S = { view:'home', set:null, start:1 };
let run = null; // {set, order:[idx...], pos, answers:{n:chosen}, correct, attempted, missed:[], viewedMax}

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function home(){
  const cards = SETS.map((set,i)=>`
    <button class="card" style="--hue:${set.hue}" onclick="openSet(${i})">
      <span class="spine"></span>
      <span class="top">
        <span class="chip">${set.code}</span>
        <span class="qn">${set.questions.length} Q</span>
      </span>
      <h2>${esc(set.title)}</h2>
      <div class="src">${esc(set.source)}</div>
    </button>`).join('');
  app.innerHTML = `
    <div class="eyebrow">FRCEM SBA · Question Bank</div>
    <h1>Catalogue</h1>
    <p class="sub">Tap a set, choose where to start, work through in fixed order. Nothing is stored on your device — copy your result code at the end.</p>
    <div class="cards">${cards}</div>
    <div class="foot">${SETS.reduce((a,s)=>a+s.questions.length,0)} questions · UK guidelines only</div>`;
  window.scrollTo(0,0);
}

function openSet(i){
  S.set=i; S.start=1;
  const set=SETS[i]; const n=set.questions.length;
  app.innerHTML=`
    <button class="back" onclick="home()">&larr; Catalogue</button>
    <div class="panel" style="--hue:${set.hue}">
      <span class="chip" style="--hue:${set.hue}">${set.code}</span>
      <h1 style="margin-top:12px">${esc(set.title)}</h1>
      <div class="sub" style="margin-bottom:18px">${esc(set.source)} · ${n} questions</div>
      <div class="label">Start from question</div>
      <div class="stepper">
        <button onclick="bump(-1)" aria-label="down">–</button>
        <input id="startn" type="number" inputmode="numeric" min="1" max="${n}" value="${S.start}" onchange="setStart(this.value)">
        <button onclick="bump(1)" aria-label="up">+</button>
      </div>
      <div style="height:18px"></div>
      <button class="btn" style="background:${set.hue};color:#0d1117" onclick="startRun()">Start &rarr;</button>
    </div>`;
  window.scrollTo(0,0);
}
function bump(d){const set=SETS[S.set];S.start=Math.min(set.questions.length,Math.max(1,S.start+d));document.getElementById('startn').value=S.start;}
function setStart(v){const set=SETS[S.set];let x=parseInt(v||'1',10);if(isNaN(x))x=1;S.start=Math.min(set.questions.length,Math.max(1,x));document.getElementById('startn').value=S.start;}

function startRun(){
  const set=SETS[S.set];
  const order=[]; for(let k=S.start-1;k<set.questions.length;k++) order.push(k);
  run={set:S.set,order,pos:0,answers:{},correct:0,attempted:0,missed:[],lastN:set.questions[order[0]].n};
  renderQ();
}

function renderQ(){
  const set=SETS[run.set];
  const q=set.questions[run.order[run.pos]];
  run.lastN=q.n;
  const total=run.order.length, done=run.pos;
  const answered = run.answers.hasOwnProperty(q.n);
  const isShort = q.type==='short';
  let optsHtml='';
  if(!isShort){
    optsHtml = q.options.map((o,k)=>{
      let cls='opt';
      if(answered){
        if(k===q.answer) cls+=' correct';
        else if(k===run.answers[q.n]) cls+=' wrong';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="choose(${k})">
        <span class="ltr">${LTR[k]}</span><span>${esc(o)}</span></button>`;
    }).join('');
  }
  let expHtml='';
  if(answered){
    if(isShort){
      expHtml=`<div class="model"><b>Model answer.</b> ${esc(q.model)}</div>
               <div class="exp"><div class="verdict">Recall card — not scored</div>${esc(q.exp||'')}</div>`;
    }else{
      const ok=run.answers[q.n]===q.answer;
      expHtml=`<div class="exp"><div class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect — answer '+LTR[q.answer]}</div>${esc(q.exp)}</div>`;
    }
  }
  const lastQ = run.pos===total-1;
  const nav = answered ? `<button class="btn" style="background:${set.hue};color:#0d1117" onclick="next()">${lastQ?'Finish &rarr;':'Next &rarr;'}</button>` : '';
  const shortReveal = (isShort && !answered) ? `<button class="btn ghost" onclick="revealShort()">Reveal model answer</button>` : '';
  app.innerHTML=`
    <div class="qbar" style="--hue:${set.hue}">
      <span class="idx">${set.code} · Q${q.n}</span>
      <span class="prog"><i style="width:${Math.round((done/(total))*100)}%"></i></span>
      <button class="stop" onclick="finish(true)">Stop &amp; score</button>
    </div>
    <span class="tag" style="--hue:${set.hue}">${esc(q.topic)}</span>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts">${optsHtml}</div>
    ${shortReveal}
    ${expHtml}
    <div class="navbtns">${nav}</div>`;
  window.scrollTo(0,0);
}

function choose(k){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  if(run.answers.hasOwnProperty(q.n))return;
  run.answers[q.n]=k; run.attempted++;
  if(k===q.answer) run.correct++; else run.missed.push(q.n);
  renderQ();
}
function revealShort(){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  run.answers[q.n]='seen'; renderQ();
}
function next(){
  if(run.pos<run.order.length-1){run.pos++;renderQ();}
  else finish(false);
}

function finish(stopped){
  const set=SETS[run.set];
  const firstN = set.questions[run.order[0]].n;
  const lastN = run.lastN;
  const att=run.attempted, cor=run.correct;
  const pct = att? Math.round(cor/att*100):0;
  const missed=[...run.missed].sort((a,b)=>a-b);
  const code = `${set.code} ${firstN}-${lastN} ${cor}/${att} W:${missed.length?missed.join(','):'-'}`;
  const missedHtml = missed.length? `<div class="label" style="margin-top:16px">Missed</div><div class="missed">${missed.map(n=>`<span>Q${n}</span>`).join('')}</div>`:
    `<div class="label" style="margin-top:16px">Missed</div><div class="sub" style="margin:0">None — clean run.</div>`;
  app.innerHTML=`
    <button class="back" onclick="openSet(${run.set})">&larr; ${set.code}</button>
    <div class="panel" style="--hue:${set.hue}">
      <div class="label">${set.code} · ${stopped?'stopped at':'completed to'} Q${lastN}</div>
      <div class="big">${cor}<span style="color:var(--muted);font-size:24px">/${att}</span></div>
      <div class="pct">${pct}% · questions ${firstN}–${lastN}</div>
      ${missedHtml}
      <div class="label" style="margin-top:18px">Result code</div>
      <div class="code" id="code">${esc(code)}</div>
      <div class="navbtns">
        <button class="btn sm" style="background:${set.hue};color:#0d1117;width:100%" onclick="copyCode(${JSON.stringify(code).replace(/"/g,'&quot;')})">Copy result code</button>
      </div>
      <div class="navbtns">
        <button class="btn ghost" onclick="home()">Catalogue</button>
        <button class="btn ghost" onclick="openSet(${run.set})">Redo set</button>
      </div>
    </div>
    <div class="foot">Paste the code back into your FRCEM chat to log the result.</div>`;
  window.scrollTo(0,0);
}

function copyCode(txt){
  const done=()=>toast();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,cb){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
let tt;
function toast(){const t=document.getElementById('toast');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400);}

home();
</script>
</body>
</html>

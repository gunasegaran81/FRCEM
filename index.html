er": 1, "exp": "NG217 7.1.1 [G]: treat convulsive seizures lasting 5 minutes or more as status epilepticus. The older '30 minutes' figure is a superseded definition for treatment purposes — a classic near-miss distractor.", "type": "mcq"}]}, {"code": "TOX", "title": "Acute Opioid Toxicity", "source": "RCEM / NPIS · April 2024", "hue": "#f5b544", "questions": [{"n": 1, "topic": "Scope", "stem": "This guideline applies to acute opioid toxicity from illicit use, misuse or deliberate self-poisoning. In which group is it explicitly NOT applicable?", "options": ["Patients on methadone maintenance", "Patients taking prescribed opioids for palliative care/cancer pain", "Patients under 18", "Patients with co-ingestion of benzodiazepines", "Patients presenting >6 hours after use"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). It excludes patients on prescribed opioids for palliative/cancer pain.", "type": "mcq"}, {"n": 2, "topic": "Epidemiology", "stem": "Regarding European ED drug toxicity presentations, which class is most frequently encountered?", "options": ["Benzodiazepines", "Opioids", "Sympathomimetics", "NPS cannabinoids", "Alcohol alone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Opioids are the most frequent.", "type": "mcq"}, {"n": 3, "topic": "Epidemiology", "stem": "Approximately how many opioid-related drug deaths occurred per week in Great Britain in 2022?", "options": ["20", "40", "60", "100", "150"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60 per week.", "type": "mcq"}, {"n": 4, "topic": "Epidemiology", "stem": "In Scotland (2022), drug poisoning death rate vs the UK average, and the proportion of drug-misuse deaths implicating opiates/opioids, were approximately:", "options": ["1.5x higher; 50%", "2.7x higher; 82%", "4x higher; 60%", "Equal; 90%", "2x higher; 70%"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~2.7x higher; ~82%.", "type": "mcq"}, {"n": 5, "topic": "Epidemiology", "stem": "Since 2009, how many novel psychoactive substance (NPS) opioids have been identified on the European market?", "options": ["24", "44", "74", "104", "124"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 74.", "type": "mcq"}, {"n": 6, "topic": "Epidemiology", "stem": "Which novel opioid is cited as having roughly twice the potency of fentanyl?", "options": ["Carfentanil", "Isotonitazene", "U-47700", "Etonitazene", "Acetylfentanyl"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Isotonitazene (~2x fentanyl potency).", "type": "mcq"}, {"n": 7, "topic": "Epidemiology", "stem": "Acute opioid toxicity presentations are more common:", "options": ["Early morning on weekdays", "At weekends, late evening and night", "Only in winter", "Immediately after payday only", "Equally distributed"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Weekends, late evening and night.", "type": "mcq"}, {"n": 8, "topic": "Toxidrome", "stem": "The classic triad of acute opioid toxicity is:", "options": ["Hypertension, mydriasis, tachypnoea", "Drowsiness, respiratory depression, miosis", "Agitation, hyperthermia, tachycardia", "Seizures, bradycardia, mydriasis", "Vomiting, diarrhoea, diaphoresis"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Drowsiness, respiratory depression, miosis.", "type": "mcq"}, {"n": 9, "topic": "Toxidrome", "stem": "Which is NOT a recognised feature of acute opioid toxicity in this guideline?", "options": ["Hypothermia from environmental exposure", "Hypertension and tachycardia", "Convulsions", "Urticaria and pruritis", "Neuropsychiatric features (nightmares, hallucinations, paranoia)"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Hypertension/tachycardia are NOT features of opioid toxicity.", "type": "mcq"}, {"n": 10, "topic": "Toxidrome", "stem": "Co-ingestion with which class most exacerbates respiratory depression?", "options": ["Antihistamines", "Benzodiazepines and GABA-ergics (e.g. pregabalin)", "Beta-blockers", "Statins", "Proton pump inhibitors"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Benzodiazepines/GABA-ergics.", "type": "mcq"}, {"n": 11, "topic": "Diagnosis", "stem": "Role of urine drug screening in immediate ED management of suspected opioid toxicity?", "options": ["Mandatory before naloxone", "Confirms diagnosis and guides naloxone dosing", "No role in immediate management; diagnosis is clinical", "Send but wait for results before treating", "Replaces clinical assessment"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Diagnosis is clinical; urine screen has no immediate role.", "type": "mcq"}, {"n": 12, "topic": "Diagnosis", "stem": "For diagnostic uncertainty, who should be contacted for advice?", "options": ["Regional toxicology consultant only", "A clinical toxicologist via the National Poisons Information Service (NPIS)", "The coroner's office", "The patient's GP", "The hospital pharmacist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). NPIS clinical toxicologist.", "type": "mcq"}, {"n": 13, "topic": "Naloxone principles", "stem": "Primary therapeutic aim of naloxone in acute opioid toxicity?", "options": ["Full reversal of unconsciousness", "Reversal of respiratory depression and maintenance of airway protective reflexes", "Normalising pupil size", "Preventing all withdrawal symptoms", "Achieving GCS 15"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reverse respiratory depression / maintain airway reflexes, NOT full arousal.", "type": "mcq"}, {"n": 14, "topic": "Naloxone principles", "stem": "Naloxone acts as a:", "options": ["Partial mu-opioid agonist", "Mu-opioid receptor antagonist", "Kappa-opioid agonist", "NMDA antagonist", "GABA agonist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Mu-opioid receptor antagonist.", "type": "mcq"}, {"n": 15, "topic": "Naloxone principles", "stem": "Preferred naloxone route in the ED when IV access is available?", "options": ["Intramuscular", "Intranasal", "Intravenous", "Subcutaneous", "Intraosseous"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IV when access available.", "type": "mcq"}, {"n": 16, "topic": "Naloxone principles", "stem": "Compared with IV, the IM and IN routes are associated with:", "options": ["Shorter time to peak concentration", "Longer time to peak concentration", "Identical pharmacokinetics", "Greater risk of withdrawal", "No difference in onset"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Longer time to peak concentration.", "type": "mcq"}, {"n": 17, "topic": "Naloxone principles", "stem": "The guideline actively discourages which practice?", "options": ["Giving naloxone via IO access", "Giving IM naloxone alongside IV, or IM naloxone prior to discharge", "Titrating naloxone in small boluses", "Monitoring ETCO2", "Using saline to dilute naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid IM naloxone alongside IV / IM before discharge.", "type": "mcq"}, {"n": 18, "topic": "Naloxone principles", "stem": "Adverse effects from naloxone are more likely when:", "options": ["Small titrated doses are used", "Excessive/large doses are used", "Given IV rather than IM", "Given with oxygen", "Given to opioid-naïve patients"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Excessive doses.", "type": "mcq"}, {"n": 19, "topic": "Naloxone principles", "stem": "Which is a reported adverse effect of naloxone?", "options": ["Bradycardia and hypotension only", "Nausea, vomiting, sweating, tachycardia, tremor, hyperventilation, hypertension", "Miosis", "Sedation", "Hypoglycaemia"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal-type effects: N/V, sweating, tachycardia, tremor, hypertension.", "type": "mcq"}, {"n": 20, "topic": "Naloxone principles", "stem": "Regarding naloxone-associated convulsions, the guideline states:", "options": ["Common and clearly caused by naloxone", "A causal link is not clearly shown; may relate to co-used drugs", "Only with IM naloxone", "More common than opioid withdrawal", "Never occur"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Causal link not clearly established.", "type": "mcq"}, {"n": 21, "topic": "Naloxone principles", "stem": "Why are smaller initial IV naloxone doses preferred in hospital (non-arrest) settings?", "options": ["To reduce drug cost", "To find the minimum dose reversing respiratory depression while avoiding acute iatrogenic withdrawal", "Larger doses are contraindicated in all", "Smaller doses act faster", "IV naloxone has a ceiling effect"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to minimum effective dose; avoid precipitating withdrawal.", "type": "mcq"}, {"n": 22, "topic": "Naloxone principles", "stem": "Overzealous reversal is particularly concerning with opioid+stimulant co-use because it may:", "options": ["Cause immediate cardiac arrest", "Unmask stimulant toxicity", "Prevent withdrawal entirely", "Cause permanent respiratory depression", "Have no additional risk"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Can unmask stimulant toxicity.", "type": "mcq"}, {"n": 23, "topic": "Withdrawal", "stem": "Which is NOT a feature of acute opioid withdrawal (Table 1)?", "options": ["Yawning", "Lacrimation", "Miosis (pinpoint pupils)", "Piloerection-type fine muscle tremor", "Tachycardia and hypertension"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal causes DILATED pupils, not miosis.", "type": "mcq"}, {"n": 24, "topic": "Withdrawal", "stem": "Which pupil finding is associated with opioid WITHDRAWAL (vs toxicity)?", "options": ["Pinpoint/constricted", "Dilated", "Unequal", "Fixed", "No change"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Dilated pupils in withdrawal.", "type": "mcq"}, {"n": 25, "topic": "Withdrawal", "stem": "List at least six features of acute opioid withdrawal (Table 1). (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Yawning, sneezing, lacrimation, tachycardia, hypertension, dilated pupils, diarrhoea, cool/clammy skin, fine muscle tremor, nausea, irritability, restlessness, anxiety, coughing, running nose."}, {"n": 26, "topic": "Algorithm", "stem": "Per Figure 1, initial steps for any suspected opioid toxicity include:", "options": ["Immediate 2 mg IV naloxone bolus for all", "Attach monitoring and secure IV access", "Immediate intubation", "CT head before any treatment", "Urine toxicology before intervention"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Attach monitoring, secure IV access.", "type": "mcq"}, {"n": 27, "topic": "Algorithm", "stem": "RR >10/min and SpO2 >92% on air. Initial management?", "options": ["400 mcg naloxone IV", "Naloxone not required; monitor RR, SpO2, ETCO2 and AVPU every 30 min", "Start a naloxone infusion", "Discharge immediately", "100 mcg naloxone as a precaution"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Green pathway: monitor, no naloxone.", "type": "mcq"}, {"n": 28, "topic": "Algorithm", "stem": "RR 6–10/min or SpO2 86–92% on air (amber). First action?", "options": ["Call for senior decision maker", "Apply supplemental oxygen, then titrated IV naloxone 100–200 mcg every 60 s", "BVM at 10–12 breaths/min", "Start naloxone infusion directly", "400 mcg naloxone IV bolus immediately"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Oxygen then titrated 100–200 mcg boluses every 60 s.", "type": "mcq"}, {"n": 29, "topic": "Algorithm", "stem": "In the amber pathway, titrated boluses every 60 s up to a maximum of:", "options": ["400 mcg", "800 mcg", "1200 mcg", "2000 mcg", "4000 mcg"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 2000 mcg (2 mg).", "type": "mcq"}, {"n": 30, "topic": "Algorithm", "stem": "What defines the 'red' (respiratory/peri-arrest) pathway?", "options": ["RR ≤5 and/or SpO2 <85% on air", "RR ≤10 and SpO2 <92%", "Any GCS <15", "Any patient needing >1 bolus", "RR ≤8 regardless of SpO2"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). RR ≤5 and/or SpO2 <85% on air.", "type": "mcq"}, {"n": 31, "topic": "Algorithm", "stem": "Red pathway: initial oxygen/ventilation strategy?", "options": ["15 L/min NRB, no ventilation", "Ventilate with 15 L/min O2 via BVM at 10–12 breaths/min per ALS", "Nasal cannula 4 L/min", "CPAP", "No O2 until naloxone given"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). BVM 15 L/min at 10–12/min per ALS.", "type": "mcq"}, {"n": 32, "topic": "Algorithm", "stem": "Red pathway: first naloxone dose after IV/IO access?", "options": ["100 mcg IV", "400 mcg IV (or IO/IM if IV not secured)", "2000 mcg IV", "800 mcg IM only", "40 mcg IV"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg IV (IO/IM if no IV).", "type": "mcq"}, {"n": 33, "topic": "Algorithm", "stem": "Red pathway: no response after 60 s to the initial 400 mcg. Next?", "options": ["A further 400 mcg", "A further 800 mcg", "A further 2000 mcg", "Repeat 400 mcg once then stop", "IM naloxone instead"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A further 800 mcg.", "type": "mcq"}, {"n": 34, "topic": "Algorithm", "stem": "Red pathway: after two further 800 mcg doses with no response. Next step?", "options": ["Stop naloxone and intubate", "Give a further 2000 mcg IV and consider advanced airway/alternate diagnoses plus urgent critical care referral", "Switch to intranasal naloxone", "Wait 10 min", "IM naloxone 400 mcg"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 2000 mcg IV, advanced airway, reconsider diagnosis, critical care.", "type": "mcq"}, {"n": 35, "topic": "Algorithm", "stem": "Footnote D: correct initial and subsequent bolus dosing in the amber pathway?", "options": ["Initial 200, subsequent 100 mcg", "Initial 100 mcg; if no response to four 100 mcg boluses, subsequent boluses 200 mcg", "All boluses fixed 500 mcg", "Initial 400 mcg throughout", "Initial 50 mcg throughout"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 100 mcg, escalate to 200 mcg after four.", "type": "mcq"}, {"n": 36, "topic": "Algorithm", "stem": "How to dilute a 400 mcg naloxone vial so a 100 mcg bolus = 2.5 mL?", "options": ["Draw 1×400 mcg vial into a 10 mL syringe and make up to 10 mL with saline", "Draw up undiluted and give 1 mL boluses", "Dilute in a 100 mL saline bag", "Mix with dextrose only", "5 mL syringe undiluted"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg to 10 mL (40 mcg/mL); 2.5 mL = 100 mcg.", "type": "mcq"}, {"n": 37, "topic": "Algorithm", "stem": "Which patients may require larger naloxone doses (>4 mg)?", "options": ["Elderly only", "Those with severe toxicity or exposure to highly potent opioids", "COPD patients", "Opioid-naïve patients", "Under-30s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Severe toxicity / highly potent opioids.", "type": "mcq"}, {"n": 38, "topic": "Algorithm", "stem": "If a longer-acting opioid (e.g. methadone or NPS opioid) is suspected, extend observation up to:", "options": ["4 hours", "6 hours", "8 hours", "12 hours", "24 hours"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 12 hours.", "type": "mcq"}, {"n": 39, "topic": "Algorithm", "stem": "What does AVPU/GCS monitoring reflect, and what is emphasised?", "options": ["Primary target for titrating naloxone", "Useful to monitor, but naloxone aims at reversing respiratory depression / maintaining airway reflexes, NOT full arousal", "Must be normalised before discharge", "Replaces RR/SpO2 monitoring", "No clinical relevance"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to ventilation, not to consciousness.", "type": "mcq"}, {"n": 40, "topic": "Disposition", "stem": "Green pathway (no naloxone): when can discharge be considered?", "options": ["Immediately", "When RR, SpO2, ETCO2 and AVPU are normal for 6 hours after suspected overdose", "After 1 hour of normal obs", "Only after clear urine tox", "After psychiatric review only"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥6 h of normal observations since overdose.", "type": "mcq"}, {"n": 41, "topic": "Disposition", "stem": "Orange pathway (needed naloxone): discharge when obs normal for how long after naloxone, and since overdose?", "options": ["2 h after naloxone; 4 h since overdose", "4 h after naloxone; 6 h since overdose", "6 h after naloxone; 8 h since overdose", "1 h after naloxone; 2 h since overdose", "8 h after naloxone; 12 h since overdose"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since overdose.", "type": "mcq"}, {"n": 42, "topic": "Disposition", "stem": "How to interpret SpO2 targets in pre-existing respiratory disease (e.g. COPD)?", "options": ["Same targets universally (>92%)", "Interpret with caution; target may routinely be 88–92%", "Target >98%", "SpO2 monitoring not useful", "Never give oxygen"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). COPD target may be 88–92% — interpret with caution.", "type": "mcq"}, {"n": 43, "topic": "Investigations", "stem": "Footnote A: what to consider in all patients (to look for alternate diagnoses)?", "options": ["Full septic screen only", "BM (glucose), VBG, paracetamol concentration ± CT head", "Chest X-ray only", "Lumbar puncture", "ECG only, no bloods"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Glucose, VBG, paracetamol level ± CT head.", "type": "mcq"}, {"n": 44, "topic": "Algorithm", "stem": "Is Figure 1 a mandatory standard of care?", "options": ["Yes, followed exactly in all cases", "No — a suggested pathway; trained senior decision-makers may use alternatives such as permissive hypercapnia or lower boluses", "Yes, but only under 65", "No, prehospital only", "Mandatory only in tertiary centres"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A suggested pathway, not mandatory.", "type": "mcq"}, {"n": 45, "topic": "Infusion", "stem": "When is a naloxone infusion indicated?", "options": ["In every patient receiving any bolus", "When, after an initial response, the patient deteriorates and needs further boluses to maintain ventilation", "Only in cardiac arrest", "Only for heroin", "Only if the patient requests it"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Recurrent deterioration needing repeat boluses.", "type": "mcq"}, {"n": 46, "topic": "Infusion", "stem": "Recommended starting hourly infusion rate is calculated as:", "options": ["100% of the total dose required initially", "60% of the total dose(s) required to adequately reverse respiratory depression during the second dosing", "Fixed 400 mcg/h", "30% of the maximum bolus", "Double the total bolus"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60% of the reversing dose per hour.", "type": "mcq"}, {"n": 47, "topic": "Infusion", "stem": "How is the standard naloxone infusion prepared?", "options": ["4 mg (10×400 mcg vials) + 30 mL 0.9% saline to 40 mL final (100 mcg/mL)", "4 mg + 50 mL saline (80 mcg/mL)", "2 mg + 20 mL saline (100 mcg/mL)", "1 mg in 10 mL", "4 mg + 100 mL saline by gravity"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 4 mg to 40 mL = 100 mcg/mL.", "type": "mcq"}, {"n": 48, "topic": "Infusion", "stem": "If 800 mcg total bolus achieved response, starting infusion rate (mL/h) per Table 2?", "options": ["2.4", "3.6", "4.8", "6.0", "7.2"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 800 = 480 mcg/h = 4.8 mL/h at 100 mcg/mL.", "type": "mcq"}, {"n": 49, "topic": "Infusion", "stem": "1200 mcg total bolus to respond — starting rate in mcg/h?", "options": ["480", "600", "720", "840", "960"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 1200 = 720 mcg/h.", "type": "mcq"}, {"n": 50, "topic": "Infusion", "stem": "Practical point about high-dose naloxone infusions?", "options": ["Never exceed 4 hours", "The syringe may need replacing soon; consider a follow-on prescription with the initial one", "Central line only", "Cannot be prepared with dextrose", "Second nurse must co-sign hourly"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Provide a follow-on prescription as the syringe may run out.", "type": "mcq"}, {"n": 51, "topic": "Monitoring", "stem": "Once infusion started, how often should observations occur (initially, then subsequently)?", "options": ["Every 5 min for 2 h then hourly", "Every 15 min for the first hour, then every 30 min", "Every 30 min throughout", "Hourly throughout", "Continuous only, no manual checks"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 15-minutely for 1 h, then 30-minutely.", "type": "mcq"}, {"n": 52, "topic": "Monitoring", "stem": "On infusion, RR <10, SpO2 <92%, and/or concerning ETCO2. Action?", "options": ["Immediately double the infusion", "Give further 100–200 mcg boluses every 60 s up to 2 mg, then increase the infusion rate by 60% of the total bolus dose required", "Stop the infusion and observe", "Switch to IM naloxone", "Intubate without further naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Re-bolus then step up the infusion by 60% of the boluses given.", "type": "mcq"}, {"n": 53, "topic": "Monitoring", "stem": "On infusion, signs of acute withdrawal appear. First-line action?", "options": ["Stop the infusion permanently", "Decrease the infusion rate, generally by 50% first", "Double the infusion", "Give an additional bolus", "Switch to oral naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reduce rate ~50%.", "type": "mcq"}, {"n": 54, "topic": "Monitoring", "stem": "Significant agitation from withdrawal on infusion. Recommended approach?", "options": ["Continue unchanged and restrain", "Temporarily stop; restart after 30–60 min at 50% of the previous rate once withdrawal settles", "Switch antagonist", "Diazepam and continue unchanged", "Permanently discontinue in all such cases"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Pause, then restart at 50% once settled.", "type": "mcq"}, {"n": 55, "topic": "Monitoring", "stem": "After any change to infusion rate/dose, monitoring frequency should:", "options": ["Remain unchanged", "Recommence at every 15 min for the first hour, then every 30 min", "Reduce to hourly", "Reduce to 4-hourly", "Stop for 1 hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reset to 15-minutely for 1 h then 30-minutely.", "type": "mcq"}, {"n": 56, "topic": "Stopping", "stem": "How long should the infusion continue at the same rate (absent recurrence) before down-titration?", "options": ["≥1 hour", "≥2 hours", "≥4 hours", "≥8 hours", "≥24 hours"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). At least 4 hours.", "type": "mcq"}, {"n": 57, "topic": "Stopping", "stem": "Down-titration: reduce by how much and how often?", "options": ["10% of max every hour", "25% of the maximum infusion rate every two hours", "50% of max every hour", "5% every 30 min", "Fixed 100 mcg/h every hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 25% of the maximum rate every 2 hours.", "type": "mcq"}, {"n": 58, "topic": "Stopping", "stem": "Likely that down-titration completes within the ED?", "options": ["Yes, always", "No — unlikely within the ED unless there are significant admission delays", "Yes, under 40 only", "Only in resus", "Only overnight"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Usually completed after admission, not in ED.", "type": "mcq"}, {"n": 59, "topic": "Stopping", "stem": "When should an infusion generally NOT be stopped?", "options": ["Daytime (0800–1600)", "At night (midnight–0600) unless the patient shows withdrawal", "Weekends", "Within the first hour regardless", "No timing restriction"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid stopping overnight unless withdrawing.", "type": "mcq"}, {"n": 60, "topic": "Stopping", "stem": "Why avoid stopping overnight?", "options": ["Nursing staff unavailable", "Recurrent toxicity is harder to detect overnight if the patient is asleep", "Naloxone less effective at night", "Pharmacy closed", "Unrelated hospital policy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Sleep masks recurrence of toxicity.", "type": "mcq"}, {"n": 61, "topic": "Disposition", "stem": "Standard minimum observation before discharge after naloxone?", "options": ["2 h after last dose; 4 h since use", "4 h after last naloxone dose; 6 h since suspected opioid use", "6 h; 12 h", "1 h; 2 h", "12 h regardless"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since use.", "type": "mcq"}, {"n": 62, "topic": "Prevention", "stem": "US study: at 12 months after non-fatal overdose, patients died at approximately what rate vs the general population?", "options": ["2x", "5x", "10x", "24x", "50x"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~24x.", "type": "mcq"}, {"n": 63, "topic": "Prevention", "stem": "Causes of death noted in that cohort?", "options": ["Only respiratory failure", "Drug-use-associated diseases, HIV, chronic respiratory disease, viral hepatitis and suicide", "Only cardiovascular", "Only trauma", "Only malignancy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Broad — drug-associated disease, HIV, respiratory, hepatitis, suicide.", "type": "mcq"}, {"n": 64, "topic": "Prevention", "stem": "Secondary prevention opportunities after an opioid presentation?", "options": ["Brief intervention, referral to drug liaison services, encouraging engagement with community services", "Compulsory detox admission", "Police notification in all cases", "Discharge with no action if obs normal", "Bariatric referral"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Brief intervention + drug liaison + community engagement.", "type": "mcq"}, {"n": 65, "topic": "Prevention", "stem": "What is take-home naloxone, and what supports its provision?", "options": ["Experimental, no evidence", "In-hospital/community IM or nasal naloxone with training; reduces drug-related deaths", "USA only", "Effective only with buprenorphine", "Prophylactic tablets"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IM/nasal take-home naloxone with training reduces deaths.", "type": "mcq"}, {"n": 66, "topic": "Prevention", "stem": "Legal duty of EDs in England re homelessness in this group?", "options": ["No duty exists", "Duty to refer someone believed homeless, or threatened within 56 days, to a housing authority of their choice", "Only provide a leaflet", "Only if the patient requests", "Only for under-18s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Duty to refer to housing (56-day threshold).", "type": "mcq"}, {"n": 67, "topic": "Prevention", "stem": "Other health screening to consider in this high-risk cohort?", "options": ["Bone density", "Blood-borne virus testing", "Routine echocardiography", "Colonoscopy", "Genetic testing"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Blood-borne virus screening.", "type": "mcq"}, {"n": 68, "topic": "Harm reduction", "stem": "Advice about variability of drug supply?", "options": ["Purity is consistent, no need to test", "Test first — start with a small amount or inject slowly, as potency/content varies", "Only use pharmacy drugs", "Avoid injecting entirely", "Test by tasting"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Start small; potency varies.", "type": "mcq"}, {"n": 69, "topic": "Harm reduction", "stem": "Advice about using alone vs with others?", "options": ["Alone is safer", "Use with others if possible; using alone is riskier — no one to help if overdose", "No difference", "Only in public", "Group use always avoided"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Don't use alone.", "type": "mcq"}, {"n": 70, "topic": "Harm reduction", "stem": "List the signs of overdose from the 'Look out for the signs' section. (Short answer, ≥4)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Falling unconscious; very light/shallow breathing or no breathing; loud raspy snoring or gurgling; blue or pale lips or fingertips."}, {"n": 71, "topic": "Harm reduction", "stem": "Bystander steps per 'Naloxone: get it, carry it, use it'?", "options": ["Wait 30 min for spontaneous recovery", "Act fast, call 999, check breathing, recovery position, give naloxone ASAP", "Give food and water first", "Only give naloxone if a HCP is present", "Restrain until EMS arrive"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Call 999, check breathing, recovery position, naloxone ASAP.", "type": "mcq"}, {"n": 72, "topic": "Recall", "stem": "State, in your own words, the four Summary Recommendations at the start of the guideline. (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "1) Naloxone's aim is reversal of respiratory depression / maintenance of airway reflexes, not full reversal of unconsciousness. 2) Adverse effects are more likely with excessive doses. 3) Observe ≥4 h after last naloxone dose and ≥6 h after suspected opioid use, adjusted for the opioid's duration. 4) Non-fatal overdose is an opportunity for brief intervention, referral to drug liaison, and community engagement."}, {"n": 73, "topic": "Recall (T/F)", "stem": "The aim of naloxone therapy is to fully awaken the patient to GCS 15.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — the aim is reversal of respiratory depression, not full arousal.", "type": "mcq"}, {"n": 74, "topic": "Recall (T/F)", "stem": "Patients should generally be observed ≥4 h after the last naloxone dose AND ≥6 h after suspected opioid use, adjusted for the opioid's duration of action.", "options": ["True", "False"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). TRUE.", "type": "mcq"}, {"n": 75, "topic": "Recall (T/F)", "stem": "Non-fatal overdose should be treated purely as a medical event with no further intervention once medically stable.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — it is an opportunity for secondary prevention.", "type": "mcq"}]}, {"code": "TOX20", "title": "UK ED Toxicology", "source": "TOXBASE/NPIS · RCEM · MHRA · AAGBI", "hue": "#fbbf24", "questions": [{"n": 1, "topic": "UK ED toxicology", "stem": "A 22-year-old presents 6 hours after taking a single-episode overdose of 30 paracetamol tablets. A timed paracetamol level is above the treatment (100) line on the nomogram. According to current UK guidance, what is the correct management?", "options": ["Give oral methionine and discharge", "Give activated charcoal alone", "No treatment, as she presented within 8 hours", "Start intravenous acetylcysteine using the SNAP 12-hour regimen", "Wait until 8 hours post-ingestion before deciding"], "answer": 3, "exp": "[G] TOXBASE/NPIS/RCEM: for a single acute overdose, take a timed paracetamol level at 4 hours or later and treat with acetylcysteine (NAC) if it is above the 100-line.\n\n[G] The UK standard is now the SNAP 12-hour regimen (100 mg/kg over 2 hours, then 200 mg/kg over 10 hours), recommended by RCEM/NPIS since 2021 - fewer anaphylactoid reactions and shorter stay than the old 21-hour regimen.\n\n[C] NAC is most effective within 8 hours; being within 8 hours is a reason to ensure timely treatment, not to withhold it when the level is above the line.", "type": "mcq"}, {"n": 2, "topic": "UK ED toxicology", "stem": "A patient reports taking paracetamol in several doses over the last 24 hours (a staggered overdose), and the exact timing and amount are uncertain. What is the correct approach to acetylcysteine?", "options": ["Withhold treatment until a level can be plotted", "Give treatment only if the level is undetectable", "Treat with acetylcysteine regardless of the paracetamol level", "Discharge if asymptomatic at 4 hours", "Plot a single level on the nomogram and treat only if above the line"], "answer": 2, "exp": "[G] MHRA/TOXBASE: for a staggered overdose or when the timing is uncertain, the nomogram cannot be used reliably, so treat with acetylcysteine regardless of the paracetamol concentration.\n\n[C] Take baseline paracetamol level, ALT, INR, creatinine, venous bicarbonate/gas, and discuss with NPIS.\n\n[C] The nomogram applies ONLY to a single acute ingestion with a known time, at 4 hours or more post-ingestion.", "type": "mcq"}, {"n": 3, "topic": "UK ED toxicology", "stem": "Thirty minutes into an acetylcysteine infusion, a patient develops an urticarial rash, flushing and mild wheeze (an anaphylactoid reaction). What is the correct management?", "options": ["Pause or slow the infusion, treat with an antihistamine (and bronchodilator/adrenaline if severe), then restart at a slower rate", "Give IV hydrocortisone and continue at the same rate", "Stop acetylcysteine permanently and never restart", "Switch immediately to oral methionine and abandon NAC", "Ignore it and continue at full rate"], "answer": 0, "exp": "[C, UK practice] Anaphylactoid (non-IgE, rate-related histamine release) reactions to NAC are common, usually early and dose-rate related. Pause or slow the infusion, give an antihistamine (and treat bronchospasm; adrenaline if genuinely severe), then restart at a slower rate once settled.\n\n[C] The reaction is NOT an absolute contraindication - NAC can almost always be continued, which is why permanent cessation is wrong.\n\n[C] The SNAP regimen reduces the frequency of these reactions compared with the older regimen.", "type": "mcq"}, {"n": 4, "topic": "UK ED toxicology", "stem": "A 40-year-old has taken a large aspirin (salicylate) overdose and has a high salicylate level with a metabolic acidosis but is alert. Alongside supportive care, which treatment enhances elimination?", "options": ["Forced acid diuresis", "Intravenous glucagon", "Intravenous sodium bicarbonate for urinary alkalinisation", "Intravenous calcium gluconate", "Oral activated charcoal repeated hourly indefinitely"], "answer": 2, "exp": "[C, UK practice] Urinary alkalinisation with IV sodium bicarbonate (aiming for a urine pH around 7.5-8.5) enhances salicylate elimination by trapping ionised salicylate in the urine. Correct hypokalaemia, which otherwise prevents effective alkalinisation.\n\n[C] Haemodialysis is indicated for severe features: very high levels, refractory acidosis, renal failure, pulmonary/cerebral oedema, seizures or altered consciousness.\n\n[C] Avoid intubation-related hypoventilation, which worsens acidosis and drives salicylate into the CNS. Discuss with NPIS.", "type": "mcq"}, {"n": 5, "topic": "UK ED toxicology", "stem": "A patient with a tricyclic antidepressant overdose has a widened QRS complex (greater than 100-120 ms) and hypotension. What is the most appropriate specific treatment?", "options": ["Intravenous calcium chloride", "Oral activated charcoal only", "Intravenous amiodarone", "Intravenous flumazenil", "Intravenous sodium bicarbonate"], "answer": 4, "exp": "[C, UK practice] TCA cardiotoxicity is driven by sodium-channel blockade, seen as QRS widening. Give IV sodium bicarbonate for a QRS above 100-120 ms, ventricular arrhythmia, or hypotension - it narrows the QRS and is both diagnostic and therapeutic.\n\n[C] Avoid class Ia/Ic and III antiarrhythmics (including amiodarone), which worsen sodium-channel blockade.\n\n[C] Treat seizures with benzodiazepines; discuss refractory cases with NPIS.", "type": "mcq"}, {"n": 6, "topic": "UK ED toxicology", "stem": "A patient with a beta-blocker overdose has symptomatic bradycardia and hypotension that has not responded to atropine. What is the most appropriate next agent?", "options": ["Intravenous adenosine", "Nebulised salbutamol", "Intravenous glucagon", "Intravenous digoxin", "Intravenous magnesium"], "answer": 2, "exp": "[C, UK practice] In beta-blocker toxicity unresponsive to atropine and fluids, IV glucagon is the first-line specific treatment - it bypasses the beta-receptor to raise intracellular cAMP, improving heart rate and contractility.\n\n[C] Further options include high-dose insulin euglycaemic therapy, vasopressors, and pacing; discuss with NPIS/critical care.\n\n[C] Glucagon commonly causes vomiting, so protect the airway.", "type": "mcq"}, {"n": 7, "topic": "UK ED toxicology", "stem": "A patient with a calcium-channel-blocker (for example verapamil) overdose has profound shock refractory to fluids, calcium and vasopressors. Which therapy should be considered?", "options": ["High-dose insulin euglycaemic therapy", "Intravenous flumazenil", "Oral activated charcoal only", "Intravenous sodium bicarbonate", "Intravenous naloxone"], "answer": 0, "exp": "[C, UK practice] High-dose insulin euglycaemic therapy (HIET) improves myocardial performance in severe calcium-channel-blocker (and beta-blocker) toxicity and is used in refractory shock, with close glucose and potassium monitoring.\n\n[C] Initial measures include IV calcium (chloride or gluconate), fluids, atropine, and vasopressors; lipid emulsion and mechanical support are considered in extremis.\n\n[C] Always involve NPIS and critical care early.", "type": "mcq"}, {"n": 8, "topic": "UK ED toxicology", "stem": "A patient on long-term digoxin presents with nausea, confusion, a bradyarrhythmia and a serum potassium of 6.2 mmol/L in the context of digoxin toxicity. What is the most appropriate specific treatment?", "options": ["Intravenous magnesium alone", "Intravenous calcium chloride to treat the hyperkalaemia", "Urgent haemodialysis to remove digoxin", "Intravenous glucagon", "Digoxin-specific antibody fragments (DigiFab)"], "answer": 4, "exp": "[C, UK practice] Life-threatening digoxin toxicity - significant arrhythmia, haemodynamic instability, or hyperkalaemia (a marker of severe poisoning) - is treated with digoxin-specific antibody fragments (DigiFab).\n\n[C] Classic teaching is to avoid IV calcium for hyperkalaemia in digoxin toxicity (the 'stone heart' concern); the hyperkalaemia is corrected by the antibody itself.\n\n[C] Digoxin is not effectively removed by dialysis. Discuss dosing (level- or dose-based) with NPIS.", "type": "mcq"}, {"n": 9, "topic": "UK ED toxicology", "stem": "A 30-year-old is rescued from a house fire with soot around the mouth, reduced consciousness, cardiovascular instability and a markedly raised lactate. Cyanide toxicity is suspected. What is the antidote of choice in the UK?", "options": ["Flumazenil", "Hydroxocobalamin", "Intravenous ethanol", "Dicobalt edetate as first-line in the stable patient", "Methylene blue"], "answer": 1, "exp": "[C, UK practice] Hydroxocobalamin is the preferred antidote for cyanide toxicity (including smoke inhalation), binding cyanide to form cyanocobalamin, and is safe to give empirically when cyanide is suspected.\n\n[C] A very high lactate with cardiovascular collapse after smoke inhalation strongly suggests cyanide.\n\n[C] Dicobalt edetate is an alternative but is toxic if cyanide is not actually present, so it is reserved for confirmed severe cases. Give high-flow oxygen and consider concurrent carbon monoxide poisoning.", "type": "mcq"}, {"n": 10, "topic": "UK ED toxicology", "stem": "A patient is brought in after prolonged exposure to a faulty gas heater with headache, confusion and a cherry-red appearance. Carboxyhaemoglobin is elevated. What is the correct initial treatment, and what indicates possible hyperbaric oxygen?", "options": ["Immediate exchange transfusion for all", "Methylene blue", "High-flow 100% oxygen; consider hyperbaric oxygen for loss of consciousness, neurological signs, cardiac involvement, pregnancy or very high COHb", "Titrate oxygen to SpO2 94-98% only", "No oxygen unless SpO2 is low"], "answer": 2, "exp": "[C, UK practice] Give high-flow 100% oxygen (via a tight-fitting reservoir mask) to all patients with carbon monoxide poisoning - it dramatically shortens the half-life of carboxyhaemoglobin. Pulse oximetry is unreliable in CO poisoning (it cannot distinguish COHb), so do not titrate to SpO2.\n\n[C] Discuss hyperbaric oxygen with NPIS for features such as loss of consciousness, neurological or cardiac involvement, pregnancy, or a very high COHb level - though access and evidence are debated.\n\n[C] The 'cherry-red' appearance is a late/classical sign and often absent.", "type": "mcq"}, {"n": 11, "topic": "UK ED toxicology", "stem": "A farm worker presents with the SLUDGE features of organophosphate poisoning: salivation, lacrimation, urination, defecation, bronchorrhoea and miosis, with bradycardia. What is the correct treatment?", "options": ["Flumazenil", "Intravenous naloxone", "Beta-blockade to control secretions", "Glucagon and calcium", "Atropine titrated to reverse bronchorrhoea and bradycardia, plus pralidoxime"], "answer": 4, "exp": "[C, UK practice] Organophosphates inhibit acetylcholinesterase, causing a cholinergic crisis. Give atropine in escalating/repeated doses titrated to clinical effect - the key endpoint is drying of bronchial secretions and reversal of bradycardia (not pupil size).\n\n[C] Add pralidoxime (an oxime that reactivates acetylcholinesterase) early, before ageing of the enzyme occurs.\n\n[C] Wear personal protective equipment and decontaminate the patient; treat seizures with benzodiazepines. Discuss with NPIS.", "type": "mcq"}, {"n": 12, "topic": "UK ED toxicology", "stem": "During a regional anaesthetic block a patient develops seizures, then cardiovascular collapse from local anaesthetic systemic toxicity (LAST). Alongside standard resuscitation, what is the specific treatment?", "options": ["Intravenous dantrolene", "Intravenous glucagon", "Intravenous sodium bicarbonate", "Intravenous flumazenil", "Intravenous 20% lipid emulsion (Intralipid)"], "answer": 4, "exp": "[C, UK practice - AAGBI guidance] Local anaesthetic systemic toxicity is treated with IV 20% lipid emulsion: an initial bolus (about 1.5 mL/kg) followed by an infusion, repeated as needed, alongside high-quality CPR and airway/ventilation support.\n\n[C] Stop injecting the local anaesthetic immediately and call for help; treat seizures with benzodiazepines.\n\n[C] Prolonged resuscitation may be required; the lipid 'sink' sequesters the anaesthetic. Follow the AAGBI/local LAST protocol.", "type": "mcq"}, {"n": 13, "topic": "UK ED toxicology", "stem": "A patient presents with agitation, chest pain, tachycardia and hypertension after using cocaine. Which treatment principle is correct?", "options": ["Use flumazenil to reverse the agitation", "Give digoxin to slow the heart", "Withhold all treatment and observe", "Use benzodiazepines first-line; avoid beta-blockers because of the risk of unopposed alpha stimulation", "Give a beta-blocker first-line to control heart rate and blood pressure"], "answer": 3, "exp": "[C, UK practice] In cocaine (and other sympathomimetic) toxicity, benzodiazepines are first-line for agitation, tachycardia, hypertension and chest pain, by reducing central sympathetic drive.\n\n[C] Avoid beta-blockers, which can cause unopposed alpha-adrenergic stimulation and worsening hypertension/coronary vasoconstriction.\n\n[C] For cocaine-associated chest pain, add GTN and aspirin, and use benzodiazepines; manage as ACS if evolving.", "type": "mcq"}, {"n": 14, "topic": "UK ED toxicology", "stem": "A patient has taken a sulfonylurea overdose and has recurrent hypoglycaemia despite repeated intravenous glucose. What treatment specifically counteracts the mechanism?", "options": ["Octreotide", "Glucagon as a single dose", "Intravenous insulin", "Hydrocortisone", "Activated charcoal alone"], "answer": 0, "exp": "[C, UK practice] Sulfonylureas cause hypoglycaemia by stimulating insulin release. Octreotide suppresses this insulin secretion and is used for recurrent or refractory hypoglycaemia, reducing the need for repeated glucose boluses.\n\n[C] Give glucose to correct acute hypoglycaemia, but boluses alone often lead to rebound insulin release and recurrent hypoglycaemia - hence octreotide.\n\n[C] Admit and monitor glucose closely, as hypoglycaemia can be prolonged. Discuss with NPIS.", "type": "mcq"}, {"n": 15, "topic": "UK ED toxicology", "stem": "A patient on warfarin presents with major gastrointestinal bleeding and an INR of 8. What is the most appropriate treatment?", "options": ["Prothrombin complex concentrate (PCC) plus intravenous vitamin K", "Idarucizumab", "Stop warfarin and observe", "Fresh frozen plasma as first-line", "Oral vitamin K alone"], "answer": 0, "exp": "[C, UK practice - BNF/BSH] For major bleeding on warfarin, give IV vitamin K together with prothrombin complex concentrate (PCC), which rapidly and completely replaces the vitamin-K-dependent clotting factors (II, VII, IX, X).\n\n[C] FFP is a less effective and slower alternative and is not first-line when PCC is available.\n\n[C] Idarucizumab is the reversal agent for dabigatran (a DOAC), not warfarin - a common distractor.", "type": "mcq"}, {"n": 16, "topic": "UK ED toxicology", "stem": "A patient taking an SSRI is started on tramadol and develops agitation, tremor, inducible clonus, hyperreflexia, sweating and a temperature of 38.8C. What is the diagnosis and management?", "options": ["Malignant hyperthermia - dantrolene", "Serotonin syndrome - stop the offending drugs, supportive care and benzodiazepines, with cyproheptadine if needed", "Anticholinergic toxidrome - physostigmine", "Simple drug interaction - continue both drugs", "Neuroleptic malignant syndrome - dantrolene"], "answer": 1, "exp": "[C, UK practice] Serotonin syndrome (here from an SSRI plus tramadol) presents with the triad of neuromuscular excitation (clonus, hyperreflexia, tremor - typically more marked in the lower limbs), autonomic instability, and altered mental state, with rapid onset.\n\n[C] Management: stop the serotonergic drugs, give supportive care and benzodiazepines for agitation and rigidity, cool if hyperthermic, and use cyproheptadine (a serotonin antagonist) in significant cases.\n\n[C] It is distinguished from NMS (slower onset, lead-pipe rigidity, bradyreflexia, associated with dopamine antagonists) - clonus and hyperreflexia favour serotonin syndrome.", "type": "mcq"}, {"n": 17, "topic": "UK ED toxicology", "stem": "A patient presents cyanosed with a low oxygen saturation that does not improve with high-flow oxygen, and 'chocolate-brown' arterial blood. Methaemoglobinaemia is confirmed. What is the specific antidote?", "options": ["Intravenous ascorbic acid as first-line", "Hydroxocobalamin", "Dicobalt edetate", "Methylene blue", "Flumazenil"], "answer": 3, "exp": "[C, UK practice] Symptomatic methaemoglobinaemia (cyanosis unresponsive to oxygen, a 'saturation gap', chocolate-brown blood; causes include dapsone, local anaesthetics, nitrites) is treated with IV methylene blue.\n\n[C] Methylene blue is contraindicated/ineffective in G6PD deficiency (risk of haemolysis and it is less effective); alternatives such as ascorbic acid or exchange transfusion are then considered.\n\n[C] Pulse oximetry is unreliable in methaemoglobinaemia; co-oximetry on a blood gas confirms the methaemoglobin level.", "type": "mcq"}, {"n": 18, "topic": "UK ED toxicology", "stem": "A patient with chronic lithium therapy presents with tremor, ataxia, confusion and a high lithium level, with acute kidney injury. Which statement about management is correct?", "options": ["Administer flumazenil", "Force a saline diuresis with added potassium", "Give activated charcoal, which binds lithium well", "Provide IV fluids (0.9% saline) and consider haemodialysis for severe toxicity (high levels, neurological features or renal failure)", "Give sodium bicarbonate to enhance elimination"], "answer": 3, "exp": "[C, UK practice] Manage lithium toxicity with IV 0.9% saline to restore volume and renal excretion, stop lithium and any precipitating drugs (NSAIDs, ACE inhibitors, diuretics), and consider haemodialysis for severe toxicity - high levels, significant neurological features, or renal failure.\n\n[C] Activated charcoal does NOT bind lithium (a metal ion) - a common trap.\n\n[C] Chronic toxicity is dangerous at lower levels than acute; discuss dialysis thresholds with NPIS/renal.", "type": "mcq"}, {"n": 19, "topic": "UK ED toxicology", "stem": "A patient has taken a potentially significant overdose of a drug and presents within 1 hour, alert and cooperative with a protected airway. For which agent is activated charcoal LEAST likely to be useful?", "options": ["Quetiapine", "Iron", "Citalopram", "Amitriptyline", "Aspirin"], "answer": 1, "exp": "[C, UK practice] Activated charcoal adsorbs many drugs if given early (ideally within 1 hour of a significant ingestion) in a patient with a protected airway. It does NOT adsorb iron, lithium, alcohols/glycols, and other metal salts, or strong acids/alkalis.\n\n[C] So for iron overdose, charcoal is not useful - management is supportive, with whole-bowel irrigation and desferrioxamine for significant toxicity.\n\n[C] Contraindications to charcoal include a reduced/unprotected airway (aspiration risk) and corrosive ingestion. Always check TOXBASE/discuss with NPIS.", "type": "mcq"}, {"n": 20, "topic": "UK ED toxicology", "stem": "A patient presents drowsy but maintaining their own airway after an isolated benzodiazepine overdose, and is haemodynamically stable. A junior colleague suggests giving flumazenil. What is the most appropriate management?", "options": ["Give flumazenil only if the patient is a known epileptic", "Supportive care with airway monitoring; avoid routine flumazenil because of the risk of seizures, especially with co-ingestion or dependence", "Give flumazenil routinely to reverse sedation", "Give naloxone as it also reverses benzodiazepines", "Intubate all patients with benzodiazepine overdose"], "answer": 1, "exp": "[C, UK practice] Isolated benzodiazepine overdose is usually managed supportively with observation and airway monitoring, as it is rarely fatal alone.\n\n[C] Avoid routine flumazenil: it can precipitate seizures and arrhythmias, particularly with co-ingestion of proconvulsants (e.g. TCAs) or in benzodiazepine-dependent patients, and its short half-life risks re-sedation. Its use is largely restricted to reversing iatrogenic procedural sedation.\n\n[C] Naloxone reverses opioids, not benzodiazepines - a distractor.", "type": "mcq"}]}, {"code": "BITES", "title": "Bites, Stings & Envenomation", "source": "UK ID/tox · TOXBASE · RCEM", "hue": "#86efac", "questions": [{"n": 1, "topic": "Lyme disease — serology pathway", "stem": "A 38-year-old forestry worker presents with fatigue, arthralgia and headache 3 weeks after multiple tick bites. No rash. Lyme ELISA is negative. Clinical suspicion remains high. What is the most appropriate next step?", "options": ["Immunoblot now", "Repeat ELISA 4–6 weeks after the first test", "Blood PCR for Borrelia", "Treat empirically with 21 days doxycycline", "Reassure and discharge — Lyme excluded"], "answer": 1, "exp": "NICE NG95 (guideline-stated): if Lyme disease is still suspected in someone tested within 4 weeks of symptom onset and the ELISA is negative, repeat the ELISA 4–6 weeks after the first test — early antibody responses are often not yet detectable. Immunoblot is the confirmatory test after a positive/equivocal ELISA, not a rescue test after a negative one. Empirical treatment without erythema migrans is not recommended. A negative early ELISA does NOT exclude Lyme.", "type": "mcq"}, {"n": 2, "topic": "Lyme carditis", "stem": "A 47-year-old man presents with pre-syncope 6 weeks after untreated erythema migrans. ECG shows 2:1 AV block. Lyme serology is positive. What is the most appropriate management?", "options": ["Oral doxycycline 21 days as outpatient", "Admit for cardiac monitoring and IV ceftriaxone", "Permanent pacemaker insertion", "Oral amoxicillin 21 days as outpatient", "IV benzylpenicillin and temporary pacing wire prophylactically"], "answer": 1, "exp": "NICE NG95 (guideline-stated): Lyme carditis in a haemodynamically compromised or symptomatic patient (syncope/pre-syncope, high-grade AV block) — admit and treat with IV ceftriaxone. Asymptomatic/stable Lyme carditis can be treated with oral doxycycline. Key exam point: Lyme heart block is usually REVERSIBLE with antibiotics, so permanent pacing is not first-line; temporary pacing only if clinically needed, not prophylactically.", "type": "mcq"}, {"n": 3, "topic": "Erythema migrans — first-line treatment", "stem": "A 30-year-old non-pregnant woman has classic erythema migrans. Which regimen is first-line per NICE?", "options": ["Doxycycline 100 mg BD for 10 days", "Doxycycline 100 mg BD for 21 days", "Amoxicillin 500 mg TDS for 14 days", "Azithromycin 500 mg OD for 21 days", "Doxycycline 200 mg single dose"], "answer": 1, "exp": "NICE NG95 (guideline-stated): first-line for erythema migrans in adults is doxycycline 100 mg BD (or 200 mg OD) for 21 days. Amoxicillin 1 g TDS 21 days is second-line (note: 1 g TDS, not 500 mg); azithromycin is third-line. The single-dose 200 mg prophylaxis regimen is US (IDSA) practice — a classic distractor; it is NOT UK practice for treatment or prophylaxis.", "type": "mcq"}, {"n": 4, "topic": "Lyme disease in children", "stem": "An 8-year-old boy presents with erythema migrans after a camping trip. He has no allergies. What is the most appropriate treatment?", "options": ["Doxycycline (dose by weight) 21 days", "Amoxicillin (dose by weight) 21 days", "Azithromycin 10 days", "Ceftriaxone IV 14 days", "No treatment — serology first"], "answer": 1, "exp": "NICE NG95 (guideline-stated): in children UNDER 9 years, first-line for erythema migrans is amoxicillin; doxycycline is first-line for children aged 9 years and over (and adults). Erythema migrans remains a clinical diagnosis in children too — no serology needed. Remember the age-9 cut-off: an 8-year-old gets amoxicillin, a 10-year-old gets doxycycline.", "type": "mcq"}, {"n": 5, "topic": "Tick removal — retained mouthparts", "stem": "During tick removal with fine-tipped tweezers, the mouthparts break off and remain embedded in the skin. The patient is well. What is the most appropriate management?", "options": ["Excision under local anaesthetic", "Incise and probe with a sterile needle", "Leave alone — advise they will usually shed naturally; safety-net for infection", "Prophylactic doxycycline because retained parts increase Lyme risk", "Refer to plastic surgery"], "answer": 2, "exp": "NICE CKS ‘Insect bites and stings’ (guideline-stated): retained tick mouthparts should be left to shed naturally — digging them out causes more tissue trauma and infection risk than leaving them. Retained mouthparts do NOT transmit Lyme (transmission requires the live tick feeding), so prophylactic antibiotics are not indicated. Safety-net for local infection and for erythema migrans up to 6 weeks.", "type": "mcq"}, {"n": 6, "topic": "Scabies — post-treatment itch vs failure", "stem": "A 27-year-old completed two correctly applied whole-body permethrin 5% treatments (day 0 and day 7) for scabies, with all contacts treated. Ten days after the second application he still itches, but there are no new burrows or lesions. What is the most appropriate management?", "options": ["Third application of permethrin", "Switch to malathion 0.5%", "Oral ivermectin", "Reassure — itch can persist 2–4 weeks after successful treatment; symptomatic care (e.g. crotamiton/antihistamine)", "Skin scrapings and dermatology referral today"], "answer": 3, "exp": "NICE CKS ‘Scabies’ (guideline-stated): pruritus commonly persists for 2–4 weeks after successful eradication (hypersensitivity to dead mites/eggs), and this alone is NOT treatment failure. Manage with crotamiton 10% cream or a sedating antihistamine at night. Suspect true failure only if NEW burrows/lesions appear, or itch persists beyond ~4–6 weeks — then re-treat. Repeated unnecessary scabicide applications cause irritant dermatitis that mimics ongoing infestation (exam trap).", "type": "mcq"}, {"n": 7, "topic": "Scabies — second-line agent", "stem": "A patient with confirmed scabies reports a previous severe skin reaction to permethrin (chrysanthemum allergy). What is the most appropriate alternative first-line topical agent in the UK?", "options": ["Malathion 0.5% aqueous liquid", "Benzyl benzoate 25%", "Topical ivermectin", "Lindane 1%", "Hydrocortisone 1%"], "answer": 0, "exp": "NICE CKS / BNF (guideline-stated): permethrin 5% is first-line; malathion 0.5% AQUEOUS liquid is the UK alternative when permethrin is unsuitable (e.g. chrysanthemum/pyrethroid allergy). Same principles apply: whole-body application, repeat after 7 days, treat all household and sexual contacts simultaneously. Lindane is withdrawn in the UK; benzyl benzoate is not recommended UK practice; oral (not topical) ivermectin is reserved for crusted/resistant scabies, usually on specialist advice.", "type": "mcq"}, {"n": 8, "topic": "Adder bite — antivenom in children", "stem": "A 6-year-old girl is bitten by an adder. Two hours later she is vomiting, drowsy, BP 82/50, with swelling spreading above the knee. Her parents are worried antivenom is “too dangerous for children”. What is the most appropriate management?", "options": ["Withhold antivenom — contraindicated under 12 years", "Give half-dose antivenom", "Give full-dose European viper antivenom and discuss with NPIS — age is not a contraindication", "IV fluids only and observe", "Adrenaline infusion instead of antivenom"], "answer": 2, "exp": "TOXBASE/NPIS (guideline-stated): systemic envenoming (hypotension, vomiting, reduced GCS) or severe/spreading limb swelling are indications for European viper antivenom at the SAME dose in children as adults — antivenom neutralises a fixed venom load, not a per-kilogram dose. Age is not a contraindication, and children are at higher risk of severe envenoming relative to body size. Discuss envenomed patients with NPIS. This child has both systemic and severe local envenoming — antivenom is clearly indicated.", "type": "mcq"}, {"n": 9, "topic": "Adder bite — pre-hospital first aid", "stem": "A walker is bitten on the ankle by an adder in a remote area. An ambulance is 40 minutes away. Which pre-hospital advice is most appropriate?", "options": ["Apply a tight arterial tourniquet above the bite", "Incise the wound and attempt suction", "Apply a firm pressure-immobilisation bandage over the whole limb", "Immobilise the limb, keep the patient still, remove constricting items, no tourniquet or suction", "Walk quickly to the car park to save time"], "answer": 3, "exp": "TOXBASE/NPIS and RCEMLearning (guideline-stated): for UK adder bites — immobilise the bitten limb (splint/sling), keep the patient as still as possible, remove rings/watches/tight clothing before swelling, and transfer to hospital. Tourniquets, incision, suction and local compression have NO benefit and may cause harm. Pressure-immobilisation bandaging is Australian elapid practice (neurotoxic venoms) — NOT recommended for European viper (cytotoxic) envenoming; it may worsen local tissue damage. Walking increases venom spread.", "type": "mcq"}, {"n": 10, "topic": "Human bite — fight bite", "stem": "A 24-year-old punched someone in the mouth last night. He has a 5 mm wound over the right 5th MCP joint, mildly tender, moving fingers normally. What is the most appropriate ED management?", "options": ["Steristrip closure and discharge", "X-ray the hand, thorough irrigation, leave wound open, co-amoxiclav, and refer/discuss with hand surgery", "Primary suture with prophylactic flucloxacillin", "Discharge with safety-netting only, as the wound looks clean", "Oral metronidazole alone"], "answer": 1, "exp": "‘Fight bite’ = clenched-fist injury over the MCP joint — treat as a penetrating joint injury until proven otherwise. Management (NICE NG182 + standard UK hand-surgery practice): X-ray for fracture, tooth fragment and air in the joint; copious irrigation; do NOT close primarily; prophylactic co-amoxiclav (NG182 guideline-stated first choice for human bites; doxycycline + metronidazole if penicillin-allergic); low threshold for hand surgery referral for washout — the extensor tendon injury retracts proximally when the fist opens, so the wound looks deceptively innocent. Flucloxacillin alone does not cover Eikenella (general clinical knowledge).", "type": "mcq"}, {"n": 11, "topic": "Cat bite — antibiotic prophylaxis (NG182)", "stem": "A 60-year-old woman was bitten by her cat on the hand 6 hours ago. Two puncture wounds drew blood. The hand looks clean, no signs of infection, she is systemically well and immunocompetent. Per NICE NG182, what is the most appropriate management?", "options": ["No antibiotics — review only if signs of infection", "Prophylactic co-amoxiclav", "Prophylactic flucloxacillin", "Prophylactic metronidazole", "IV antibiotics and admission"], "answer": 1, "exp": "NICE NG182 (guideline-stated): offer antibiotic prophylaxis for a CAT bite that has broken the skin and drawn blood — cat bites are deep punctures that inoculate Pasteurella multocida. First choice: co-amoxiclav for 3 days (prophylaxis). Contrast with DOG/human bites: prophylaxis only if the wound has drawn blood AND involves a high-risk area (hand, foot, face, genitals, joint/tendon) or a high-risk patient (immunosuppressed, diabetic, asplenic, cirrhotic). For cats the threshold is lower because of the puncture mechanism. Penicillin allergy: doxycycline + metronidazole.", "type": "mcq"}, {"n": 12, "topic": "Bat bite — rabies risk in the UK", "stem": "A wildlife volunteer in Devon was bitten on the finger by a bat yesterday. The wound is trivial and clean. She is otherwise well and fully tetanus-vaccinated. What is the most important next step?", "options": ["Reassure — no rabies risk in the UK", "Co-amoxiclav prophylaxis only", "Contact UKHSA urgently to assess need for rabies post-exposure treatment", "Serology for lyssavirus antibodies", "Observe the bat for 10 days"], "answer": 2, "exp": "UKHSA rabies guidance (guideline-stated): the UK is rabies-free in terrestrial animals, BUT UK bats can carry European Bat Lyssavirus (EBLV) — a UK bat handler died of EBLV-2 in 2002. ANY bat bite/scratch, however trivial, requires urgent risk assessment by UKHSA (or the local health protection team) for rabies post-exposure treatment (vaccine ± immunoglobulin), plus immediate wound washing with soap and water. ‘No rabies in the UK’ is the classic trap answer. Antibiotics may also be considered, but the rabies assessment is the critical, time-sensitive step.", "type": "mcq"}, {"n": 13, "topic": "Bite reaction vs cellulitis", "stem": "A 35-year-old presents 36 hours after an insect bite on the forearm with an 8 cm hot, red, itchy, slightly swollen area around the bite. She is apyrexial and systemically well, and the redness has not progressed since yesterday. The most appropriate management is:", "options": ["Oral flucloxacillin for cellulitis", "Oral co-amoxiclav", "Admit for IV antibiotics", "Explain this is likely a local inflammatory reaction; oral antihistamine ± topical steroid and safety-netting", "Incision and drainage"], "answer": 3, "exp": "NICE CKS ‘Insect bites and stings’ (guideline-stated): redness, warmth, swelling and ITCH around a bite within the first 48 hours is usually a local inflammatory/allergic reaction, not infection — antibiotics are NOT routinely needed. Manage with an oral antihistamine, cold compress ± a short course of topical corticosteroid. Features favouring cellulitis: onset/worsening AFTER 48 hours, fever/systemic upset, spreading margins, pain rather than itch, lymphangitis. Prescribing flucloxacillin for every red bite is the common error this question targets.", "type": "mcq"}, {"n": 14, "topic": "Jarisch–Herxheimer reaction", "stem": "A patient started doxycycline for disseminated Lyme disease 12 hours ago and now has fever, rigors, myalgia and worsening of the rash. Observations are otherwise stable. What is the most likely explanation and correct action?", "options": ["Doxycycline allergy — stop and switch to azithromycin", "Jarisch–Herxheimer reaction — supportive care and continue the antibiotic", "Antibiotic failure — escalate to IV ceftriaxone", "Sepsis — start the sepsis six", "Serum sickness — start steroids"], "answer": 1, "exp": "NICE NG95 specifically flags this (guideline-stated): warn patients that a Jarisch–Herxheimer reaction — fever, chills, myalgia and transient worsening of the rash within the first 24 hours of starting antibiotics for a spirochaetal infection (Lyme, syphilis, leptospirosis) — can occur. It is caused by cytokine release from dying spirochaetes, is self-limiting, and the antibiotic should be CONTINUED with supportive care (antipyretics, fluids). Stopping treatment or mislabelling it as allergy/sepsis are the exam traps.", "type": "mcq"}, {"n": 15, "topic": "Marine envenomation — weever fish", "stem": "A 19-year-old steps on something in shallow water at a Cornish beach and has immediate severe, escalating foot pain with a small puncture mark. Observations are normal. What is the most appropriate initial ED treatment?", "options": ["Immerse the foot in hot water (approximately 40–45°C) for 30–90 minutes", "Apply ice packs", "Local anaesthetic ring block and exploration", "Viper antivenom", "IV antibiotics"], "answer": 0, "exp": "Weever fish sting — the classic UK marine envenomation (shallow sandy water, immediate disproportionate pain). TOXBASE (guideline-stated): immerse the affected part in water as hot as can be tolerated without scalding (~40–45°C) for 30–90 minutes — the venom is thermolabile and heat inactivates it, giving dramatic pain relief. Ice worsens pain. Check for retained spines (X-ray/ultrasound if suspected), check tetanus status, give analgesia as needed. Antivenom does not exist for weever fish; antibiotics only if infection develops.", "type": "mcq"}, {"topic": "Lyme serology — when to repeat vs confirm · drill", "stem": "A 42-year-old presents with polyarthralgia and fatigue 3 weeks after a tick bite in Scotland. No rash ever seen. Initial Lyme ELISA is negative. You remain concerned about early Lyme arthritis. What is the next most appropriate step?", "options": ["Assume the patient does not have Lyme; offer supportive care only", "Repeat Lyme ELISA 4–6 weeks after the first negative result", "Proceed directly to immunoblot to confirm or exclude Lyme", "Start empirical doxycycline without serology", "Refer for PCR testing of joint fluid"], "answer": 1, "exp": "NICE NG95 (guideline-stated): if Lyme is still suspected in someone with negative ELISA tested within 4 weeks of symptom onset, repeat the ELISA after 4–6 weeks — early antibody responses are often not yet detectable. Immunoblot is NOT a rescue test after a negative ELISA; it is confirmatory after a positive or equivocal ELISA. A negative early ELISA does not exclude Lyme, so proceeding to supportive care alone is unsafe. PCR is not first-line for serology-guided diagnosis.", "type": "mcq", "n": 16}, {"topic": "Lyme carditis — disposition and drug choice · drill", "stem": "A 51-year-old man presents with dizziness and dyspnoea 4 weeks after a tick bite with subsequently confirmed erythema migrans (treated with oral doxycycline but now abandoned). ECG shows complete AV block with a junctional escape rhythm at 45 bpm. Lyme serology is positive. BP is 110/72. What is the most appropriate ED management?", "options": ["Discharge with a 24-hour Holter monitor and reassurance that Lyme block is reversible", "Admit for cardiac monitoring and IV ceftriaxone; temporary pacing if BP falls", "Insert a permanent transvenous pacemaker under fluoroscopy", "Increase the doxycycline dose and observe as an inpatient for 48 hours", "Perform electrophysiological study to risk-stratify for pacing"], "answer": 1, "exp": "NICE NG95 (guideline-stated): Lyme carditis with symptomatic high-grade AV block (complete block with escape rhythm) is a medical emergency requiring admission, cardiac monitoring, and IV ceftriaxone. Temporary pacing may be needed if haemodynamics deteriorate. Crucially: Lyme heart block is usually REVERSIBLE with antibiotics — permanent pacing is not indicated upfront. Increasing oral doxycycline after the block is established is inadequate; you need IV therapy. Reassurance/discharge is dangerous when symptomatic.", "type": "mcq", "n": 17}, {"topic": "Tick removal — mouthpart retention and infection · drill", "stem": "A 7-year-old girl had a tick removed from her calf 2 days ago using fine-tipped tweezers. The tweezers slipped, and part of the mouthpart (hypostome) remains embedded in the skin. There is mild local erythema and oedema, but no systemic signs. The family asks if this needs to be excised. What is the most appropriate ED advice?", "options": ["Excise under local anaesthetic to prevent Lyme transmission", "Prophylactic doxycycline because retained parts increase spirochaete inoculum", "Leave the mouthpart in place; it will shed naturally; safety-net for infection signs and erythema migrans", "Incise and probe with a sterile needle to retrieve the fragment", "Refer to plastics for microsurgical removal"], "answer": 2, "exp": "NICE CKS (guideline-stated): retained tick mouthparts should be left to shed naturally — attempting retrieval causes more tissue trauma and infection risk than leaving them alone. Retained mouthparts do NOT transmit Lyme disease (transmission requires the live tick feeding its saliva), so neither prophylactic antibiotics nor excision is needed. Counsel the family to watch for local infection signs and erythema migrans up to 6 weeks post-bite. This is a classic exam trap where 'doing nothing' is the right answer.", "type": "mcq", "n": 18}, {"topic": "Scabies — permethrin alternatives and application · drill", "stem": "A 34-year-old with confirmed scabies reports a severe allergic reaction to permethrin (pyrethroid sensitivity; anaphylaxis history with topical pyrethroids). Which topical agent is the most appropriate first-line alternative in the UK?", "options": ["Benzyl benzoate 25%", "Malathion 0.5% aqueous liquid, applied whole-body and repeated at 7 days", "Topical ivermectin cream", "Lindane 1%", "Crotamiton 10% alone, without repeat treatment"], "answer": 1, "exp": "NICE CKS and BNF (guideline-stated): malathion 0.5% aqueous liquid is the UK first-line alternative when permethrin 5% is contraindicated (e.g. pyrethroid allergy). Same application rules: whole-body (neck down, under nails), washed off after 12 hours, repeated 7 days later; treat all household and sexual contacts simultaneously. Benzyl benzoate is historical and not recommended current UK practice; lindane is withdrawn in the UK; topical ivermectin is not UK standard (oral ivermectin is for crusted/resistant scabies on specialist advice); crotamiton is symptomatic relief, not curative.", "type": "mcq", "n": 19}, {"topic": "Adder envenoming — antivenom dosing across age groups · drill", "stem": "A 4-year-old boy is bitten by an adder in the Lake District. Within 1 hour, he develops vomiting, hypotension (BP 80/50, down from baseline ~100/60), and swelling extending from foot to mid-thigh. His mother is tearful and asks if antivenom is 'safe for such a small child'. What is the most appropriate action?", "options": ["Give a quarter-dose of European viper antivenom scaled to body weight", "Withhold antivenom under 5 years of age; manage with IV fluids and observation", "Give the full standard adult dose of European viper antivenom; discuss with NPIS", "Give adrenaline IM instead of antivenom to manage the systemic features", "Delay antivenom until ECG is done to rule out cardiotoxicity"], "answer": 2, "exp": "TOXBASE and NPIS (guideline-stated): antivenom neutralises a FIXED venom load, not a body-weight-based dose. The same full-dose antivenom is given to children as to adults. Children are at HIGHER risk relative to their body size, making early antivenom even more important. This child has both systemic envenoming (hypotension, vomiting) and severe limb swelling — clear antivenom indication. Age is NOT a contraindication. Discuss with NPIS for guidance on follow-up dosing if needed (some patients need a second dose).", "type": "mcq", "n": 20}, {"topic": "Marine envenomation — thermolabile venom and first-line relief · drill", "stem": "A 28-year-old wades in shallow water at Bournemouth and steps on a weever fish. Within minutes she has severe burning foot pain out of proportion to the injury, with a small puncture wound. Pain is 10/10 and escalating. She has no systemic features. What is the most appropriate initial ED intervention?", "options": ["Apply ice packs to reduce pain and swelling", "Immerse the foot in water as hot as can be tolerated (approximately 40–45°C) for 30–90 minutes", "Incise the wound and attempt venom extraction", "Give IV morphine and refer for surgical exploration", "Apply a topical local anaesthetic and reassure that the pain will settle in a few hours"], "answer": 1, "exp": "TOXBASE (guideline-stated): weever fish venom is thermolabile; immersion in water as hot as can be tolerated without scalding (~40–45°C) for 30–90 minutes inactivates the venom and gives dramatic pain relief. Ice WORSENS pain. This is the classic UK marine envenomation (shallow sandy water, immediate disproportionate pain). After immersion, check for retained spines (X-ray/ultrasound if suspected), check tetanus, and manage analgesia. Incision and suction are not indicated. Morphine may be needed while awaiting hot-water access, but immersion is the definitive pain-relieving intervention.", "type": "mcq", "n": 21}]}, {"code": "RESUS", "title": "Resuscitation + Legal Twists", "source": "RCUK 2021 · NICE NG51 · MCA 2005", "hue": "#fb7185", "questions": [{"n": 1, "topic": "Anaphylaxis", "stem": "A 34-year-old woman develops widespread urticaria, lip swelling, wheeze and BP 82/50 five minutes after IV co-amoxiclav. Most appropriate IMMEDIATE drug treatment?", "options": ["IV chlorphenamine 10 mg", "IM adrenaline 500 micrograms (0.5 mL of 1:1000)", "IV adrenaline 1 mg (10 mL of 1:10,000)", "IV hydrocortisone 200 mg", "Nebulised salbutamol 5 mg"], "answer": 1, "exp": "[G] RCUK 2021: IM adrenaline 500 mcg into the anterolateral thigh is first-line, repeated after 5 minutes if no improvement. IV adrenaline is reserved for experienced clinicians as an infusion because of arrhythmia risk with bolus dosing. Antihistamines and corticosteroids were REMOVED from the initial emergency algorithm in the 2021 update.", "type": "mcq"}, {"n": 2, "topic": "Refractory anaphylaxis", "stem": "Despite two doses of IM adrenaline 5 minutes apart she remains hypotensive with persistent wheeze. Most appropriate next step?", "options": ["A third dose of IM adrenaline", "IV chlorphenamine 10 mg + hydrocortisone 200 mg", "Start an IV adrenaline infusion with a rapid IV crystalloid bolus, and call for senior/critical care help", "IV aminophylline", "Subcutaneous adrenaline"], "answer": 2, "exp": "[G] No adequate response after 2 appropriate IM doses defines REFRACTORY anaphylaxis (RCUK 2021): start a low-dose IV adrenaline infusion (experienced clinician), give a rapid IV crystalloid bolus, and escalate to senior/critical care. Repeating IM doses alone or reaching for antihistamines/steroids is not the priority.", "type": "mcq"}, {"n": 3, "topic": "Anaphylaxis observation", "stem": "A patient responds fully to a SINGLE prompt dose of IM adrenaline, has no asthma, and is symptom-free at 2 hours. Per RCUK 2021, most appropriate MINIMUM observation before discharge?", "options": ["Discharge immediately", "2 hours", "6 hours", "12 hours", "Admit for 24 hours"], "answer": 1, "exp": "[G] RCUK 2021 recommends risk-stratified observation. A 2-hour minimum is reasonable for a good response to a single prompt dose with complete resolution and no higher-risk features. 6 hours applies to needing >1 dose or previous biphasic reaction; 12 hours or admission applies to severe reactions, asthma/severe respiratory compromise, ongoing absorption, late evening presentation, or poor access to emergency care.", "type": "mcq"}, {"n": 4, "topic": "ALS adrenaline timing", "stem": "A 60-year-old man is in cardiac arrest with VF. After the third shock CPR continues. Per RCUK 2021 adult ALS, when should the FIRST dose of IV adrenaline 1 mg be given?", "options": ["Immediately at the start of the arrest", "After the first shock", "After the third shock", "Only if VF persists after six shocks", "Adrenaline is not indicated in shockable rhythms"], "answer": 2, "exp": "[G] In a SHOCKABLE rhythm (VF/pVT), give adrenaline 1 mg IV after the 3rd shock, then every 3–5 minutes (alternate cycles). In a NON-shockable rhythm (PEA/asystole), adrenaline 1 mg is given as soon as IV/IO access is obtained.", "type": "mcq"}, {"n": 5, "topic": "Antiarrhythmic", "stem": "In the same VF arrest, which antiarrhythmic regimen is recommended by RCUK 2021?", "options": ["Amiodarone 150 mg after the first shock", "Amiodarone 300 mg after the third shock, then 150 mg after the fifth shock", "Lidocaine 100 mg after the first shock", "Amiodarone 300 mg after the fifth shock only", "Magnesium 2 g routinely for all VF"], "answer": 1, "exp": "[G] Amiodarone 300 mg IV after 3 shocks, with a further 150 mg after 5 shocks. Lidocaine 100 mg is an alternative only where amiodarone is unavailable. Magnesium is not routine — reserve it for torsades de pointes or documented hypomagnesaemia.", "type": "mcq"}, {"n": 6, "topic": "Sepsis NG51", "stem": "A 72-year-old with suspected pneumonia: RR 26, BP 88/54, HR 118, lactate 3.2 mmol/L. Using NICE NG51, which best describes risk and antibiotic timing?", "options": ["High risk; IV antibiotics within 3 hours", "Moderate risk; IV antibiotics within 6 hours", "High risk; senior review and IV broad-spectrum antibiotics within 1 hour", "Low risk; discharge on oral antibiotics", "High risk; withhold antibiotics until blood cultures result"], "answer": 2, "exp": "[G] Systolic BP ≤90 mmHg and

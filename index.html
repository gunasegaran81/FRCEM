ing and fever after sinusitis: proptosis, painful restricted eye movements, reduced colour vision. Most appropriate immediate management?", "options": ["Oral co-amoxiclav and review in 24 hours", "Immediate empirical IV antibiotics, then urgent CT and same-day ophthalmology/ENT referral", "CT orbits first; withhold antibiotics until imaging confirms", "Topical chloramphenicol and nasal decongestants", "Discharge with safety netting as this is preseptal"], "answer": 1, "exp": "[G] Proptosis, painful/restricted movements and impaired colour vision = ORBITAL cellulitis. RCOphth: start empirical IV antibiotics immediately, BEFORE imaging; CT then assesses for abscess; ophthalmology within 24h, ENT if sinus disease. Risks: blindness, cavernous sinus thrombosis, death.", "type": "mcq"}, {"n": 15, "topic": "Retinal detachment", "stem": "A 55-year-old myopic man, 3 days of flashes and floaters, now a 'curtain' over the lower field; central vision 6/6. Most appropriate management?", "options": ["Routine optometrist review within 2 weeks", "Same-day referral to ophthalmology/vitreoretinal service", "Reassure — this is posterior vitreous detachment", "Ophthalmology referral within one week as the macula is unaffected", "Start topical steroids and review in 48 hours"], "answer": 1, "exp": "[G] Field defect with flashes/floaters = retinal detachment. Preserved central acuity means macula-ON — the MOST urgent scenario, as prompt surgery preserves central vision (RCOphth/BEAVRS same-day). Flashes/floaters WITH a field defect always mandate same-day referral.", "type": "mcq"}, {"n": 16, "topic": "Scleritis", "stem": "A 47-year-old woman with RA, 4 days of severe boring left eye pain waking her at night, radiating to jaw; exquisitely tender globe, deep bluish-red injection not blanching with phenylephrine. Most appropriate management?", "options": ["Topical lubricants and reassurance — this is episcleritis", "Topical chloramphenicol for infective conjunctivitis", "Same-day ophthalmology referral for systemic anti-inflammatory treatment", "Oral aciclovir for presumed zoster", "Routine rheumatology clinic letter"], "answer": 2, "exp": "[G] Pain waking the patient is one of RCOphth's ten emergency presentations — classic scleritis. Non-blanching deep injection distinguishes it from episcleritis. RCOphth: slit lamp within 24h; systemic NSAIDs/steroids and assessment for systemic disease. Untreated risks scleral melt and perforation.", "type": "mcq"}, {"n": 17, "topic": "Uveitis", "stem": "A 32-year-old man with ankylosing spondylitis: painful photophobic red eye, blurred vision; pain in the LEFT eye when light is shone into the RIGHT eye. Diagnosis and pathway?", "options": ["Bacterial conjunctivitis — topical chloramphenicol from the ED", "Anterior uveitis — ophthalmology review within 24 hours for topical steroids and cycloplegia", "Anterior uveitis — start topical steroids in the ED without ophthalmic review", "Acute angle closure — IV acetazolamide", "Keratitis — hourly ofloxacin"], "answer": 1, "exp": "[G] Consensual photophobia is highly specific for anterior uveitis (HLA-B27 association). RCOphth: slit lamp and dilated exam, topical steroids and cycloplegics within 24h. Steroids should NOT be started blind in the ED — a dendritic ulcer must be excluded first.", "type": "mcq"}, {"n": 18, "topic": "Herpetic eye disease", "stem": "A 70-year-old woman, 2-day vesicular V1 rash including vesicles on the nose tip, red watering eye. Significance of the nasal vesicles and management?", "options": ["No significance; topical chloramphenicol", "Hutchinson's sign — high risk of ocular involvement; start oral aciclovir and refer for ophthalmic assessment", "Bacterial superinfection; oral flucloxacillin", "Orbital cellulitis; IV ceftriaxone", "Pathognomonic of HSV keratitis; topical aciclovir alone"], "answer": 1, "exp": "[C/CKS] Hutchinson's sign (nasociliary branch of V1) predicts ocular involvement in herpes zoster ophthalmicus. Start oral aciclovir 800 mg five times daily 7–10 days, ideally within 72h of rash, and refer for ophthalmic assessment. Complications: keratitis, uveitis, glaucoma, PHN.", "type": "mcq"}, {"n": 19, "topic": "Herpetic eye disease", "stem": "A 40-year-old woman with a painful red eye; fluorescein shows a branching corneal lesion with terminal bulbs. Which treatment would most worsen this if given inappropriately?", "options": ["Topical aciclovir", "Topical lubricants", "Topical corticosteroids", "Oral analgesia", "Cycloplegic drops"], "answer": 2, "exp": "[C] A dendritic ulcer is HSV keratitis, treated with topical antivirals. Topical steroids on an unrecognised dendritic ulcer cause geographic ulceration, melt and perforation — the reason UK practice is to exclude epithelial herpetic disease on slit lamp before any steroid for a red eye.", "type": "mcq"}, {"n": 20, "topic": "Post-surgical eye", "stem": "A 63-year-old man, corneal graft 18 months ago, 2 days of painful red eye and reduced vision. Most appropriate action?", "options": ["Treat as conjunctivitis; he is beyond the risk period", "Same-day ophthalmology referral for suspected graft rejection requiring intensive topical steroids", "Routine corneal clinic within 2 weeks", "Oral antibiotics and GP review", "Topical antihistamines for suture allergy"], "answer": 1, "exp": "[G] Graft rejection can occur AT ANY TIME after surgery — RCOphth lists 'painful loss of vision after graft/glaucoma surgery at any time' among its ten emergencies, needing slit lamp within 24h. Treat with immediate intensive topical steroids; any red/painful post-graft eye is rejection until proven otherwise.", "type": "mcq"}, {"n": 21, "topic": "Neuro-ophthalmology", "stem": "A 52-year-old woman, sudden severe headache, right ptosis, 'down and out' eye; dilated unreactive right pupil. Most appropriate next step?", "options": ["Refer to ophthalmology within 24 hours for orthoptics", "Immediate CT/CT angiography to exclude a posterior communicating artery aneurysm", "Check HbA1c and outpatient neurology — likely microvascular", "Prescribe an eye patch and review in one week", "Lumbar puncture as first investigation"], "answer": 1, "exp": "[C] Painful third nerve palsy WITH pupil involvement is a PCom aneurysm until proven otherwise (superficial parasympathetic fibres compressed early; microvascular palsies are pupil-sparing). Immediate CT + CTA. LP follows CT if SAH suspected and CT negative.", "type": "mcq"}, {"n": 22, "topic": "Orbital trauma", "stem": "A 14-year-old struck by a football: minimal bruising but marked pain and diplopia on upgaze, nausea, vomiting, an episode of bradycardia; CT shows an orbital floor fracture. Most appropriate management?", "options": ["Discharge with sinus precautions and routine maxfax follow-up in 2 weeks", "Urgent surgical referral — 'white-eyed blowout' with muscle entrapment needs early repair", "Observe 10–14 days to let swelling settle", "Oral antibiotics only", "Ophthalmology review only if vision deteriorates"], "answer": 1, "exp": "[C] 'White-eyed blowout': elastic paediatric floor traps inferior rectus with little external sign; vomiting/pain on movement/bradycardia = oculocardiac reflex. Needs urgent (24–48h) surgical release — delay causes permanent diplopia. Advise no nose-blowing (orbital emphysema).", "type": "mcq"}, {"n": 23, "topic": "Orbital trauma", "stem": "A 25-year-old, blunt squash-ball trauma: blood filling one third of the anterior chamber; vision 6/12. Most appropriate management?", "options": ["Discharge with topical chloramphenicol and GP follow-up", "Same-day ophthalmology referral, with advice to rest and avoid NSAIDs", "Aspiration of the hyphaema in the ED", "Firm double eye pad and review in 48 hours", "Routine clinic referral within 2 weeks"], "answer": 1, "exp": "[G] Traumatic hyphaema needs same-day ophthalmic assessment (RCOphth 'same day' triage). Risks: secondary haemorrhage (days 2–5), raised IOP with corneal staining, and associated globe injury. Head elevation, rest, avoid NSAIDs/antiplatelets, IOP monitoring; check sickle status.", "type": "mcq"}, {"n": 24, "topic": "Sudden painless visual loss", "stem": "A 68-year-old hypertensive woman, sudden painless blurring; widespread flame haemorrhages in all quadrants, dilated tortuous veins, cotton wool spots — 'stormy sunset'. Diagnosis and referral pathway?", "options": ["Central retinal artery occlusion — see within 8 hours", "Central retinal vein occlusion — ophthalmology referral (typically within 1–2 days per UK triage tools)", "Wet AMD — 2-week wait", "Vitreous haemorrhage — same-day vitreoretinal", "Hypertensive retinopathy — GP BP management only"], "answer": 1, "exp": "[G] 'Blood and thunder' fundus = CRVO. UK triage tools place CRVO/BRVO in the 1–2 day category — urgent but not minutes-critical like CRAO. Ophthalmology assesses for macular oedema and ischaemia. Distinguish from CRAO (pale retina, cherry-red spot, stroke pathway, 8h).", "type": "mcq"}, {"n": 25, "topic": "Sudden painless visual loss", "stem": "A 71-year-old man, single painless monocular loss 'like a shutter' 4 min with full recovery; normal exam/fundoscopy, no GCA features, normal inflammatory markers. Most appropriate management?", "options": ["Reassure and discharge", "High-dose oral prednisolone for GCA", "Treat as TIA: aspirin 300 mg and specialist TIA clinic within 24 hours", "Routine ophthalmology outpatient referral", "Urgent MRI orbits"], "answer": 2, "exp": "[G] Amaurosis fugax without inflammatory features = retinal TIA. NICE NG128: aspirin 300 mg immediately and specialist assessment within 24h; don't use ABCD2 to delay. Carotid imaging follows. Always exclude GCA in over-50s (negative here).", "type": "mcq"}, {"n": 26, "topic": "Endophthalmitis (glaucoma surgery)", "stem": "A 66-year-old woman, trabeculectomy 4 years ago, painful red eye, reduced vision, whitish inflamed bleb superiorly. Most likely diagnosis?", "options": ["Allergic conjunctivitis", "Bleb-related endophthalmitis", "Episcleritis", "Recurrent angle closure", "Suture abscess of no significance"], "answer": 1, "exp": "[G] Bleb-related endophthalmitis follows filtration surgery and — per RCOphth — can occur at ANY time (the thin-walled bleb is a lifelong portal). Management mirrors post-op endophthalmitis: urgent slit lamp, sampling, intravitreal antibiotics. Any painful red eye in a trabeculectomy patient is bleb infection until proven otherwise.", "type": "mcq"}, {"n": 27, "topic": "Corneal FB / minor trauma", "stem": "A 30-year-old welder at 2 am: severe bilateral eye pain, watering, photophobia 6h after welding without protection; diffuse bilateral punctate staining. Most appropriate management?", "options": ["Same-night ophthalmology referral for bilateral keratitis", "Topical anaesthetic drops to take home for pain relief", "Oral analgesia, lubricant ointment ± cycloplegic, with reassurance of recovery within 24–48 hours", "Hourly topical ofloxacin and corneal scrape", "Urgent CT orbits for foreign bodies"], "answer": 2, "exp": "[C/CKS] Photokeratitis ('arc eye'): UV injury with a 6–12h latent period. Supportive care — oral analgesia, lubricants, consider cycloplegic and chloramphenicol ointment; heals in 24–48h. Never dispense topical anaesthetics for home use (impairs healing, masks warning signs).", "type": "mcq"}, {"n": 28, "topic": "Papilloedema", "stem": "A 28-year-old woman, BMI 38, daily headaches worse on waking, transient visual obscurations; bilateral swollen discs, normal acuity. Most appropriate next step?", "options": ["Discharge with migraine advice", "Urgent neuroimaging before consideration of lumbar puncture", "Lumbar puncture as first investigation", "Start acetazolamide in the ED and refer routinely", "Ophthalmology outpatient within 2 weeks"], "answer": 1, "exp": "[C] Bilateral disc swelling with headache = papilloedema until proven otherwise. Although IIH is likely, exclude a mass and venous sinus thrombosis first: urgent neuroimaging (CT ± CT/MR venography) BEFORE LP (LP with a mass risks herniation). LP with opening pressure follows normal imaging.", "type": "mcq"}, {"n": 29, "topic": "Triage & pathways", "stem": "Per RCOphth commissioning guidance, true emergency eye conditions should be seen, diagnosed and have treatment initiated by an ophthalmic specialist within what timeframe?", "options": ["1 hour", "4 hours", "12 hours", "24 hours", "72 hours"], "answer": 3, "exp": "[G] The central RCOphth (2020) standard: all true emergencies seen, diagnosed and treated within 24 HOURS. Tighter internal targets exist — endophthalmitis 4h, CRAO 8h, chemical injury and retrobulbar haemorrhage immediately. Knowing which break the 24h default is high-yield.", "type": "mcq"}, {"n": 30, "topic": "Triage & pathways", "stem": "Which presentation does NOT require same-day emergency ophthalmic assessment?", "options": ["Painless loss of vision 3h ago with a cherry-red spot", "Painful red eye in a corneal graft recipient", "Severe eye pain waking the patient with a tender globe", "Recurrent bilateral zigzag lines lasting 20 minutes then headache, normal exam", "Sudden binocular diplopia with new headache"], "answer": 3, "exp": "[G] Bilateral positive visual phenomena (~20 min) with subsequent headache = migraine with aura — UK triage routes this to primary care. Bilaterality and the march distinguish cortical from retinal (monocular) pathology. The others are true emergencies (CRAO 8h; graft 24h; scleritis 24h; diplopia+headache immediate).", "type": "mcq"}, {"n": 31, "topic": "Acute angle closure", "stem": "Which commonly prescribed medication class is most likely to precipitate acute angle closure in a predisposed patient?", "options": ["Beta-blockers", "ACE inhibitors", "Anticholinergics and drugs with antimuscarinic effects (e.g. tricyclics, oxybutynin)", "Statins", "Proton pump inhibitors"], "answer": 2, "exp": "[C/BNF] Pupil-dilating drugs precipitate closure in predisposed (hypermetropic, shallow AC) eyes: anticholinergics/antimuscarinics (tricyclics, oxybutynin, hyoscine, nebulised ipratropium), sympathomimetics, topical mydriatics. Topiramate does so by a different mechanism (ciliochoroidal effusion). Beta-blockers TREAT it.", "type": "mcq"}]}, {"code": "TOX", "title": "Acute Opioid Toxicity", "source": "RCEM / NPIS · April 2024", "hue": "#f5b544", "questions": [{"n": 1, "topic": "Scope", "stem": "This guideline applies to acute opioid toxicity from illicit use, misuse or deliberate self-poisoning. In which group is it explicitly NOT applicable?", "options": ["Patients on methadone maintenance", "Patients taking prescribed opioids for palliative care/cancer pain", "Patients under 18", "Patients with co-ingestion of benzodiazepines", "Patients presenting >6 hours after use"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). It excludes patients on prescribed opioids for palliative/cancer pain.", "type": "mcq"}, {"n": 2, "topic": "Epidemiology", "stem": "Regarding European ED drug toxicity presentations, which class is most frequently encountered?", "options": ["Benzodiazepines", "Opioids", "Sympathomimetics", "NPS cannabinoids", "Alcohol alone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Opioids are the most frequent.", "type": "mcq"}, {"n": 3, "topic": "Epidemiology", "stem": "Approximately how many opioid-related drug deaths occurred per week in Great Britain in 2022?", "options": ["20", "40", "60", "100", "150"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60 per week.", "type": "mcq"}, {"n": 4, "topic": "Epidemiology", "stem": "In Scotland (2022), drug poisoning death rate vs the UK average, and the proportion of drug-misuse deaths implicating opiates/opioids, were approximately:", "options": ["1.5x higher; 50%", "2.7x higher; 82%", "4x higher; 60%", "Equal; 90%", "2x higher; 70%"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~2.7x higher; ~82%.", "type": "mcq"}, {"n": 5, "topic": "Epidemiology", "stem": "Since 2009, how many novel psychoactive substance (NPS) opioids have been identified on the European market?", "options": ["24", "44", "74", "104", "124"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 74.", "type": "mcq"}, {"n": 6, "topic": "Epidemiology", "stem": "Which novel opioid is cited as having roughly twice the potency of fentanyl?", "options": ["Carfentanil", "Isotonitazene", "U-47700", "Etonitazene", "Acetylfentanyl"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Isotonitazene (~2x fentanyl potency).", "type": "mcq"}, {"n": 7, "topic": "Epidemiology", "stem": "Acute opioid toxicity presentations are more common:", "options": ["Early morning on weekdays", "At weekends, late evening and night", "Only in winter", "Immediately after payday only", "Equally distributed"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Weekends, late evening and night.", "type": "mcq"}, {"n": 8, "topic": "Toxidrome", "stem": "The classic triad of acute opioid toxicity is:", "options": ["Hypertension, mydriasis, tachypnoea", "Drowsiness, respiratory depression, miosis", "Agitation, hyperthermia, tachycardia", "Seizures, bradycardia, mydriasis", "Vomiting, diarrhoea, diaphoresis"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Drowsiness, respiratory depression, miosis.", "type": "mcq"}, {"n": 9, "topic": "Toxidrome", "stem": "Which is NOT a recognised feature of acute opioid toxicity in this guideline?", "options": ["Hypothermia from environmental exposure", "Hypertension and tachycardia", "Convulsions", "Urticaria and pruritis", "Neuropsychiatric features (nightmares, hallucinations, paranoia)"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Hypertension/tachycardia are NOT features of opioid toxicity.", "type": "mcq"}, {"n": 10, "topic": "Toxidrome", "stem": "Co-ingestion with which class most exacerbates respiratory depression?", "options": ["Antihistamines", "Benzodiazepines and GABA-ergics (e.g. pregabalin)", "Beta-blockers", "Statins", "Proton pump inhibitors"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Benzodiazepines/GABA-ergics.", "type": "mcq"}, {"n": 11, "topic": "Diagnosis", "stem": "Role of urine drug screening in immediate ED management of suspected opioid toxicity?", "options": ["Mandatory before naloxone", "Confirms diagnosis and guides naloxone dosing", "No role in immediate management; diagnosis is clinical", "Send but wait for results before treating", "Replaces clinical assessment"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Diagnosis is clinical; urine screen has no immediate role.", "type": "mcq"}, {"n": 12, "topic": "Diagnosis", "stem": "For diagnostic uncertainty, who should be contacted for advice?", "options": ["Regional toxicology consultant only", "A clinical toxicologist via the National Poisons Information Service (NPIS)", "The coroner's office", "The patient's GP", "The hospital pharmacist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). NPIS clinical toxicologist.", "type": "mcq"}, {"n": 13, "topic": "Naloxone principles", "stem": "Primary therapeutic aim of naloxone in acute opioid toxicity?", "options": ["Full reversal of unconsciousness", "Reversal of respiratory depression and maintenance of airway protective reflexes", "Normalising pupil size", "Preventing all withdrawal symptoms", "Achieving GCS 15"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reverse respiratory depression / maintain airway reflexes, NOT full arousal.", "type": "mcq"}, {"n": 14, "topic": "Naloxone principles", "stem": "Naloxone acts as a:", "options": ["Partial mu-opioid agonist", "Mu-opioid receptor antagonist", "Kappa-opioid agonist", "NMDA antagonist", "GABA agonist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Mu-opioid receptor antagonist.", "type": "mcq"}, {"n": 15, "topic": "Naloxone principles", "stem": "Preferred naloxone route in the ED when IV access is available?", "options": ["Intramuscular", "Intranasal", "Intravenous", "Subcutaneous", "Intraosseous"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IV when access available.", "type": "mcq"}, {"n": 16, "topic": "Naloxone principles", "stem": "Compared with IV, the IM and IN routes are associated with:", "options": ["Shorter time to peak concentration", "Longer time to peak concentration", "Identical pharmacokinetics", "Greater risk of withdrawal", "No difference in onset"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Longer time to peak concentration.", "type": "mcq"}, {"n": 17, "topic": "Naloxone principles", "stem": "The guideline actively discourages which practice?", "options": ["Giving naloxone via IO access", "Giving IM naloxone alongside IV, or IM naloxone prior to discharge", "Titrating naloxone in small boluses", "Monitoring ETCO2", "Using saline to dilute naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid IM naloxone alongside IV / IM before discharge.", "type": "mcq"}, {"n": 18, "topic": "Naloxone principles", "stem": "Adverse effects from naloxone are more likely when:", "options": ["Small titrated doses are used", "Excessive/large doses are used", "Given IV rather than IM", "Given with oxygen", "Given to opioid-naïve patients"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Excessive doses.", "type": "mcq"}, {"n": 19, "topic": "Naloxone principles", "stem": "Which is a reported adverse effect of naloxone?", "options": ["Bradycardia and hypotension only", "Nausea, vomiting, sweating, tachycardia, tremor, hyperventilation, hypertension", "Miosis", "Sedation", "Hypoglycaemia"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal-type effects: N/V, sweating, tachycardia, tremor, hypertension.", "type": "mcq"}, {"n": 20, "topic": "Naloxone principles", "stem": "Regarding naloxone-associated convulsions, the guideline states:", "options": ["Common and clearly caused by naloxone", "A causal link is not clearly shown; may relate to co-used drugs", "Only with IM naloxone", "More common than opioid withdrawal", "Never occur"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Causal link not clearly established.", "type": "mcq"}, {"n": 21, "topic": "Naloxone principles", "stem": "Why are smaller initial IV naloxone doses preferred in hospital (non-arrest) settings?", "options": ["To reduce drug cost", "To find the minimum dose reversing respiratory depression while avoiding acute iatrogenic withdrawal", "Larger doses are contraindicated in all", "Smaller doses act faster", "IV naloxone has a ceiling effect"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to minimum effective dose; avoid precipitating withdrawal.", "type": "mcq"}, {"n": 22, "topic": "Naloxone principles", "stem": "Overzealous reversal is particularly concerning with opioid+stimulant co-use because it may:", "options": ["Cause immediate cardiac arrest", "Unmask stimulant toxicity", "Prevent withdrawal entirely", "Cause permanent respiratory depression", "Have no additional risk"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Can unmask stimulant toxicity.", "type": "mcq"}, {"n": 23, "topic": "Withdrawal", "stem": "Which is NOT a feature of acute opioid withdrawal (Table 1)?", "options": ["Yawning", "Lacrimation", "Miosis (pinpoint pupils)", "Piloerection-type fine muscle tremor", "Tachycardia and hypertension"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal causes DILATED pupils, not miosis.", "type": "mcq"}, {"n": 24, "topic": "Withdrawal", "stem": "Which pupil finding is associated with opioid WITHDRAWAL (vs toxicity)?", "options": ["Pinpoint/constricted", "Dilated", "Unequal", "Fixed", "No change"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Dilated pupils in withdrawal.", "type": "mcq"}, {"n": 25, "topic": "Withdrawal", "stem": "List at least six features of acute opioid withdrawal (Table 1). (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Yawning, sneezing, lacrimation, tachycardia, hypertension, dilated pupils, diarrhoea, cool/clammy skin, fine muscle tremor, nausea, irritability, restlessness, anxiety, coughing, running nose."}, {"n": 26, "topic": "Algorithm", "stem": "Per Figure 1, initial steps for any suspected opioid toxicity include:", "options": ["Immediate 2 mg IV naloxone bolus for all", "Attach monitoring and secure IV access", "Immediate intubation", "CT head before any treatment", "Urine toxicology before intervention"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Attach monitoring, secure IV access.", "type": "mcq"}, {"n": 27, "topic": "Algorithm", "stem": "RR >10/min and SpO2 >92% on air. Initial management?", "options": ["400 mcg naloxone IV", "Naloxone not required; monitor RR, SpO2, ETCO2 and AVPU every 30 min", "Start a naloxone infusion", "Discharge immediately", "100 mcg naloxone as a precaution"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Green pathway: monitor, no naloxone.", "type": "mcq"}, {"n": 28, "topic": "Algorithm", "stem": "RR 6–10/min or SpO2 86–92% on air (amber). First action?", "options": ["Call for senior decision maker", "Apply supplemental oxygen, then titrated IV naloxone 100–200 mcg every 60 s", "BVM at 10–12 breaths/min", "Start naloxone infusion directly", "400 mcg naloxone IV bolus immediately"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Oxygen then titrated 100–200 mcg boluses every 60 s.", "type": "mcq"}, {"n": 29, "topic": "Algorithm", "stem": "In the amber pathway, titrated boluses every 60 s up to a maximum of:", "options": ["400 mcg", "800 mcg", "1200 mcg", "2000 mcg", "4000 mcg"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 2000 mcg (2 mg).", "type": "mcq"}, {"n": 30, "topic": "Algorithm", "stem": "What defines the 'red' (respiratory/peri-arrest) pathway?", "options": ["RR ≤5 and/or SpO2 <85% on air", "RR ≤10 and SpO2 <92%", "Any GCS <15", "Any patient needing >1 bolus", "RR ≤8 regardless of SpO2"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). RR ≤5 and/or SpO2 <85% on air.", "type": "mcq"}, {"n": 31, "topic": "Algorithm", "stem": "Red pathway: initial oxygen/ventilation strategy?", "options": ["15 L/min NRB, no ventilation", "Ventilate with 15 L/min O2 via BVM at 10–12 breaths/min per ALS", "Nasal cannula 4 L/min", "CPAP", "No O2 until naloxone given"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). BVM 15 L/min at 10–12/min per ALS.", "type": "mcq"}, {"n": 32, "topic": "Algorithm", "stem": "Red pathway: first naloxone dose after IV/IO access?", "options": ["100 mcg IV", "400 mcg IV (or IO/IM if IV not secured)", "2000 mcg IV", "800 mcg IM only", "40 mcg IV"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg IV (IO/IM if no IV).", "type": "mcq"}, {"n": 33, "topic": "Algorithm", "stem": "Red pathway: no response after 60 s to the initial 400 mcg. Next?", "options": ["A further 400 mcg", "A further 800 mcg", "A further 2000 mcg", "Repeat 400 mcg once then stop", "IM naloxone instead"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A further 800 mcg.", "type": "mcq"}, {"n": 34, "topic": "Algorithm", "stem": "Red pathway: after two further 800 mcg doses with no response. Next step?", "options": ["Stop naloxone and intubate", "Give a further 2000 mcg IV and consider advanced airway/alternate diagnoses plus urgent critical care referral", "Switch to intranasal naloxone", "Wait 10 min", "IM naloxone 400 mcg"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 2000 mcg IV, advanced airway, reconsider diagnosis, critical care.", "type": "mcq"}, {"n": 35, "topic": "Algorithm", "stem": "Footnote D: correct initial and subsequent bolus dosing in the amber pathway?", "options": ["Initial 200, subsequent 100 mcg", "Initial 100 mcg; if no response to four 100 mcg boluses, subsequent boluses 200 mcg", "All boluses fixed 500 mcg", "Initial 400 mcg throughout", "Initial 50 mcg throughout"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 100 mcg, escalate to 200 mcg after four.", "type": "mcq"}, {"n": 36, "topic": "Algorithm", "stem": "How to dilute a 400 mcg naloxone vial so a 100 mcg bolus = 2.5 mL?", "options": ["Draw 1×400 mcg vial into a 10 mL syringe and make up to 10 mL with saline", "Draw up undiluted and give 1 mL boluses", "Dilute in a 100 mL saline bag", "Mix with dextrose only", "5 mL syringe undiluted"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg to 10 mL (40 mcg/mL); 2.5 mL = 100 mcg.", "type": "mcq"}, {"n": 37, "topic": "Algorithm", "stem": "Which patients may require larger naloxone doses (>4 mg)?", "options": ["Elderly only", "Those with severe toxicity or exposure to highly potent opioids", "COPD patients", "Opioid-naïve patients", "Under-30s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Severe toxicity / highly potent opioids.", "type": "mcq"}, {"n": 38, "topic": "Algorithm", "stem": "If a longer-acting opioid (e.g. methadone or NPS opioid) is suspected, extend observation up to:", "options": ["4 hours", "6 hours", "8 hours", "12 hours", "24 hours"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 12 hours.", "type": "mcq"}, {"n": 39, "topic": "Algorithm", "stem": "What does AVPU/GCS monitoring reflect, and what is emphasised?", "options": ["Primary target for titrating naloxone", "Useful to monitor, but naloxone aims at reversing respiratory depression / maintaining airway reflexes, NOT full arousal", "Must be normalised before discharge", "Replaces RR/SpO2 monitoring", "No clinical relevance"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to ventilation, not to consciousness.", "type": "mcq"}, {"n": 40, "topic": "Disposition", "stem": "Green pathway (no naloxone): when can discharge be considered?", "options": ["Immediately", "When RR, SpO2, ETCO2 and AVPU are normal for 6 hours after suspected overdose", "After 1 hour of normal obs", "Only after clear urine tox", "After psychiatric review only"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥6 h of normal observations since overdose.", "type": "mcq"}, {"n": 41, "topic": "Disposition", "stem": "Orange pathway (needed naloxone): discharge when obs normal for how long after naloxone, and since overdose?", "options": ["2 h after naloxone; 4 h since overdose", "4 h after naloxone; 6 h since overdose", "6 h after naloxone; 8 h since overdose", "1 h after naloxone; 2 h since overdose", "8 h after naloxone; 12 h since overdose"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since overdose.", "type": "mcq"}, {"n": 42, "topic": "Disposition", "stem": "How to interpret SpO2 targets in pre-existing respiratory disease (e.g. COPD)?", "options": ["Same targets universally (>92%)", "Interpret with caution; target may routinely be 88–92%", "Target >98%", "SpO2 monitoring not useful", "Never give oxygen"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). COPD target may be 88–92% — interpret with caution.", "type": "mcq"}, {"n": 43, "topic": "Investigations", "stem": "Footnote A: what to consider in all patients (to look for alternate diagnoses)?", "options": ["Full septic screen only", "BM (glucose), VBG, paracetamol concentration ± CT head", "Chest X-ray only", "Lumbar puncture", "ECG only, no bloods"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Glucose, VBG, paracetamol level ± CT head.", "type": "mcq"}, {"n": 44, "topic": "Algorithm", "stem": "Is Figure 1 a mandatory standard of care?", "options": ["Yes, followed exactly in all cases", "No — a suggested pathway; trained senior decision-makers may use alternatives such as permissive hypercapnia or lower boluses", "Yes, but only under 65", "No, prehospital only", "Mandatory only in tertiary centres"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A suggested pathway, not mandatory.", "type": "mcq"}, {"n": 45, "topic": "Infusion", "stem": "When is a naloxone infusion indicated?", "options": ["In every patient receiving any bolus", "When, after an initial response, the patient deteriorates and needs further boluses to maintain ventilation", "Only in cardiac arrest", "Only for heroin", "Only if the patient requests it"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Recurrent deterioration needing repeat boluses.", "type": "mcq"}, {"n": 46, "topic": "Infusion", "stem": "Recommended starting hourly infusion rate is calculated as:", "options": ["100% of the total dose required initially", "60% of the total dose(s) required to adequately reverse respiratory depression during the second dosing", "Fixed 400 mcg/h", "30% of the maximum bolus", "Double the total bolus"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60% of the reversing dose per hour.", "type": "mcq"}, {"n": 47, "topic": "Infusion", "stem": "How is the standard naloxone infusion prepared?", "options": ["4 mg (10×400 mcg vials) + 30 mL 0.9% saline to 40 mL final (100 mcg/mL)", "4 mg + 50 mL saline (80 mcg/mL)", "2 mg + 20 mL saline (100 mcg/mL)", "1 mg in 10 mL", "4 mg + 100 mL saline by gravity"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 4 mg to 40 mL = 100 mcg/mL.", "type": "mcq"}, {"n": 48, "topic": "Infusion", "stem": "If 800 mcg total bolus achieved response, starting infusion rate (mL/h) per Table 2?", "options": ["2.4", "3.6", "4.8", "6.0", "7.2"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 800 = 480 mcg/h = 4.8 mL/h at 100 mcg/mL.", "type": "mcq"}, {"n": 49, "topic": "Infusion", "stem": "1200 mcg total bolus to respond — starting rate in mcg/h?", "options": ["480", "600", "720", "840", "960"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 1200 = 720 mcg/h.", "type": "mcq"}, {"n": 50, "topic": "Infusion", "stem": "Practical point about high-dose naloxone infusions?", "options": ["Never exceed 4 hours", "The syringe may need replacing soon; consider a follow-on prescription with the initial one", "Central line only", "Cannot be prepared with dextrose", "Second nurse must co-sign hourly"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Provide a follow-on prescription as the syringe may run out.", "type": "mcq"}, {"n": 51, "topic": "Monitoring", "stem": "Once infusion started, how often should observations occur (initially, then subsequently)?", "options": ["Every 5 min for 2 h then hourly", "Every 15 min for the first hour, then every 30 min", "Every 30 min throughout", "Hourly throughout", "Continuous only, no manual checks"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 15-minutely for 1 h, then 30-minutely.", "type": "mcq"}, {"n": 52, "topic": "Monitoring", "stem": "On infusion, RR <10, SpO2 <92%, and/or concerning ETCO2. Action?", "options": ["Immediately double the infusion", "Give further 100–200 mcg boluses every 60 s up to 2 mg, then increase the infusion rate by 60% of the total bolus dose required", "Stop the infusion and observe", "Switch to IM naloxone", "Intubate without further naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Re-bolus then step up the infusion by 60% of the boluses given.", "type": "mcq"}, {"n": 53, "topic": "Monitoring", "stem": "On infusion, signs of acute withdrawal appear. First-line action?", "options": ["Stop the infusion permanently", "Decrease the infusion rate, generally by 50% first", "Double the infusion", "Give an additional bolus", "Switch to oral naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reduce rate ~50%.", "type": "mcq"}, {"n": 54, "topic": "Monitoring", "stem": "Significant agitation from withdrawal on infusion. Recommended approach?", "options": ["Continue unchanged and restrain", "Temporarily stop; restart after 30–60 min at 50% of the previous rate once withdrawal settles", "Switch antagonist", "Diazepam and continue unchanged", "Permanently discontinue in all such cases"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Pause, then restart at 50% once settled.", "type": "mcq"}, {"n": 55, "topic": "Monitoring", "stem": "After any change to infusion rate/dose, monitoring frequency should:", "options": ["Remain unchanged", "Recommence at every 15 min for the first hour, then every 30 min", "Reduce to hourly", "Reduce to 4-hourly", "Stop for 1 hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reset to 15-minutely for 1 h then 30-minutely.", "type": "mcq"}, {"n": 56, "topic": "Stopping", "stem": "How long should the infusion continue at the same rate (absent recurrence) before down-titration?", "options": ["≥1 hour", "≥2 hours", "≥4 hours", "≥8 hours", "≥24 hours"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). At least 4 hours.", "type": "mcq"}, {"n": 57, "topic": "Stopping", "stem": "Down-titration: reduce by how much and how often?", "options": ["10% of max every hour", "25% of the maximum infusion rate every two hours", "50% of max every hour", "5% every 30 min", "Fixed 100 mcg/h every hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 25% of the maximum rate every 2 hours.", "type": "mcq"}, {"n": 58, "topic": "Stopping", "stem": "Likely that down-titration completes within the ED?", "options": ["Yes, always", "No — unlikely within the ED unless there are significant admission delays", "Yes, under 40 only", "Only in resus", "Only overnight"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Usually completed after admission, not in ED.", "type": "mcq"}, {"n": 59, "topic": "Stopping", "stem": "When should an infusion generally NOT be stopped?", "options": ["Daytime (0800–1600)", "At night (midnight–0600) unless the patient shows withdrawal", "Weekends", "Within the first hour regardless", "No timing restriction"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid stopping overnight unless withdrawing.", "type": "mcq"}, {"n": 60, "topic": "Stopping", "stem": "Why avoid stopping overnight?", "options": ["Nursing staff unavailable", "Recurrent toxicity is harder to detect overnight if the patient is asleep", "Naloxone less effective at night", "Pharmacy closed", "Unrelated hospital policy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Sleep masks recurrence of toxicity.", "type": "mcq"}, {"n": 61, "topic": "Disposition", "stem": "Standard minimum observation before discharge after naloxone?", "options": ["2 h after last dose; 4 h since use", "4 h after last naloxone dose; 6 h since suspected opioid use", "6 h; 12 h", "1 h; 2 h", "12 h regardless"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since use.", "type": "mcq"}, {"n": 62, "topic": "Prevention", "stem": "US study: at 12 months after non-fatal overdose, patients died at approximately what rate vs the general population?", "options": ["2x", "5x", "10x", "24x", "50x"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~24x.", "type": "mcq"}, {"n": 63, "topic": "Prevention", "stem": "Causes of death noted in that cohort?", "options": ["Only respiratory failure", "Drug-use-associated diseases, HIV, chronic respiratory disease, viral hepatitis and suicide", "Only cardiovascular", "Only trauma", "Only malignancy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Broad — drug-associated disease, HIV, respiratory, hepatitis, suicide.", "type": "mcq"}, {"n": 64, "topic": "Prevention", "stem": "Secondary prevention opportunities after an opioid presentation?", "options": ["Brief intervention, referral to drug liaison services, encouraging engagement with community services", "Compulsory detox admission", "Police notification in all cases", "Discharge with no action if obs normal", "Bariatric referral"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Brief intervention + drug liaison + community engagement.", "type": "mcq"}, {"n": 65, "topic": "Prevention", "stem": "What is take-home naloxone, and what supports its provision?", "options": ["Experimental, no evidence", "In-hospital/community IM or nasal naloxone with training; reduces drug-related deaths", "USA only", "Effective only with buprenorphine", "Prophylactic tablets"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IM/nasal take-home naloxone with training reduces deaths.", "type": "mcq"}, {"n": 66, "topic": "Prevention", "stem": "Legal duty of EDs in England re homelessness in this group?", "options": ["No duty exists", "Duty to refer someone believed homeless, or threatened within 56 days, to a housing authority of their choice", "Only provide a leaflet", "Only if the patient requests", "Only for under-18s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Duty to refer to housing (56-day threshold).", "type": "mcq"}, {"n": 67, "topic": "Prevention", "stem": "Other health screening to consider in this high-risk cohort?", "options": ["Bone density", "Blood-borne virus testing", "Routine echocardiography", "Colonoscopy", "Genetic testing"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Blood-borne virus screening.", "type": "mcq"}, {"n": 68, "topic": "Harm reduction", "stem": "Advice about variability of drug supply?", "options": ["Purity is consistent, no need to test", "Test first — start with a small amount or inject slowly, as potency/content varies", "Only use pharmacy drugs", "Avoid injecting entirely", "Test by tasting"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Start small; potency varies.", "type": "mcq"}, {"n": 69, "topic": "Harm reduction", "stem": "Advice about using alone vs with others?", "options": ["Alone is safer", "Use with others if possible; using alone is riskier — no one to help if overdose", "No difference", "Only in public", "Group use always avoided"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Don't use alone.", "type": "mcq"}, {"n": 70, "topic": "Harm reduction", "stem": "List the signs of overdose from the 'Look out for the signs' section. (Short answer, ≥4)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Falling unconscious; very light/shallow breathing or no breathing; loud raspy snoring or gurgling; blue or pale lips or fingertips."}, {"n": 71, "topic": "Harm reduction", "stem": "Bystander steps per 'Naloxone: get it, carry it, use it'?", "options": ["Wait 30 min for spontaneous recovery", "Act fast, call 999, check breathing, recovery position, give naloxone ASAP", "Give food and water first", "Only give naloxone if a HCP is present", "Restrain until EMS arrive"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Call 999, check breathing, recovery position, naloxone ASAP.", "type": "mcq"}, {"n": 72, "topic": "Recall", "stem": "State, in your own words, the four Summary Recommendations at the start of the guideline. (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "1) Naloxone's aim is reversal of respiratory depression / maintenance of airway reflexes, not full reversal of unconsciousness. 2) Adverse effects are more likely with excessive doses. 3) Observe ≥4 h after last naloxone dose and ≥6 h after suspected opioid use, adjusted for the opioid's duration. 4) Non-fatal overdose is an opportunity for brief intervention, referral to drug liaison, and community engagement."}, {"n": 73, "topic": "Recall (T/F)", "stem": "The aim of naloxone therapy is to fully awaken the patient to GCS 15.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — the aim is reversal of respiratory depression, not full arousal.", "type": "mcq"}, {"n": 74, "topic": "Recall (T/F)", "stem": "Patients should generally be observed ≥4 h after the last naloxone dose AND ≥6 h after suspected opioid use, adjusted for the opioid's duration of action.", "options": ["True", "False"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). TRUE.", "type": "mcq"}, {"n": 75, "topic": "Recall (T/F)", "stem": "Non-fatal overdose should be treated purely as a medical event with no further intervention once medically stable.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — it is an opportunity for secondary prevention.", "type": "mcq"}]}, {"code": "RESUS", "title": "Resuscitation + Legal Twists", "source": "RCUK 2021 · NICE NG51 · MCA 2005", "hue": "#fb7185", "questions": [{"n": 1, "topic": "Anaphylaxis", "stem": "A 34-year-old woman develops widespread urticaria, lip swelling, wheeze and BP 82/50 five minutes after IV co-amoxiclav. Most appropriate IMMEDIATE drug treatment?", "options": ["IV chlorphenamine 10 mg", "IM adrenaline 500 micrograms (0.5 mL of 1:1000)", "IV adrenaline 1 mg (10 mL of 1:10,000)", "IV hydrocortisone 200 mg", "Nebulised salbutamol 5 mg"], "answer": 1, "exp": "[G] RCUK 2021: IM adrenaline 500 mcg into the anterolateral thigh is first-line, repeated after 5 minutes if no improvement. IV adrenaline is reserved for experienced clinicians as an infusion because of arrhythmia risk with bolus dosing. Antihistamines and corticosteroids were REMOVED from the initial emergency algorithm in the 2021 update.", "type": "mcq"}, {"n": 2, "topic": "Refractory anaphylaxis", "stem": "Despite two doses of IM adrenaline 5 minutes apart she remains hypotensive with persistent wheeze. Most appropriate next step?", "options": ["A third dose of IM adrenaline", "IV chlorphenamine 10 mg + hydrocortisone 200 mg", "Start an IV adrenaline infusion with a rapid IV crystalloid bolus, and call for senior/critical care help", "IV aminophylline", "Subcutaneous adrenaline"], "answer": 2, "exp": "[G] No adequate response after 2 appropriate IM doses defines REFRACTORY anaphylaxis (RCUK 2021): start a low-dose IV adrenaline infusion (experienced clinician), give a rapid IV crystalloid bolus, and escalate to senior/critical care. Repeating IM doses alone or reaching for antihistamines/steroids is not the priority.", "type": "mcq"}, {"n": 3, "topic": "Anaphylaxis observation", "stem": "A patient responds fully to a SINGLE prompt dose of IM adrenaline, has no asthma, and is symptom-free at 2 hours. Per RCUK 2021, most appropriate MINIMUM observation before discharge?", "options": ["Discharge immediately", "2 hours", "6 hours", "12 hours", "Admit for 24 hours"], "answer": 1, "exp": "[G] RCUK 2021 recommends risk-stratified observation. A 2-hour minimum is reasonable for a good response to a single prompt dose with complete resolution and no higher-risk features. 6 hours applies to needing >1 dose or previous biphasic reaction; 12 hours or admission applies to severe reactions, asthma/severe respiratory compromise, ongoing absorption, late evening presentation, or poor access to emergency care.", "type": "mcq"}, {"n": 4, "topic": "ALS adrenaline timing", "stem": "A 60-year-old man is in cardiac arrest with VF. After the third shock CPR continues. Per RCUK 2021 adult ALS, when should the FIRST dose of IV adrenaline 1 mg be given?", "options": ["Immediately at the start of the arrest", "After the first shock", "After the third shock", "Only if VF persists after six shocks", "Adrenaline is not indicated in shockable rhythms"], "answer": 2, "exp": "[G] In a SHOCKABLE rhythm (VF/pVT), give adrenaline 1 mg IV after the 3rd shock, then every 3–5 minutes (alternate cycles). In a NON-shockable rhythm (PEA/asystole), adrenaline 1 mg is given as soon as IV/IO access is obtained.", "type": "mcq"}, {"n": 5, "topic": "Antiarrhythmic", "stem": "In the same VF arrest, which antiarrhythmic regimen is recommended by RCUK 2021?", "options": ["Amiodarone 150 mg after the first shock", "Amiodarone 300 mg after the third shock, then 150 mg after the fifth shock", "Lidocaine 100 mg after the first shock", "Amiodarone 300 mg after the fifth shock only", "Magnesium 2 g routinely for all VF"], "answer": 1, "exp": "[G] Amiodarone 300 mg IV after 3 shocks, with a further 150 mg after 5 shocks. Lidocaine 100 mg is an alternative only where amiodarone is unavailable. Magnesium is not routine — reserve it for torsades de pointes or documented hypomagnesaemia.", "type": "mcq"}, {"n": 6, "topic": "Sepsis NG51", "stem": "A 72-year-old with suspected pneumonia: RR 26, BP 88/54, HR 118, lactate 3.2 mmol/L. Using NICE NG51, which best describes risk and antibiotic timing?", "options": ["High risk; IV antibiotics within 3 hours", "Moderate risk; IV antibiotics within 6 hours", "High risk; senior review and IV broad-spectrum antibiotics within 1 hour", "Low risk; discharge on oral antibiotics", "High risk; withhold antibiotics until blood cultures result"], "answer": 2, "exp": "[G] Systolic BP ≤90 mmHg and lactate >2 mmol/L are NICE NG51 HIGH-RISK criteria. Action: senior review and IV broad-spectrum antibiotics within 1 hour, alongside the Sepsis Six. Antibiotics must NOT be delayed to await blood cultures.", "type": "mcq"}, {"n": 7, "topic": "Post-ROSC temperature", "stem": "Following ROSC after an out-of-hospital VF arrest the patient remains comatose. Regarding temperature per RCUK post-resuscitation care, which is most appropriate?", "options": ["Actively rewarm to 38°C", "Maintain a constant target temperature of 32–36°C and actively prevent fever", "No temperature control is required", "Cool to 28°C for 48 hours", "Permissive hyperthermia improves neurological outcome"], "answer": 1, "exp": "[G] RCUK post-resuscitation care: targeted temperature management — maintain a constant target between 32 and 36°C and actively prevent and treat fever (>37.7°C) for at least 72 hours in patients who remain comatose. Hyperthermia is associated with worse neurological outcome.", "type": "mcq"}, {"n": 8, "topic": "Adult choking", "stem": "A conscious adult suddenly clutches his throat during a meal, cannot speak, and has a silent (ineffective) cough. He remains conscious. Per the RCUK adult choking algorithm, what is correct?", "options": ["Blind finger sweep of the mouth", "Immediate abdominal thrusts only", "Up to 5 back blows, then up to 5 abdominal thrusts, alternating", "Start chest compressions now", "Encourage him to keep coughing"], "answer": 2, "exp": "[G] An ineffective (silent) cough indicates SEVERE airway obstruction. In a conscious adult: up to 5 back blows, then up to 5 abdominal thrusts, alternating, until relieved. If the person becomes unconscious, start CPR. Encouraging coughing is correct only for MILD obstruction. Blind finger sweeps are not recommended.", "type": "mcq"}, {"n": 9, "topic": "DNACPR", "stem": "An 84-year-old care-home resident with metastatic cancer arrests in the ED. A completed, signed DNACPR form dated last week accompanies her, with no reason to doubt validity. Family are not present. Most appropriate?", "options": ["Start full ALS because family are absent to confirm", "Start CPR until a consultant reviews the form", "Withhold CPR in line with the valid DNACPR decision", "Contact the coroner before deciding", "Perform CPR for 2 minutes as a compromise"], "answer": 2, "exp": "[Ethics/law twist] A valid DNACPR decision should be respected. The family's absence does not invalidate it, and relatives cannot demand CPR that is against a valid clinical decision. Only genuine doubt about the form's validity or applicability would justify commencing CPR while clarifying — and no such doubt exists here.", "type": "mcq"}, {"n": 10, "topic": "Capacitous refusal", "stem": "A 25-year-old presents after paracetamol overdose. Alert and oriented, understands untreated overdose can cause fatal liver failure, and calmly refuses acetylcysteine. Capacity assessment confirms she understands, retains, weighs and communicates. Most appropriate?", "options": ["Treat with acetylcysteine under the Mental Capacity Act", "Detain under Section 5(2) and force treatment", "Respect her refusal, as she has capacity to refuse this specific treatment", "Sedate and treat her in her best interests", "Treat under common law necessity"], "answer": 2, "exp": "[Capacity/MCA twist] A capacitous adult may refuse even life-saving treatment. MCA best-interests treatment applies ONLY where capacity is lacking; the MHA authorises treatment for a MENTAL disorder, not the physical consequences of an overdose. With capacity confirmed for this specific decision, respect the refusal — while documenting meticulously, offering ongoing help, and reassessing capacity, which can fluctuate as toxicity develops.", "type": "mcq"}, {"n": 11, "topic": "Advance decision", "stem": "A 40-year-old Jehovah's Witness is exsanguinating from a ruptured spleen. He carries a valid, signed, witnessed advance decision refusing blood and blood products even when life-threatening, with no reason to doubt validity or applicability. He is now unconscious. What is correct?", "options": ["Transfuse because the situation is now life-threatening", "Transfuse under the Mental Capacity Act in his best interests", "Respect the advance decision, withhold blood products, and use alternatives (e.g. cell salvage, haemostatics)", "Seek a court order before withholding transfusion", "Ask the family to override the decision"], "answer": 2, "exp": "[Advance decisions/MCA twist] A valid and applicable advance decision to refuse treatment (ADRT) — even one that is life-sustaining — is legally binding under the MCA 2005 and must be respected. Best-interests transfusion does not apply because a valid ADRT overrides it; family cannot override it and no court order is required. Manage with non-blood strategies (cell salvage, tranexamic acid, surgical/IR haemostasis).", "type": "mcq"}, {"n": 12, "topic": "Best interests", "stem": "An unidentified, unconscious adult is brought in after a road traffic collision, hypotensive and peri-arrest. No capacity, no known advance decision, no relatives present. What legal basis permits emergency life-saving treatment?", "options": ["Section 136 of the Mental Health Act", "Written consent from a relative is required before acting", "Treatment in his best interests under the Mental Capacity Act (doctrine of necessity)", "A court order must be obtained first", "A Deprivation of Liberty Safeguards authorisation"], "answer": 2, "exp": "[Best interests/necessity twist] For an adult lacking capacity with no valid advance decision or appointed attorney, provide treatment that is immediately necessary and in their best interests under the MCA 2005 / common law doctrine of necessity. Relatives cannot consent on behalf of an adult; s136, DoLS and the courts are not the legal basis for delivering emergency clinical treatment.", "type": "mcq"}]}, {"code": "ALS", "title": "Adult Advanced Life Support", "source": "RCUK ALS · boundary conditions", "hue": "#f97316", "questions": [{"n": 1, "topic": "Physiology-guided CPR", "stem": "A 55-year-old in ICU with continuous intra-arterial BP monitoring develops asystolic cardiac arrest. CPR commenced. Most appropriate initial adrenaline dosing strategy per RCUK ALS?", "options": ["Administer 1 mg adrenaline IV bolus immediately", "Administer 50–100 micrograms adrenaline IV increments", "Withhold adrenaline until a diastolic BP <30 mmHg is confirmed", "Administer 500 micrograms adrenaline IV bolus", "Start an adrenaline infusion at 2–10 micrograms/min"], "answer": 1, "exp": "[G] For adults in cardiac arrest ALREADY undergoing continuous intra-arterial BP monitoring, RCUK suggests adrenaline initially in small increments of 50–100 mcg IV. If a total of 1 mg has been given in micro-doses with no response, consider transitioning back to standard 1 mg every 3–5 min. [C] A standard 1 mg bolus with an arterial line running can cause severe harmful hypertension if ROSC occurs; titration supports a target diastolic BP ≥30 mmHg.", "type": "mcq"}, {"n": 2, "topic": "AF cardioversion", "stem": "A 68-year-old with rapid irregular wide-complex AF with pre-existing bundle branch block is unstable (BP 82/44) with severe acute heart failure. After sedation, recommended initial energy strategy for synchronised cardioversion?", "options": ["Initial synchronised shock at 70 J", "Initial synchronised shock at 100 J", "Initial synchronised shock at 120–150 J", "Initial synchronised shock at maximum defibrillator output", "Amiodarone 300 mg IV over 10–20 minutes prior to electrical shock"], "answer": 3, "exp": "[G] For an unstable patient in atrial fibrillation, RCUK explicitly states to deliver the initial synchronised shock at MAXIMUM defibrillator output, rather than an escalating approach. [C] AF is structurally more resilient than atrial flutter or PSVT (which start lower at 70–120 J); maximising the first shock avoids repeated failed attempts, myocardial stunning and further decompensation.", "type": "mcq"}, {"n": 3, "topic": "Atropine contraindication", "stem": "A 74-year-old with syncope has third-degree AV block with a wide QRS at 28 bpm, BP 85/50 and ongoing chest discomfort. Transcutaneous pacing is being retrieved. Most appropriate consideration regarding atropine?", "options": ["Administer atropine 500 micrograms IV immediately as first-line", "Avoid atropine as it is ineffective and may worsen the heart block", "Administer atropine 3 mg IV as a single rapid bolus", "Give aminophylline 100–200 mg slow IV instead of pacing", "Administer atropine only if the QRS complex narrows during telemetry"], "answer": 1, "exp": "[G] High-degree (third-degree) AV block with a WIDE QRS is a strict contraindication to atropine — it is ineffective and can paradoxically worsen the block or cause ventricular standstill. [C] Atropine blocks vagal tone at the SA/AV nodes; in infra-nodal block, speeding the sinus node can outpace and suppress fragile ventricular escape pacemakers. Bridge with pacing or inotropic infusion.", "type": "mcq"}, {"n": 4, "topic": "Ventilator settings in CPR", "stem": "A 42-year-old in refractory VF is intubated and transitioned to mechanical ventilation during continuous manual compressions (volume-controlled, RR 10/min, maximum FiO2). Correct combination for peak pressure alarm and flow trigger during CPR?", "options": ["Peak pressure alarm 30–40 cmH2O, flow trigger on", "Peak pressure alarm 40–50 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger on", "Peak pressure alarm 80–90 cmH2O, flow trigger off"], "answer": 2, "exp": "[G] For mechanical ventilation during CPR: volume-controlled mode, tidal volume 6–8 mL/kg, RR 10/min, peak pressure alarm 60–70 cmH2O, and flow trigger turned completely OFF. [C] Compressions generate heavy transient circuit flow; turning the flow trigger off stops the machine misinterpreting compressions as patient breaths (causing air trapping), and a high alarm ceiling prevents premature breath termination.", "type": "mcq"}, {"n": 5, "topic": "POCUS in arrest", "stem": "A 35-year-old in PEA arrest. POCUS by a skilled operator without interrupting compressions shows isolated right ventricular dilation, no pericardial fluid, no tension pneumothorax. Correct interpretation and management?", "options": ["RV dilation in isolation confirms massive PE; administer immediate thrombolysis", "RV dilation in isolation should not be used to diagnose pulmonary embolism; continue high-quality CPR and search for other reversible causes", "Isolated RV dilation indicates profound contractility failure; terminate resuscitation immediately", "RV dilation is a normal finding in PEA; pause CPR for 60 seconds for a formal echo", "Administer a fluid bolus immediately as isolated RV dilation confirms severe hypovolaemia"], "answer": 1, "exp": "[G] RCUK mandates that RV dilation in isolation during cardiac arrest must NOT be used to diagnose pulmonary embolism, nor should POCUS be the sole indicator to terminate resuscitation. [C] RV dilation is a non-specific consequence of any arrest — blood shifts from the arterial system to the compliant venous system in low-flow states and the right heart distends. Relying on it alone risks inappropriate thrombolysis.", "type": "mcq"}, {"n": 6, "topic": "Failed cardioversion", "stem": "A 59-year-old with unstable monomorphic VT with a pulse (BP 78/40, severe chest pain) has had synchronised shocks at 120 J then 150 J; the rhythm persists and he remains profoundly unstable. Most appropriate next step?", "options": ["Immediate IV bolus of 300 mg amiodarone over 1 minute", "Unsynchronised shock at maximum defibrillator output (360 J)", "Give procainamide 10–15 mg/kg over 20 minutes or amiodarone 300 mg IV over 10–20 minutes, then re-attempt electrical cardioversion", "Immediate infusion of isoprenaline at 5 micrograms/min", "Abandon electrical management and prepare for emergency transvenous pacing"], "answer": 2, "exp": "[G] If synchronised cardioversion fails in an unstable tachyarrhythmia, the RCUK algorithm directs procainamide 10–15 mg/kg over 20 min OR amiodarone 300 mg IV over 10–20 min, then re-attempt cardioversion. [C] Rapid amiodarone bolus over 1 minute is reserved for PULSELESS arrest; in a patient with a pulse it can trigger catastrophic vasodilatory hypotension.", "type": "mcq"}, {"n": 7, "topic": "Asthma — gas trapping", "stem": "A 26-year-old with brittle asthma is in PEA arrest and intubated. During ventilation there is extreme resistance, rapidly rising peak airway pressures, and profound drop in chest wall expansion during decompression. Dynamic hyperinflation suspected. Most appropriate immediate action?", "options": ["Apply PEEP of 10 cmH2O to splint the airways open", "Increase the respiratory rate to 20 breaths per minute", "Perform immediate bilateral needle thoracocentesis in the second intercostal space", "Disconnect the tracheal tube from the breathing circuit and manually compress the chest wall", "Administer an immediate IV bolus of 2 g magnesium sulphate over 1 minute"], "answer": 3, "exp": "[G] In cardiac arrest in asthma, if dynamic hyperinflation (gas trapping) is suspected, immediately disconnect the tracheal tube/breathing circuit and manually compress the chest wall to facilitate exhalation. [C] Trapped gas builds intrathoracic pressure, blocking venous return and mimicking tension pneumothorax. Increasing PEEP or rate worsens it. Empty the lungs before bilateral needle decompression.", "type": "mcq"}, {"n": 8, "topic": "Post-ROSC ventilation", "stem": "A 64-year-old resuscitated after a 12-minute out-of-hospital VF arrest remains comatose, ventilated on 100% oxygen, BP 118/72. ABG 15 min post-ROSC: pH 7.28, PaO2 24.5 kPa, PaCO2 3.9 kPa, HCO3 18. Most appropriate ventilator adjustments?", "options": ["Maintain 100% oxygen and increase minute ventilation to normalise pH", "Titrate FiO2 to target SpO2 94–98% and DECREASE minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Titrate FiO2 to target SpO2 88–92% and increase minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Maintain 100% oxygen to correct the metabolic acidosis and keep current parameters", "Titrate FiO2 to target SpO2 94–98% and increase minute ventilation to drive PaCO2 below 3.5 kPa"], "answer": 1, "exp": "[G] Post-resuscitation care: titrate inspired oxygen as soon as feasible to SpO2 94–98% (avoiding hyperoxaemia) and ventilate to maintain normal PaCO2 of 4.6–6.0 kPa. [C] PaO2 24.5 kPa is severe hyperoxaemia (oxygen free radicals worsen reperfusion injury); PaCO2 3.9 kPa is hypocapnia causing cerebral vasoconstriction. Decreasing minute ventilation normalises CO2 and restores cerebral perfusion.", "type": "mcq"}, {"n": 9, "topic": "Airway attempts", "stem": "A 52-year-old in refractory VF after anterior MI. During compressions, direct laryngoscopy fails (poor view); a second attempt with a bougie also fails to pass the cords. Most appropriate next step?", "options": ["Attempt a third intubation using a video laryngoscope with a hyperangulated blade", "Immediately perform an emergency surgical cricothyroidotomy", "Switch to a supraglottic airway device or return to high-quality bag-mask ventilation", "Halt chest compressions for up to 20 seconds for a controlled third attempt", "Continue compressions and request a senior anaesthetist for a third direct laryngoscopy"], "answer": 2, "exp": "[G] RCUK ALS explicitly states no more than TWO attempts at tracheal intubation before switching to a supraglottic airway device or returning to bag-mask ventilation. [C] Fixating on a definitive tube causes prolonged compression interruptions and severe hypoxia.", "type": "mcq"}, {"n": 10, "topic": "Failed SGA", "stem": "A 45-year-old in arrest after drowning: two failed laryngoscopy attempts due to massive airway oedema, then a second-generation SGA placed. On testing there is zero chest rise, a massive audible leak and no ETCO2 waveform. Most appropriate immediate action?", "options": ["Proceed immediately to a third intubation attempt using a videolaryngoscope", "Revert immediately to high-quality bag-mask ventilation using a two-person technique and basic airway adjuncts", "Perform an immediate emergency surgical cricothyroidotomy", "Remove the SGA and attempt a larger size of the same device", "Continue chest compressions and ignore the lack of ventilation for two cycles"], "answer": 1, "exp": "[G] If both intubation and an SGA fail to provide adequate ventilation, revert immediately to high-quality bag-mask ventilation with a two-person technique and basic airway adjuncts. [C] A third intubation or changing SGA size wastes critical seconds during active hypoxia. Surgical cricothyroidotomy is a terminal option only in confirmed 'cannot intubate, cannot oxygenate' after bag-mask rescue has been maximised and failed.", "type": "mcq"}, {"n": 11, "topic": "Hyperkalaemic arrest", "stem": "A 62-year-old with ESRD who missed dialysis collapses in PEA arrest. The monitor shows an extremely wide sinusoidal QRS morphing towards asystole. Hyperkalaemia strongly suspected. Correct first-line drug intervention and dosing?", "options": ["30 mL of 10% calcium gluconate by slow IV infusion over 10 minutes", "10 mL of 10% calcium chloride by rapid intravenous bolus", "50 mL of 8.4% sodium bicarbonate over 15 minutes", "10 units of soluble insulin with 50 mL of 50% glucose over 5 minutes", "Withhold calcium until a formal point-of-care potassium is confirmed"], "answer": 1, "exp": "[G] In cardiac arrest secondary to hyperkalaemia, the standard slow calcium administration protocols are bypassed: give 10 mL of 10% CALCIUM CHLORIDE by rapid IV bolus, repeatable if the arrest continues. [C] Calcium stabilises the myocardial membrane; calcium chloride's superior bioavailability (gluconate requires hepatic activation) makes it first-line during active CPR.", "type": "mcq"}, {"n": 12, "topic": "Maternal arrest", "stem": "A 31-year-old at 28 weeks collapses in resus after a severe headache and arrests. High-quality compressions and continuous manual left uterine displacement are applied. Rhythm is asystole. After 3 minutes of ALS there is no ROSC. Critical timing boundary for resuscitative hysterotomy?", "options": ["Prepare to perform the procedure immediately if there is no ROSC by 4 minutes, aiming for delivery of the fetus by 5 minutes", "Defer until 10 minutes of ALS have been delivered to maximise maternal ROSC", "Perform only if fetal distress is documented via formal obstetric ultrasound", "Immediately transfer to the nearest obstetric theatre before initiating the incision", "Initiate immediately at the 2-minute mark if the rhythm is non-shockable"], "answer": 0, "exp": "[G] In maternal cardiac arrest (≥20 weeks or fundus at/above the umbilicus), if there is no ROSC within 4 minutes of collapse, immediately perform a resuscitative hysterotomy aiming for delivery by 5 minutes. [C] The gravid uterus compresses the IVC and aorta, reducing compression-generated output to negligible levels; emptying the uterus unloads this and gives the mother her best chance. Perform in the resus bay, not after transfer.", "type": "mcq"}]}, {"code": "ABS", "title": "The Patient Who Absconds", "source": "RCEM Best Practice Guideline (rev. 2023)", "hue": "#4ade80", "questions": [{"n": 1, "topic": "Definitions", "stem": "A 34-year-old man brought to the ED after an overdose is booked in and placed in majors awaiting bloods. An hour later his cubicle is empty; no staff saw him leave and he remains at potential risk of self-harm. Which term correctly describes this event?", "options": ["Did not wait", "Left without being seen", "Self-discharge", "Absconded", "Discharge against medical advice"], "answer": 3, "exp": "[G] RCEM (The Patient Who Absconds, rev. 2023) defines absconding as a patient who has left the department unexpectedly, without the knowledge of clinical staff, and in whom there remains a potential risk of harm to self or others. The guideline explicitly excludes 'did not wait', 'left without being seen' and 'self-discharge'. A duty of care exists from the moment of booking in.", "type": "mcq"}, {"n": 2, "topic": "Risk identification", "stem": "At triage a 26-year-old woman presenting after self-harm is judged at risk of absconding. Which single action is essential as soon as the risk is identified?", "options": ["Record her physical description", "Assess her capacity, ideally as part of a mental health triage tool", "Allocate a security officer to observe her", "Refer immediately to the mental health liaison team", "Move her to a cubicle near the nursing station"], "answer": 1, "exp": "[G] RCEM Recommendation 2: the essential action once absconding risk is identified is to assess capacity, ideally within a mental health triage tool. The triage question is 'Do you think this patient has the capacity to decide to leave?'. Recording a physical description and prioritised assessment are also recommended, but capacity assessment is the guideline-stated essential first action.", "type": "mcq"}, {"n": 3, "topic": "Restraint threshold", "stem": "A 78-year-old woman with delirium from urosepsis lacks capacity and repeatedly attempts to leave. Security physically restrain her under the MCA 2005. After what duration of physical restraint should chemical restraint (rapid tranquillisation) be administered?", "options": ["5 minutes", "10 minutes", "20 minutes", "30 minutes", "60 minutes"], "answer": 1, "exp": "[G] Guideline-stated: if restraint is needed for more than 10 minutes, chemical restraint (rapid tranquillisation) should be administered. Restraint must be clinically led, necessary, proportionate and in the patient's best interests, with its legal basis documented in the notes.", "type": "mcq"}, {"n": 4, "topic": "Deprivation of liberty", "stem": "A 45-year-old man with head injury and fluctuating confusion lacks capacity and is being prevented from leaving under s6 MCA 2005. His work-up will take 6–8 hours and he keeps trying to leave. Key legal issue?", "options": ["Restraint under s6 MCA 2005 remains lawful for the whole attendance", "He should be detained under s5(2) MHA 1983 by the ED consultant", "Keeping him for more than a short period likely amounts to a deprivation of liberty requiring formal authority", "Common law powers permit detention for up to 24 hours", "ED nursing staff can apply s5(4) MHA 1983"], "answer": 2, "exp": "[G] MCA s6 permits necessary and proportionate restraint, but if a patient must remain for more than a short period ('measured at most in hours') this goes beyond restraint and becomes a deprivation of liberty, lawful only with formal authority. s5(2) and s5(4) holding powers apply to admitted inpatients, not the ED.", "type": "mcq"}, {"n": 5, "topic": "ED and MHA powers", "stem": "A 30-year-old man with acute psychosis, not on any section, is attempting to leave. He is felt to lack capacity due to mental illness. Which correctly describes ED staff powers under the MHA 1983?", "options": ["The ED consultant can complete an emergency s4 application", "ED nurses can use the s5(4) holding power", "ED staff have no MHA detention powers; options are limited to requesting the police apply s136", "Security staff can detain under s136 within hospital grounds", "Two ED doctors can jointly detain under s2 pending psychiatric review"], "answer": 2, "exp": "[G] ED personnel do not have powers to detain under the MHA 1983; options are limited to requesting police assistance, as police can apply s136 in the ED. If the primary problem is mental illness, discuss with mental health liaison. In the interim, if he lacks capacity, MCA 2005 powers may justify restraint in his best interests.", "type": "mcq"}, {"n": 6, "topic": "Unsigned s2 paperwork", "stem": "A 24-year-old woman has been assessed under the MHA with medical recommendations completed for a s2 admission, but no bed identified and the application paperwork unsigned. She attempts to leave. Which statement is correct?", "options": ["She is already detained under s2 and can be restrained under the MHA", "The s2 recommendation does not apply until the paperwork is signed once a bed is identified; if she lacks capacity, restrain under the MCA 2005", "She must be allowed to leave as no legal framework applies", "The police must be called to apply s135", "Security may detain her under common law for up to 4 hours"], "answer": 1, "exp": "[G] Guideline-stated boundary point: a recommendation for s2 or s3 does not apply until the paperwork has been signed when a bed has been identified. Until then, restraint is only lawful under the MCA 2005 (if she lacks capacity, in her best interests) or via police s136 if she is not sectioned. s135 relates to a magistrate's warrant for removal from private premises.", "type": "mcq"}, {"n": 7, "topic": "Capacitous refusal", "stem": "A 28-year-old man with pleuritic chest pain and raised D-dimer awaiting CTPA wants to leave to collect his children. Formal assessment confirms capacity. He understands he may have a PE and could die. What should happen?", "options": ["Restrain him under s6 MCA 2005 as the decision is unwise", "Detain him under common law given the risk to life", "Respect his decision, document the discussion and offer a return plan", "Contact the police to return him if he leaves", "Ask security to delay him until senior review"], "answer": 2, "exp": "[G] The decision of a patient with capacity must be respected even if the clinician considers it unwise, provided it does not put others at immediate risk of significant harm. The guideline advises caution before concluding an apparently unwise decision was made with capacity — but once capacity is confirmed, his liberty prevails.", "type": "mcq"}, {"n": 8, "topic": "Common law", "stem": "An intoxicated man attempting to leave begins swinging a metal drip stand at staff and other patients. His capacity status is unknown. Legal basis for immediately intervening?", "options": ["Section 6 MCA 2005", "Section 136 MHA 1983", "Common law — preventing immediate risk of significant harm to others, irrespective of capacity", "Deprivation of Liberty Safeguards", "Intervention is unlawful until capacity is formally assessed"], "answer": 2, "exp": "[G] If a patient's actions put others at immediate risk of significant harm, it is lawful under common law to intervene to prevent that harm, irrespective of their capacity. MCA s6 applies only where the patient lacks capacity and restraint is in their own best interests; s136 is a police power. Capacity is irrelevant here — that's the trap.", "type": "mcq"}, {"n": 9, "topic": "Initial response", "stem": "A nurse discovers a 40-year-old man who presented after paracetamol overdose has absconded from the waiting room. What should the department do FIRST?", "options": ["Immediately telephone the police", "Search the ED and immediate surrounding area and undertake a thorough risk assessment", "Complete a DATIX incident form", "Send a discharge letter to the GP", "Contact the mental health liaison team"], "answer": 1, "exp": "[G] EDs should avoid immediately calling police and instead undertake a thorough risk assessment: search the ED and surrounding area, involve security and CCTV, call the patient's contact number, consider next of kin. Police involvement comes later and only if strict criteria are met — real and immediate risk to life AND proportionate police response AND vulnerability considered AND telephone contact failed AND no other person or service can return the patient.", "type": "mcq"}, {"n": 10, "topic": "Police powers", "stem": "Police locate a 52-year-old man with capacity who absconded before review of an abnormal ECG. He is safe at home and refuses to return. Not under arrest, not on s136, no marked vulnerability. What can the police do?", "options": ["Return him to the ED using reasonable force", "Apply s5(2) MHA 1983", "Detain him under the MCA 2005 on the ED's behalf", "They have no power to return him against his will", "Issue a community treatment order"], "answer": 3, "exp": "[G] Police do not have the power to bring patients back to the ED against their will unless the patient is under arrest, has been placed on s136, or is considered at risk and vulnerable (e.g. dementia, a child). None applies here, so his refusal stands. Alternatives: contact him directly, involve a relative if appropriate, inform the GP.", "type": "mcq"}, {"n": 11, "topic": "Return to ED", "stem": "A 19-year-old woman who absconded after presenting with suicidal ideation is brought back by police 3 hours later. What does RCEM recommend on her return?", "options": ["Resume the previous management plan from where it was interrupted", "Re-triage her, treat her as high risk for further absconding, and arrange prompt review preferably by a senior clinician", "Place her last in the queue as she left voluntarily", "Ask the police to remain with her until discharge", "Transfer her directly to the mental health unit"], "answer": 1, "exp": "[G] Returned patients should be re-triaged, considered high risk for further absconding, and seen promptly, preferably by a senior clinician. Their condition may have changed (e.g. alcohol or drug ingestion), so previous plans must be reviewed. Establish whether police presence reflects s136, arrest or mere accompaniment, and whether they intend to remain.", "type": "mcq"}, {"n": 12, "topic": "Safeguarding", "stem": "A 15-year-old boy awaiting assessm

al current and alkali cause liquefactive necrosis, and septal perforation can develop within hours. Arrange emergency removal (ENT).\n\n[C] Unilateral foul or blood-stained nasal discharge in a toddler should always prompt a search for a nasal foreign body, and a battery changes it from urgent to emergency.\n\n[C] This parallels the oesophageal button battery principle from the earlier set - location plus battery equals emergency.", "type": "mcq"}, {"n": 10, "topic": "Don't-miss paediatrics", "stem": "A 13-year-old with obesity presents with a 3-week history of a limp and pain felt mainly in the knee. On examination the affected leg is held externally rotated and internal rotation of the hip is restricted and painful. What is the most likely diagnosis and correct action?", "options": ["Growing pains - reassure and discharge", "Slipped upper femoral epiphysis - keep non-weight-bearing and refer urgently to orthopaedics", "Transient synovitis - mobilise and review", "A knee ligament injury - knee MRI", "Osgood-Schlatter disease - physiotherapy"], "answer": 1, "exp": "[C, UK practice] An adolescent (often overweight) with a limp, restricted and painful internal rotation of the hip, and an externally rotated leg has a slipped upper femoral epiphysis (SUFE) until proven otherwise. Keep the child non-weight-bearing and refer urgently to orthopaedics; confirm with AP and frog-leg lateral pelvic X-rays.\n\n[C] The crucial trap is that hip pathology frequently refers pain to the KNEE - examining only the knee misses the diagnosis. Always examine the joint above and below.\n\n[C] Delay or continued weight-bearing risks slip progression and avascular necrosis.", "type": "mcq"}]}, {"code": "EYE", "title": "Emergency Eye Care", "source": "RCOphth 2020 · NICE · BSR · CKS", "hue": "#38bdf8", "questions": [{"n": 1, "topic": "Chemical injury", "stem": "A 34-year-old builder attends the ED 10 minutes after cement powder entered his left eye. Severe pain and blurred vision. Visual acuity not yet recorded. Single most appropriate immediate action?", "options": ["Record visual acuity in both eyes", "Instil topical anaesthetic and begin copious irrigation with normal saline", "Test the pH of the conjunctival fornix", "Perform slit lamp examination with fluorescein", "Refer immediately to ophthalmology before any intervention"], "answer": 1, "exp": "[G] RCOphth commissioning guidance (2020): chemical injury is the one ocular emergency where treatment precedes full assessment. Irrigate after topical anaesthetic; acuity, pH and slit lamp follow. Cement is alkaline (liquefactive necrosis) — every minute of delay worsens prognosis.", "type": "mcq"}, {"n": 2, "topic": "Chemical injury", "stem": "Following prolonged irrigation of an alkali eye injury, when should pH be re-checked to confirm irrigation can stop?", "options": ["Immediately after stopping irrigation", "5 minutes after stopping irrigation", "At least 15 minutes after stopping irrigation", "30 minutes after the injury occurred", "Only if the patient remains symptomatic"], "answer": 2, "exp": "[G] RCOphth: test pH prior to, and at least 15 min after, cessation of irrigation. Retained particulate alkali (evert the lids) keeps releasing hydroxide, so an immediate post-irrigation pH can be falsely reassuring. Aim for stable pH 7.0–7.5.", "type": "mcq"}, {"n": 3, "topic": "Chemical injury", "stem": "Which chemical agent typically causes the most severe ocular injury?", "options": ["Hydrochloric acid (car battery)", "Petrol", "Sodium hydroxide (oven cleaner)", "Vinegar", "Chlorinated pool water"], "answer": 2, "exp": "[C] Alkalis (NaOH, lime/cement, ammonia) cause liquefactive necrosis and saponify membranes, penetrating the anterior chamber rapidly. Acids cause coagulative necrosis that limits penetration (hydrofluoric acid excepted). Alkali = worst prognosis.", "type": "mcq"}, {"n": 4, "topic": "Post-op endophthalmitis", "stem": "A 76-year-old woman, 4 days after routine cataract surgery, with 12h of increasing pain, marked reduced vision and a hypopyon. Within what timeframe from first healthcare contact should an ophthalmologist examine her (RCOphth)?", "options": ["Within 1 hour", "Within 4 hours", "Within 12 hours", "Within 24 hours", "Within 48 hours"], "answer": 1, "exp": "[G] RCOphth: suspected endophthalmitis must be seen on a slit lamp within FOUR hours of first contact — the tightest of the ten emergency presentations. Organisms can double in <30 min. Management is tap-and-inject. Most other true emergencies carry a 24h standard.", "type": "mcq"}, {"n": 5, "topic": "Post-op endophthalmitis", "stem": "A 70-year-old man, 3 days after intravitreal anti-VEGF injection, painful red eye, vision hand movements. Endophthalmitis suspected. Definitive initial treatment?", "options": ["Intensive hourly topical ofloxacin", "Intravenous ceftriaxone", "Vitreous sampling and intravitreal antibiotic injection", "Oral moxifloxacin and review in 24 hours", "Immediate pars plana vitrectomy in all cases"], "answer": 2, "exp": "[G] RCOphth: immediate sampling of intraocular fluids and intravitreal antibiotics ('tap and inject'). Topical/oral/IV routes do not reach adequate vitreous levels. Vitrectomy is reserved for selected cases, not universal.", "type": "mcq"}, {"n": 6, "topic": "GCA", "stem": "A 74-year-old woman with sudden painless loss of vision in the right eye, 2-week temporal headache, jaw claudication, scalp tenderness; pale swollen disc. Single most appropriate immediate management?", "options": ["Oral prednisolone 40 mg and rheumatology referral within 3 days", "Urgent temporal artery biopsy before starting treatment", "Intravenous methylprednisolone 500 mg–1 g immediately", "Aspirin 300 mg and referral to TIA clinic", "Await ESR and CRP before starting corticosteroids"], "answer": 2, "exp": "[G] GCA with visual loss (arteritic AION): IV methylprednisolone 500 mg–1 g daily up to 3 days (BSR / RCOphth). Never delay for biopsy or bloods — the fellow eye can be lost within hours. Biopsy still valid within ~2 weeks of starting steroids.", "type": "mcq"}, {"n": 7, "topic": "GCA", "stem": "A 68-year-old man, two episodes of transient monocular visual loss (5 min), new headache, scalp tenderness. Vision 6/6 bilaterally, CRP elevated. Most appropriate immediate treatment?", "options": ["Aspirin 300 mg alone and TIA clinic referral", "Oral prednisolone 60 mg daily started immediately", "IV methylprednisolone for 3 days", "Topical steroids and ophthalmology review within 24 hours", "No treatment until temporal artery ultrasound performed"], "answer": 1, "exp": "[G] BSR: suspected GCA WITHOUT established visual loss — start high-dose oral prednisolone (40–60 mg) immediately; amaurosis pushes to the higher end plus urgent same-day ophthalmology. IV methylprednisolone is for established visual loss. Don't delay steroids for imaging/biopsy.", "type": "mcq"}, {"n": 8, "topic": "Vascular occlusion", "stem": "A 62-year-old hypertensive man, 3h after sudden painless profound visual loss; pale retina with a cherry-red spot. Time window and what it mandates alongside ophthalmic referral?", "options": ["Within 24 hours; routine cardiovascular risk assessment", "Within 8 hours; management as a stroke equivalent with same-day stroke pathway", "Within 72 hours; outpatient carotid Doppler", "Within 8 hours; immediate thrombolysis in the ED", "Within 4 hours; intravitreal antibiotics"], "answer": 1, "exp": "[G] CRAO — RCOphth triage: seen within 8 hours. It is an ocular stroke: urgent stroke-pathway assessment (imaging, carotid, risk factors) and always consider GCA in over-50s. Thrombolysis is not standard UK practice outside trials.", "type": "mcq"}, {"n": 9, "topic": "Acute angle closure", "stem": "A 58-year-old long-sighted woman at night: severe left eye pain, headache, vomiting, haloes; red eye, hazy cornea, fixed mid-dilated pupil, IOP 56. Initial pharmacological management in the ED?", "options": ["Topical prednisolone alone and review in the morning", "IV acetazolamide 500 mg plus topical pilocarpine, beta-blocker and steroid", "IV mannitol as first-line monotherapy", "Topical atropine to relieve ciliary spasm", "High-flow oxygen and analgesia pending ophthalmology review"], "answer": 1, "exp": "[G] AACG (NICE CKS / RCOphth): lie flat, IV acetazolamide 500 mg plus topical pilocarpine 2% (pulls iris from the angle), a beta-blocker and steroid; analgesia/antiemetics. Mannitol is second-line. Atropine is contraindicated (worsens closure). Definitive = laser peripheral iridotomy.", "type": "mcq"}, {"n": 10, "topic": "Microbial keratitis", "stem": "A 24-year-old contact lens wearer, 24h painful red watering eye, reduced vision; corneal infiltrate with epithelial defect. Most appropriate management?", "options": ["Chloramphenicol ointment and GP follow-up", "Topical aciclovir five times daily", "Same-day ophthalmology referral for corneal scrape then hourly topical fluoroquinolone", "Pressure patching the eye with cycloplegic drops", "Oral flucloxacillin and review in 48 hours"], "answer": 2, "exp": "[G] Contact-lens microbial keratitis — sight-threatening. RCOphth: slit lamp within 24h, corneal scrape, then hourly topical fluoroquinolone; cover Acanthamoeba in lens wearers. Never patch an infected cornea; stop lens wear and keep lens/case for culture.", "type": "mcq"}, {"n": 11, "topic": "Penetrating trauma", "stem": "A 29-year-old hammering metal, sudden pain and reduced vision; small subconjunctival haemorrhage and a peaked teardrop pupil. Most appropriate imaging for intraocular foreign body?", "options": ["MRI orbits", "CT orbits (thin slice)", "Plain orbital X-ray only", "B-scan ocular ultrasound with firm probe pressure", "No imaging — proceed straight to theatre"], "answer": 1, "exp": "[G] Metal-on-metal is the classic ferrous IOFB mechanism. Thin-slice CT orbits is investigation of choice. MRI is contraindicated with possible metallic IOFB; ultrasound needs globe pressure (avoid on suspected open globe). RCOphth: assess and repair within 24h.", "type": "mcq"}, {"n": 12, "topic": "Penetrating trauma", "stem": "A confirmed open globe injury awaiting transfer for repair. Most appropriate ED management step?", "options": ["Apply a firm pressure pad to prevent extrusion", "Instil topical chloramphenicol ointment", "Place a rigid shield over the eye, give antiemetics and analgesia, keep nil by mouth", "Attempt removal of any visible protruding foreign body", "Measure intraocular pressure to complete the assessment"], "answer": 2, "exp": "[G] Open globe: rigid shield on the orbital rim (never a pressure pad), antiemetics (vomiting raises IOP), analgesia, tetanus, NBM, IV antibiotics per policy. Don't remove protruding FBs, instil ointments, or measure IOP. Repair within 24h (RCOphth).", "type": "mcq"}, {"n": 13, "topic": "Retrobulbar haemorrhage", "stem": "A 45-year-old with blunt facial trauma: tense proptosed eye, vision hand movements, RAPD, IOP 52. CT awaited. Single most appropriate next step?", "options": ["Wait for CT orbits before intervening", "IV acetazolamide and reassess in one hour", "Immediate lateral canthotomy and inferior cantholysis in the ED", "Urgent transfer to a tertiary ophthalmic unit for decompression", "High-dose IV methylprednisolone"], "answer": 2, "exp": "[C/RCEM] Orbital compartment syndrome — minutes count; irreversible loss in 60–120 min. Lateral canthotomy and cantholysis is a core RCEM ED procedure done immediately on clinical grounds, never delayed for imaging/transfer. Medical IOP-lowering is adjunct only.", "type": "mcq"}, {"n": 14, "topic": "Orbital cellulitis", "stem": "A 19-year-old, 2 days periorbital swelling and fever after sinusitis: proptosis, painful restricted eye movements, reduced colour vision. Most appropriate immediate management?", "options": ["Oral co-amoxiclav and review in 24 hours", "Immediate empirical IV antibiotics, then urgent CT and same-day ophthalmology/ENT referral", "CT orbits first; withhold antibiotics until imaging confirms", "Topical chloramphenicol and nasal decongestants", "Discharge with safety netting as this is preseptal"], "answer": 1, "exp": "[G] Proptosis, painful/restricted movements and impaired colour vision = ORBITAL cellulitis. RCOphth: start empirical IV antibiotics immediately, BEFORE imaging; CT then assesses for abscess; ophthalmology within 24h, ENT if sinus disease. Risks: blindness, cavernous sinus thrombosis, death.", "type": "mcq"}, {"n": 15, "topic": "Retinal detachment", "stem": "A 55-year-old myopic man, 3 days of flashes and floaters, now a 'curtain' over the lower field; central vision 6/6. Most appropriate management?", "options": ["Routine optometrist review within 2 weeks", "Same-day referral to ophthalmology/vitreoretinal service", "Reassure — this is posterior vitreous detachment", "Ophthalmology referral within one week as the macula is unaffected", "Start topical steroids and review in 48 hours"], "answer": 1, "exp": "[G] Field defect with flashes/floaters = retinal detachment. Preserved central acuity means macula-ON — the MOST urgent scenario, as prompt surgery preserves central vision (RCOphth/BEAVRS same-day). Flashes/floaters WITH a field defect always mandate same-day referral.", "type": "mcq"}, {"n": 16, "topic": "Scleritis", "stem": "A 47-year-old woman with RA, 4 days of severe boring left eye pain waking her at night, radiating to jaw; exquisitely tender globe, deep bluish-red injection not blanching with phenylephrine. Most appropriate management?", "options": ["Topical lubricants and reassurance — this is episcleritis", "Topical chloramphenicol for infective conjunctivitis", "Same-day ophthalmology referral for systemic anti-inflammatory treatment", "Oral aciclovir for presumed zoster", "Routine rheumatology clinic letter"], "answer": 2, "exp": "[G] Pain waking the patient is one of RCOphth's ten emergency presentations — classic scleritis. Non-blanching deep injection distinguishes it from episcleritis. RCOphth: slit lamp within 24h; systemic NSAIDs/steroids and assessment for systemic disease. Untreated risks scleral melt and perforation.", "type": "mcq"}, {"n": 17, "topic": "Uveitis", "stem": "A 32-year-old man with ankylosing spondylitis: painful photophobic red eye, blurred vision; pain in the LEFT eye when light is shone into the RIGHT eye. Diagnosis and pathway?", "options": ["Bacterial conjunctivitis — topical chloramphenicol from the ED", "Anterior uveitis — ophthalmology review within 24 hours for topical steroids and cycloplegia", "Anterior uveitis — start topical steroids in the ED without ophthalmic review", "Acute angle closure — IV acetazolamide", "Keratitis — hourly ofloxacin"], "answer": 1, "exp": "[G] Consensual photophobia is highly specific for anterior uveitis (HLA-B27 association). RCOphth: slit lamp and dilated exam, topical steroids and cycloplegics within 24h. Steroids should NOT be started blind in the ED — a dendritic ulcer must be excluded first.", "type": "mcq"}, {"n": 18, "topic": "Herpetic eye disease", "stem": "A 70-year-old woman, 2-day vesicular V1 rash including vesicles on the nose tip, red watering eye. Significance of the nasal vesicles and management?", "options": ["No significance; topical chloramphenicol", "Hutchinson's sign — high risk of ocular involvement; start oral aciclovir and refer for ophthalmic assessment", "Bacterial superinfection; oral flucloxacillin", "Orbital cellulitis; IV ceftriaxone", "Pathognomonic of HSV keratitis; topical aciclovir alone"], "answer": 1, "exp": "[C/CKS] Hutchinson's sign (nasociliary branch of V1) predicts ocular involvement in herpes zoster ophthalmicus. Start oral aciclovir 800 mg five times daily 7–10 days, ideally within 72h of rash, and refer for ophthalmic assessment. Complications: keratitis, uveitis, glaucoma, PHN.", "type": "mcq"}, {"n": 19, "topic": "Herpetic eye disease", "stem": "A 40-year-old woman with a painful red eye; fluorescein shows a branching corneal lesion with terminal bulbs. Which treatment would most worsen this if given inappropriately?", "options": ["Topical aciclovir", "Topical lubricants", "Topical corticosteroids", "Oral analgesia", "Cycloplegic drops"], "answer": 2, "exp": "[C] A dendritic ulcer is HSV keratitis, treated with topical antivirals. Topical steroids on an unrecognised dendritic ulcer cause geographic ulceration, melt and perforation — the reason UK practice is to exclude epithelial herpetic disease on slit lamp before any steroid for a red eye.", "type": "mcq"}, {"n": 20, "topic": "Post-surgical eye", "stem": "A 63-year-old man, corneal graft 18 months ago, 2 days of painful red eye and reduced vision. Most appropriate action?", "options": ["Treat as conjunctivitis; he is beyond the risk period", "Same-day ophthalmology referral for suspected graft rejection requiring intensive topical steroids", "Routine corneal clinic within 2 weeks", "Oral antibiotics and GP review", "Topical antihistamines for suture allergy"], "answer": 1, "exp": "[G] Graft rejection can occur AT ANY TIME after surgery — RCOphth lists 'painful loss of vision after graft/glaucoma surgery at any time' among its ten emergencies, needing slit lamp within 24h. Treat with immediate intensive topical steroids; any red/painful post-graft eye is rejection until proven otherwise.", "type": "mcq"}, {"n": 21, "topic": "Neuro-ophthalmology", "stem": "A 52-year-old woman, sudden severe headache, right ptosis, 'down and out' eye; dilated unreactive right pupil. Most appropriate next step?", "options": ["Refer to ophthalmology within 24 hours for orthoptics", "Immediate CT/CT angiography to exclude a posterior communicating artery aneurysm", "Check HbA1c and outpatient neurology — likely microvascular", "Prescribe an eye patch and review in one week", "Lumbar puncture as first investigation"], "answer": 1, "exp": "[C] Painful third nerve palsy WITH pupil involvement is a PCom aneurysm until proven otherwise (superficial parasympathetic fibres compressed early; microvascular palsies are pupil-sparing). Immediate CT + CTA. LP follows CT if SAH suspected and CT negative.", "type": "mcq"}, {"n": 22, "topic": "Orbital trauma", "stem": "A 14-year-old struck by a football: minimal bruising but marked pain and diplopia on upgaze, nausea, vomiting, an episode of bradycardia; CT shows an orbital floor fracture. Most appropriate management?", "options": ["Discharge with sinus precautions and routine maxfax follow-up in 2 weeks", "Urgent surgical referral — 'white-eyed blowout' with muscle entrapment needs early repair", "Observe 10–14 days to let swelling settle", "Oral antibiotics only", "Ophthalmology review only if vision deteriorates"], "answer": 1, "exp": "[C] 'White-eyed blowout': elastic paediatric floor traps inferior rectus with little external sign; vomiting/pain on movement/bradycardia = oculocardiac reflex. Needs urgent (24–48h) surgical release — delay causes permanent diplopia. Advise no nose-blowing (orbital emphysema).", "type": "mcq"}, {"n": 23, "topic": "Orbital trauma", "stem": "A 25-year-old, blunt squash-ball trauma: blood filling one third of the anterior chamber; vision 6/12. Most appropriate management?", "options": ["Discharge with topical chloramphenicol and GP follow-up", "Same-day ophthalmology referral, with advice to rest and avoid NSAIDs", "Aspiration of the hyphaema in the ED", "Firm double eye pad and review in 48 hours", "Routine clinic referral within 2 weeks"], "answer": 1, "exp": "[G] Traumatic hyphaema needs same-day ophthalmic assessment (RCOphth 'same day' triage). Risks: secondary haemorrhage (days 2–5), raised IOP with corneal staining, and associated globe injury. Head elevation, rest, avoid NSAIDs/antiplatelets, IOP monitoring; check sickle status.", "type": "mcq"}, {"n": 24, "topic": "Sudden painless visual loss", "stem": "A 68-year-old hypertensive woman, sudden painless blurring; widespread flame haemorrhages in all quadrants, dilated tortuous veins, cotton wool spots — 'stormy sunset'. Diagnosis and referral pathway?", "options": ["Central retinal artery occlusion — see within 8 hours", "Central retinal vein occlusion — ophthalmology referral (typically within 1–2 days per UK triage tools)", "Wet AMD — 2-week wait", "Vitreous haemorrhage — same-day vitreoretinal", "Hypertensive retinopathy — GP BP management only"], "answer": 1, "exp": "[G] 'Blood and thunder' fundus = CRVO. UK triage tools place CRVO/BRVO in the 1–2 day category — urgent but not minutes-critical like CRAO. Ophthalmology assesses for macular oedema and ischaemia. Distinguish from CRAO (pale retina, cherry-red spot, stroke pathway, 8h).", "type": "mcq"}, {"n": 25, "topic": "Sudden painless visual loss", "stem": "A 71-year-old man, single painless monocular loss 'like a shutter' 4 min with full recovery; normal exam/fundoscopy, no GCA features, normal inflammatory markers. Most appropriate management?", "options": ["Reassure and discharge", "High-dose oral prednisolone for GCA", "Treat as TIA: aspirin 300 mg and specialist TIA clinic within 24 hours", "Routine ophthalmology outpatient referral", "Urgent MRI orbits"], "answer": 2, "exp": "[G] Amaurosis fugax without inflammatory features = retinal TIA. NICE NG128: aspirin 300 mg immediately and specialist assessment within 24h; don't use ABCD2 to delay. Carotid imaging follows. Always exclude GCA in over-50s (negative here).", "type": "mcq"}, {"n": 26, "topic": "Endophthalmitis (glaucoma surgery)", "stem": "A 66-year-old woman, trabeculectomy 4 years ago, painful red eye, reduced vision, whitish inflamed bleb superiorly. Most likely diagnosis?", "options": ["Allergic conjunctivitis", "Bleb-related endophthalmitis", "Episcleritis", "Recurrent angle closure", "Suture abscess of no significance"], "answer": 1, "exp": "[G] Bleb-related endophthalmitis follows filtration surgery and — per RCOphth — can occur at ANY time (the thin-walled bleb is a lifelong portal). Management mirrors post-op endophthalmitis: urgent slit lamp, sampling, intravitreal antibiotics. Any painful red eye in a trabeculectomy patient is bleb infection until proven otherwise.", "type": "mcq"}, {"n": 27, "topic": "Corneal FB / minor trauma", "stem": "A 30-year-old welder at 2 am: severe bilateral eye pain, watering, photophobia 6h after welding without protection; diffuse bilateral punctate staining. Most appropriate management?", "options": ["Same-night ophthalmology referral for bilateral keratitis", "Topical anaesthetic drops to take home for pain relief", "Oral analgesia, lubricant ointment ± cycloplegic, with reassurance of recovery within 24–48 hours", "Hourly topical ofloxacin and corneal scrape", "Urgent CT orbits for foreign bodies"], "answer": 2, "exp": "[C/CKS] Photokeratitis ('arc eye'): UV injury with a 6–12h latent period. Supportive care — oral analgesia, lubricants, consider cycloplegic and chloramphenicol ointment; heals in 24–48h. Never dispense topical anaesthetics for home use (impairs healing, masks warning signs).", "type": "mcq"}, {"n": 28, "topic": "Papilloedema", "stem": "A 28-year-old woman, BMI 38, daily headaches worse on waking, transient visual obscurations; bilateral swollen discs, normal acuity. Most appropriate next step?", "options": ["Discharge with migraine advice", "Urgent neuroimaging before consideration of lumbar puncture", "Lumbar puncture as first investigation", "Start acetazolamide in the ED and refer routinely", "Ophthalmology outpatient within 2 weeks"], "answer": 1, "exp": "[C] Bilateral disc swelling with headache = papilloedema until proven otherwise. Although IIH is likely, exclude a mass and venous sinus thrombosis first: urgent neuroimaging (CT ± CT/MR venography) BEFORE LP (LP with a mass risks herniation). LP with opening pressure follows normal imaging.", "type": "mcq"}, {"n": 29, "topic": "Triage & pathways", "stem": "Per RCOphth commissioning guidance, true emergency eye conditions should be seen, diagnosed and have treatment initiated by an ophthalmic specialist within what timeframe?", "options": ["1 hour", "4 hours", "12 hours", "24 hours", "72 hours"], "answer": 3, "exp": "[G] The central RCOphth (2020) standard: all true emergencies seen, diagnosed and treated within 24 HOURS. Tighter internal targets exist — endophthalmitis 4h, CRAO 8h, chemical injury and retrobulbar haemorrhage immediately. Knowing which break the 24h default is high-yield.", "type": "mcq"}, {"n": 30, "topic": "Triage & pathways", "stem": "Which presentation does NOT require same-day emergency ophthalmic assessment?", "options": ["Painless loss of vision 3h ago with a cherry-red spot", "Painful red eye in a corneal graft recipient", "Severe eye pain waking the patient with a tender globe", "Recurrent bilateral zigzag lines lasting 20 minutes then headache, normal exam", "Sudden binocular diplopia with new headache"], "answer": 3, "exp": "[G] Bilateral positive visual phenomena (~20 min) with subsequent headache = migraine with aura — UK triage routes this to primary care. Bilaterality and the march distinguish cortical from retinal (monocular) pathology. The others are true emergencies (CRAO 8h; graft 24h; scleritis 24h; diplopia+headache immediate).", "type": "mcq"}, {"n": 31, "topic": "Acute angle closure", "stem": "Which commonly prescribed medication class is most likely to precipitate acute angle closure in a predisposed patient?", "options": ["Beta-blockers", "ACE inhibitors", "Anticholinergics and drugs with antimuscarinic effects (e.g. tricyclics, oxybutynin)", "Statins", "Proton pump inhibitors"], "answer": 2, "exp": "[C/BNF] Pupil-dilating drugs precipitate closure in predisposed (hypermetropic, shallow AC) eyes: anticholinergics/antimuscarinics (tricyclics, oxybutynin, hyoscine, nebulised ipratropium), sympathomimetics, topical mydriatics. Topiramate does so by a different mechanism (ciliochoroidal effusion). Beta-blockers TREAT it.", "type": "mcq"}]}, {"code": "MEN", "title": "Bacterial Meningitis", "source": "NICE NG240 (2024) · MHRA", "hue": "#2dd4bf", "questions": [{"n": 1, "topic": "Meningitis (NG240)", "stem": "A 27-year-old man arrives in the ED at 02:10 with fever, severe headache, neck stiffness and confusion. Blood cultures, FBC, CRP, glucose and whole-blood PCR have been sent. It is now 02:55. The medical registrar can perform a lumbar puncture, but the procedure trolley and a second clinician will not be available for at least another 45 minutes. He is haemodynamically stable, GCS 14, with no focal neurology. What is the most appropriate next step?", "options": ["Wait for the lumbar puncture to be performed, then give IV ceftriaxone", "Give IV ceftriaxone now and perform the lumbar puncture as soon as it is safe to do so", "Arrange a CT head, then lumbar puncture, then antibiotics", "Give oral doxycycline while awaiting the lumbar puncture", "Give IV ceftriaxone only once CSF Gram stain confirms organisms"], "answer": 1, "exp": "[G] NICE NG240: give IV antibiotics as soon as bacterial meningitis is suspected and within 1 hour of arrival, after blood samples and LP — but only if the LP will not cause a clinically significant delay. A 45-minute wait at the 45-minute mark breaches the 1-hour target.\n\n[G] If antibiotics are given before LP, perform the LP as soon as possible afterwards (if safe). The LP is deferred, not abandoned.\n\n[G] Do not routinely image before LP, so C is wrong on two counts.\n\n[C] Doxycycline has no role in empirical bacterial meningitis, and waiting for Gram stain is an unsafe delay.\n\nBoundary point: the 1-hour antibiotic clock is the hard target; LP timing is flexible around it.", "type": "mcq"}, {"n": 2, "topic": "Meningitis (NG240)", "stem": "A 41-year-old woman has strongly suspected bacterial meningitis. She has fever, headache, neck stiffness and confusion. Pupils are equal and reactive, there is no focal deficit, no seizure activity, and no history of immunosuppression or malignancy. The ED consultant is asked whether a CT head is required before lumbar puncture. Which single feature, if present, would make neuroimaging necessary before lumbar puncture?", "options": ["Temperature of 39.4°C", "Neck stiffness with photophobia", "CRP greater than 200 mg/L", "A Glasgow Coma Scale score of 9 or less", "Age over 60 years"], "answer": 3, "exp": "[G] NICE NG240: do NOT routinely image before LP. Image only for risk factors of an evolving space-occupying lesion, or features suggesting raised ICP: new focal neurological features (including seizures or posturing), abnormal pupillary reactions, GCS 9 or less, or a progressive/rapid fall in consciousness.\n\n[G] Take bloods, give antibiotics and stabilise BEFORE imaging — imaging never delays the antibiotic.\n\n[C] Fever height, meningism, CRP value and age are not imaging triggers. The threshold is GCS ≤9 (not ≤13, not ≤8).\n\nNG240 moved practice towards LESS imaging, because CT-first delays antibiotics and worsens outcomes.", "type": "mcq"}, {"n": 3, "topic": "Meningitis (NG240)", "stem": "A 19-year-old university student presents with fever, headache, confusion and a purpuric rash across the trunk and limbs which has visibly spread over the last 30 minutes. Blood pressure is 88/50 mmHg. Coagulation screen is normal. The FY2 asks when the lumbar puncture should be performed. What is the most appropriate approach to lumbar puncture?", "options": ["Perform the lumbar puncture as soon as antibiotics have been given", "Perform the lumbar puncture after a normal CT head", "Perform the lumbar puncture after a platelet transfusion", "Perform the lumbar puncture under general anaesthesia in theatre", "Do not perform a lumbar puncture; treat and diagnose on clinical features and blood tests"], "answer": 4, "exp": "[G] NICE NG240: do NOT perform an LP if there is extensive or rapidly spreading purpura, infection at the LP site, risk factors for an evolving space-occupying lesion, or features of raised ICP. Rapidly spreading purpura is an independent contraindication in its own right — it does not depend on the clotting screen.\n\n[G] Confirm meningococcal disease on blood results plus clinical features (blood culture, WCC, CRP/PCT, lactate, whole-blood PCR). CSF is not required to make this diagnosis.\n\n[G] Shock must be treated and stabilised before any LP anyway.\n\n[C] A normal platelet count/coagulation screen is irrelevant here — the contraindication is the purpura itself and the instability.", "type": "mcq"}, {"n": 4, "topic": "Meningitis (NG240)", "stem": "A 6-year-old is brought to a rural GP surgery with fever, headache, neck stiffness and drowsiness. Bacterial meningitis is strongly suspected. The nearest emergency department is 70 minutes away by road and no air ambulance is available. There is no history of allergy. What is the most appropriate management before transfer?", "options": ["Give intramuscular or intravenous ceftriaxone or benzylpenicillin now and transfer as an emergency", "Transfer immediately as an emergency without giving antibiotics", "Give oral amoxicillin and transfer as an emergency", "Await the ambulance and treat only if the child deteriorates en route", "Give intramuscular dexamethasone before transfer"], "answer": 0, "exp": "[G] NICE NG240: if there is likely to be a clinically significant delay in transfer for STRONGLY suspected bacterial meningitis, give IV or IM ceftriaxone or benzylpenicillin outside hospital. A 70-minute road transfer is such a delay.\n\n[G] The counterweight: do NOT delay transfer in order to give antibiotics. Pre-hospital antibiotics accompany emergency transfer, never replace it.\n\n[G] Withhold pre-hospital antibiotics only if there is severe allergy to both ceftriaxone and benzylpenicillin.\n\n[C] Oral antibiotics have no role. Dexamethasone is an in-hospital decision, not pre-hospital.\n\nBoundary point: the decision hinges on 'strongly suspected' AND transfer time. Short transfer → just go.", "type": "mcq"}, {"n": 5, "topic": "Meningitis (NG240)", "stem": "A 78-year-old woman with type 2 diabetes presents with confusion, fever and neck stiffness. Bacterial meningitis is strongly suspected. Blood cultures have been taken and LP is being arranged. She has no drug allergies. The causative organism is not yet known. What is the most appropriate initial intravenous antibiotic regimen?", "options": ["Ceftriaxone alone", "Benzylpenicillin plus gentamicin", "Ceftriaxone plus amoxicillin", "Meropenem alone", "Ceftriaxone plus vancomycin"], "answer": 2, "exp": "[G] NICE NG240: when the organism is unknown, give IV ceftriaxone at the highest dose (cefotaxime if ceftriaxone contraindicated).\n\n[G] Add IV amoxicillin for people with risk factors for Listeria monocytogenes: very old or very young, pregnancy, cancer, kidney disease, liver disease, DIABETES, alcohol misuse, immunosuppressive drugs. This patient has two (age 78, diabetes).\n\n[C] Listeria is intrinsically resistant to third-generation cephalosporins — hence the amoxicillin add-on.\n\n[C] Vancomycin add-on is a US/IDSA convention for resistant pneumococcus, NOT the NICE recommendation. Meropenem is only for coliform meningitis on specialist advice.\n\nScan for pregnancy, alcohol, diabetes, immunosuppression, malignancy, CKD/liver disease — not just age.", "type": "mcq"}, {"n": 6, "topic": "Meningitis (NG240)", "stem": "A 33-year-old man has strongly suspected bacterial meningitis. He has a clearly documented episode of anaphylaxis to ceftriaxone two years ago requiring intensive care admission. He has no risk factors for Listeria monocytogenes. What is the most appropriate antibiotic?", "options": ["Cefotaxime", "Ceftriaxone with antihistamine and steroid cover", "Co-trimoxazole", "Benzylpenicillin", "Chloramphenicol"], "answer": 4, "exp": "[G] NICE NG240: ask about the nature of the reaction. Non-severe allergy → still give ceftriaxone. Severe allergic reaction → chloramphenicol for most organisms or when the cause is unknown. Severe allergy PLUS Listeria risk → co-trimoxazole and chloramphenicol.\n\n[C] Cefotaxime is another third-generation cephalosporin — it does not avoid cross-reactivity after ceftriaxone anaphylaxis. It is the alternative for CONTRAINDICATION (pre-term neonates, calcium co-administration), not for severe allergy.\n\n[C] Co-trimoxazole alone does not cover the main pathogens; it is the Listeria-specific add-on.\n\nBoundary point: severity of the reaction switches the answer, not the presence of allergy per se.", "type": "mcq"}, {"n": 7, "topic": "Meningitis (NG240)", "stem": "A 45-year-old man is transferred from a district general hospital. IV ceftriaxone was started there 6 hours ago. CSF obtained after antibiotics shows a neutrophil pleocytosis, high protein and a low CSF:blood glucose ratio, and bacterial meningitis is now confirmed clinically. He has not received any corticosteroid. What is the most appropriate management of dexamethasone?", "options": ["Withhold dexamethasone because antibiotics have already been started", "Give intravenous dexamethasone as soon as possible now", "Give dexamethasone only if pneumococcus is subsequently confirmed", "Give dexamethasone 24 hours after the antibiotics were started", "Get infection specialist advice before giving any dexamethasone"], "answer": 1, "exp": "[G] NICE NG240: give the first dexamethasone dose with or before the first antibiotic if possible; do NOT delay antibiotics for it. If dexamethasone is delayed LESS than 12 hours after antibiotics → give as soon as possible. If MORE than 12 hours → get infection specialist advice.\n\nAt 6 hours he is inside the 12-hour window, so give it now.\n\n[G] Dexamethasone is for people over 3 months with strongly suspected or confirmed bacterial meningitis — it does not require organism confirmation first. Once the organism is known, continue for pneumococcus or Hib, stop for everything else.\n\n[C] The evidence came from studies giving steroid before/with antibiotics and none beyond 12 hours — hence the rule.", "type": "mcq"}, {"n": 8, "topic": "Meningitis (NG240)", "stem": "A 52-year-old woman was admitted overnight with confusion and fever and was started on IV ceftriaxone 18 hours ago. Bacterial meningitis is now confirmed on CSF. Dexamethasone was never prescribed. She remains drowsy. What is the most appropriate management of corticosteroid therapy?", "options": ["Give high-dose intravenous dexamethasone immediately", "Dexamethasone is absolutely contraindicated at this point", "Give hydrocortisone instead of dexamethasone", "Get infection specialist advice on whether dexamethasone is still likely to provide benefit", "Give dexamethasone only if her GCS deteriorates further"], "answer": 3, "exp": "[G] NICE NG240: if dexamethasone is delayed MORE than 12 hours after the start of antibiotics, get advice from an infection specialist on whether it is still likely to benefit.\n\n[G] This is a judgement, not a prohibition: current practice is not to give steroid beyond 12 hours, but there was no evidence for or against it, and there are situations where it would benefit. Hence 'discuss', not 'never'.\n\n[C] The classic pairing with the previous question — two sides of the same 12-hour threshold: <12 h → give as soon as possible (your decision); >12 h → infection specialist advice (escalate).\n\n[C] Hydrocortisone substitution has no basis; the evidence is for high-dose dexamethasone.", "type": "mcq"}, {"n": 9, "topic": "Meningitis (NG240)", "stem": "A 24-year-old man was started on IV ceftriaxone and IV dexamethasone for strongly suspected bacterial meningitis. On day 2, both CSF PCR and blood culture confirm Neisseria meningitidis. He is improving. What is the most appropriate management of the dexamethasone?", "options": ["Stop the dexamethasone", "Continue dexamethasone for a full 4-day course", "Continue dexamethasone at half the current dose", "Switch to oral prednisolone to complete the course", "Continue dexamethasone and add fludrocortisone"], "answer": 0, "exp": "[G] NICE NG240: when the organism is found, CONTINUE dexamethasone if it is Streptococcus pneumoniae or Haemophilus influenzae type b; STOP for all other organisms. Neisseria meningitidis is 'all other organisms' → stop.\n\n[G] If NO organism is found, get infection specialist advice on whether to continue.\n\n[G] Do not routinely give corticosteroids in meningococcal disease at all — high-dose dexamethasone increased mortality in children/young people with meningococcal disease.\n\n[C] Mnemonic: steroid stays only for the two organisms with the strongest hearing/mortality benefit — pneumococcus and Hib. Everything else (meningococcus, listeria, GBS, coliforms) gets it stopped.", "type": "mcq"}, {"n": 10, "topic": "Meningitis (NG240)", "stem": "A 20-year-old woman with confirmed meningococcal septicaemia is in intensive care. She remains profoundly hypotensive despite fluid resuscitation and high-dose noradrenaline and adrenaline infusions. She has a widespread purpuric rash and multi-organ dysfunction. What is the most appropriate corticosteroid strategy?", "options": ["High-dose intravenous dexamethasone", "Corticosteroids are contraindicated in all meningococcal disease", "Pulsed intravenous methylprednisolone", "A single high-dose hydrocortisone bolus only, then stop", "Consider low-dose replacement corticosteroids"], "answer": 4, "exp": "[G] NICE NG240: do NOT routinely give corticosteroids in meningococcal disease. But CONSIDER low-dose replacement corticosteroids for meningococcal septic shock not responding to high-dose vasoactive agents — precisely this patient.\n\n[G] High-dose dexamethasone increased mortality in babies, children and young people with meningococcal disease, so it is off the table — but low-dose replacement steroid for catecholamine-refractory shock remains an option.\n\n[C] Two distinct ideas: high-dose anti-inflammatory dexamethasone (for pneumococcal/Hib MENINGITIS) versus low-dose replacement steroid for refractory septic shock. Option B overstates it — 'not routinely' is not 'never'.", "type": "mcq"}, {"n": 11, "topic": "Meningitis (NG240)", "stem": "A 6-week-old term baby is admitted with fever, poor feeding, a bulging fontanelle and reduced responsiveness. Bacterial meningitis is strongly suspected and IV antibiotics are being drawn up. The registrar asks about corticosteroids. What is the most appropriate management regarding dexamethasone?", "options": ["Give intravenous dexamethasone with the first dose of antibiotics", "Give dexamethasone only once pneumococcus is confirmed", "Get infection specialist advice on using dexamethasone", "Dexamethasone is contraindicated in anyone under 3 months of age", "Give oral prednisolone instead of dexamethasone"], "answer": 2, "exp": "[G] NICE NG240 age bands for dexamethasone: over 3 months → give IV dexamethasone; 28 days to 3 months → GET INFECTION SPECIALIST ADVICE; 28 days or under → not recommended (research recommendation instead). A 6-week-old sits in the 28 days–3 months band → escalate for advice.\n\n[G] Rationale: no evidence supporting or refuting dexamethasone between 28 days and 3 months, so specialist input is required rather than a blanket rule.\n\n[C] Option D overstates it — this is uncertainty, not contraindication.\n\n[G] In March 2024 all uses of dexamethasone in this section were off-label. The two age thresholds (28 days / 3 months) are the examinable numbers.", "type": "mcq"}, {"n": 12, "topic": "Meningitis (NG240)", "stem": "A 38-year-old man presents with fever, headache, neck stiffness and confusion. There is no seizure activity, no focal neurological deficit, no personality or behavioural change, and no history of cold sores or immunosuppression. Bacterial meningitis is strongly suspected and IV ceftriaxone has been given within the hour. What is the most appropriate management regarding aciclovir?", "options": ["Give IV aciclovir to all patients with suspected bacterial meningitis", "Give IV aciclovir until the CSF herpes simplex PCR is negative", "Give oral valaciclovir until CSF results return", "Do not routinely give aciclovir unless herpes simplex encephalitis is strongly suspected", "Give aciclovir only if dexamethasone is being used"], "answer": 3, "exp": "[G] NICE NG240: do NOT routinely give IV aciclovir unless herpes simplex encephalitis is strongly suspected.\n\n[C] A deliberate boundary against adding aciclovir to every 'fever plus confusion' patient. Features shifting suspicion to HSV encephalitis are altered behaviour/personality change, new seizures, focal neurology (especially temporal lobe), and progressive confusion out of proportion to meningism — none present here.\n\n[G] Continue the initial antibiotic until blood and CSF results suggest otherwise. So continue ceftriaxone and reassess on results, not empirical antiviral cover.\n\n[C] Oral valaciclovir has no role in suspected CNS infection — CNS penetration requires IV aciclovir.", "type": "mcq"}, {"n": 13, "topic": "Meningitis (NG240)", "stem": "A 2-year-old with confirmed bacterial meningitis is receiving an intravenous ceftriaxone infusion. She develops a seizure and is found to have symptomatic hypocalcaemia requiring intravenous calcium gluconate. She currently has a single peripheral cannula in situ. What is the most appropriate action?", "options": ["Give the calcium gluconate through the same cannula alongside the ceftriaxone infusion", "Do not co-administer calcium with ceftriaxone; obtain separate access with separated administration and discuss switching to cefotaxime", "Stop all antibiotics until the calcium has been corrected", "Give oral calcium supplementation only until the ceftriaxone course is complete", "Withhold calcium replacement until the ceftriaxone course finishes"], "answer": 1, "exp": "[G] NICE NG240 carries a March 2024 MHRA safety flag: ceftriaxone is INCOMPATIBLE with calcium-containing solutions. Ceftriaxone–calcium precipitates have caused fatal pulmonary and renal events, particularly in neonates.\n\n[G] Cefotaxime is the alternative wherever ceftriaxone is contraindicated.\n\n[C] Symptomatic hypocalcaemia with seizure is a life threat and must be treated — options C, D and E all fail the patient.\n\n[C] Practical answer: separate line/separated administration with adequate flushing, and switch to cefotaxime if calcium-containing fluids will be needed repeatedly.\n\n[G] Ceftriaxone is also contraindicated in pre-term babies under 41 weeks corrected gestational age.", "type": "mcq"}, {"n": 14, "topic": "Meningitis (NG240)", "stem": "A 9-year-old boy has confirmed pneumococcal meningitis and is on the paediatric ward. He is alert, euvolaemic and tolerating oral fluids. Serum sodium is 133 mmol/L. There are no signs of raised intracranial pressure or fluid overload. The FY1 asks whether he should be fluid restricted. What is the most appropriate fluid management?", "options": ["Restrict fluid intake to 50–60% of routine maintenance", "Restrict to two-thirds maintenance given intravenously", "Give routine maintenance fluids, orally or by enteral tube if tolerated", "Give intravenous 0.45% sodium chloride at 1.5 times maintenance", "Fluid restrict and give hypertonic saline"], "answer": 2, "exp": "[G] NICE NG240: do NOT routinely restrict fluid intake below routine maintenance in bacterial meningitis. Give maintenance fluids orally or by enteral tube if tolerated.\n\n[G] Why the change: fluid restriction reduced pulmonary/facial oedema but INCREASED neurological impairment and epilepsy. The committee prioritised neurological outcome, so routine restriction was dropped. 'Routinely' was deliberate — restriction is still appropriate in genuine fluid overload.\n\n[C] Mild hyponatraemia in meningitis is common and not on its own an indication to restrict. Isotonic fluids are used if IV fluids are needed; hypotonic 0.45% saline above maintenance is the wrong direction.\n\nThis reverses old teaching about routine two-thirds maintenance — a high-yield update.", "type": "mcq"}, {"n": 15, "topic": "Meningitis (NG240)", "stem": "A 47-year-old man with confirmed bacterial meningitis deteriorates on the ward. His GCS falls from 13 to 7, his right pupil becomes dilated and sluggish, and urgent CT shows diffuse cerebral oedema with early transtentorial herniation. The intensive care team has been called. What is the most appropriate immediate management?", "options": ["Give oral glycerol", "Insert an invasive intracranial pressure monitor routinely in the emergency department", "Restrict fluids to 50% of maintenance", "Perform a therapeutic lumbar puncture to lower the pressure", "Consider an osmotic agent other than glycerol as a temporary measure and get urgent critical care advice"], "answer": 4, "exp": "[G] NICE NG240: with signs of raised ICP and herniation concern — consider osmotic agents (but NOT glycerol) as a TEMPORARY measure and get urgent critical care advice.\n\n[G] Do not use glycerol at all in bacterial meningitis (higher mortality vs placebo). Do not ROUTINELY use other osmotic agents (mannitol, hypertonic saline) — they are reserved for exactly this herniation scenario.\n\n[G] Do not routinely use invasive ICP monitoring; get specialist advice on it if features of raised ICP or hydrocephalus. It is an ICU/neurosurgical decision, not an ED one.\n\n[C] LP with herniation is catastrophic and absolutely contraindicated.\n\nThree separate 'do not routinely' statements — the exam tests the exception that unlocks each.", "type": "mcq"}, {"n": 16, "topic": "Meningitis (NG240)", "stem": "A 21-year-old woman has confirmed Neisseria meningitidis meningitis. She has been treated with intravenous ceftriaxone and by day 5 she is afebrile, fully orientated, mobilising and eating normally. Inflammatory markers have normalised. What is the most appropriate antibiotic duration?", "options": ["Stop antibiotics after 5 days", "Continue antibiotics to a total of 7 days", "Continue antibiotics to a total of 10 days", "Continue antibiotics to a total of 14 days", "Continue antibiotics to a total of 21 days"], "answer": 0, "exp": "[G] NICE NG240 organism-specific durations (then stop if recovered, or get advice if not): Neisseria meningitidis 5 days; Haemophilus influenzae type b 7 days (to 10 if not recovered); Streptococcus pneumoniae 10 days; Group B streptococcus 14 days; Enterobacterales (coliforms) 21 days; Listeria monocytogenes 21 days (amoxicillin/ampicillin, not ceftriaxone).\n\n[G] Meningococcal DISEASE (including septicaemia) is likewise 5 days.\n\n[G] No difference between 5-day and 10-day ceftriaxone for Hib and meningococcal meningitis; other durations from committee experience.\n\n[C] Memorise 5–7–10–14–21–21. Durations are a favourite boundary and the numbers are not intuitive.", "type": "mcq"}, {"n": 17, "topic": "Meningitis (NG240)", "stem": "A 30-year-old man attends with a 6-hour history of fever, severe headache, neck stiffness and mild confusion noted by his partner. He looks unwell but is haemodynamically stable. Initial bloods show CRP 8 mg/L, white cell count 9.1 × 10⁹/L and lactate 1.2 mmol/L. What is the most appropriate management?", "options": ["Discharge with safety-netting advice as the inflammatory markers are normal", "Repeat the CRP in 6 hours before deciding on treatment", "Give oral antibiotics and arrange review in 24 hours", "Continue the bacterial meningitis pathway, giving intravenous antibiotics within 1 hour of arrival", "Diagnose viral meningitis and admit for observation without antibiotics"], "answer": 3, "exp": "[G] NICE NG240: STRONGLY suspect bacterial meningitis with ALL of fever, headache, neck stiffness, and altered consciousness or cognition (including confusion/delirium). This patient has all four.\n\n[G] Do NOT rule out bacterial meningitis on a normal CRP, PCT or white cell count. Confirm on clinical features AND blood tests AND LP — no single test rules in or out.\n\n[C] Early presentation (6 hours) is exactly when CRP has not yet risen; a normal CRP in the first hours is a trap, not reassurance.\n\n[G] Bacterial meningitis can still be strongly suspected even when not all red flags are present. Safety netting applies to people you are sending home — not to the full red-flag combination.", "type": "mcq"}, {"n": 18, "topic": "Meningitis (NG240)", "stem": "A 44-year-old man is recovering on the ward from confirmed pneumococcal meningitis. He has no known immunodeficiency, is fully immunised, and reports no risk factors for blood-borne viruses. The consultant asks what additional testing NICE recommends. Which single investigation should be performed?", "options": ["Serum immunoglobulins alone", "An HIV test", "Complement function testing alone", "No further testing is needed in the absence of risk factors", "CT of the temporal bones"], "answer": 1, "exp": "[G] NICE NG240: test for HIV in ADULTS with bacterial meningitis or meningococcal disease. This is unconditional — it does not depend on declared risk factors, and HIV testing is among the routine bloods for suspected bacterial meningitis.\n\n[G] For babies, children and young people, only CONSIDER HIV testing, and only with signs of immunodeficiency or HIV risk factors. After a RECURRENT episode, test for HIV in all age groups.\n\n[G] Rationale: higher risk of pneumococcal and invasive meningococcal disease with HIV, and higher HIV prevalence among people with bacterial meningitis.\n\n[C] The examinable contrast: adults (test) vs children (consider, if indicated) vs recurrence (test everyone).", "type": "mcq"}, {"n": 19, "topic": "Meningitis (NG240)", "stem": "A previously well, fully immunised 3-year-old girl is recovering from confirmed Streptococcus pneumoniae meningitis. She has had no previous serious infections and there is no relevant family history. What additional step does NICE recommend?", "options": ["No further action beyond routine GP follow-up", "Lifelong prophylactic penicillin without specialist review", "Refer to a paediatric immunology and infectious disease specialist to assess for primary immunodeficiency", "Repeat lumbar puncture at 6 weeks", "Test for HIV as the only additional investigation"], "answer": 2, "exp": "[G] NICE NG240: refer children/young people with PNEUMOCOCCAL meningitis to a paediatric immunology and infectious disease specialist to assess for primary immunodeficiency.\n\n[G] Rationale: pneumococcal meningitis may indicate poor immune response to vaccination or a primary immune deficiency — present in 8% to 26% of children with invasive pneumococcal disease. Adults were excluded (no evidence of increased primary immunodeficiency).\n\n[G] For babies and young children with bacterial meningitis, also examine the back and scalp for a sinus tract.\n\n[C] Being fully immunised makes the referral MORE relevant — vaccine failure is the signal. Prophylaxis/further vaccines follow only after specialist review.", "type": "mcq"}, {"n": 20, "topic": "Meningitis (NG240)", "stem": "A 16-year-old is medically fit for discharge on day 8 after confirmed bacterial meningitis. During the discharge conversation she reports that sounds have been muffled in both ears since the acute illness. What is the most appropriate plan for her hearing?", "options": ["Reassure her and review her hearing at 6 months", "Make a routine ENT referral to be seen within 18 weeks", "Arrange audiology only at the 4 to 6 week post-discharge review", "Repeat assessment only if symptoms persist at 3 months", "Arrange audiological assessment within 4 weeks of her being well enough for testing, preferably before discharge, with urgent cochlear implant assessment if severe or profound deafness is found"], "answer": 4, "exp": "[G] NICE NG240: offer audiological assessment within 4 WEEKS of the person being well enough for testing, and preferably before discharge. Offer those with severe or profound deafness an URGENT cochlear implant assessment.\n\n[C] The urgency is anatomical: post-meningitic labyrinthitis ossificans can obliterate the cochlea within weeks to months, and delay can make implantation impossible. This is why hearing sits outside the general follow-up timetable.\n\n[G] Separately, the post-discharge review is at 4 to 6 WEEKS, and should not be delayed if hearing results are not yet available.\n\n[C] Keep the two numbers apart: audiology within 4 weeks of being fit to test (preferably pre-discharge); general review at 4–6 weeks.", "type": "mcq"}]}, {"code": "TOX", "title": "Acute Opioid Toxicity", "source": "RCEM / NPIS · April 2024", "hue": "#f5b544", "questions": [{"n": 1, "topic": "Scope", "stem": "This guideline applies to acute opioid toxicity from illicit use, misuse or deliberate self-poisoning. In which group is it explicitly NOT applicable?", "options": ["Patients on methadone maintenance", "Patients taking prescribed opioids for palliative care/cancer pain", "Patients under 18", "Patients with co-ingestion of benzodiazepines", "Patients presenting >6 hours after use"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). It excludes patients on prescribed opioids for palliative/cancer pain.", "type": "mcq"}, {"n": 2, "topic": "Epidemiology", "stem": "Regarding European ED drug toxicity presentations, which class is most frequently encountered?", "options": ["Benzodiazepines", "Opioids", "Sympathomimetics", "NPS cannabinoids", "Alcohol alone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Opioids are the most frequent.", "type": "mcq"}, {"n": 3, "topic": "Epidemiology", "stem": "Approximately how many opioid-related drug deaths occurred per week in Great Britain in 2022?", "options": ["20", "40", "60", "100", "150"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60 per week.", "type": "mcq"}, {"n": 4, "topic": "Epidemiology", "stem": "In Scotland (2022), drug poisoning death rate vs the UK average, and the proportion of drug-misuse deaths implicating opiates/opioids, were approximately:", "options": ["1.5x higher; 50%", "2.7x higher; 82%", "4x higher; 60%", "Equal; 90%", "2x higher; 70%"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~2.7x higher; ~82%.", "type": "mcq"}, {"n": 5, "topic": "Epidemiology", "stem": "Since 2009, how many novel psychoactive substance (NPS) opioids have been identified on the European market?", "options": ["24", "44", "74", "104", "124"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 74.", "type": "mcq"}, {"n": 6, "topic": "Epidemiology", "stem": "Which novel opioid is cited as having roughly twice the potency of fentanyl?", "options": ["Carfentanil", "Isotonitazene", "U-47700", "Etonitazene", "Acetylfentanyl"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Isotonitazene (~2x fentanyl potency).", "type": "mcq"}, {"n": 7, "topic": "Epidemiology", "stem": "Acute opioid toxicity presentations are more common:", "options": ["Early morning on weekdays", "At weekends, late evening and night", "Only in winter", "Immediately after payday only", "Equally distributed"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Weekends, late evening and night.", "type": "mcq"}, {"n": 8, "topic": "Toxidrome", "stem": "The classic triad of acute opioid toxicity is:", "options": ["Hypertension, mydriasis, tachypnoea", "Drowsiness, respiratory depression, miosis", "Agitation, hyperthermia, tachycardia", "Seizures, bradycardia, mydriasis", "Vomiting, diarrhoea, diaphoresis"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Drowsiness, respiratory depression, miosis.", "type": "mcq"}, {"n": 9, "topic": "Toxidrome", "stem": "Which is NOT a recognised feature of acute opioid toxicity in this guideline?", "options": ["Hypothermia from environmental exposure", "Hypertension and tachycardia", "Convulsions", "Urticaria and pruritis", "Neuropsychiatric features (nightmares, hallucinations, paranoia)"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Hypertension/tachycardia are NOT features of opioid toxicity.", "type": "mcq"}, {"n": 10, "topic": "Toxidrome", "stem": "Co-ingestion with which class most exacerbates respiratory depression?", "options": ["Antihistamines", "Benzodiazepines and GABA-ergics (e.g. pregabalin)", "Beta-blockers", "Statins", "Proton pump inhibitors"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Benzodiazepines/GABA-ergics.", "type": "mcq"}, {"n": 11, "topic": "Diagnosis", "stem": "Role of urine drug screening in immediate ED management of suspected opioid toxicity?", "options": ["Mandatory before naloxone", "Confirms diagnosis and guides naloxone dosing", "No role in immediate management; diagnosis is clinical", "Send but wait for results before treating", "Replaces clinical assessment"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Diagnosis is clinical; urine screen has no immediate role.", "type": "mcq"}, {"n": 12, "topic": "Diagnosis", "stem": "For diagnostic uncertainty, who should be contacted for advice?", "options": ["Regional toxicology consultant only", "A clinical toxicologist via the National Poisons Information Service (NPIS)", "The coroner's office", "The patient's GP", "The hospital pharmacist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). NPIS clinical toxicologist.", "type": "mcq"}, {"n": 13, "topic": "Naloxone principles", "stem": "Primary therapeutic aim of naloxone in acute opioid toxicity?", "options": ["Full reversal of unconsciousness", "Reversal of respiratory depression and maintenance of airway protective reflexes", "Normalising pupil size", "Preventing all withdrawal symptoms", "Achieving GCS 15"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reverse respiratory depression / maintain airway reflexes, NOT full arousal.", "type": "mcq"}, {"n": 14, "topic": "Naloxone principles", "stem": "Naloxone acts as a:", "options": ["Partial mu-opioid agonist", "Mu-opioid receptor antagonist", "Kappa-opioid agonist", "NMDA antagonist", "GABA agonist"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Mu-opioid receptor antagonist.", "type": "mcq"}, {"n": 15, "topic": "Naloxone principles", "stem": "Preferred naloxone route in the ED when IV access is available?", "options": ["Intramuscular", "Intranasal", "Intravenous", "Subcutaneous", "Intraosseous"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IV when access available.", "type": "mcq"}, {"n": 16, "topic": "Naloxone principles", "stem": "Compared with IV, the IM and IN routes are associated with:", "options": ["Shorter time to peak concentration", "Longer time to peak concentration", "Identical pharmacokinetics", "Greater risk of withdrawal", "No difference in onset"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Longer time to peak concentration.", "type": "mcq"}, {"n": 17, "topic": "Naloxone principles", "stem": "The guideline actively discourages which practice?", "options": ["Giving naloxone via IO access", "Giving IM naloxone alongside IV, or IM naloxone prior to discharge", "Titrating naloxone in small boluses", "Monitoring ETCO2", "Using saline to dilute naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid IM naloxone alongside IV / IM before discharge.", "type": "mcq"}, {"n": 18, "topic": "Naloxone principles", "stem": "Adverse effects from naloxone are more likely when:", "options": ["Small titrated doses are used", "Excessive/large doses are used", "Given IV rather than IM", "Given with oxygen", "Given to opioid-naïve patients"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Excessive doses.", "type": "mcq"}, {"n": 19, "topic": "Naloxone principles", "stem": "Which is a reported adverse effect of naloxone?", "options": ["Bradycardia and hypotension only", "Nausea, vomiting, sweating, tachycardia, tremor, hyperventilation, hypertension", "Miosis", "Sedation", "Hypoglycaemia"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal-type effects: N/V, sweating, tachycardia, tremor, hypertension.", "type": "mcq"}, {"n": 20, "topic": "Naloxone principles", "stem": "Regarding naloxone-associated convulsions, the guideline states:", "options": ["Common and clearly caused by naloxone", "A causal link is not clearly shown; may relate to co-used drugs", "Only with IM naloxone", "More common than opioid withdrawal", "Never occur"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Causal link not clearly established.", "type": "mcq"}, {"n": 21, "topic": "Naloxone principles", "stem": "Why are smaller initial IV naloxone doses preferred in hospital (non-arrest) settings?", "options": ["To reduce drug cost", "To find the minimum dose reversing respiratory depression while avoiding acute iatrogenic withdrawal", "Larger doses are contraindicated in all", "Smaller doses act faster", "IV naloxone has a ceiling effect"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to minimum effective dose; avoid precipitating withdrawal.", "type": "mcq"}, {"n": 22, "topic": "Naloxone principles", "stem": "Overzealous reversal is particularly concerning with opioid+stimulant co-use because it may:", "options": ["Cause immediate cardiac arrest", "Unmask stimulant toxicity", "Prevent withdrawal entirely", "Cause permanent respiratory depression", "Have no additional risk"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Can unmask stimulant toxicity.", "type": "mcq"}, {"n": 23, "topic": "Withdrawal", "stem": "Which is NOT a feature of acute opioid withdrawal (Table 1)?", "options": ["Yawning", "Lacrimation", "Miosis (pinpoint pupils)", "Piloerection-type fine muscle tremor", "Tachycardia and hypertension"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Withdrawal causes DILATED pupils, not miosis.", "type": "mcq"}, {"n": 24, "topic": "Withdrawal", "stem": "Which pupil finding is associated with opioid WITHDRAWAL (vs toxicity)?", "options": ["Pinpoint/constricted", "Dilated", "Unequal", "Fixed", "No change"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Dilated pupils in withdrawal.", "type": "mcq"}, {"n": 25, "topic": "Withdrawal", "stem": "List at least six features of acute opioid withdrawal (Table 1). (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Yawning, sneezing, lacrimation, tachycardia, hypertension, dilated pupils, diarrhoea, cool/clammy skin, fine muscle tremor, nausea, irritability, restlessness, anxiety, coughing, running nose."}, {"n": 26, "topic": "Algorithm", "stem": "Per Figure 1, initial steps for any suspected opioid toxicity include:", "options": ["Immediate 2 mg IV naloxone bolus for all", "Attach monitoring and secure IV access", "Immediate intubation", "CT head before any treatment", "Urine toxicology before intervention"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Attach monitoring, secure IV access.", "type": "mcq"}, {"n": 27, "topic": "Algorithm", "stem": "RR >10/min and SpO2 >92% on air. Initial management?", "options": ["400 mcg naloxone IV", "Naloxone not required; monitor RR, SpO2, ETCO2 and AVPU every 30 min", "Start a naloxone infusion", "Discharge immediately", "100 mcg naloxone as a precaution"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Green pathway: monitor, no naloxone.", "type": "mcq"}, {"n": 28, "topic": "Algorithm", "stem": "RR 6–10/min or SpO2 86–92% on air (amber). First action?", "options": ["Call for senior decision maker", "Apply supplemental oxygen, then titrated IV naloxone 100–200 mcg every 60 s", "BVM at 10–12 breaths/min", "Start naloxone infusion directly", "400 mcg naloxone IV bolus immediately"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Oxygen then titrated 100–200 mcg boluses every 60 s.", "type": "mcq"}, {"n": 29, "topic": "Algorithm", "stem": "In the amber pathway, titrated boluses every 60 s up to a maximum of:", "options": ["400 mcg", "800 mcg", "1200 mcg", "2000 mcg", "4000 mcg"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 2000 mcg (2 mg).", "type": "mcq"}, {"n": 30, "topic": "Algorithm", "stem": "What defines the 'red' (respiratory/peri-arrest) pathway?", "options": ["RR ≤5 and/or SpO2 <85% on air", "RR ≤10 and SpO2 <92%", "Any GCS <15", "Any patient needing >1 bolus", "RR ≤8 regardless of SpO2"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). RR ≤5 and/or SpO2 <85% on air.", "type": "mcq"}, {"n": 31, "topic": "Algorithm", "stem": "Red pathway: initial oxygen/ventilation strategy?", "options": ["15 L/min NRB, no ventilation", "Ventilate with 15 L/min O2 via BVM at 10–12 breaths/min per ALS", "Nasal cannula 4 L/min", "CPAP", "No O2 until naloxone given"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). BVM 15 L/min at 10–12/min per ALS.", "type": "mcq"}, {"n": 32, "topic": "Algorithm", "stem": "Red pathway: first naloxone dose after IV/IO access?", "options": ["100 mcg IV", "400 mcg IV (or IO/IM if IV not secured)", "2000 mcg IV", "800 mcg IM only", "40 mcg IV"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg IV (IO/IM if no IV).", "type": "mcq"}, {"n": 33, "topic": "Algorithm", "stem": "Red pathway: no response after 60 s to the initial 400 mcg. Next?", "options": ["A further 400 mcg", "A further 800 mcg", "A further 2000 mcg", "Repeat 400 mcg once then stop", "IM naloxone instead"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A further 800 mcg.", "type": "mcq"}, {"n": 34, "topic": "Algorithm", "stem": "Red pathway: after two further 800 mcg doses with no response. Next step?", "options": ["Stop naloxone and intubate", "Give a further 2000 mcg IV and consider advanced airway/alternate diagnoses plus urgent critical care referral", "Switch to intranasal naloxone", "Wait 10 min", "IM naloxone 400 mcg"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 2000 mcg IV, advanced airway, reconsider diagnosis, critical care.", "type": "mcq"}, {"n": 35, "topic": "Algorithm", "stem": "Footnote D: correct initial and subsequent bolus dosing in the amber pathway?", "options": ["Initial 200, subsequent 100 mcg", "Initial 100 mcg; if no response to four 100 mcg boluses, subsequent boluses 200 mcg", "All boluses fixed 500 mcg", "Initial 400 mcg throughout", "Initial 50 mcg throughout"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 100 mcg, escalate to 200 mcg after four.", "type": "mcq"}, {"n": 36, "topic": "Algorithm", "stem": "How to dilute a 400 mcg naloxone vial so a 100 mcg bolus = 2.5 mL?", "options": ["Draw 1×400 mcg vial into a 10 mL syringe and make up to 10 mL with saline", "Draw up undiluted and give 1 mL boluses", "Dilute in a 100 mL saline bag", "Mix with dextrose only", "5 mL syringe undiluted"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 400 mcg to 10 mL (40 mcg/mL); 2.5 mL = 100 mcg.", "type": "mcq"}, {"n": 37, "topic": "Algorithm", "stem": "Which patients may require larger naloxone doses (>4 mg)?", "options": ["Elderly only", "Those with severe toxicity or exposure to highly potent opioids", "COPD patients", "Opioid-naïve patients", "Under-30s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Severe toxicity / highly potent opioids.", "type": "mcq"}, {"n": 38, "topic": "Algorithm", "stem": "If a longer-acting opioid (e.g. methadone or NPS opioid) is suspected, extend observation up to:", "options": ["4 hours", "6 hours", "8 hours", "12 hours", "24 hours"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Up to 12 hours.", "type": "mcq"}, {"n": 39, "topic": "Algorithm", "stem": "What does AVPU/GCS monitoring reflect, and what is emphasised?", "options": ["Primary target for titrating naloxone", "Useful to monitor, but naloxone aims at reversing respiratory depression / maintaining airway reflexes, NOT full arousal", "Must be normalised before discharge", "Replaces RR/SpO2 monitoring", "No clinical relevance"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Titrate to ventilation, not to consciousness.", "type": "mcq"}, {"n": 40, "topic": "Disposition", "stem": "Green pathway (no naloxone): when can discharge be considered?", "options": ["Immediately", "When RR, SpO2, ETCO2 and AVPU are normal for 6 hours after suspected overdose", "After 1 hour of normal obs", "Only after clear urine tox", "After psychiatric review only"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥6 h of normal observations since overdose.", "type": "mcq"}, {"n": 41, "topic": "Disposition", "stem": "Orange pathway (needed naloxone): discharge when obs normal for how long after naloxone, and since overdose?", "options": ["2 h after naloxone; 4 h since overdose", "4 h after naloxone; 6 h since overdose", "6 h after naloxone; 8 h since overdose", "1 h after naloxone; 2 h since overdose", "8 h after naloxone; 12 h since overdose"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since overdose.", "type": "mcq"}, {"n": 42, "topic": "Disposition", "stem": "How to interpret SpO2 targets in pre-existing respiratory disease (e.g. COPD)?", "options": ["Same targets universally (>92%)", "Interpret with caution; target may routinely be 88–92%", "Target >98%", "SpO2 monitoring not useful", "Never give oxygen"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). COPD target may be 88–92% — interpret with caution.", "type": "mcq"}, {"n": 43, "topic": "Investigations", "stem": "Footnote A: what to consider in all patients (to look for alternate diagnoses)?", "options": ["Full septic screen only", "BM (glucose), VBG, paracetamol concentration ± CT head", "Chest X-ray only", "Lumbar puncture", "ECG only, no bloods"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Glucose, VBG, paracetamol level ± CT head.", "type": "mcq"}, {"n": 44, "topic": "Algorithm", "stem": "Is Figure 1 a mandatory standard of care?", "options": ["Yes, followed exactly in all cases", "No — a suggested pathway; trained senior decision-makers may use alternatives such as permissive hypercapnia or lower boluses", "Yes, but only under 65", "No, prehospital only", "Mandatory only in tertiary centres"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). A suggested pathway, not mandatory.", "type": "mcq"}, {"n": 45, "topic": "Infusion", "stem": "When is a naloxone infusion indicated?", "options": ["In every patient receiving any bolus", "When, after an initial response, the patient deteriorates and needs further boluses to maintain ventilation", "Only in cardiac arrest", "Only for heroin", "Only if the patient requests it"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Recurrent deterioration needing repeat boluses.", "type": "mcq"}, {"n": 46, "topic": "Infusion", "stem": "Recommended starting hourly infusion rate is calculated as:", "options": ["100% of the total dose required initially", "60% of the total dose(s) required to adequately reverse respiratory depression during the second dosing", "Fixed 400 mcg/h", "30% of the maximum bolus", "Double the total bolus"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~60% of the reversing dose per hour.", "type": "mcq"}, {"n": 47, "topic": "Infusion", "stem": "How is the standard naloxone infusion prepared?", "options": ["4 mg (10×400 mcg vials) + 30 mL 0.9% saline to 40 mL final (100 mcg/mL)", "4 mg + 50 mL saline (80 mcg/mL)", "2 mg + 20 mL saline (100 mcg/mL)", "1 mg in 10 mL", "4 mg + 100 mL saline by gravity"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 4 mg to 40 mL = 100 mcg/mL.", "type": "mcq"}, {"n": 48, "topic": "Infusion", "stem": "If 800 mcg total bolus achieved response, starting infusion rate (mL/h) per Table 2?", "options": ["2.4", "3.6", "4.8", "6.0", "7.2"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 800 = 480 mcg/h = 4.8 mL/h at 100 mcg/mL.", "type": "mcq"}, {"n": 49, "topic": "Infusion", "stem": "1200 mcg total bolus to respond — starting rate in mcg/h?", "options": ["480", "600", "720", "840", "960"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 60% of 1200 = 720 mcg/h.", "type": "mcq"}, {"n": 50, "topic": "Infusion", "stem": "Practical point about high-dose naloxone infusions?", "options": ["Never exceed 4 hours", "The syringe may need replacing soon; consider a follow-on prescription with the initial one", "Central line only", "Cannot be prepared with dextrose", "Second nurse must co-sign hourly"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Provide a follow-on prescription as the syringe may run out.", "type": "mcq"}, {"n": 51, "topic": "Monitoring", "stem": "Once infusion started, how often should observations occur (initially, then subsequently)?", "options": ["Every 5 min for 2 h then hourly", "Every 15 min for the first hour, then every 30 min", "Every 30 min throughout", "Hourly throughout", "Continuous only, no manual checks"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 15-minutely for 1 h, then 30-minutely.", "type": "mcq"}, {"n": 52, "topic": "Monitoring", "stem": "On infusion, RR <10, SpO2 <92%, and/or concerning ETCO2. Action?", "options": ["Immediately double the infusion", "Give further 100–200 mcg boluses every 60 s up to 2 mg, then increase the infusion rate by 60% of the total bolus dose required", "Stop the infusion and observe", "Switch to IM naloxone", "Intubate without further naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Re-bolus then step up the infusion by 60% of the boluses given.", "type": "mcq"}, {"n": 53, "topic": "Monitoring", "stem": "On infusion, signs of acute withdrawal appear. First-line action?", "options": ["Stop the infusion permanently", "Decrease the infusion rate, generally by 50% first", "Double the infusion", "Give an additional bolus", "Switch to oral naloxone"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reduce rate ~50%.", "type": "mcq"}, {"n": 54, "topic": "Monitoring", "stem": "Significant agitation from withdrawal on infusion. Recommended approach?", "options": ["Continue unchanged and restrain", "Temporarily stop; restart after 30–60 min at 50% of the previous rate once withdrawal settles", "Switch antagonist", "Diazepam and continue unchanged", "Permanently discontinue in all such cases"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Pause, then restart at 50% once settled.", "type": "mcq"}, {"n": 55, "topic": "Monitoring", "stem": "After any change to infusion rate/dose, monitoring frequency should:", "options": ["Remain unchanged", "Recommence at every 15 min for the first hour, then every 30 min", "Reduce to hourly", "Reduce to 4-hourly", "Stop for 1 hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Reset to 15-minutely for 1 h then 30-minutely.", "type": "mcq"}, {"n": 56, "topic": "Stopping", "stem": "How long should the infusion continue at the same rate (absent recurrence) before down-titration?", "options": ["≥1 hour", "≥2 hours", "≥4 hours", "≥8 hours", "≥24 hours"], "answer": 2, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). At least 4 hours.", "type": "mcq"}, {"n": 57, "topic": "Stopping", "stem": "Down-titration: reduce by how much and how often?", "options": ["10% of max every hour", "25% of the maximum infusion rate every two hours", "50% of max every hour", "5% every 30 min", "Fixed 100 mcg/h every hour"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). 25% of the maximum rate every 2 hours.", "type": "mcq"}, {"n": 58, "topic": "Stopping", "stem": "Likely that down-titration completes within the ED?", "options": ["Yes, always", "No — unlikely within the ED unless there are significant admission delays", "Yes, under 40 only", "Only in resus", "Only overnight"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Usually completed after admission, not in ED.", "type": "mcq"}, {"n": 59, "topic": "Stopping", "stem": "When should an infusion generally NOT be stopped?", "options": ["Daytime (0800–1600)", "At night (midnight–0600) unless the patient shows withdrawal", "Weekends", "Within the first hour regardless", "No timing restriction"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Avoid stopping overnight unless withdrawing.", "type": "mcq"}, {"n": 60, "topic": "Stopping", "stem": "Why avoid stopping overnight?", "options": ["Nursing staff unavailable", "Recurrent toxicity is harder to detect overnight if the patient is asleep", "Naloxone less effective at night", "Pharmacy closed", "Unrelated hospital policy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Sleep masks recurrence of toxicity.", "type": "mcq"}, {"n": 61, "topic": "Disposition", "stem": "Standard minimum observation before disch

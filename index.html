al current and alkali cause liquefactive necrosis, and septal perforation can develop within hours. Arrange emergency removal (ENT).\n\n[C] Unilateral foul or blood-stained nasal discharge in a toddler should always prompt a search for a nasal foreign body, and a battery changes it from urgent to emergency.\n\n[C] This parallels the oesophageal button battery principle from the earlier set - location plus battery equals emergency.", "type": "mcq"}, {"n": 10, "topic": "Don't-miss paediatrics", "stem": "A 13-year-old with obesity presents with a 3-week history of a limp and pain felt mainly in the knee. On examination the affected leg is held externally rotated and internal rotation of the hip is restricted and painful. What is the most likely diagnosis and correct action?", "options": ["Growing pains - reassure and discharge", "Slipped upper femoral epiphysis - keep non-weight-bearing and refer urgently to orthopaedics", "Transient synovitis - mobilise and review", "A knee ligament injury - knee MRI", "Osgood-Schlatter disease - physiotherapy"], "answer": 1, "exp": "[C, UK practice] An adolescent (often overweight) with a limp, restricted and painful internal rotation of the hip, and an externally rotated leg has a slipped upper femoral epiphysis (SUFE) until proven otherwise. Keep the child non-weight-bearing and refer urgently to orthopaedics; confirm with AP and frog-leg lateral pelvic X-rays.\n\n[C] The crucial trap is that hip pathology frequently refers pain to the KNEE - examining only the knee misses the diagnosis. Always examine the joint above and below.\n\n[C] Delay or continued weight-bearing risks slip progression and avascular necrosis.", "type": "mcq"}]}, {"code": "PDKA", "title": "Paediatric DKA", "source": "BSPED v3 · NICE NG18", "hue": "#67e8f9", "questions": [{"n": 1, "topic": "Paediatric DKA (BSPED)", "stem": "A 9-year-old is brought to the ED unwell. Which combination of biochemical criteria defines diabetic ketoacidosis per BSPED?", "options": ["Glucose >11 mmol/L, pH <7.3 OR bicarbonate <15 mmol/L, blood ketones >3 mmol/L", "Glucose >14 mmol/L, pH <7.2 OR bicarbonate <10 mmol/L, ketones >3 mmol/L", "Glucose >11 mmol/L, pH <7.2 OR bicarbonate <18 mmol/L, ketones >1.5 mmol/L", "Glucose >20 mmol/L, pH <7.3, ketones >3 mmol/L", "Glucose >11 mmol/L, pH <7.35 OR bicarbonate <22 mmol/L, ketones >2 mmol/L"], "answer": 0, "exp": "BSPED/ISPAD [G]: hyperglycaemia (glucose >11), acidosis (pH <7.3 OR bicarbonate <15), and ketosis (blood ketones >3, or moderate–large ketonuria). All three needed.", "type": "mcq"}, {"n": 2, "topic": "Paediatric DKA (BSPED)", "stem": "A 14-year-old with DKA has a venous pH of 7.15 and bicarbonate of 9 mmol/L. How is the severity classified?", "options": ["Mild", "Severe", "Moderate", "Treat as mild given the overlap", "Cannot classify without serum osmolality"], "answer": 2, "exp": "BSPED [G] severity by acidosis: mild pH 7.2–7.29 &/or bicarb <15; moderate pH 7.1–7.19 &/or bicarb <10; severe pH <7.1 &/or bicarb <5. pH 7.15 = moderate.", "type": "mcq"}, {"n": 3, "topic": "Paediatric DKA (BSPED)", "stem": "A child with DKA has a pH of 7.05. What fluid deficit does BSPED assume for the rehydration calculation?", "options": ["3%", "5%", "7%", "15%", "10%"], "answer": 4, "exp": "BSPED [G]: severe DKA (pH <7.1) → assume 10% dehydration; mild and moderate → assume 5%. You do not clinically estimate the deficit.", "type": "mcq"}, {"n": 4, "topic": "Paediatric DKA (BSPED)", "stem": "A child has moderate DKA and is NOT clinically shocked. What is the correct initial fluid bolus?", "options": ["10 mL/kg of 0.9% saline over 30 minutes", "20 mL/kg over 15 minutes", "10 mL/kg over 60 minutes", "20 mL/kg over 30 minutes", "No bolus; begin deficit and maintenance directly"], "answer": 0, "exp": "BSPED [G]: a non-shocked child (mild/moderate/severe) gets 10 mL/kg 0.9% saline over 30 minutes. The 20 mL/kg figure is the general/adult resuscitation volume — a deliberate trap here.", "type": "mcq"}, {"n": 5, "topic": "Paediatric DKA (BSPED)", "stem": "A child with DKA is clinically shocked. What is the correct resuscitation approach?", "options": ["20 mL/kg over 15 minutes, repeated up to 60 mL/kg", "10 mL/kg over 30 minutes, no repeat", "20 mL/kg over 5 minutes, repeated up to 40 mL/kg", "10 mL/kg over 15 minutes, repeated up to a maximum of 40 mL/kg before considering inotropes", "5 mL/kg over 15 minutes"], "answer": 3, "exp": "BSPED [G]: shocked child → 10 mL/kg over 15 min, reassess, further 10 mL/kg boluses up to a maximum of 40 mL/kg, then consider inotropes. Note shock is not just cool peripheries (acidosis alone causes vasoconstriction).", "type": "mcq"}, {"n": 6, "topic": "Paediatric DKA (BSPED)", "stem": "Which statement about subtracting fluid boluses from the calculated deficit is correct?", "options": ["All boluses, including shock resuscitation fluid, are subtracted from the deficit", "The 10 mL/kg bolus given to a non-shocked child is subtracted from the calculated deficit", "No bolus is ever subtracted from the deficit", "Only second and subsequent boluses are subtracted", "Boluses are added to the deficit"], "answer": 1, "exp": "BSPED [G]: the initial 10 mL/kg bolus in a NON-shocked child is subtracted from the deficit. Resuscitation fluid given to a SHOCKED child is NOT subtracted. A classic discriminator.", "type": "mcq"}, {"n": 7, "topic": "Paediatric DKA (BSPED)", "stem": "A 20 kg boy has moderate DKA (pH 7.15) and is not shocked. Deficit 5%, maintenance 1500 mL/day, initial bolus 10 mL/kg. What is the approximate total fluid rate?", "options": ["62.5 mL/hr", "70.8 mL/hr", "79.2 mL/hr", "83.3 mL/hr", "104 mL/hr"], "answer": 2, "exp": "[G/C]: bolus = 200 mL. Deficit = 5% × 20 kg × 10 = 1000 mL; minus 200 mL bolus = 800 mL over 48 h = 16.7 mL/hr. Maintenance = 1500 ÷ 24 = 62.5 mL/hr. Total ≈ 79.2 mL/hr.", "type": "mcq"}, {"n": 8, "topic": "Paediatric DKA (BSPED)", "stem": "Over what period does BSPED recommend replacing the fluid deficit in paediatric DKA?", "options": ["24 hours", "36 hours", "72 hours", "48 hours", "12 hours"], "answer": 3, "exp": "BSPED [G]: replace the deficit evenly over 48 hours (added to maintenance). Slow, even rehydration reduces the risk of cerebral oedema.", "type": "mcq"}, {"n": 9, "topic": "Paediatric DKA (BSPED)", "stem": "When should the insulin infusion be started in paediatric DKA?", "options": ["Immediately, with the first fluid bolus", "As a bolus, then an infusion", "Only once glucose falls below 14 mmol/L", "After 4 hours of fluids", "At least 1 hour after IV fluids have been started"], "answer": 4, "exp": "BSPED [G]: start insulin at least 1 hour (usually 1–2 h) after IV fluids. Insulin within the first hour raises the risk of cerebral oedema. Never give a bolus.", "type": "mcq"}, {"n": 10, "topic": "Paediatric DKA (BSPED)", "stem": "What is the correct insulin regimen once it is due to start?", "options": ["0.1 units/kg/hr for all, preceded by a 0.1 units/kg bolus", "0.05–0.1 units/kg/hr with no bolus; start at 0.05 unless severe DKA or an adolescent", "0.15 units/kg/hr with no bolus", "0.025 units/kg/hr fixed", "1 unit/kg/hr"], "answer": 1, "exp": "BSPED [G]: soluble insulin infusion 0.05–0.1 units/kg/hr, no bolus. BSPED suggests starting at 0.05 units/kg/hr unless the DKA is severe or the patient is an adolescent, where 0.1 may be used.", "type": "mcq"}, {"n": 11, "topic": "Paediatric DKA (BSPED)", "stem": "During treatment the blood glucose falls to 3.5 mmol/L. What is the correct action?", "options": ["Stop the insulin infusion until glucose recovers", "Give 5 mL/kg of 10% dextrose and stop insulin", "Give a 2 mL/kg bolus of 10% dextrose, add 10% glucose to the fluids, and reduce — not stop — the insulin", "Increase the insulin rate to clear ketones faster", "Give 1 mL/kg of 50% dextrose and stop the fluids"], "answer": 2, "exp": "BSPED [G]: if glucose falls below 4, give 2 mL/kg of 10% dextrose and ensure fluids contain 10% glucose, and reduce insulin to 0.05 units/kg/hr. Do NOT stop insulin — it is still needed to switch off ketogenesis.", "type": "mcq"}, {"n": 12, "topic": "Paediatric DKA (BSPED)", "stem": "As glucose falls during treatment, at what level does BSPED advise adding glucose to the fluids, and which concentration first?", "options": ["Add 5% glucose when blood glucose falls below 14 mmol/L", "Add 10% glucose when glucose falls below 14 mmol/L", "Stop the insulin infusion at 14 mmol/L", "Reduce fluids to half maintenance at 14 mmol/L", "Give a dextrose bolus at 14 mmol/L"], "answer": 0, "exp": "BSPED [G]: below 14 mmol/L → 0.9% saline + 5% glucose (with 20 mmol KCl/500 mL). Below 6 mmol/L → step up to 10% glucose. Insulin continues throughout.", "type": "mcq"}, {"n": 13, "topic": "Paediatric DKA (BSPED)", "stem": "A child with DKA has a normal presenting potassium and has passed urine. How is potassium managed in the fluids?", "options": ["40 mmol KCl per 500 mL immediately, including in the first bolus", "No potassium until day 2", "Potassium only if plasma K is <3.5 mmol/L", "10 mmol KCl per 1 litre", "20 mmol KCl per 500 mL of 0.9% saline, once not hyperkalaemic and urine has been passed"], "answer": 4, "exp": "BSPED [G]: 20 mmol KCl per 500 mL (40 mmol/L). Total body potassium is depleted and insulin drives K intracellularly, so replacement starts with insulin once the child is not hyperkalaemic and has passed urine. Boluses themselves contain no potassium.", "type": "mcq"}, {"n": 14, "topic": "Paediatric DKA (BSPED)", "stem": "At presentation a child with DKA is hyperkalaemic (K 5.8 mmol/L). How should potassium replacement be handled?", "options": ["Add 40 mmol/L KCl immediately", "Give IV calcium and insulin-dextrose", "Give oral calcium resonium", "Defer potassium replacement until urine is passed or K falls into the normal range", "Withhold all fluids until K normalises"], "answer": 3, "exp": "BSPED [G]: if hyperkalaemic (>5), defer KCl until the child has passed urine or K has fallen to normal (usually after the first bolus). Assess the ECG for hyperkalaemic changes. If K <3, discuss with critical care — central access is needed for higher-concentration replacement.", "type": "mcq"}, {"n": 15, "topic": "Paediatric DKA (BSPED)", "stem": "A child with severe DKA has a pH of 6.9. Should sodium bicarbonate be given?", "options": ["Give 8.4% sodium bicarbonate 1 mL/kg", "Give a 1.26% bicarbonate infusion", "Do not give bicarbonate — it raises the risk of cerebral oedema", "Give bicarbonate if pH <7.0", "Give bicarbonate if bicarbonate <5 mmol/L"], "answer": 2, "exp": "BSPED [G]: do NOT give bicarbonate — it is associated with increased cerebral oedema. Only consider it after discussion with intensive care for life-threatening hyperkalaemia or profound acidosis. Fluids and insulin correct the acidosis.", "type": "mcq"}, {"n": 16, "topic": "Paediatric DKA (BSPED)", "stem": "Which of the following is a recognised warning sign of cerebral oedema in paediatric DKA?", "options": ["Tachycardia with hypotension", "Headache with a rising blood pressure and a falling heart rate", "Polyuria", "Rising blood glucose", "Improving GCS with warm peripheries"], "answer": 1, "exp": "BSPED [G]: warning signs include headache, falling GCS/irritability, relative bradycardia with hypertension (Cushing's reflex), cranial nerve palsies, falling saturations and abnormal posturing. Late signs (convulsions, coma, papilloedema) carry a very poor prognosis.", "type": "mcq"}, {"n": 17, "topic": "Paediatric DKA (BSPED)", "stem": "A child with DKA develops headache, drowsiness and relative bradycardia. What is the most appropriate immediate management?", "options": ["Immediately intubate and hyperventilate", "Give a 20 mL/kg saline bolus and increase fluids", "Give IV dexamethasone", "Perform an urgent lumbar puncture", "Give hypertonic (2.7%) saline or mannitol, reduce IV fluids to half maintenance, and exclude hypoglycaemia"], "answer": 4, "exp": "BSPED [G]: treat suspected cerebral oedema immediately — exclude hypoglycaemia, give hypertonic (2.7%) saline OR mannitol (whichever is to hand, don't delay), reduce fluids to half maintenance, nurse head-up, and get senior/PICU help. Do not intubate and ventilate until an experienced doctor is present.", "type": "mcq"}, {"n": 18, "topic": "Paediatric DKA (BSPED)", "stem": "When should CT of the head be performed in a child with suspected cerebral oedema complicating DKA?", "options": ["Treat first; arrange CT once stable, to exclude other intracranial pathology", "Urgent CT before starting any treatment", "MRI immediately", "No imaging is ever required", "Lumbar puncture to measure opening pressure first"], "answer": 0, "exp": "BSPED [G]: treatment must not be delayed for imaging. Give hyperosmolar therapy first; once stable, CT can exclude thrombosis, haemorrhage or infarction, which can mimic cerebral oedema.", "type": "mcq"}, {"n": 19, "topic": "Paediatric DKA (BSPED)", "stem": "In which situation should an NG tube be seriously considered in a child with DKA?", "options": ["All DKA patients routinely need an NG tube", "A child with a reduced conscious level and recurrent vomiting, because of aspiration risk", "Only if abdominal pain is present", "NG tubes are never indicated in DKA", "Only for feeding purposes"], "answer": 1, "exp": "BSPED [G]: consider an NG tube where there is a reduced conscious level, recurrent vomiting, or recent large-volume sugary drinks — all raise the aspiration-pneumonia risk.", "type": "mcq"}, {"n": 20, "topic": "Paediatric DKA (BSPED)", "stem": "Fever is not part of DKA. Which feature should prompt you to actively consider sepsis in a child with DKA?", "options": ["Kussmaul breathing", "Abdominal pain", "Ketotic breath", "Fever, hypotension, or a refractory / lactic acidosis", "Polydipsia"], "answer": 3, "exp": "RCEM/BSPED [G/C]: fever or hypothermia, hypotension, refractory acidosis, or lactic acidosis should prompt consideration of sepsis — Kussmaul breathing, ketotic breath and abdominal pain are expected features of DKA itself.", "type": "mcq"}]}, {"code": "EYE", "title": "Emergency Eye Care", "source": "RCOphth 2020 · NICE · BSR · CKS", "hue": "#38bdf8", "questions": [{"n": 1, "topic": "Chemical injury", "stem": "A 34-year-old builder attends the ED 10 minutes after cement powder entered his left eye. Severe pain and blurred vision. Visual acuity not yet recorded. Single most appropriate immediate action?", "options": ["Record visual acuity in both eyes", "Instil topical anaesthetic and begin copious irrigation with normal saline", "Test the pH of the conjunctival fornix", "Perform slit lamp examination with fluorescein", "Refer immediately to ophthalmology before any intervention"], "answer": 1, "exp": "[G] RCOphth commissioning guidance (2020): chemical injury is the one ocular emergency where treatment precedes full assessment. Irrigate after topical anaesthetic; acuity, pH and slit lamp follow. Cement is alkaline (liquefactive necrosis) — every minute of delay worsens prognosis.", "type": "mcq"}, {"n": 2, "topic": "Chemical injury", "stem": "Following prolonged irrigation of an alkali eye injury, when should pH be re-checked to confirm irrigation can stop?", "options": ["Immediately after stopping irrigation", "5 minutes after stopping irrigation", "At least 15 minutes after stopping irrigation", "30 minutes after the injury occurred", "Only if the patient remains symptomatic"], "answer": 2, "exp": "[G] RCOphth: test pH prior to, and at least 15 min after, cessation of irrigation. Retained particulate alkali (evert the lids) keeps releasing hydroxide, so an immediate post-irrigation pH can be falsely reassuring. Aim for stable pH 7.0–7.5.", "type": "mcq"}, {"n": 3, "topic": "Chemical injury", "stem": "Which chemical agent typically causes the most severe ocular injury?", "options": ["Hydrochloric acid (car battery)", "Petrol", "Sodium hydroxide (oven cleaner)", "Vinegar", "Chlorinated pool water"], "answer": 2, "exp": "[C] Alkalis (NaOH, lime/cement, ammonia) cause liquefactive necrosis and saponify membranes, penetrating the anterior chamber rapidly. Acids cause coagulative necrosis that limits penetration (hydrofluoric acid excepted). Alkali = worst prognosis.", "type": "mcq"}, {"n": 4, "topic": "Post-op endophthalmitis", "stem": "A 76-year-old woman, 4 days after routine cataract surgery, with 12h of increasing pain, marked reduced vision and a hypopyon. Within what timeframe from first healthcare contact should an ophthalmologist examine her (RCOphth)?", "options": ["Within 1 hour", "Within 4 hours", "Within 12 hours", "Within 24 hours", "Within 48 hours"], "answer": 1, "exp": "[G] RCOphth: suspected endophthalmitis must be seen on a slit lamp within FOUR hours of first contact — the tightest of the ten emergency presentations. Organisms can double in <30 min. Management is tap-and-inject. Most other true emergencies carry a 24h standard.", "type": "mcq"}, {"n": 5, "topic": "Post-op endophthalmitis", "stem": "A 70-year-old man, 3 days after intravitreal anti-VEGF injection, painful red eye, vision hand movements. Endophthalmitis suspected. Definitive initial treatment?", "options": ["Intensive hourly topical ofloxacin", "Intravenous ceftriaxone", "Vitreous sampling and intravitreal antibiotic injection", "Oral moxifloxacin and review in 24 hours", "Immediate pars plana vitrectomy in all cases"], "answer": 2, "exp": "[G] RCOphth: immediate sampling of intraocular fluids and intravitreal antibiotics ('tap and inject'). Topical/oral/IV routes do not reach adequate vitreous levels. Vitrectomy is reserved for selected cases, not universal.", "type": "mcq"}, {"n": 6, "topic": "GCA", "stem": "A 74-year-old woman with sudden painless loss of vision in the right eye, 2-week temporal headache, jaw claudication, scalp tenderness; pale swollen disc. Single most appropriate immediate management?", "options": ["Oral prednisolone 40 mg and rheumatology referral within 3 days", "Urgent temporal artery biopsy before starting treatment", "Intravenous methylprednisolone 500 mg–1 g immediately", "Aspirin 300 mg and referral to TIA clinic", "Await ESR and CRP before starting corticosteroids"], "answer": 2, "exp": "[G] GCA with visual loss (arteritic AION): IV methylprednisolone 500 mg–1 g daily up to 3 days (BSR / RCOphth). Never delay for biopsy or bloods — the fellow eye can be lost within hours. Biopsy still valid within ~2 weeks of starting steroids.", "type": "mcq"}, {"n": 7, "topic": "GCA", "stem": "A 68-year-old man, two episodes of transient monocular visual loss (5 min), new headache, scalp tenderness. Vision 6/6 bilaterally, CRP elevated. Most appropriate immediate treatment?", "options": ["Aspirin 300 mg alone and TIA clinic referral", "Oral prednisolone 60 mg daily started immediately", "IV methylprednisolone for 3 days", "Topical steroids and ophthalmology review within 24 hours", "No treatment until temporal artery ultrasound performed"], "answer": 1, "exp": "[G] BSR: suspected GCA WITHOUT established visual loss — start high-dose oral prednisolone (40–60 mg) immediately; amaurosis pushes to the higher end plus urgent same-day ophthalmology. IV methylprednisolone is for established visual loss. Don't delay steroids for imaging/biopsy.", "type": "mcq"}, {"n": 8, "topic": "Vascular occlusion", "stem": "A 62-year-old hypertensive man, 3h after sudden painless profound visual loss; pale retina with a cherry-red spot. Time window and what it mandates alongside ophthalmic referral?", "options": ["Within 24 hours; routine cardiovascular risk assessment", "Within 8 hours; management as a stroke equivalent with same-day stroke pathway", "Within 72 hours; outpatient carotid Doppler", "Within 8 hours; immediate thrombolysis in the ED", "Within 4 hours; intravitreal antibiotics"], "answer": 1, "exp": "[G] CRAO — RCOphth triage: seen within 8 hours. It is an ocular stroke: urgent stroke-pathway assessment (imaging, carotid, risk factors) and always consider GCA in over-50s. Thrombolysis is not standard UK practice outside trials.", "type": "mcq"}, {"n": 9, "topic": "Acute angle closure", "stem": "A 58-year-old long-sighted woman at night: severe left eye pain, headache, vomiting, haloes; red eye, hazy cornea, fixed mid-dilated pupil, IOP 56. Initial pharmacological management in the ED?", "options": ["Topical prednisolone alone and review in the morning", "IV acetazolamide 500 mg plus topical pilocarpine, beta-blocker and steroid", "IV mannitol as first-line monotherapy", "Topical atropine to relieve ciliary spasm", "High-flow oxygen and analgesia pending ophthalmology review"], "answer": 1, "exp": "[G] AACG (NICE CKS / RCOphth): lie flat, IV acetazolamide 500 mg plus topical pilocarpine 2% (pulls iris from the angle), a beta-blocker and steroid; analgesia/antiemetics. Mannitol is second-line. Atropine is contraindicated (worsens closure). Definitive = laser peripheral iridotomy.", "type": "mcq"}, {"n": 10, "topic": "Microbial keratitis", "stem": "A 24-year-old contact lens wearer, 24h painful red watering eye, reduced vision; corneal infiltrate with epithelial defect. Most appropriate management?", "options": ["Chloramphenicol ointment and GP follow-up", "Topical aciclovir five times daily", "Same-day ophthalmology referral for corneal scrape then hourly topical fluoroquinolone", "Pressure patching the eye with cycloplegic drops", "Oral flucloxacillin and review in 48 hours"], "answer": 2, "exp": "[G] Contact-lens microbial keratitis — sight-threatening. RCOphth: slit lamp within 24h, corneal scrape, then hourly topical fluoroquinolone; cover Acanthamoeba in lens wearers. Never patch an infected cornea; stop lens wear and keep lens/case for culture.", "type": "mcq"}, {"n": 11, "topic": "Penetrating trauma", "stem": "A 29-year-old hammering metal, sudden pain and reduced vision; small subconjunctival haemorrhage and a peaked teardrop pupil. Most appropriate imaging for intraocular foreign body?", "options": ["MRI orbits", "CT orbits (thin slice)", "Plain orbital X-ray only", "B-scan ocular ultrasound with firm probe pressure", "No imaging — proceed straight to theatre"], "answer": 1, "exp": "[G] Metal-on-metal is the classic ferrous IOFB mechanism. Thin-slice CT orbits is investigation of choice. MRI is contraindicated with possible metallic IOFB; ultrasound needs globe pressure (avoid on suspected open globe). RCOphth: assess and repair within 24h.", "type": "mcq"}, {"n": 12, "topic": "Penetrating trauma", "stem": "A confirmed open globe injury awaiting transfer for repair. Most appropriate ED management step?", "options": ["Apply a firm pressure pad to prevent extrusion", "Instil topical chloramphenicol ointment", "Place a rigid shield over the eye, give antiemetics and analgesia, keep nil by mouth", "Attempt removal of any visible protruding foreign body", "Measure intraocular pressure to complete the assessment"], "answer": 2, "exp": "[G] Open globe: rigid shield on the orbital rim (never a pressure pad), antiemetics (vomiting raises IOP), analgesia, tetanus, NBM, IV antibiotics per policy. Don't remove protruding FBs, instil ointments, or measure IOP. Repair within 24h (RCOphth).", "type": "mcq"}, {"n": 13, "topic": "Retrobulbar haemorrhage", "stem": "A 45-year-old with blunt facial trauma: tense proptosed eye, vision hand movements, RAPD, IOP 52. CT awaited. Single most appropriate next step?", "options": ["Wait for CT orbits before intervening", "IV acetazolamide and reassess in one hour", "Immediate lateral canthotomy and inferior cantholysis in the ED", "Urgent transfer to a tertiary ophthalmic unit for decompression", "High-dose IV methylprednisolone"], "answer": 2, "exp": "[C/RCEM] Orbital compartment syndrome — minutes count; irreversible loss in 60–120 min. Lateral canthotomy and cantholysis is a core RCEM ED procedure done immediately on clinical grounds, never delayed for imaging/transfer. Medical IOP-lowering is adjunct only.", "type": "mcq"}, {"n": 14, "topic": "Orbital cellulitis", "stem": "A 19-year-old, 2 days periorbital swelling and fever after sinusitis: proptosis, painful restricted eye movements, reduced colour vision. Most appropriate immediate management?", "options": ["Oral co-amoxiclav and review in 24 hours", "Immediate empirical IV antibiotics, then urgent CT and same-day ophthalmology/ENT referral", "CT orbits first; withhold antibiotics until imaging confirms", "Topical chloramphenicol and nasal decongestants", "Discharge with safety netting as this is preseptal"], "answer": 1, "exp": "[G] Proptosis, painful/restricted movements and impaired colour vision = ORBITAL cellulitis. RCOphth: start empirical IV antibiotics immediately, BEFORE imaging; CT then assesses for abscess; ophthalmology within 24h, ENT if sinus disease. Risks: blindness, cavernous sinus thrombosis, death.", "type": "mcq"}, {"n": 15, "topic": "Retinal detachment", "stem": "A 55-year-old myopic man, 3 days of flashes and floaters, now a 'curtain' over the lower field; central vision 6/6. Most appropriate management?", "options": ["Routine optometrist review within 2 weeks", "Same-day referral to ophthalmology/vitreoretinal service", "Reassure — this is posterior vitreous detachment", "Ophthalmology referral within one week as the macula is unaffected", "Start topical steroids and review in 48 hours"], "answer": 1, "exp": "[G] Field defect with flashes/floaters = retinal detachment. Preserved central acuity means macula-ON — the MOST urgent scenario, as prompt surgery preserves central vision (RCOphth/BEAVRS same-day). Flashes/floaters WITH a field defect always mandate same-day referral.", "type": "mcq"}, {"n": 16, "topic": "Scleritis", "stem": "A 47-year-old woman with RA, 4 days of severe boring left eye pain waking her at night, radiating to jaw; exquisitely tender globe, deep bluish-red injection not blanching with phenylephrine. Most appropriate management?", "options": ["Topical lubricants and reassurance — this is episcleritis", "Topical chloramphenicol for infective conjunctivitis", "Same-day ophthalmology referral for systemic anti-inflammatory treatment", "Oral aciclovir for presumed zoster", "Routine rheumatology clinic letter"], "answer": 2, "exp": "[G] Pain waking the patient is one of RCOphth's ten emergency presentations — classic scleritis. Non-blanching deep injection distinguishes it from episcleritis. RCOphth: slit lamp within 24h; systemic NSAIDs/steroids and assessment for systemic disease. Untreated risks scleral melt and perforation.", "type": "mcq"}, {"n": 17, "topic": "Uveitis", "stem": "A 32-year-old man with ankylosing spondylitis: painful photophobic red eye, blurred vision; pain in the LEFT eye when light is shone into the RIGHT eye. Diagnosis and pathway?", "options": ["Bacterial conjunctivitis — topical chloramphenicol from the ED", "Anterior uveitis — ophthalmology review within 24 hours for topical steroids and cycloplegia", "Anterior uveitis — start topical steroids in the ED without ophthalmic review", "Acute angle closure — IV acetazolamide", "Keratitis — hourly ofloxacin"], "answer": 1, "exp": "[G] Consensual photophobia is highly specific for anterior uveitis (HLA-B27 association). RCOphth: slit lamp and dilated exam, topical steroids and cycloplegics within 24h. Steroids should NOT be started blind in the ED — a dendritic ulcer must be excluded first.", "type": "mcq"}, {"n": 18, "topic": "Herpetic eye disease", "stem": "A 70-year-old woman, 2-day vesicular V1 rash including vesicles on the nose tip, red watering eye. Significance of the nasal vesicles and management?", "options": ["No significance; topical chloramphenicol", "Hutchinson's sign — high risk of ocular involvement; start oral aciclovir and refer for ophthalmic assessment", "Bacterial superinfection; oral flucloxacillin", "Orbital cellulitis; IV ceftriaxone", "Pathognomonic of HSV keratitis; topical aciclovir alone"], "answer": 1, "exp": "[C/CKS] Hutchinson's sign (nasociliary branch of V1) predicts ocular involvement in herpes zoster ophthalmicus. Start oral aciclovir 800 mg five times daily 7–10 days, ideally within 72h of rash, and refer for ophthalmic assessment. Complications: keratitis, uveitis, glaucoma, PHN.", "type": "mcq"}, {"n": 19, "topic": "Herpetic eye disease", "stem": "A 40-year-old woman with a painful red eye; fluorescein shows a branching corneal lesion with terminal bulbs. Which treatment would most worsen this if given inappropriately?", "options": ["Topical aciclovir", "Topical lubricants", "Topical corticosteroids", "Oral analgesia", "Cycloplegic drops"], "answer": 2, "exp": "[C] A dendritic ulcer is HSV keratitis, treated with topical antivirals. Topical steroids on an unrecognised dendritic ulcer cause geographic ulceration, melt and perforation — the reason UK practice is to exclude epithelial herpetic disease on slit lamp before any steroid for a red eye.", "type": "mcq"}, {"n": 20, "topic": "Post-surgical eye", "stem": "A 63-year-old man, corneal graft 18 months ago, 2 days of painful red eye and reduced vision. Most appropriate action?", "options": ["Treat as conjunctivitis; he is beyond the risk period", "Same-day ophthalmology referral for suspected graft rejection requiring intensive topical steroids", "Routine corneal clinic within 2 weeks", "Oral antibiotics and GP review", "Topical antihistamines for suture allergy"], "answer": 1, "exp": "[G] Graft rejection can occur AT ANY TIME after surgery — RCOphth lists 'painful loss of vision after graft/glaucoma surgery at any time' among its ten emergencies, needing slit lamp within 24h. Treat with immediate intensive topical steroids; any red/painful post-graft eye is rejection until proven otherwise.", "type": "mcq"}, {"n": 21, "topic": "Neuro-ophthalmology", "stem": "A 52-year-old woman, sudden severe headache, right ptosis, 'down and out' eye; dilated unreactive right pupil. Most appropriate next step?", "options": ["Refer to ophthalmology within 24 hours for orthoptics", "Immediate CT/CT angiography to exclude a posterior communicating artery aneurysm", "Check HbA1c and outpatient neurology — likely microvascular", "Prescribe an eye patch and review in one week", "Lumbar puncture as first investigation"], "answer": 1, "exp": "[C] Painful third nerve palsy WITH pupil involvement is a PCom aneurysm until proven otherwise (superficial parasympathetic fibres compressed early; microvascular palsies are pupil-sparing). Immediate CT + CTA. LP follows CT if SAH suspected and CT negative.", "type": "mcq"}, {"n": 22, "topic": "Orbital trauma", "stem": "A 14-year-old struck by a football: minimal bruising but marked pain and diplopia on upgaze, nausea, vomiting, an episode of bradycardia; CT shows an orbital floor fracture. Most appropriate management?", "options": ["Discharge with sinus precautions and routine maxfax follow-up in 2 weeks", "Urgent surgical referral — 'white-eyed blowout' with muscle entrapment needs early repair", "Observe 10–14 days to let swelling settle", "Oral antibiotics only", "Ophthalmology review only if vision deteriorates"], "answer": 1, "exp": "[C] 'White-eyed blowout': elastic paediatric floor traps inferior rectus with little external sign; vomiting/pain on movement/bradycardia = oculocardiac reflex. Needs urgent (24–48h) surgical release — delay causes permanent diplopia. Advise no nose-blowing (orbital emphysema).", "type": "mcq"}, {"n": 23, "topic": "Orbital trauma", "stem": "A 25-year-old, blunt squash-ball trauma: blood filling one third of the anterior chamber; vision 6/12. Most appropriate management?", "options": ["Discharge with topical chloramphenicol and GP follow-up", "Same-day ophthalmology referral, with advice to rest and avoid NSAIDs", "Aspiration of the hyphaema in the ED", "Firm double eye pad and review in 48 hours", "Routine clinic referral within 2 weeks"], "answer": 1, "exp": "[G] Traumatic hyphaema needs same-day ophthalmic assessment (RCOphth 'same day' triage). Risks: secondary haemorrhage (days 2–5), raised IOP with corneal staining, and associated globe injury. Head elevation, rest, avoid NSAIDs/antiplatelets, IOP monitoring; check sickle status.", "type": "mcq"}, {"n": 24, "topic": "Sudden painless visual loss", "stem": "A 68-year-old hypertensive woman, sudden painless blurring; widespread flame haemorrhages in all quadrants, dilated tortuous veins, cotton wool spots — 'stormy sunset'. Diagnosis and referral pathway?", "options": ["Central retinal artery occlusion — see within 8 hours", "Central retinal vein occlusion — ophthalmology referral (typically within 1–2 days per UK triage tools)", "Wet AMD — 2-week wait", "Vitreous haemorrhage — same-day vitreoretinal", "Hypertensive retinopathy — GP BP management only"], "answer": 1, "exp": "[G] 'Blood and thunder' fundus = CRVO. UK triage tools place CRVO/BRVO in the 1–2 day category — urgent but not minutes-critical like CRAO. Ophthalmology assesses for macular oedema and ischaemia. Distinguish from CRAO (pale retina, cherry-red spot, stroke pathway, 8h).", "type": "mcq"}, {"n": 25, "topic": "Sudden painless visual loss", "stem": "A 71-year-old man, single painless monocular loss 'like a shutter' 4 min with full recovery; normal exam/fundoscopy, no GCA features, normal inflammatory markers. Most appropriate management?", "options": ["Reassure and discharge", "High-dose oral prednisolone for GCA", "Treat as TIA: aspirin 300 mg and specialist TIA clinic within 24 hours", "Routine ophthalmology outpatient referral", "Urgent MRI orbits"], "answer": 2, "exp": "[G] Amaurosis fugax without inflammatory features = retinal TIA. NICE NG128: aspirin 300 mg immediately and specialist assessment within 24h; don't use ABCD2 to delay. Carotid imaging follows. Always exclude GCA in over-50s (negative here).", "type": "mcq"}, {"n": 26, "topic": "Endophthalmitis (glaucoma surgery)", "stem": "A 66-year-old woman, trabeculectomy 4 years ago, painful red eye, reduced vision, whitish inflamed bleb superiorly. Most likely diagnosis?", "options": ["Allergic conjunctivitis", "Bleb-related endophthalmitis", "Episcleritis", "Recurrent angle closure", "Suture abscess of no significance"], "answer": 1, "exp": "[G] Bleb-related endophthalmitis follows filtration surgery and — per RCOphth — can occur at ANY time (the thin-walled bleb is a lifelong portal). Management mirrors post-op endophthalmitis: urgent slit lamp, sampling, intravitreal antibiotics. Any painful red eye in a trabeculectomy patient is bleb infection until proven otherwise.", "type": "mcq"}, {"n": 27, "topic": "Corneal FB / minor trauma", "stem": "A 30-year-old welder at 2 am: severe bilateral eye pain, watering, photophobia 6h after welding without protection; diffuse bilateral punctate staining. Most appropriate management?", "options": ["Same-night ophthalmology referral for bilateral keratitis", "Topical anaesthetic drops to take home for pain relief", "Oral analgesia, lubricant ointment ± cycloplegic, with reassurance of recovery within 24–48 hours", "Hourly topical ofloxacin and corneal scrape", "Urgent CT orbits for foreign bodies"], "answer": 2, "exp": "[C/CKS] Photokeratitis ('arc eye'): UV injury with a 6–12h latent period. Supportive care — oral analgesia, lubricants, consider cycloplegic and chloramphenicol ointment; heals in 24–48h. Never dispense topical anaesthetics for home use (impairs healing, masks warning signs).", "type": "mcq"}, {"n": 28, "topic": "Papilloedema", "stem": "A 28-year-old woman, BMI 38, daily headaches worse on waking, transient visual obscurations; bilateral swollen discs, normal acuity. Most appropriate next step?", "options": ["Discharge with migraine advice", "Urgent neuroimaging before consideration of lumbar puncture", "Lumbar puncture as first investigation", "Start acetazolamide in the ED and refer routinely", "Ophthalmology outpatient within 2 weeks"], "answer": 1, "exp": "[C] Bilateral disc swelling with headache = papilloedema until proven otherwise. Although IIH is likely, exclude a mass and venous sinus thrombosis first: urgent neuroimaging (CT ± CT/MR venography) BEFORE LP (LP with a mass risks herniation). LP with opening pressure follows normal imaging.", "type": "mcq"}, {"n": 29, "topic": "Triage & pathways", "stem": "Per RCOphth commissioning guidance, true emergency eye conditions should be seen, diagnosed and have treatment initiated by an ophthalmic specialist within what timeframe?", "options": ["1 hour", "4 hours", "12 hours", "24 hours", "72 hours"], "answer": 3, "exp": "[G] The central RCOphth (2020) standard: all true emergencies seen, diagnosed and treated within 24 HOURS. Tighter internal targets exist — endophthalmitis 4h, CRAO 8h, chemical injury and retrobulbar haemorrhage immediately. Knowing which break the 24h default is high-yield.", "type": "mcq"}, {"n": 30, "topic": "Triage & pathways", "stem": "Which presentation does NOT require same-day emergency ophthalmic assessment?", "options": ["Painless loss of vision 3h ago with a cherry-red spot", "Painful red eye in a corneal graft recipient", "Severe eye pain waking the patient with a tender globe", "Recurrent bilateral zigzag lines lasting 20 minutes then headache, normal exam", "Sudden binocular diplopia with new headache"], "answer": 3, "exp": "[G] Bilateral positive visual phenomena (~20 min) with subsequent headache = migraine with aura — UK triage routes this to primary care. Bilaterality and the march distinguish cortical from retinal (monocular) pathology. The others are true emergencies (CRAO 8h; graft 24h; scleritis 24h; diplopia+headache immediate).", "type": "mcq"}, {"n": 31, "topic": "Acute angle closure", "stem": "Which commonly prescribed medication class is most likely to precipitate acute angle closure in a predisposed patient?", "options": ["Beta-blockers", "ACE inhibitors", "Anticholinergics and drugs with antimuscarinic effects (e.g. tricyclics, oxybutynin)", "Statins", "Proton pump inhibitors"], "answer": 2, "exp": "[C/BNF] Pupil-dilating drugs precipitate closure in predisposed (hypermetropic, shallow AC) eyes: anticholinergics/antimuscarinics (tricyclics, oxybutynin, hyoscine, nebulised ipratropium), sympathomimetics, topical mydriatics. Topiramate does so by a different mechanism (ciliochoroidal effusion). Beta-blockers TREAT it.", "type": "mcq"}]}, {"code": "MEN", "title": "Bacterial Meningitis", "source": "NICE NG240 (2024) · MHRA", "hue": "#2dd4bf", "questions": [{"n": 1, "topic": "Meningitis (NG240)", "stem": "A 27-year-old man arrives in the ED at 02:10 with fever, severe headache, neck stiffness and confusion. Blood cultures, FBC, CRP, glucose and whole-blood PCR have been sent. It is now 02:55. The medical registrar can perform a lumbar puncture, but the procedure trolley and a second clinician will not be available for at least another 45 minutes. He is haemodynamically stable, GCS 14, with no focal neurology. What is the most appropriate next step?", "options": ["Wait for the lumbar puncture to be performed, then give IV ceftriaxone", "Give IV ceftriaxone now and perform the lumbar puncture as soon as it is safe to do so", "Arrange a CT head, then lumbar puncture, then antibiotics", "Give oral doxycycline while awaiting the lumbar puncture", "Give IV ceftriaxone only once CSF Gram stain confirms organisms"], "answer": 1, "exp": "[G] NICE NG240: give IV antibiotics as soon as bacterial meningitis is suspected and within 1 hour of arrival, after blood samples and LP — but only if the LP will not cause a clinically significant delay. A 45-minute wait at the 45-minute mark breaches the 1-hour target.\n\n[G] If antibiotics are given before LP, perform the LP as soon as possible afterwards (if safe). The LP is deferred, not abandoned.\n\n[G] Do not routinely image before LP, so C is wrong on two counts.\n\n[C] Doxycycline has no role in empirical bacterial meningitis, and waiting for Gram stain is an unsafe delay.\n\nBoundary point: the 1-hour antibiotic clock is the hard target; LP timing is flexible around it.", "type": "mcq"}, {"n": 2, "topic": "Meningitis (NG240)", "stem": "A 41-year-old woman has strongly suspected bacterial meningitis. She has fever, headache, neck stiffness and confusion. Pupils are equal and reactive, there is no focal deficit, no seizure activity, and no history of immunosuppression or malignancy. The ED consultant is asked whether a CT head is required before lumbar puncture. Which single feature, if present, would make neuroimaging necessary before lumbar puncture?", "options": ["Temperature of 39.4°C", "Neck stiffness with photophobia", "CRP greater than 200 mg/L", "A Glasgow Coma Scale score of 9 or less", "Age over 60 years"], "answer": 3, "exp": "[G] NICE NG240: do NOT routinely image before LP. Image only for risk factors of an evolving space-occupying lesion, or features suggesting raised ICP: new focal neurological features (including seizures or posturing), abnormal pupillary reactions, GCS 9 or less, or a progressive/rapid fall in consciousness.\n\n[G] Take bloods, give antibiotics and stabilise BEFORE imaging — imaging never delays the antibiotic.\n\n[C] Fever height, meningism, CRP value and age are not imaging triggers. The threshold is GCS ≤9 (not ≤13, not ≤8).\n\nNG240 moved practice towards LESS imaging, because CT-first delays antibiotics and worsens outcomes.", "type": "mcq"}, {"n": 3, "topic": "Meningitis (NG240)", "stem": "A 19-year-old university student presents with fever, headache, confusion and a purpuric rash across the trunk and limbs which has visibly spread over the last 30 minutes. Blood pressure is 88/50 mmHg. Coagulation screen is normal. The FY2 asks when the lumbar puncture should be performed. What is the most appropriate approach to lumbar puncture?", "options": ["Perform the lumbar puncture as soon as antibiotics have been given", "Perform the lumbar puncture after a normal CT head", "Perform the lumbar puncture after a platelet transfusion", "Perform the lumbar puncture under general anaesthesia in theatre", "Do not perform a lumbar puncture; treat and diagnose on clinical features and blood tests"], "answer": 4, "exp": "[G] NICE NG240: do NOT perform an LP if there is extensive or rapidly spreading purpura, infection at the LP site, risk factors for an evolving space-occupying lesion, or features of raised ICP. Rapidly spreading purpura is an independent contraindication in its own right — it does not depend on the clotting screen.\n\n[G] Confirm meningococcal disease on blood results plus clinical features (blood culture, WCC, CRP/PCT, lactate, whole-blood PCR). CSF is not required to make this diagnosis.\n\n[G] Shock must be treated and stabilised before any LP anyway.\n\n[C] A normal platelet count/coagulation screen is irrelevant here — the contraindication is the purpura itself and the instability.", "type": "mcq"}, {"n": 4, "topic": "Meningitis (NG240)", "stem": "A 6-year-old is brought to a rural GP surgery with fever, headache, neck stiffness and drowsiness. Bacterial meningitis is strongly suspected. The nearest emergency department is 70 minutes away by road and no air ambulance is available. There is no history of allergy. What is the most appropriate management before transfer?", "options": ["Give intramuscular or intravenous ceftriaxone or benzylpenicillin now and transfer as an emergency", "Transfer immediately as an emergency without giving antibiotics", "Give oral amoxicillin and transfer as an emergency", "Await the ambulance and treat only if the child deteriorates en route", "Give intramuscular dexamethasone before transfer"], "answer": 0, "exp": "[G] NICE NG240: if there is likely to be a clinically significant delay in transfer for STRONGLY suspected bacterial meningitis, give IV or IM ceftriaxone or benzylpenicillin outside hospital. A 70-minute road transfer is such a delay.\n\n[G] The counterweight: do NOT delay transfer in order to give antibiotics. Pre-hospital antibiotics accompany emergency transfer, never replace it.\n\n[G] Withhold pre-hospital antibiotics only if there is severe allergy to both ceftriaxone and benzylpenicillin.\n\n[C] Oral antibiotics have no role. Dexamethasone is an in-hospital decision, not pre-hospital.\n\nBoundary point: the decision hinges on 'strongly suspected' AND transfer time. Short transfer → just go.", "type": "mcq"}, {"n": 5, "topic": "Meningitis (NG240)", "stem": "A 78-year-old woman with type 2 diabetes presents with confusion, fever and neck stiffness. Bacterial meningitis is strongly suspected. Blood cultures have been taken and LP is being arranged. She has no drug allergies. The causative organism is not yet known. What is the most appropriate initial intravenous antibiotic regimen?", "options": ["Ceftriaxone alone", "Benzylpenicillin plus gentamicin", "Ceftriaxone plus amoxicillin", "Meropenem alone", "Ceftriaxone plus vancomycin"], "answer": 2, "exp": "[G] NICE NG240: when the organism is unknown, give IV ceftriaxone at the highest dose (cefotaxime if ceftriaxone contraindicated).\n\n[G] Add IV amoxicillin for people with risk factors for Listeria monocytogenes: very old or very young, pregnancy, cancer, kidney disease, liver disease, DIABETES, alcohol misuse, immunosuppressive drugs. This patient has two (age 78, diabetes).\n\n[C] Listeria is intrinsically resistant to third-generation cephalosporins — hence the amoxicillin add-on.\n\n[C] Vancomycin add-on is a US/IDSA convention for resistant pneumococcus, NOT the NICE recommendation. Meropenem is only for coliform meningitis on specialist advice.\n\nScan for pregnancy, alcohol, diabetes, immunosuppression, malignancy, CKD/liver disease — not just age.", "type": "mcq"}, {"n": 6, "topic": "Meningitis (NG240)", "stem": "A 33-year-old man has strongly suspected bacterial meningitis. He has a clearly documented episode of anaphylaxis to ceftriaxone two years ago requiring intensive care admission. He has no risk factors for Listeria monocytogenes. What is the most appropriate antibiotic?", "options": ["Cefotaxime", "Ceftriaxone with antihistamine and steroid cover", "Co-trimoxazole", "Benzylpenicillin", "Chloramphenicol"], "answer": 4, "exp": "[G] NICE NG240: ask about the nature of the reaction. Non-severe allergy → still give ceftriaxone. Severe allergic reaction → chloramphenicol for most organisms or when the cause is unknown. Severe allergy PLUS Listeria risk → co-trimoxazole and chloramphenicol.\n\n[C] Cefotaxime is another third-generation cephalosporin — it does not avoid cross-reactivity after ceftriaxone anaphylaxis. It is the alternative for CONTRAINDICATION (pre-term neonates, calcium co-administration), not for severe allergy.\n\n[C] Co-trimoxazole alone does not cover the main pathogens; it is the Listeria-specific add-on.\n\nBoundary point: severity of the reaction switches the answer, not the presence of allergy per se.", "type": "mcq"}, {"n": 7, "topic": "Meningitis (NG240)", "stem": "A 45-year-old man is transferred from a district general hospital. IV ceftriaxone was started there 6 hours ago. CSF obtained after antibiotics shows a neutrophil pleocytosis, high protein and a low CSF:blood glucose ratio, and bacterial meningitis is now confirmed clinically. He has not received any corticosteroid. What is the most appropriate management of dexamethasone?", "options": ["Withhold dexamethasone because antibiotics have already been started", "Give intravenous dexamethasone as soon as possible now", "Give dexamethasone only if pneumococcus is subsequently confirmed", "Give dexamethasone 24 hours after the antibiotics were started", "Get infection specialist advice before giving any dexamethasone"], "answer": 1, "exp": "[G] NICE NG240: give the first dexamethasone dose with or before the first antibiotic if possible; do NOT delay antibiotics for it. If dexamethasone is delayed LESS than 12 hours after antibiotics → give as soon as possible. If MORE than 12 hours → get infection specialist advice.\n\nAt 6 hours he is inside the 12-hour window, so give it now.\n\n[G] Dexamethasone is for people over 3 months with strongly suspected or confirmed bacterial meningitis — it does not require organism confirmation first. Once the organism is known, continue for pneumococcus or Hib, stop for everything else.\n\n[C] The evidence came from studies giving steroid before/with antibiotics and none beyond 12 hours — hence the rule.", "type": "mcq"}, {"n": 8, "topic": "Meningitis (NG240)", "stem": "A 52-year-old woman was admitted overnight with confusion and fever and was started on IV ceftriaxone 18 hours ago. Bacterial meningitis is now confirmed on CSF. Dexamethasone was never prescribed. She remains drowsy. What is the most appropriate management of corticosteroid therapy?", "options": ["Give high-dose intravenous dexamethasone immediately", "Dexamethasone is absolutely contraindicated at this point", "Give hydrocortisone instead of dexamethasone", "Get infection specialist advice on whether dexamethasone is still likely to provide benefit", "Give dexamethasone only if her GCS deteriorates further"], "answer": 3, "exp": "[G] NICE NG240: if dexamethasone is delayed MORE than 12 hours after the start of antibiotics, get advice from an infection specialist on whether it is still likely to benefit.\n\n[G] This is a judgement, not a prohibition: current practice is not to give steroid beyond 12 hours, but there was no evidence for or against it, and there are situations where it would benefit. Hence 'discuss', not 'never'.\n\n[C] The classic pairing with the previous question — two sides of the same 12-hour threshold: <12 h → give as soon as possible (your decision); >12 h → infection specialist advice (escalate).\n\n[C] Hydrocortisone substitution has no basis; the evidence is for high-dose dexamethasone.", "type": "mcq"}, {"n": 9, "topic": "Meningitis (NG240)", "stem": "A 24-year-old man was started on IV ceftriaxone and IV dexamethasone for strongly suspected bacterial meningitis. On day 2, both CSF PCR and blood culture confirm Neisseria meningitidis. He is improving. What is the most appropriate management of the dexamethasone?", "options": ["Stop the dexamethasone", "Continue dexamethasone for a full 4-day course", "Continue dexamethasone at half the current dose", "Switch to oral prednisolone to complete the course", "Continue dexamethasone and add fludrocortisone"], "answer": 0, "exp": "[G] NICE NG240: when the organism is found, CONTINUE dexamethasone if it is Streptococcus pneumoniae or Haemophilus influenzae type b; STOP for all other organisms. Neisseria meningitidis is 'all other organisms' → stop.\n\n[G] If NO organism is found, get infection specialist advice on whether to continue.\n\n[G] Do not routinely give corticosteroids in meningococcal disease at all — high-dose dexamethasone increased mortality in children/young people with meningococcal disease.\n\n[C] Mnemonic: steroid stays only for the two organisms with the strongest hearing/mortality benefit — pneumococcus and Hib. Everything else (meningococcus, listeria, GBS, coliforms) gets it stopped.", "type": "mcq"}, {"n": 10, "topic": "Meningitis (NG240)", "stem": "A 20-year-old woman with confirmed meningococcal septicaemia is in intensive care. She remains profoundly hypotensive despite fluid resuscitation and high-dose noradrenaline and adrenaline infusions. She has a widespread purpuric rash and multi-organ dysfunction. What is the most appropriate corticosteroid strategy?", "options": ["High-dose intravenous dexamethasone", "Corticosteroids are contraindicated in all meningococcal disease", "Pulsed intravenous methylprednisolone", "A single high-dose hydrocortisone bolus only, then stop", "Consider low-dose replacement corticosteroids"], "answer": 4, "exp": "[G] NICE NG240: do NOT routinely give corticosteroids in meningococcal disease. But CONSIDER low-dose replacement corticosteroids for meningococcal septic shock not responding to high-dose vasoactive agents — precisely this patient.\n\n[G] High-dose dexamethasone increased mortality in babies, children and young people with meningococcal disease, so it is off the table — but low-dose replacement steroid for catecholamine-refractory shock remains an option.\n\n[C] Two distinct ideas: high-dose anti-inflammatory dexamethasone (for pneumococcal/Hib MENINGITIS) versus low-dose replacement steroid for refractory septic shock. Option B overstates it — 'not routinely' is not 'never'.", "type": "mcq"}, {"n": 11, "topic": "Meningitis (NG240)", "stem": "A 6-week-old term baby is admitted with fever, poor feeding, a bulging fontanelle and reduced responsiveness. Bacterial meningitis is strongly suspected and IV antibiotics are being drawn up. The registrar asks about corticosteroids. What is the most appropriate management regarding dexamethasone?", "options": ["Give intravenous dexamethasone with the first dose of antibiotics", "Give dexamethasone only once pneumococcus is confirmed", "Get infection specialist advice on using dexamethasone", "Dexamethasone is contraindicated in anyone under 3 months of age", "Give oral prednisolone instead of dexamethasone"], "answer": 2, "exp": "[G] NICE NG240 age bands for dexamethasone: over 3 months → give IV dexamethasone; 28 days to 3 months → GET INFECTION SPECIALIST ADVICE; 28 days or under → not recommended (research recommendation instead). A 6-week-old sits in the 28 days–3 months band → escalate for advice.\n\n[G] Rationale: no evidence supporting or refuting dexamethasone between 28 days and 3 months, so specialist input is required rather than a blanket rule.\n\n[C] Option D overstates it — this is uncertainty, not contraindication.\n\n[G] In March 2024 all uses of dexamethasone in this section were off-label. The two age thresholds (28 days / 3 months) are the examinable numbers.", "type": "mcq"}, {"n": 12, "topic": "Meningitis (NG240)", "stem": "A 38-year-old man presents with fever, headache, neck stiffness and confusion. There is no seizure activity, no focal neurological deficit, no personality or behavioural change, and no history of cold sores or immunosuppression. Bacterial meningitis is strongly suspected and IV ceftriaxone has been given within the hour. What is the most appropriate management regarding aciclovir?", "options": ["Give IV aciclovir to all patients with suspected bacterial meningitis", "Give IV aciclovir until the CSF herpes simplex PCR is negative", "Give oral valaciclovir until CSF results return", "Do not routinely give aciclovir unless herpes simplex encephalitis is strongly suspected", "Give aciclovir only if dexamethasone is being used"], "answer": 3, "exp": "[G] NICE NG240: do NOT routinely give IV aciclovir unless herpes simplex encephalitis is strongly suspected.\n\n[C] A deliberate boundary against adding aciclovir to every 'fever plus confusion' patient. Features shifting suspicion to HSV encephalitis are altered behaviour/personality change, new seizures, focal neurology (especially temporal lobe), and progressive confusion out of proportion to meningism — none present here.\n\n[G] Continue the initial antibiotic until blood and CSF results suggest otherwise. So continue ceftriaxone and reassess on results, not empirical antiviral cover.\n\n[C] Oral valaciclovir has no role in suspected CNS infection — CNS penetration requires IV aciclovir.", "type": "mcq"}, {"n": 13, "topic": "Meningitis (NG240)", "stem": "A 2-year-old with confirmed bacterial meningitis is receiving an intravenous ceftriaxone infusion. She develops a seizure and is found to have symptomatic hypocalcaemia requiring intravenous calcium gluconate. She currently has a single peripheral cannula in situ. What is the most appropriate action?", "options": ["Give the calcium gluconate through the same cannula alongside the ceftriaxone infusion", "Do not co-administer calcium with ceftriaxone; obtain separate access with separated administration and discuss switching to cefotaxime", "Stop all antibiotics until the calcium has been corrected", "Give oral calcium supplementation only until the ceftriaxone course is complete", "Withhold calcium replacement until the ceftriaxone course finishes"], "answer": 1, "exp": "[G] NICE NG240 carries a March 2024 MHRA safety flag: ceftriaxone is INCOMPATIBLE with calcium-containing solutions. Ceftriaxone–calcium precipitates have caused fatal pulmonary and renal events, particularly in neonates.\n\n[G] Cefotaxime is the alternative wherever ceftriaxone is contraindicated.\n\n[C] Symptomatic hypocalcaemia with seizure is a life threat and must be treated — options C, D and E all fail the patient.\n\n[C] Practical answer: separate line/separated administration with adequate flushing, and switch to cefotaxime if calcium-containing fluids will be needed repeatedly.\n\n[G] Ceftriaxone is also contraindicated in pre-term babies under 41 weeks corrected gestational age.", "type": "mcq"}, {"n": 14, "topic": "Meningitis (NG240)", "stem": "A 9-year-old boy has confirmed pneumococcal meningitis and is on the paediatric ward. He is alert, euvolaemic and tolerating oral fluids. Serum sodium is 133 mmol/L. There are no signs of raised intracranial pressure or fluid overload. The FY1 asks whether he should be fluid restricted. What is the most appropriate fluid management?", "options": ["Restrict fluid intake to 50–60% of routine maintenance", "Restrict to two-thirds maintenance given intravenously", "Give routine maintenance fluids, orally or by enteral tube if tolerated", "Give intravenous 0.45% sodium chloride at 1.5 times maintenance", "Fluid restrict and give hypertonic saline"], "answer": 2, "exp": "[G] NICE NG240: do NOT routinely restrict fluid intake below routine maintenance in bacterial meningitis. Give maintenance fluids orally or by enteral tube if tolerated.\n\n[G] Why the change: fluid restriction reduced pulmonary/facial oedema but INCREASED neurological impairment and epilepsy. The committee prioritised neurological outcome, so routine restriction was dropped. 'Routinely' was deliberate — restriction is still appropriate in genuine fluid overload.\n\n[C] Mild hyponatraemia in meningitis is common and not on its own an indication to restrict. Isotonic fluids are used if IV fluids are needed; hypotonic 0.45% saline above maintenance is the wrong direction.\n\nThis reverses old teaching about routine two-thirds maintenance — a high-yield update.", "type": "mcq"}, {"n": 15, "topic": "Meningitis (NG240)", "stem": "A 47-year-old man with confirmed bacterial meningitis deteriorates on the ward. His GCS falls from 13 to 7, his right pupil becomes dilated and sluggish, and urgent CT shows diffuse cerebral oedema with early transtentorial herniation. The intensive care team has been called. What is the most appropriate immediate management?", "options": ["Give oral glycerol", "Insert an invasive intracranial pressure monitor routinely in the emergency department", "Restrict fluids to 50% of maintenance", "Perform a therapeutic lumbar puncture to lower the pressure", "Consider an osmotic agent other than glycerol as a temporary measure and get urgent critical care advice"], "answer": 4, "exp": "[G] NICE NG240: with signs of raised ICP and herniation concern — consider osmotic agents (but NOT glycerol) as a TEMPORARY measure and get urgent critical care advice.\n\n[G] Do not use glycerol at all in bacterial meningitis (higher mortality vs placebo). Do not ROUTINELY use other osmotic agents (mannitol, hypertonic saline) — they are reserved for exactly this herniation scenario.\n\n[G] Do not routinely use invasive ICP monitoring; get specialist advice on it if features of raised ICP or hydrocephalus. It is an ICU/neurosurgical decision, not an ED one.\n\n[C] LP with herniation is catastrophic and absolutely contraindicated.\n\nThree separate 'do not routinely' statements — the exam tests the exception that unlocks each.", "type": "mcq"}, {"n": 16, "topic": "Meningitis (NG240)", "stem": "A 21-year-old woman has confirmed Neisseria meningitidis meningitis. She has been treated with intravenous ceftriaxone and by day 5 she is afebrile, fully orientated, mobilising and eating normally. Inflammatory markers have normalised. What is the most appropriate antibiotic duration?", "options": ["Stop antibiotics after 5 days", "Continue antibiotics to a total of 7 days", "Continue antibiotics to a total of 10 days", "Continue antibiotics to a total of 14 days", "Continue antibiotics to a total of 21 days"], "answer": 0, "exp": "[G] NICE NG240 organism-specific durations (then stop if recovered, or get advice if not): Neisseria meningitidis 5 days; Haemophilus influenzae type b 7 days (to 10 if not recovered); Streptococcus pneumoniae 10 days; Group B streptococcus 14 days; Enterobacterales (coliforms) 21 days; Listeria monocytogenes 21 days (amoxicillin/ampicillin, not ceftriaxone).\n\n[G] Meningococcal DISEASE (including septicaemia) is likewise 5 days.\n\n[G] No difference between 5-day and 10-day ceftriaxone for Hib and meningococcal meningitis; other durations from committee experience.\n\n[C] Memorise 5–7–10–14–21–21. Durations are a favourite boundary and the numbers are not intuitive.", "type": "mcq"}, {"n": 17, "topic": "Meningitis (NG240)", "stem": "A 30-year-old man attends with a 6-hour history of fever, severe headache, neck stiffness and mild confusion noted by his partner. He looks unwell but is haemodynamically stable. Initial bloods show CRP 8 mg/L, white cell count 9.1 × 10⁹/L and lactate 1.2 mmol/L. What is the most appropriate management?", "options": ["Discharge with safety-netting advice as the inflammatory markers are normal", "Repeat the CRP in 6 hours before deciding on treatment", "Give oral antibiotics and arrange review in 24 hours", "Continue the bacterial meningitis pathway, giving intravenous antibiotics within 1 hour of arrival", "Diagnose viral meningitis and admit for observation without antibiotics"], "answer": 3, "exp": "[G] NICE NG240: STRONGLY suspect bacterial meningitis with ALL of fever, headache, neck stiffness, and altered consciousness or cognition (including confusion/delirium). This patient has all four.\n\n[G] Do NOT rule out bacterial meningitis on a normal CRP, PCT or white cell count. Confirm on clinical features AND blood tests AND LP — no single test rules in or out.\n\n[C] Early presentation (6 hours) is exactly when CRP has not yet risen; a normal CRP in the first hours is a trap, not reassurance.\n\n[G] Bacterial meningitis can still be strongly suspected even when not all red flags are present. Safety netting applies to people you are sending home — not to the full red-flag combination.", "type": "mcq"}, {"n": 18, "topic": "Meningitis (NG240)", "stem": "A 44-year-old man is recovering on the ward from confirmed pneumococcal meningitis. He has no known immunodeficiency, is fully immunised, and reports no risk factors for blood-borne viruses. The consultant asks what additional testing NICE recommends. Which single investigation should be performed?", "options": ["Serum immunoglobulins alone", "An HIV test", "Complement function testing alone", "No further testing is needed in the absence of risk factors", "CT of the temporal bones"], "answer": 1, "exp": "[G] NICE NG240: test for HIV in ADULTS with bacterial meningitis or meningococcal disease. This is unconditional — it does not depend on declared risk factors, and HIV testing is among the routine bloods for suspected bacterial meningitis.\n\n[G] For babies, children and young people, only CONSIDER HIV testing, and only with signs of immunodeficiency or HIV risk factors. After a RECURRENT episode, test for HIV in all age groups.\n\n[G] Rationale: higher risk of pneumococcal and invasive meningococcal disease with HIV, and higher HIV prevalence among people with bacterial meningitis.\n\n[C] The examinable contrast: adults (test) vs children (consider, if indicated) vs recurrence (test everyone).", "type": "mcq"}, {"n": 19, "topic": "Meningitis (NG240)", "stem": "A previously well, fully immunised 3-year-old girl is recovering from confirmed Streptococcus pneumoniae meningitis. She has had no previous serious infections and there is no relevant family history. What additional step does NICE recommend?", "options": ["No further action beyond routine GP follow-up", "Lifelong prophylactic penicillin without specialist review", "Refer to a paediatric immunology and infectious disease specialist to assess for primary immunodeficiency", "Repeat lumbar puncture at 6 weeks", "Test for HIV as the only additional investigation"], "answer": 2, "exp": "[G] NICE NG240: refer children/young people with PNEUMOCOCCAL meningitis to a paediatric immunology and infectious disease specialist to assess for primary immunodeficiency.\n\n[G] Rationale: pneumococcal meningitis may indicate poor immune response to vaccination or a primary immune deficiency — present in 8% to 26% of children with invasive pneumococcal disease. Adults were excluded (no evidence of increased primary immunodeficiency).\n\n[G] For babies and young children with bacterial meningitis, also examine the back and scalp for a sinus tract.\n\n[C] Being fully immunised makes the referral MORE relevant — vaccine failure is the signal. Prophylaxis/further vaccines follow only after specialist review.", "type": "mcq"}, {"n": 20, "topic": "Meningitis (NG240)", "stem": "A 16-year-old is medically fit for discharge on day 8 after confirmed bacterial meningitis. During the discharge conversation she reports that sounds have been muffled in both ears since the acute illness. What is the most appropriate plan for her hearing?", "options": ["Reassure her and review her hearing at 6 months", "Make a routine ENT referral to be seen within 18 weeks", "Arrange audiology only at the 4 to 6 week post-discharge review", "Repeat assessment only if symptoms persist at 3 months", "Arrange audiological assessment within 4 weeks of her being well enough for testing, preferably before discharge, with urgent cochlear implant assessment if severe or profound deafness is found"], "answer": 4, "exp": "[G] NICE NG240: offer audiological assessment within 4 WEEKS of the person being well enough for testing, and preferably before discharge. Offer those with severe or profound deafness an URGENT cochlear implant assessment.\n\n[C] The urgency is anatomical: post-meningitic labyrinthitis ossificans can obliterate the cochlea within weeks to months, and delay can make implantation impossible. This is why hearing sits outside the general follow-up timetable.\n\n[G] Separately, the post-discharge review is at 4 to 6 WEEKS, and should not be delayed if hearing results are not yet available.\n\n[C] Keep the two numbers apart: audiology within 4 weeks of being fit to test (preferably pre-discharge); general review at 4–6 weeks.", "type": "mcq"}]}, {"code": "SEIZ", "title": "Seizures & Status Epilepticus", "source": "NICE NG217 · BNF/BNFc", "hue": "#7dd3fc", "questions": [{"n": 1, "topic": "Seizures & status (NG217)", "stem": "A 34-year-old man is brought to the ED with a generalised tonic-clonic seizure ongoing for 7 minutes. IV access is secured and full resuscitation facilities are available. He has no personal emergency management plan. What is the most appropriate first-line drug and route?", "options": ["IV lorazepam 4 mg", "Buccal midazolam 10 mg", "Rectal diazepam 10 mg", "IV levetiracetam 60 mg/kg", "IV phenytoin 20 mg/kg"], "answer": 0, "exp": "NG217 7.1.3 [G]: in hospital with IV access and resus facilities, IV lorazepam is first-line. Buccal midazolam / rectal diazepam are the community options used when there is no IV access. Levetiracetam and phenytoin are second-line, only after two failed benzodiazepine doses.", "type": "mcq"}, {"n": 2, "topic": "Seizures & status (NG217)", "stem": "IV lorazepam is chosen for an adult in convulsive status epilepticus. What is the standard adult dose?", "options": ["2 mg", "8 mg", "0.2 mg/kg", "0.5 mg/kg", "4 mg"], "answer": 4, "exp": "BNF [C]: adult IV lorazepam 4 mg (0.1 mg/kg, max 4 mg), repeated once after 10–20 minutes if needed. 0.1 mg/kg is the weight-based figure — 0.2 and 0.5 mg/kg are too high.", "type": "mcq"}, {"n": 3, "topic": "Seizures & status (NG217)", "stem": "A 40-year-old woman received buccal midazolam from paramedics, then IV lorazepam in the ED 8 minutes ago; she continues to seize. What is the most appropriate next step?", "options": ["A second dose of IV lorazepam", "Buccal midazolam", "Rectal diazepam", "IV levetiracetam", "IV phenytoin, but only after 30 minutes of seizure activity"], "answer": 3, "exp": "NG217 7.1.9 [G]: she has already had TWO benzodiazepine doses — the pre-hospital midazolam counts. After two benzo doses you move to an IV second-line agent (levetiracetam, phenytoin or valproate). A third benzodiazepine risks respiratory depression. You act now, not after an arbitrary 30-minute wait.", "type": "mcq"}, {"n": 4, "topic": "Seizures & status (NG217)", "stem": "A 23-year-old woman who may become pregnant in future remains in convulsive status after two doses of benzodiazepine. Which second-line IV agent is most appropriate?", "options": ["Sodium valproate 40 mg/kg", "Phenytoin 20 mg/kg", "Levetiracetam 60 mg/kg", "Phenobarbital 20 mg/kg", "Carbamazepine"], "answer": 2, "exp": "NG217 7.1.9 [G] lists levetiracetam, phenytoin OR valproate. Valproate must be avoided in women/girls of childbearing potential (MHRA pregnancy-prevention). Between the remaining two, NG217 notes levetiracetam may be quicker to give with fewer adverse effects → single best. Phenobarbital is third-line; carbamazepine has no IV/status role.", "type": "mcq"}, {"n": 5, "topic": "Seizures & status (NG217)", "stem": "Phenytoin is selected as the second-line agent. What is the correct loading dose and administration?", "options": ["15 mg/kg IV over 10 minutes", "20 mg/kg IV over 5 minutes", "10 mg/kg IV bolus", "20 mg/kg IV over about 20 minutes with cardiac monitoring", "30 mg/kg IV over 30 minutes"], "answer": 3, "exp": "BNF [C]: phenytoin 20 mg/kg (max 2 g) infused no faster than 1 mg/kg/min (max 50 mg/min) — roughly 20 minutes — with ECG and BP monitoring because of arrhythmia and hypotension risk. Rapid infusion (over 5 min) is dangerous.", "type": "mcq"}, {"n": 6, "topic": "Seizures & status (NG217)", "stem": "A 3-year-old (15 kg) has a prolonged convulsive seizure at triage with no IV access yet. What is the correct buccal midazolam dose?", "options": ["2.5 mg", "5 mg", "7.5 mg", "10 mg", "0.5 mg/kg"], "answer": 1, "exp": "BNFc [C] buccal midazolam by age band: 3–11 months 2.5 mg; 1–4 years 5 mg; 5–9 years 7.5 mg; 10–17 years and adult 10 mg. A 3-year-old = 5 mg.", "type": "mcq"}, {"n": 7, "topic": "Seizures & status (NG217)", "stem": "A 5-year-old is in convulsive status with IV access present and no benzodiazepine given yet. What is the correct IV lorazepam dose and the timing of a repeat?", "options": ["0.05 mg/kg, repeat after 5 minutes", "0.2 mg/kg, repeat after 10 minutes", "0.3 mg/kg, no repeat", "0.1 mg/kg, repeat after 20 minutes", "0.1 mg/kg, repeat once after 5–10 minutes"], "answer": 4, "exp": "BNFc [C]: IV lorazepam 0.1 mg/kg (max 4 mg). NG217 7.1.8 [G]: give the second benzodiazepine dose if the seizure has not stopped within 5–10 minutes of the first — and stop at two doses total.", "type": "mcq"}, {"n": 8, "topic": "Seizures & status (NG217)", "stem": "Per NG217, after the first benzodiazepine dose in convulsive status, a second dose should be given if the seizure has not stopped within what interval?", "options": ["5–10 minutes", "2 minutes", "Immediately", "15 minutes", "20 minutes"], "answer": 0, "exp": "NG217 7.1.8 [G]: second dose if not stopped within 5–10 minutes of the first.", "type": "mcq"}, {"n": 9, "topic": "Seizures & status (NG217)", "stem": "A 28-year-old man remains in convulsive status despite two benzodiazepine doses, full-dose IV levetiracetam, and then IV phenytoin as an alternative second-line agent. Seizures continue at ~45 minutes. What is the most appropriate next step?", "options": ["A third dose of benzodiazepine", "Repeat the levetiracetam", "IV magnesium sulfate", "IV sodium valproate as a third second-line agent", "Rapid sequence induction / general anaesthesia and call ICU-anaesthetics"], "answer": 4, "exp": "NG217 7.1.11 [G]: refractory status after second-line options → third-line phenobarbital OR general anaesthesia under expert guidance. In the ED this means RSI with an anaesthetic agent (e.g. thiopental/propofol) and ICU. Stacking further benzos or second-line agents is not appropriate here.", "type": "mcq"}, {"n": 10, "topic": "Seizures & status (NG217)", "stem": "A 33-year-old woman at 34 weeks' gestation has a witnessed generalised tonic-clonic seizure in the ED; BP 168/110, no known epilepsy. What is the most appropriate first-line drug?", "options": ["IV magnesium sulfate 4 g over 5–15 minutes", "IV lorazepam 4 mg", "IV levetiracetam 60 mg/kg", "IV phenytoin 20 mg/kg", "Buccal midazolam 10 mg"], "answer": 0, "exp": "Eclampsia — NG217 7.1.4 [G] flags eclampsia as a cause needing specific treatment. Magnesium sulfate 4 g IV loading over 5–15 min then 1 g/hr [C, RCOG/MBRRACE] is first-line for the eclamptic seizure, not a benzodiazepine. Treat the BP and involve obstetrics.", "type": "mcq"}, {"n": 11, "topic": "Seizures & status (NG217)", "stem": "A 50-year-old man is in convulsive status; capillary glucose is 1.9 mmol/L. In addition to a benzodiazepine, what is the most important immediate treatment?", "options": ["IV phenytoin", "IV levetiracetam", "IV 10% glucose", "IV thiamine before any glucose", "Oral carbohydrate"], "answer": 2, "exp": "Hypoglycaemia is a reversible cause (NG217 7.1.4 [G]). Correct it immediately with IV glucose — do not delay for anything. (Thiamine is given alongside glucose where chronic alcohol misuse or malnutrition is suspected, but correcting profound hypoglycaemia is the priority and isn't withheld for it.)", "type": "mcq"}, {"n": 12, "topic": "Seizures & status (NG217)", "stem": "A 45-year-old man with alcohol dependence has a witnessed generalised seizure and is now post-ictal. If he seizes again, what is the most appropriate acute pharmacological management?", "options": ["IV phenytoin loading", "IV levetiracetam", "IV sodium valproate", "A benzodiazepine plus IV thiamine (Pabrinex)", "Oral carbamazepine"], "answer": 3, "exp": "[C]: alcohol-withdrawal seizures respond to benzodiazepines; phenytoin is ineffective for withdrawal seizures. Give thiamine to prevent Wernicke's encephalopathy.", "type": "mcq"}, {"n": 13, "topic": "Seizures & status (NG217)", "stem": "A 26-year-old woman has a first, unprovoked generalised tonic-clonic seizure. She has fully recovered, GCS 15, normal neurological exam, normal glucose and ECG, no head injury. What is the most appropriate ED disposition?", "options": ["Admit for 24-hour observation", "Discharge with referral to a first-seizure / epilepsy specialist to be seen within 2 weeks, plus safety and driving advice", "Start levetiracetam and discharge", "Arrange a routine neurology referral within 6 weeks", "Discharge with no follow-up, as it is a single seizure"], "answer": 1, "exp": "NG217 [G]: a suspected first seizure should be seen by a specialist within 2 weeks. Antiseizure medication is not routinely started in the ED after a single seizure — that is a specialist decision, usually after a second seizure. Give DVLA and safety advice on discharge.", "type": "mcq"}, {"n": 14, "topic": "Seizures & status (NG217)", "stem": "The same woman holds an ordinary (Group 1) car licence and asks about driving. After a first unprovoked seizure with normal investigations, what is the correct advice?", "options": ["She may continue driving", "Stop driving, notify the DVLA; 1 month off driving", "Stop driving, notify the DVLA; 12 months off driving", "Stop driving, notify the DVLA; 6 months off driving", "Lifetime driving ban"], "answer": 3, "exp": "DVLA [C]: a first unprovoked seizure with no relevant abnormality on investigation = 6 months off Group 1 driving. Established epilepsy needs 12 months seizure-free. The patient (not the ED) must notify the DVLA.", "type": "mcq"}, {"n": 15, "topic": "Seizures & status (NG217)", "stem": "Which patient presenting to the ED after a seizure most requires an urgent CT head before discharge?", "options": ["A known epileptic with a typical seizure, back to baseline", "A first seizure, fully recovered with a normal exam", "A patient post-ictal but steadily improving with no focal signs", "A provoked seizure from documented hypoglycaemia, now corrected", "A patient with a new persistent focal neurological deficit that is not resolving"], "answer": 4, "exp": "[C, RCEM]: urgent neuroimaging is indicated for failure to return to baseline, a new focal deficit, head injury, anticoagulation, immunocompromise, or suspected SAH / space-occupying lesion. A resolved provoked seizure with a clear reversible cause does not mandate acute CT.", "type": "mcq"}, {"n": 16, "topic": "Seizures & status (NG217)", "stem": "A 30-year-old develops a generalised seizure during an ultrasound-guided regional nerve block; the ECG shows broad complexes. Besides airway control and a benzodiazepine, what is the key specific treatment?", "options": ["IV phenytoin", "IV sodium bicarbonate", "IV 20% lipid emulsion", "IV levetiracetam", "IV flumazenil"], "answer": 2, "exp": "Local anaesthetic systemic toxicity (LAST) [C, AAGBI]: stop the injection, give IV 20% lipid emulsion (1.5 mL/kg bolus then infusion), and treat seizures with a benzodiazepine. Manage arrest with prolonged ALS.", "type": "mcq"}, {"n": 17, "topic": "Seizures & status (NG217)", "stem": "A 22-year-old has seizures after a tricyclic antidepressant overdose; the ECG shows QRS 130 ms. Which management is correct?", "options": ["IV sodium bicarbonate plus a benzodiazepine", "IV phenytoin", "IV flecainide", "IV levetiracetam then phenytoin", "IV magnesium sulfate 4 g"], "answer": 0, "exp": "TCA toxicity [C, TOXBASE]: IV sodium bicarbonate for QRS widening (>100–120 ms) and benzodiazepines for seizures. Phenytoin is contraindicated — it can worsen the cardiotoxicity/arrhythmia; class Ia/Ic agents are also avoided.", "type": "mcq"}, {"n": 18, "topic": "Seizures & status (NG217)", "stem": "A patient being treated for tuberculosis is in status epilepticus after an isoniazid overdose, unresponsive to two benzodiazepine doses. What is the most appropriate specific treatment?", "options": ["IV phenytoin", "IV pyridoxine (vitamin B6)", "IV levetiracetam", "IV sodium valproate", "IV phenobarbital"], "answer": 1, "exp": "[C, TOXBASE]: isoniazid-induced seizures are typically refractory to standard agents. IV pyridoxine is the antidote — gram-for-gram with the ingested isoniazid, or 5 g if the amount is unknown.", "type": "mcq"}, {"n": 19, "topic": "Seizures & status (NG217)", "stem": "A 6-year-old in convulsive status has had two benzodiazepine doses without effect and takes no regular antiseizure medication. Which is the most appropriate second-line agent?", "options": ["A third dose of benzodiazepine", "Oral carbamazepine", "IV levetiracetam", "IV magnesium sulfate", "Rectal paraldehyde as the required next step"], "answer": 2, "exp": "NG217 7.1.9 [G]: after two benzo doses, give an IV second-line agent — levetiracetam, phenytoin or valproate. Levetiracetam is commonly preferred (quicker, fewer adverse effects; EcLiPSE trial). Note: if the child were already on regular phenytoin, phenobarbital would be used instead.", "type": "mcq"}, {"n": 20, "topic": "Seizures & status (NG217)", "stem": "How does NG217 define convulsive status epilepticus — i.e. at what point should emergency treatment begin?", "options": ["A convulsive seizure lasting 2 minutes or more", "A convulsive seizure lasting 5 minutes or more", "A convulsive seizure lasting 10 minutes or more", "A convulsive seizure lasting 20 minutes or more", "A convulsive seizure lasting 30 minutes or more"], "answ

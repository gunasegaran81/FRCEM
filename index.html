arge after naloxone?", "options": ["2 h after last dose; 4 h since use", "4 h after last naloxone dose; 6 h since suspected opioid use", "6 h; 12 h", "1 h; 2 h", "12 h regardless"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ≥4 h after naloxone AND ≥6 h since use.", "type": "mcq"}, {"n": 62, "topic": "Prevention", "stem": "US study: at 12 months after non-fatal overdose, patients died at approximately what rate vs the general population?", "options": ["2x", "5x", "10x", "24x", "50x"], "answer": 3, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). ~24x.", "type": "mcq"}, {"n": 63, "topic": "Prevention", "stem": "Causes of death noted in that cohort?", "options": ["Only respiratory failure", "Drug-use-associated diseases, HIV, chronic respiratory disease, viral hepatitis and suicide", "Only cardiovascular", "Only trauma", "Only malignancy"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Broad — drug-associated disease, HIV, respiratory, hepatitis, suicide.", "type": "mcq"}, {"n": 64, "topic": "Prevention", "stem": "Secondary prevention opportunities after an opioid presentation?", "options": ["Brief intervention, referral to drug liaison services, encouraging engagement with community services", "Compulsory detox admission", "Police notification in all cases", "Discharge with no action if obs normal", "Bariatric referral"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Brief intervention + drug liaison + community engagement.", "type": "mcq"}, {"n": 65, "topic": "Prevention", "stem": "What is take-home naloxone, and what supports its provision?", "options": ["Experimental, no evidence", "In-hospital/community IM or nasal naloxone with training; reduces drug-related deaths", "USA only", "Effective only with buprenorphine", "Prophylactic tablets"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). IM/nasal take-home naloxone with training reduces deaths.", "type": "mcq"}, {"n": 66, "topic": "Prevention", "stem": "Legal duty of EDs in England re homelessness in this group?", "options": ["No duty exists", "Duty to refer someone believed homeless, or threatened within 56 days, to a housing authority of their choice", "Only provide a leaflet", "Only if the patient requests", "Only for under-18s"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Duty to refer to housing (56-day threshold).", "type": "mcq"}, {"n": 67, "topic": "Prevention", "stem": "Other health screening to consider in this high-risk cohort?", "options": ["Bone density", "Blood-borne virus testing", "Routine echocardiography", "Colonoscopy", "Genetic testing"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Blood-borne virus screening.", "type": "mcq"}, {"n": 68, "topic": "Harm reduction", "stem": "Advice about variability of drug supply?", "options": ["Purity is consistent, no need to test", "Test first — start with a small amount or inject slowly, as potency/content varies", "Only use pharmacy drugs", "Avoid injecting entirely", "Test by tasting"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Start small; potency varies.", "type": "mcq"}, {"n": 69, "topic": "Harm reduction", "stem": "Advice about using alone vs with others?", "options": ["Alone is safer", "Use with others if possible; using alone is riskier — no one to help if overdose", "No difference", "Only in public", "Group use always avoided"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Don't use alone.", "type": "mcq"}, {"n": 70, "topic": "Harm reduction", "stem": "List the signs of overdose from the 'Look out for the signs' section. (Short answer, ≥4)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "Falling unconscious; very light/shallow breathing or no breathing; loud raspy snoring or gurgling; blue or pale lips or fingertips."}, {"n": 71, "topic": "Harm reduction", "stem": "Bystander steps per 'Naloxone: get it, carry it, use it'?", "options": ["Wait 30 min for spontaneous recovery", "Act fast, call 999, check breathing, recovery position, give naloxone ASAP", "Give food and water first", "Only give naloxone if a HCP is present", "Restrain until EMS arrive"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). Call 999, check breathing, recovery position, naloxone ASAP.", "type": "mcq"}, {"n": 72, "topic": "Recall", "stem": "State, in your own words, the four Summary Recommendations at the start of the guideline. (Short answer)", "options": [], "answer": null, "exp": "Model answer below.", "type": "short", "model": "1) Naloxone's aim is reversal of respiratory depression / maintenance of airway reflexes, not full reversal of unconsciousness. 2) Adverse effects are more likely with excessive doses. 3) Observe ≥4 h after last naloxone dose and ≥6 h after suspected opioid use, adjusted for the opioid's duration. 4) Non-fatal overdose is an opportunity for brief intervention, referral to drug liaison, and community engagement."}, {"n": 73, "topic": "Recall (T/F)", "stem": "The aim of naloxone therapy is to fully awaken the patient to GCS 15.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — the aim is reversal of respiratory depression, not full arousal.", "type": "mcq"}, {"n": 74, "topic": "Recall (T/F)", "stem": "Patients should generally be observed ≥4 h after the last naloxone dose AND ≥6 h after suspected opioid use, adjusted for the opioid's duration of action.", "options": ["True", "False"], "answer": 0, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). TRUE.", "type": "mcq"}, {"n": 75, "topic": "Recall (T/F)", "stem": "Non-fatal overdose should be treated purely as a medical event with no further intervention once medically stable.", "options": ["True", "False"], "answer": 1, "exp": "Per RCEM/NPIS Acute Opioid Toxicity guideline (April 2024). FALSE — it is an opportunity for secondary prevention.", "type": "mcq"}]}, {"code": "TOX20", "title": "UK ED Toxicology", "source": "TOXBASE/NPIS · RCEM · MHRA · AAGBI", "hue": "#fbbf24", "questions": [{"n": 1, "topic": "UK ED toxicology", "stem": "A 22-year-old presents 6 hours after taking a single-episode overdose of 30 paracetamol tablets. A timed paracetamol level is above the treatment (100) line on the nomogram. According to current UK guidance, what is the correct management?", "options": ["Give oral methionine and discharge", "Give activated charcoal alone", "No treatment, as she presented within 8 hours", "Start intravenous acetylcysteine using the SNAP 12-hour regimen", "Wait until 8 hours post-ingestion before deciding"], "answer": 3, "exp": "[G] TOXBASE/NPIS/RCEM: for a single acute overdose, take a timed paracetamol level at 4 hours or later and treat with acetylcysteine (NAC) if it is above the 100-line.\n\n[G] The UK standard is now the SNAP 12-hour regimen (100 mg/kg over 2 hours, then 200 mg/kg over 10 hours), recommended by RCEM/NPIS since 2021 - fewer anaphylactoid reactions and shorter stay than the old 21-hour regimen.\n\n[C] NAC is most effective within 8 hours; being within 8 hours is a reason to ensure timely treatment, not to withhold it when the level is above the line.", "type": "mcq"}, {"n": 2, "topic": "UK ED toxicology", "stem": "A patient reports taking paracetamol in several doses over the last 24 hours (a staggered overdose), and the exact timing and amount are uncertain. What is the correct approach to acetylcysteine?", "options": ["Withhold treatment until a level can be plotted", "Give treatment only if the level is undetectable", "Treat with acetylcysteine regardless of the paracetamol level", "Discharge if asymptomatic at 4 hours", "Plot a single level on the nomogram and treat only if above the line"], "answer": 2, "exp": "[G] MHRA/TOXBASE: for a staggered overdose or when the timing is uncertain, the nomogram cannot be used reliably, so treat with acetylcysteine regardless of the paracetamol concentration.\n\n[C] Take baseline paracetamol level, ALT, INR, creatinine, venous bicarbonate/gas, and discuss with NPIS.\n\n[C] The nomogram applies ONLY to a single acute ingestion with a known time, at 4 hours or more post-ingestion.", "type": "mcq"}, {"n": 3, "topic": "UK ED toxicology", "stem": "Thirty minutes into an acetylcysteine infusion, a patient develops an urticarial rash, flushing and mild wheeze (an anaphylactoid reaction). What is the correct management?", "options": ["Pause or slow the infusion, treat with an antihistamine (and bronchodilator/adrenaline if severe), then restart at a slower rate", "Give IV hydrocortisone and continue at the same rate", "Stop acetylcysteine permanently and never restart", "Switch immediately to oral methionine and abandon NAC", "Ignore it and continue at full rate"], "answer": 0, "exp": "[C, UK practice] Anaphylactoid (non-IgE, rate-related histamine release) reactions to NAC are common, usually early and dose-rate related. Pause or slow the infusion, give an antihistamine (and treat bronchospasm; adrenaline if genuinely severe), then restart at a slower rate once settled.\n\n[C] The reaction is NOT an absolute contraindication - NAC can almost always be continued, which is why permanent cessation is wrong.\n\n[C] The SNAP regimen reduces the frequency of these reactions compared with the older regimen.", "type": "mcq"}, {"n": 4, "topic": "UK ED toxicology", "stem": "A 40-year-old has taken a large aspirin (salicylate) overdose and has a high salicylate level with a metabolic acidosis but is alert. Alongside supportive care, which treatment enhances elimination?", "options": ["Forced acid diuresis", "Intravenous glucagon", "Intravenous sodium bicarbonate for urinary alkalinisation", "Intravenous calcium gluconate", "Oral activated charcoal repeated hourly indefinitely"], "answer": 2, "exp": "[C, UK practice] Urinary alkalinisation with IV sodium bicarbonate (aiming for a urine pH around 7.5-8.5) enhances salicylate elimination by trapping ionised salicylate in the urine. Correct hypokalaemia, which otherwise prevents effective alkalinisation.\n\n[C] Haemodialysis is indicated for severe features: very high levels, refractory acidosis, renal failure, pulmonary/cerebral oedema, seizures or altered consciousness.\n\n[C] Avoid intubation-related hypoventilation, which worsens acidosis and drives salicylate into the CNS. Discuss with NPIS.", "type": "mcq"}, {"n": 5, "topic": "UK ED toxicology", "stem": "A patient with a tricyclic antidepressant overdose has a widened QRS complex (greater than 100-120 ms) and hypotension. What is the most appropriate specific treatment?", "options": ["Intravenous calcium chloride", "Oral activated charcoal only", "Intravenous amiodarone", "Intravenous flumazenil", "Intravenous sodium bicarbonate"], "answer": 4, "exp": "[C, UK practice] TCA cardiotoxicity is driven by sodium-channel blockade, seen as QRS widening. Give IV sodium bicarbonate for a QRS above 100-120 ms, ventricular arrhythmia, or hypotension - it narrows the QRS and is both diagnostic and therapeutic.\n\n[C] Avoid class Ia/Ic and III antiarrhythmics (including amiodarone), which worsen sodium-channel blockade.\n\n[C] Treat seizures with benzodiazepines; discuss refractory cases with NPIS.", "type": "mcq"}, {"n": 6, "topic": "UK ED toxicology", "stem": "A patient with a beta-blocker overdose has symptomatic bradycardia and hypotension that has not responded to atropine. What is the most appropriate next agent?", "options": ["Intravenous adenosine", "Nebulised salbutamol", "Intravenous glucagon", "Intravenous digoxin", "Intravenous magnesium"], "answer": 2, "exp": "[C, UK practice] In beta-blocker toxicity unresponsive to atropine and fluids, IV glucagon is the first-line specific treatment - it bypasses the beta-receptor to raise intracellular cAMP, improving heart rate and contractility.\n\n[C] Further options include high-dose insulin euglycaemic therapy, vasopressors, and pacing; discuss with NPIS/critical care.\n\n[C] Glucagon commonly causes vomiting, so protect the airway.", "type": "mcq"}, {"n": 7, "topic": "UK ED toxicology", "stem": "A patient with a calcium-channel-blocker (for example verapamil) overdose has profound shock refractory to fluids, calcium and vasopressors. Which therapy should be considered?", "options": ["High-dose insulin euglycaemic therapy", "Intravenous flumazenil", "Oral activated charcoal only", "Intravenous sodium bicarbonate", "Intravenous naloxone"], "answer": 0, "exp": "[C, UK practice] High-dose insulin euglycaemic therapy (HIET) improves myocardial performance in severe calcium-channel-blocker (and beta-blocker) toxicity and is used in refractory shock, with close glucose and potassium monitoring.\n\n[C] Initial measures include IV calcium (chloride or gluconate), fluids, atropine, and vasopressors; lipid emulsion and mechanical support are considered in extremis.\n\n[C] Always involve NPIS and critical care early.", "type": "mcq"}, {"n": 8, "topic": "UK ED toxicology", "stem": "A patient on long-term digoxin presents with nausea, confusion, a bradyarrhythmia and a serum potassium of 6.2 mmol/L in the context of digoxin toxicity. What is the most appropriate specific treatment?", "options": ["Intravenous magnesium alone", "Intravenous calcium chloride to treat the hyperkalaemia", "Urgent haemodialysis to remove digoxin", "Intravenous glucagon", "Digoxin-specific antibody fragments (DigiFab)"], "answer": 4, "exp": "[C, UK practice] Life-threatening digoxin toxicity - significant arrhythmia, haemodynamic instability, or hyperkalaemia (a marker of severe poisoning) - is treated with digoxin-specific antibody fragments (DigiFab).\n\n[C] Classic teaching is to avoid IV calcium for hyperkalaemia in digoxin toxicity (the 'stone heart' concern); the hyperkalaemia is corrected by the antibody itself.\n\n[C] Digoxin is not effectively removed by dialysis. Discuss dosing (level- or dose-based) with NPIS.", "type": "mcq"}, {"n": 9, "topic": "UK ED toxicology", "stem": "A 30-year-old is rescued from a house fire with soot around the mouth, reduced consciousness, cardiovascular instability and a markedly raised lactate. Cyanide toxicity is suspected. What is the antidote of choice in the UK?", "options": ["Flumazenil", "Hydroxocobalamin", "Intravenous ethanol", "Dicobalt edetate as first-line in the stable patient", "Methylene blue"], "answer": 1, "exp": "[C, UK practice] Hydroxocobalamin is the preferred antidote for cyanide toxicity (including smoke inhalation), binding cyanide to form cyanocobalamin, and is safe to give empirically when cyanide is suspected.\n\n[C] A very high lactate with cardiovascular collapse after smoke inhalation strongly suggests cyanide.\n\n[C] Dicobalt edetate is an alternative but is toxic if cyanide is not actually present, so it is reserved for confirmed severe cases. Give high-flow oxygen and consider concurrent carbon monoxide poisoning.", "type": "mcq"}, {"n": 10, "topic": "UK ED toxicology", "stem": "A patient is brought in after prolonged exposure to a faulty gas heater with headache, confusion and a cherry-red appearance. Carboxyhaemoglobin is elevated. What is the correct initial treatment, and what indicates possible hyperbaric oxygen?", "options": ["Immediate exchange transfusion for all", "Methylene blue", "High-flow 100% oxygen; consider hyperbaric oxygen for loss of consciousness, neurological signs, cardiac involvement, pregnancy or very high COHb", "Titrate oxygen to SpO2 94-98% only", "No oxygen unless SpO2 is low"], "answer": 2, "exp": "[C, UK practice] Give high-flow 100% oxygen (via a tight-fitting reservoir mask) to all patients with carbon monoxide poisoning - it dramatically shortens the half-life of carboxyhaemoglobin. Pulse oximetry is unreliable in CO poisoning (it cannot distinguish COHb), so do not titrate to SpO2.\n\n[C] Discuss hyperbaric oxygen with NPIS for features such as loss of consciousness, neurological or cardiac involvement, pregnancy, or a very high COHb level - though access and evidence are debated.\n\n[C] The 'cherry-red' appearance is a late/classical sign and often absent.", "type": "mcq"}, {"n": 11, "topic": "UK ED toxicology", "stem": "A farm worker presents with the SLUDGE features of organophosphate poisoning: salivation, lacrimation, urination, defecation, bronchorrhoea and miosis, with bradycardia. What is the correct treatment?", "options": ["Flumazenil", "Intravenous naloxone", "Beta-blockade to control secretions", "Glucagon and calcium", "Atropine titrated to reverse bronchorrhoea and bradycardia, plus pralidoxime"], "answer": 4, "exp": "[C, UK practice] Organophosphates inhibit acetylcholinesterase, causing a cholinergic crisis. Give atropine in escalating/repeated doses titrated to clinical effect - the key endpoint is drying of bronchial secretions and reversal of bradycardia (not pupil size).\n\n[C] Add pralidoxime (an oxime that reactivates acetylcholinesterase) early, before ageing of the enzyme occurs.\n\n[C] Wear personal protective equipment and decontaminate the patient; treat seizures with benzodiazepines. Discuss with NPIS.", "type": "mcq"}, {"n": 12, "topic": "UK ED toxicology", "stem": "During a regional anaesthetic block a patient develops seizures, then cardiovascular collapse from local anaesthetic systemic toxicity (LAST). Alongside standard resuscitation, what is the specific treatment?", "options": ["Intravenous dantrolene", "Intravenous glucagon", "Intravenous sodium bicarbonate", "Intravenous flumazenil", "Intravenous 20% lipid emulsion (Intralipid)"], "answer": 4, "exp": "[C, UK practice - AAGBI guidance] Local anaesthetic systemic toxicity is treated with IV 20% lipid emulsion: an initial bolus (about 1.5 mL/kg) followed by an infusion, repeated as needed, alongside high-quality CPR and airway/ventilation support.\n\n[C] Stop injecting the local anaesthetic immediately and call for help; treat seizures with benzodiazepines.\n\n[C] Prolonged resuscitation may be required; the lipid 'sink' sequesters the anaesthetic. Follow the AAGBI/local LAST protocol.", "type": "mcq"}, {"n": 13, "topic": "UK ED toxicology", "stem": "A patient presents with agitation, chest pain, tachycardia and hypertension after using cocaine. Which treatment principle is correct?", "options": ["Use flumazenil to reverse the agitation", "Give digoxin to slow the heart", "Withhold all treatment and observe", "Use benzodiazepines first-line; avoid beta-blockers because of the risk of unopposed alpha stimulation", "Give a beta-blocker first-line to control heart rate and blood pressure"], "answer": 3, "exp": "[C, UK practice] In cocaine (and other sympathomimetic) toxicity, benzodiazepines are first-line for agitation, tachycardia, hypertension and chest pain, by reducing central sympathetic drive.\n\n[C] Avoid beta-blockers, which can cause unopposed alpha-adrenergic stimulation and worsening hypertension/coronary vasoconstriction.\n\n[C] For cocaine-associated chest pain, add GTN and aspirin, and use benzodiazepines; manage as ACS if evolving.", "type": "mcq"}, {"n": 14, "topic": "UK ED toxicology", "stem": "A patient has taken a sulfonylurea overdose and has recurrent hypoglycaemia despite repeated intravenous glucose. What treatment specifically counteracts the mechanism?", "options": ["Octreotide", "Glucagon as a single dose", "Intravenous insulin", "Hydrocortisone", "Activated charcoal alone"], "answer": 0, "exp": "[C, UK practice] Sulfonylureas cause hypoglycaemia by stimulating insulin release. Octreotide suppresses this insulin secretion and is used for recurrent or refractory hypoglycaemia, reducing the need for repeated glucose boluses.\n\n[C] Give glucose to correct acute hypoglycaemia, but boluses alone often lead to rebound insulin release and recurrent hypoglycaemia - hence octreotide.\n\n[C] Admit and monitor glucose closely, as hypoglycaemia can be prolonged. Discuss with NPIS.", "type": "mcq"}, {"n": 15, "topic": "UK ED toxicology", "stem": "A patient on warfarin presents with major gastrointestinal bleeding and an INR of 8. What is the most appropriate treatment?", "options": ["Prothrombin complex concentrate (PCC) plus intravenous vitamin K", "Idarucizumab", "Stop warfarin and observe", "Fresh frozen plasma as first-line", "Oral vitamin K alone"], "answer": 0, "exp": "[C, UK practice - BNF/BSH] For major bleeding on warfarin, give IV vitamin K together with prothrombin complex concentrate (PCC), which rapidly and completely replaces the vitamin-K-dependent clotting factors (II, VII, IX, X).\n\n[C] FFP is a less effective and slower alternative and is not first-line when PCC is available.\n\n[C] Idarucizumab is the reversal agent for dabigatran (a DOAC), not warfarin - a common distractor.", "type": "mcq"}, {"n": 16, "topic": "UK ED toxicology", "stem": "A patient taking an SSRI is started on tramadol and develops agitation, tremor, inducible clonus, hyperreflexia, sweating and a temperature of 38.8C. What is the diagnosis and management?", "options": ["Malignant hyperthermia - dantrolene", "Serotonin syndrome - stop the offending drugs, supportive care and benzodiazepines, with cyproheptadine if needed", "Anticholinergic toxidrome - physostigmine", "Simple drug interaction - continue both drugs", "Neuroleptic malignant syndrome - dantrolene"], "answer": 1, "exp": "[C, UK practice] Serotonin syndrome (here from an SSRI plus tramadol) presents with the triad of neuromuscular excitation (clonus, hyperreflexia, tremor - typically more marked in the lower limbs), autonomic instability, and altered mental state, with rapid onset.\n\n[C] Management: stop the serotonergic drugs, give supportive care and benzodiazepines for agitation and rigidity, cool if hyperthermic, and use cyproheptadine (a serotonin antagonist) in significant cases.\n\n[C] It is distinguished from NMS (slower onset, lead-pipe rigidity, bradyreflexia, associated with dopamine antagonists) - clonus and hyperreflexia favour serotonin syndrome.", "type": "mcq"}, {"n": 17, "topic": "UK ED toxicology", "stem": "A patient presents cyanosed with a low oxygen saturation that does not improve with high-flow oxygen, and 'chocolate-brown' arterial blood. Methaemoglobinaemia is confirmed. What is the specific antidote?", "options": ["Intravenous ascorbic acid as first-line", "Hydroxocobalamin", "Dicobalt edetate", "Methylene blue", "Flumazenil"], "answer": 3, "exp": "[C, UK practice] Symptomatic methaemoglobinaemia (cyanosis unresponsive to oxygen, a 'saturation gap', chocolate-brown blood; causes include dapsone, local anaesthetics, nitrites) is treated with IV methylene blue.\n\n[C] Methylene blue is contraindicated/ineffective in G6PD deficiency (risk of haemolysis and it is less effective); alternatives such as ascorbic acid or exchange transfusion are then considered.\n\n[C] Pulse oximetry is unreliable in methaemoglobinaemia; co-oximetry on a blood gas confirms the methaemoglobin level.", "type": "mcq"}, {"n": 18, "topic": "UK ED toxicology", "stem": "A patient with chronic lithium therapy presents with tremor, ataxia, confusion and a high lithium level, with acute kidney injury. Which statement about management is correct?", "options": ["Administer flumazenil", "Force a saline diuresis with added potassium", "Give activated charcoal, which binds lithium well", "Provide IV fluids (0.9% saline) and consider haemodialysis for severe toxicity (high levels, neurological features or renal failure)", "Give sodium bicarbonate to enhance elimination"], "answer": 3, "exp": "[C, UK practice] Manage lithium toxicity with IV 0.9% saline to restore volume and renal excretion, stop lithium and any precipitating drugs (NSAIDs, ACE inhibitors, diuretics), and consider haemodialysis for severe toxicity - high levels, significant neurological features, or renal failure.\n\n[C] Activated charcoal does NOT bind lithium (a metal ion) - a common trap.\n\n[C] Chronic toxicity is dangerous at lower levels than acute; discuss dialysis thresholds with NPIS/renal.", "type": "mcq"}, {"n": 19, "topic": "UK ED toxicology", "stem": "A patient has taken a potentially significant overdose of a drug and presents within 1 hour, alert and cooperative with a protected airway. For which agent is activated charcoal LEAST likely to be useful?", "options": ["Quetiapine", "Iron", "Citalopram", "Amitriptyline", "Aspirin"], "answer": 1, "exp": "[C, UK practice] Activated charcoal adsorbs many drugs if given early (ideally within 1 hour of a significant ingestion) in a patient with a protected airway. It does NOT adsorb iron, lithium, alcohols/glycols, and other metal salts, or strong acids/alkalis.\n\n[C] So for iron overdose, charcoal is not useful - management is supportive, with whole-bowel irrigation and desferrioxamine for significant toxicity.\n\n[C] Contraindications to charcoal include a reduced/unprotected airway (aspiration risk) and corrosive ingestion. Always check TOXBASE/discuss with NPIS.", "type": "mcq"}, {"n": 20, "topic": "UK ED toxicology", "stem": "A patient presents drowsy but maintaining their own airway after an isolated benzodiazepine overdose, and is haemodynamically stable. A junior colleague suggests giving flumazenil. What is the most appropriate management?", "options": ["Give flumazenil only if the patient is a known epileptic", "Supportive care with airway monitoring; avoid routine flumazenil because of the risk of seizures, especially with co-ingestion or dependence", "Give flumazenil routinely to reverse sedation", "Give naloxone as it also reverses benzodiazepines", "Intubate all patients with benzodiazepine overdose"], "answer": 1, "exp": "[C, UK practice] Isolated benzodiazepine overdose is usually managed supportively with observation and airway monitoring, as it is rarely fatal alone.\n\n[C] Avoid routine flumazenil: it can precipitate seizures and arrhythmias, particularly with co-ingestion of proconvulsants (e.g. TCAs) or in benzodiazepine-dependent patients, and its short half-life risks re-sedation. Its use is largely restricted to reversing iatrogenic procedural sedation.\n\n[C] Naloxone reverses opioids, not benzodiazepines - a distractor.", "type": "mcq"}]}, {"code": "RESUS", "title": "Resuscitation + Legal Twists", "source": "RCUK 2021 · NICE NG51 · MCA 2005", "hue": "#fb7185", "questions": [{"n": 1, "topic": "Anaphylaxis", "stem": "A 34-year-old woman develops widespread urticaria, lip swelling, wheeze and BP 82/50 five minutes after IV co-amoxiclav. Most appropriate IMMEDIATE drug treatment?", "options": ["IV chlorphenamine 10 mg", "IM adrenaline 500 micrograms (0.5 mL of 1:1000)", "IV adrenaline 1 mg (10 mL of 1:10,000)", "IV hydrocortisone 200 mg", "Nebulised salbutamol 5 mg"], "answer": 1, "exp": "[G] RCUK 2021: IM adrenaline 500 mcg into the anterolateral thigh is first-line, repeated after 5 minutes if no improvement. IV adrenaline is reserved for experienced clinicians as an infusion because of arrhythmia risk with bolus dosing. Antihistamines and corticosteroids were REMOVED from the initial emergency algorithm in the 2021 update.", "type": "mcq"}, {"n": 2, "topic": "Refractory anaphylaxis", "stem": "Despite two doses of IM adrenaline 5 minutes apart she remains hypotensive with persistent wheeze. Most appropriate next step?", "options": ["A third dose of IM adrenaline", "IV chlorphenamine 10 mg + hydrocortisone 200 mg", "Start an IV adrenaline infusion with a rapid IV crystalloid bolus, and call for senior/critical care help", "IV aminophylline", "Subcutaneous adrenaline"], "answer": 2, "exp": "[G] No adequate response after 2 appropriate IM doses defines REFRACTORY anaphylaxis (RCUK 2021): start a low-dose IV adrenaline infusion (experienced clinician), give a rapid IV crystalloid bolus, and escalate to senior/critical care. Repeating IM doses alone or reaching for antihistamines/steroids is not the priority.", "type": "mcq"}, {"n": 3, "topic": "Anaphylaxis observation", "stem": "A patient responds fully to a SINGLE prompt dose of IM adrenaline, has no asthma, and is symptom-free at 2 hours. Per RCUK 2021, most appropriate MINIMUM observation before discharge?", "options": ["Discharge immediately", "2 hours", "6 hours", "12 hours", "Admit for 24 hours"], "answer": 1, "exp": "[G] RCUK 2021 recommends risk-stratified observation. A 2-hour minimum is reasonable for a good response to a single prompt dose with complete resolution and no higher-risk features. 6 hours applies to needing >1 dose or previous biphasic reaction; 12 hours or admission applies to severe reactions, asthma/severe respiratory compromise, ongoing absorption, late evening presentation, or poor access to emergency care.", "type": "mcq"}, {"n": 4, "topic": "ALS adrenaline timing", "stem": "A 60-year-old man is in cardiac arrest with VF. After the third shock CPR continues. Per RCUK 2021 adult ALS, when should the FIRST dose of IV adrenaline 1 mg be given?", "options": ["Immediately at the start of the arrest", "After the first shock", "After the third shock", "Only if VF persists after six shocks", "Adrenaline is not indicated in shockable rhythms"], "answer": 2, "exp": "[G] In a SHOCKABLE rhythm (VF/pVT), give adrenaline 1 mg IV after the 3rd shock, then every 3–5 minutes (alternate cycles). In a NON-shockable rhythm (PEA/asystole), adrenaline 1 mg is given as soon as IV/IO access is obtained.", "type": "mcq"}, {"n": 5, "topic": "Antiarrhythmic", "stem": "In the same VF arrest, which antiarrhythmic regimen is recommended by RCUK 2021?", "options": ["Amiodarone 150 mg after the first shock", "Amiodarone 300 mg after the third shock, then 150 mg after the fifth shock", "Lidocaine 100 mg after the first shock", "Amiodarone 300 mg after the fifth shock only", "Magnesium 2 g routinely for all VF"], "answer": 1, "exp": "[G] Amiodarone 300 mg IV after 3 shocks, with a further 150 mg after 5 shocks. Lidocaine 100 mg is an alternative only where amiodarone is unavailable. Magnesium is not routine — reserve it for torsades de pointes or documented hypomagnesaemia.", "type": "mcq"}, {"n": 6, "topic": "Sepsis NG51", "stem": "A 72-year-old with suspected pneumonia: RR 26, BP 88/54, HR 118, lactate 3.2 mmol/L. Using NICE NG51, which best describes risk and antibiotic timing?", "options": ["High risk; IV antibiotics within 3 hours", "Moderate risk; IV antibiotics within 6 hours", "High risk; senior review and IV broad-spectrum antibiotics within 1 hour", "Low risk; discharge on oral antibiotics", "High risk; withhold antibiotics until blood cultures result"], "answer": 2, "exp": "[G] Systolic BP ≤90 mmHg and lactate >2 mmol/L are NICE NG51 HIGH-RISK criteria. Action: senior review and IV broad-spectrum antibiotics within 1 hour, alongside the Sepsis Six. Antibiotics must NOT be delayed to await blood cultures.", "type": "mcq"}, {"n": 7, "topic": "Post-ROSC temperature", "stem": "Following ROSC after an out-of-hospital VF arrest the patient remains comatose. Regarding temperature per RCUK post-resuscitation care, which is most appropriate?", "options": ["Actively rewarm to 38°C", "Maintain a constant target temperature of 32–36°C and actively prevent fever", "No temperature control is required", "Cool to 28°C for 48 hours", "Permissive hyperthermia improves neurological outcome"], "answer": 1, "exp": "[G] RCUK post-resuscitation care: targeted temperature management — maintain a constant target between 32 and 36°C and actively prevent and treat fever (>37.7°C) for at least 72 hours in patients who remain comatose. Hyperthermia is associated with worse neurological outcome.", "type": "mcq"}, {"n": 8, "topic": "Adult choking", "stem": "A conscious adult suddenly clutches his throat during a meal, cannot speak, and has a silent (ineffective) cough. He remains conscious. Per the RCUK adult choking algorithm, what is correct?", "options": ["Blind finger sweep of the mouth", "Immediate abdominal thrusts only", "Up to 5 back blows, then up to 5 abdominal thrusts, alternating", "Start chest compressions now", "Encourage him to keep coughing"], "answer": 2, "exp": "[G] An ineffective (silent) cough indicates SEVERE airway obstruction. In a conscious adult: up to 5 back blows, then up to 5 abdominal thrusts, alternating, until relieved. If the person becomes unconscious, start CPR. Encouraging coughing is correct only for MILD obstruction. Blind finger sweeps are not recommended.", "type": "mcq"}, {"n": 9, "topic": "DNACPR", "stem": "An 84-year-old care-home resident with metastatic cancer arrests in the ED. A completed, signed DNACPR form dated last week accompanies her, with no reason to doubt validity. Family are not present. Most appropriate?", "options": ["Start full ALS because family are absent to confirm", "Start CPR until a consultant reviews the form", "Withhold CPR in line with the valid DNACPR decision", "Contact the coroner before deciding", "Perform CPR for 2 minutes as a compromise"], "answer": 2, "exp": "[Ethics/law twist] A valid DNACPR decision should be respected. The family's absence does not invalidate it, and relatives cannot demand CPR that is against a valid clinical decision. Only genuine doubt about the form's validity or applicability would justify commencing CPR while clarifying — and no such doubt exists here.", "type": "mcq"}, {"n": 10, "topic": "Capacitous refusal", "stem": "A 25-year-old presents after paracetamol overdose. Alert and oriented, understands untreated overdose can cause fatal liver failure, and calmly refuses acetylcysteine. Capacity assessment confirms she understands, retains, weighs and communicates. Most appropriate?", "options": ["Treat with acetylcysteine under the Mental Capacity Act", "Detain under Section 5(2) and force treatment", "Respect her refusal, as she has capacity to refuse this specific treatment", "Sedate and treat her in her best interests", "Treat under common law necessity"], "answer": 2, "exp": "[Capacity/MCA twist] A capacitous adult may refuse even life-saving treatment. MCA best-interests treatment applies ONLY where capacity is lacking; the MHA authorises treatment for a MENTAL disorder, not the physical consequences of an overdose. With capacity confirmed for this specific decision, respect the refusal — while documenting meticulously, offering ongoing help, and reassessing capacity, which can fluctuate as toxicity develops.", "type": "mcq"}, {"n": 11, "topic": "Advance decision", "stem": "A 40-year-old Jehovah's Witness is exsanguinating from a ruptured spleen. He carries a valid, signed, witnessed advance decision refusing blood and blood products even when life-threatening, with no reason to doubt validity or applicability. He is now unconscious. What is correct?", "options": ["Transfuse because the situation is now life-threatening", "Transfuse under the Mental Capacity Act in his best interests", "Respect the advance decision, withhold blood products, and use alternatives (e.g. cell salvage, haemostatics)", "Seek a court order before withholding transfusion", "Ask the family to override the decision"], "answer": 2, "exp": "[Advance decisions/MCA twist] A valid and applicable advance decision to refuse treatment (ADRT) — even one that is life-sustaining — is legally binding under the MCA 2005 and must be respected. Best-interests transfusion does not apply because a valid ADRT overrides it; family cannot override it and no court order is required. Manage with non-blood strategies (cell salvage, tranexamic acid, surgical/IR haemostasis).", "type": "mcq"}, {"n": 12, "topic": "Best interests", "stem": "An unidentified, unconscious adult is brought in after a road traffic collision, hypotensive and peri-arrest. No capacity, no known advance decision, no relatives present. What legal basis permits emergency life-saving treatment?", "options": ["Section 136 of the Mental Health Act", "Written consent from a relative is required before acting", "Treatment in his best interests under the Mental Capacity Act (doctrine of necessity)", "A court order must be obtained first", "A Deprivation of Liberty Safeguards authorisation"], "answer": 2, "exp": "[Best interests/necessity twist] For an adult lacking capacity with no valid advance decision or appointed attorney, provide treatment that is immediately necessary and in their best interests under the MCA 2005 / common law doctrine of necessity. Relatives cannot consent on behalf of an adult; s136, DoLS and the courts are not the legal basis for delivering emergency clinical treatment.", "type": "mcq"}]}, {"code": "ALS", "title": "Adult Advanced Life Support", "source": "RCUK ALS · boundary conditions", "hue": "#f97316", "questions": [{"n": 1, "topic": "Physiology-guided CPR", "stem": "A 55-year-old in ICU with continuous intra-arterial BP monitoring develops asystolic cardiac arrest. CPR commenced. Most appropriate initial adrenaline dosing strategy per RCUK ALS?", "options": ["Administer 1 mg adrenaline IV bolus immediately", "Administer 50–100 micrograms adrenaline IV increments", "Withhold adrenaline until a diastolic BP <30 mmHg is confirmed", "Administer 500 micrograms adrenaline IV bolus", "Start an adrenaline infusion at 2–10 micrograms/min"], "answer": 1, "exp": "[G] For adults in cardiac arrest ALREADY undergoing continuous intra-arterial BP monitoring, RCUK suggests adrenaline initially in small increments of 50–100 mcg IV. If a total of 1 mg has been given in micro-doses with no response, consider transitioning back to standard 1 mg every 3–5 min. [C] A standard 1 mg bolus with an arterial line running can cause severe harmful hypertension if ROSC occurs; titration supports a target diastolic BP ≥30 mmHg.", "type": "mcq"}, {"n": 2, "topic": "AF cardioversion", "stem": "A 68-year-old with rapid irregular wide-complex AF with pre-existing bundle branch block is unstable (BP 82/44) with severe acute heart failure. After sedation, recommended initial energy strategy for synchronised cardioversion?", "options": ["Initial synchronised shock at 70 J", "Initial synchronised shock at 100 J", "Initial synchronised shock at 120–150 J", "Initial synchronised shock at maximum defibrillator output", "Amiodarone 300 mg IV over 10–20 minutes prior to electrical shock"], "answer": 3, "exp": "[G] For an unstable patient in atrial fibrillation, RCUK explicitly states to deliver the initial synchronised shock at MAXIMUM defibrillator output, rather than an escalating approach. [C] AF is structurally more resilient than atrial flutter or PSVT (which start lower at 70–120 J); maximising the first shock avoids repeated failed attempts, myocardial stunning and further decompensation.", "type": "mcq"}, {"n": 3, "topic": "Atropine contraindication", "stem": "A 74-year-old with syncope has third-degree AV block with a wide QRS at 28 bpm, BP 85/50 and ongoing chest discomfort. Transcutaneous pacing is being retrieved. Most appropriate consideration regarding atropine?", "options": ["Administer atropine 500 micrograms IV immediately as first-line", "Avoid atropine as it is ineffective and may worsen the heart block", "Administer atropine 3 mg IV as a single rapid bolus", "Give aminophylline 100–200 mg slow IV instead of pacing", "Administer atropine only if the QRS complex narrows during telemetry"], "answer": 1, "exp": "[G] High-degree (third-degree) AV block with a WIDE QRS is a strict contraindication to atropine — it is ineffective and can paradoxically worsen the block or cause ventricular standstill. [C] Atropine blocks vagal tone at the SA/AV nodes; in infra-nodal block, speeding the sinus node can outpace and suppress fragile ventricular escape pacemakers. Bridge with pacing or inotropic infusion.", "type": "mcq"}, {"n": 4, "topic": "Ventilator settings in CPR", "stem": "A 42-year-old in refractory VF is intubated and transitioned to mechanical ventilation during continuous manual compressions (volume-controlled, RR 10/min, maximum FiO2). Correct combination for peak pressure alarm and flow trigger during CPR?", "options": ["Peak pressure alarm 30–40 cmH2O, flow trigger on", "Peak pressure alarm 40–50 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger on", "Peak pressure alarm 80–90 cmH2O, flow trigger off"], "answer": 2, "exp": "[G] For mechanical ventilation during CPR: volume-controlled mode, tidal volume 6–8 mL/kg, RR 10/min, peak pressure alarm 60–70 cmH2O, and flow trigger turned completely OFF. [C] Compressions generate heavy transient circuit flow; turning the flow trigger off stops the machine misinterpreting compressions as patient breaths (causing air trapping), and a high alarm ceiling prevents premature breath termination.", "type": "mcq"}, {"n": 5, "topic": "POCUS in arrest", "stem": "A 35-year-old in PEA arrest. POCUS by a skilled operator without interrupting compressions shows isolated right ventricular dilation, no pericardial fluid, no tension pneumothorax. Correct interpretation and management?", "options": ["RV dilation in isolation confirms massive PE; administer immediate thrombolysis", "RV dilation in isolation should not be used to diagnose pulmonary embolism; continue high-quality CPR and search for other reversible causes", "Isolated RV dilation indicates profound contractility failure; terminate resuscitation immediately", "RV dilation is a normal finding in PEA; pause CPR for 60 seconds for a formal echo", "Administer a fluid bolus immediately as isolated RV dilation confirms severe hypovolaemia"], "answer": 1, "exp": "[G] RCUK mandates that RV dilation in isolation during cardiac arrest must NOT be used to diagnose pulmonary embolism, nor should POCUS be the sole indicator to terminate resuscitation. [C] RV dilation is a non-specific consequence of any arrest — blood shifts from the arterial system to the compliant venous system in low-flow states and the right heart distends. Relying on it alone risks inappropriate thrombolysis.", "type": "mcq"}, {"n": 6, "topic": "Failed cardioversion", "stem": "A 59-year-old with unstable monomorphic VT with a pulse (BP 78/40, severe chest pain) has had synchronised shocks at 120 J then 150 J; the rhythm persists and he remains profoundly unstable. Most appropriate next step?", "options": ["Immediate IV bolus of 300 mg amiodarone over 1 minute", "Unsynchronised shock at maximum defibrillator output (360 J)", "Give procainamide 10–15 mg/kg over 20 minutes or amiodarone 300 mg IV over 10–20 minutes, then re-attempt electrical cardioversion", "Immediate infusion of isoprenaline at 5 micrograms/min", "Abandon electrical management and prepare for emergency transvenous pacing"], "answer": 2, "exp": "[G] If synchronised cardioversion fails in an unstable tachyarrhythmia, the RCUK algorithm directs procainamide 10–15 mg/kg over 20 min OR amiodarone 300 mg IV over 10–20 min, then re-attempt cardioversion. [C] Rapid amiodarone bolus over 1 minute is reserved for PULSELESS arrest; in a patient with a pulse it can trigger catastrophic vasodilatory hypotension.", "type": "mcq"}, {"n": 7, "topic": "Asthma — gas trapping", "stem": "A 26-year-old with brittle asthma is in PEA arrest and intubated. During ventilation there is extreme resistance, rapidly rising peak airway pressures, and profound drop in chest wall expansion during decompression. Dynamic hyperinflation suspected. Most appropriate immediate action?", "options": ["Apply PEEP of 10 cmH2O to splint the airways open", "Increase the respiratory rate to 20 breaths per minute", "Perform immediate bilateral needle thoracocentesis in the second intercostal space", "Disconnect the tracheal tube from the breathing circuit and manually compress the chest wall", "Administer an immediate IV bolus of 2 g magnesium sulphate over 1 minute"], "answer": 3, "exp": "[G] In cardiac arrest in asthma, if dynamic hyperinflation (gas trapping) is suspected, immediately disconnect the tracheal tube/breathing circuit and manually compress the chest wall to facilitate exhalation. [C] Trapped gas builds intrathoracic pressure, blocking venous return and mimicking tension pneumothorax. Increasing PEEP or rate worsens it. Empty the lungs before bilateral needle decompression.", "type": "mcq"}, {"n": 8, "topic": "Post-ROSC ventilation", "stem": "A 64-year-old resuscitated after a 12-minute out-of-hospital VF arrest remains comatose, ventilated on 100% oxygen, BP 118/72. ABG 15 min post-ROSC: pH 7.28, PaO2 24.5 kPa, PaCO2 3.9 kPa, HCO3 18. Most appropriate ventilator adjustments?", "options": ["Maintain 100% oxygen and increase minute ventilation to normalise pH", "Titrate FiO2 to target SpO2 94–98% and DECREASE minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Titrate FiO2 to target SpO2 88–92% and increase minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Maintain 100% oxygen to correct the metabolic acidosis and keep current parameters", "Titrate FiO2 to target SpO2 94–98% and increase minute ventilation to drive PaCO2 below 3.5 kPa"], "answer": 1, "exp": "[G] Post-resuscitation care: titrate inspired oxygen as soon as feasible to SpO2 94–98% (avoiding hyperoxaemia) and ventilate to maintain normal PaCO2 of 4.6–6.0 kPa. [C] PaO2 24.5 kPa is severe hyperoxaemia (oxygen free radicals worsen reperfusion injury); PaCO2 3.9 kPa is hypocapnia causing cerebral vasoconstriction. Decreasing minute ventilation normalises CO2 and restores cerebral perfusion.", "type": "mcq"}, {"n": 9, "topic": "Airway attempts", "stem": "A 52-year-old in refractory VF after anterior MI. During compressions, direct laryngoscopy fails (poor view); a second attempt with a bougie also fails to pass the cords. Most appropriate next step?", "options": ["Attempt a third intubation using a video laryngoscope with a hyperangulated blade", "Immediately perform an emergency surgical cricothyroidotomy", "Switch to a supraglottic airway device or return to high-quality bag-mask ventilation", "Halt chest compressions for up to 20 seconds for a controlled third attempt", "Continue compressions and request a senior anaesthetist for a third direct laryngoscopy"], "answer": 2, "exp": "[G] RCUK ALS explicitly states no more than TWO attempts at tracheal intubation before switching to a supraglottic airway device or returning to bag-mask ventilation. [C] Fixating on a definitive tube causes prolonged compression interruptions and severe hypoxia.", "type": "mcq"}, {"n": 10, "topic": "Failed SGA", "stem": "A 45-year-old in arrest after drowning: two failed laryngoscopy attempts due to massive airway oedema, then a second-generation SGA placed. On testing there is zero chest rise, a massive audible leak and no ETCO2 waveform. Most appropriate immediate action?", "options": ["Proceed immediately to a third intubation attempt using a videolaryngoscope", "Revert immediately to high-quality bag-mask ventilation using a two-person technique and basic airway adjuncts", "Perform an immediate emergency surgical cricothyroidotomy", "Remove the SGA and attempt a larger size of the same device", "Continue chest compressions and ignore the lack of ventilation for two cycles"], "answer": 1, "exp": "[G] If both intubation and an SGA fail to provide adequate ventilation, revert immediately to high-quality bag-mask ventilation with a two-person technique and basic airway adjuncts. [C] A third intubation or changing SGA size wastes critical seconds during active hypoxia. Surgical cricothyroidotomy is a terminal option only in confirmed 'cannot intubate, cannot oxygenate' after bag-mask rescue has been maximised and failed.", "type": "mcq"}, {"n": 11, "topic": "Hyperkalaemic arrest", "stem": "A 62-year-old with ESRD who missed dialysis collapses in PEA arrest. The monitor shows an extremely wide sinusoidal QRS morphing towards asystole. Hyperkalaemia strongly suspected. Correct first-line drug intervention and dosing?", "options": ["30 mL of 10% calcium gluconate by slow IV infusion over 10 minutes", "10 mL of 10% calcium chloride by rapid intravenous bolus", "50 mL of 8.4% sodium bicarbonate over 15 minutes", "10 units of soluble insulin with 50 mL of 50% glucose over 5 minutes", "Withhold calcium until a formal point-of-care potassium is confirmed"], "answer": 1, "exp": "[G] In cardiac arrest secondary to hyperkalaemia, the standard slow calcium administration protocols are bypassed: give 10 mL of 10% CALCIUM CHLORIDE by rapid IV bolus, repeatable if the arrest continues. [C] Calcium stabilises the myocardial membrane; calcium chloride's superior bioavailability (gluconate requires hepatic activation) makes it first-line during active CPR.", "type": "mcq"}, {"n": 12, "topic": "Maternal arrest", "stem": "A 31-year-old at 28 weeks collapses in resus after a severe headache and arrests. High-quality compressions and continuous manual left uterine displacement are applied. Rhythm is asystole. After 3 minutes of ALS there is no ROSC. Critical timing boundary for resuscitative hysterotomy?", "options": ["Prepare to perform the procedure immediately if there is no ROSC by 4 minutes, aiming for delivery of the fetus by 5 minutes", "Defer until 10 minutes of ALS have been delivered to maximise maternal ROSC", "Perform only if fetal distress is documented via formal obstetric ultrasound", "Immediately transfer to the nearest obstetric theatre before initiating the incision", "Initiate immediately at the 2-minute mark if the rhythm is non-shockable"], "answer": 0, "exp": "[G] In maternal cardiac arrest (≥20 weeks or fundus at/above the umbilicus), if there is no ROSC within 4 minutes of collapse, immediately perform a resuscitative hysterotomy aiming for delivery by 5 minutes. [C] The gravid uterus compresses the IVC and aorta, reducing compression-generated output to negligible levels; emptying the uterus unloads this and gives the mother her best chance. Perform in the resus bay, not after transfer.", "type": "mcq"}]}, {"code": "ABS", "title": "The Patient Who Absconds", "source": "RCEM Best Practice Guideline (rev. 2023)", "hue": "#4ade80", "questions": [{"n": 1, "topic": "Definitions", "stem": "A 34-year-old man brought to the ED after an overdose is booked in and placed in majors awaiting bloods. An hour later his cubicle is empty; no staff saw him leave and he remains at potential risk of self-harm. Which term correctly describes this event?", "options": ["Did not wait", "Left without being seen", "Self-discharge", "Absconded", "Discharge against medical advice"], "answer": 3, "exp": "[G] RCEM (The Patient Who Absconds, rev. 2023) defines absconding as a patient who has left the department unexpectedly, without the knowledge of clinical staff, and in whom there remains a potential risk of harm to self or others. The guideline explicitly excludes 'did not wait', 'left without being seen' and 'self-discharge'. A duty of care exists from the moment of booking in.", "type": "mcq"}, {"n": 2, "topic": "Risk identification", "stem": "At triage a 26-year-old woman presenting after self-harm is judged at risk of absconding. Which single action is essential as soon as the risk is identified?", "options": ["Record her physical description", "Assess her capacity, ideally as part of a mental health triage tool", "Allocate a security officer to observe her", "Refer immediately to the mental health liaison team", "Move her to a cubicle near the nursing station"], "answer": 1, "exp": "[G] RCEM Recommendation 2: the essential action once absconding risk is identified is to assess capacity, ideally within a mental health triage tool. The triage question is 'Do you think this patient has the capacity to decide to leave?'. Recording a physical description and prioritised assessment are also recommended, but capacity assessment is the guideline-stated essential first action.", "type": "mcq"}, {"n": 3, "topic": "Restraint threshold", "stem": "A 78-year-old woman with delirium from urosepsis lacks capacity and repeatedly attempts to leave. Security physically restrain her under the MCA 2005. After what duration of physical restraint should chemical restraint (rapid tranquillisation) be administered?", "options": ["5 minutes", "10 minutes", "20 minutes", "30 minutes", "60 minutes"], "answer": 1, "exp": "[G] Guideline-stated: if restraint is needed for more than 10 minutes, chemical restraint (rapid tranquillisation) should be administered. Restraint must be clinically led, necessary, proportionate and in the patient's best interests, with its legal basis documented in the notes.", "type": "mcq"}, {"n": 4, "topic": "Deprivation of liberty", "stem": "A 45-year-old man with head injury and fluctuating confusion lacks capacity and is being prevented from leaving under s6 MCA 2005. His work-up will take 6–8 hours and he keeps trying to leave. Key legal issue?", "options": ["Restraint under s6 MCA 2005 remains lawful for the whole attendance", "He should be detained under s5(2) MHA 1983 by the ED consultant", "Keeping him for more than a short period likely amounts to a deprivation of liberty requiring formal authority", "Common law powers permit detention for up to 24 hours", "ED nursing staff can apply s5(4) MHA 1983"], "answer": 2, "exp": "[G] MCA s6 permits necessary and proportionate restraint, but if a patient must remain for more than a short period ('measured at most in hours') this goes beyond restraint and becomes a deprivation of liberty, lawful only with formal authority. s5(2) and s5(4) holding powers apply to admitted inpatients, not the ED.", "type": "mcq"}, {"n": 5, "topic": "ED and MHA powers", "stem": "A 30-year-old man with acute psychosis, not on any section, is attempting to leave. He is felt to lack capacity due to mental illness. Which correctly describes ED staff powers under the MHA 1983?", "options": ["The ED consultant can complete an emergency s4 application", "ED nurses can use the s5(4) holding power", "ED staff have no MHA detention powers; options are limited to requesting the police apply s136", "Security staff can detain under s136 within hospital grounds", "Two ED doctors can jointly detain under s2 pending psychiatric review"], "answer": 2, "exp": "[G] ED personnel do not have powers to detain under the MHA 1983; options are limited to requesting police assistance, as police can apply s136 in the ED. If the primary problem is mental illness, discuss with mental health liaison. In the interim, if he lacks capacity, MCA 2005 powers may justify restraint in his best interests.", "type": "mcq"}, {"n": 6, "topic": "Unsigned s2 paperwork", "stem": "A 24-year-old woman has been assessed under the MHA with medical recommendations completed for a s2 admission, but no bed identified and the application paperwork unsigned. She attempts to leave. Which statement is correct?", "options": ["She is already detained under s2 and can be restrained under the MHA", "The s2 recommendation does not apply until the paperwork is signed once a bed is identified; if she lacks capacity, restrain under the MCA 2005", "She must be allowed to leave as no legal framework applies", "The police must be called to apply s135", "Security may detain her under common law for up to 4 hours"], "answer": 1, "exp": "[G] Guideline-stated boundary point: a recommendation for s2 or s3 does not apply until the paperwork has been signed when a bed has been identified. Until then, restraint is only lawful under the MCA 2005 (if she lacks capacity, in her best interests) or via police s136 if she is not sectioned. s135 relates to a magistrate's warrant for removal from private premises.", "type": "mcq"}, {"n": 7, "topic": "Capacitous refusal", "stem": "A 28-year-old man with pleuritic chest pain and raised D-dimer awaiting CTPA wants to leave to collect his children. Formal assessment confirms capacity. He understands he may have a PE and could die. What should happen?", "options": ["Restrain him under s6 MCA 2005 as the decision is unwise", "Detain him under common law given the risk to life", "Respect his decision, document the discussion and offer a return plan", "Contact the police to return him if he leaves", "Ask security to delay him until senior review"], "answer": 2, "exp": "[G] The decision of a patient with capacity must be respected even if the clinician considers it unwise, provided it does not put others at immediate risk of significant harm. The guideline advises caution before concluding an apparently unwise decision was made with capacity — but once capacity is confirmed, his liberty prevails.", "type": "mcq"}, {"n": 8, "topic": "Common law", "stem": "An intoxicated man attempting to leave begins swinging a metal drip stand at staff and other patients. His capacity status is unknown. Legal basis for immediately intervening?", "options": ["Section 6 MCA 2005", "Section 136 MHA 1983", "Common law — preventing immediate risk of significant harm to others, irrespective of capacity", "Deprivation of Liberty Safeguards", "Intervention is unlawful until capacity is formally assessed"], "answer": 2, "exp": "[G] If a patient's actions put others at immediate risk of significant harm, it is lawful under common law to intervene to prevent that harm, irrespective of their capacity. MCA s6 applies only where the patient lacks capacity and restraint is in their own best interests; s136 is a police power. Capacity is irrelevant here — that's the trap.", "type": "mcq"}, {"n": 9, "topic": "Initial response", "stem": "A nurse discovers a 40-year-old man who presented after paracetamol overdose has absconded from the waiting room. What should the department do FIRST?", "options": ["Immediately telephone the police", "Search the ED and immediate surrounding area and undertake a thorough risk assessment", "Complete a DATIX incident form", "Send a discharge letter to the GP", "Contact the mental health liaison team"], "answer": 1, "exp": "[G] EDs should avoid immediately calling police and instead undertake a thorough risk assessment: search the ED and surrounding area, involve security and CCTV, call the patient's contact number, consider next of kin. Police involvement comes later and only if strict criteria are met — real and immediate risk to life AND proportionate police response AND vulnerability considered AND telephone contact failed AND no other person or service can return the patient.", "type": "mcq"}, {"n": 10, "topic": "Police powers", "stem": "Police locate a 52-year-old man with capacity who absconded before review of an abnormal ECG. He is safe at home and refuses to return. Not under arrest, not on s136, no marked vulnerability. What can the police do?", "options": ["Return him to the ED using reasonable force", "Apply s5(2) MHA 1983", "Detain him under the MCA 2005 on the ED's behalf", "They have no power to return him against his will", "Issue a community treatment order"], "answer": 3, "exp": "[G] Police do not have the power to bring patients back to the ED against their will unless the patient is under arrest, has been placed on s136, or is considered at risk and vulnerable (e.g. dementia, a child). None applies here, so his refusal stands. Alternatives: contact him directly, involve a relative if appropriate, inform the GP.", "type": "mcq"}, {"n": 11, "topic": "Return to ED", "stem": "A 19-year-old woman who absconded after presenting with suicidal ideation is brought back by police 3 hours later. What does RCEM recommend on her return?", "options": ["Resume the previous management plan from where it was interrupted", "Re-triage her, treat her as high risk for further absconding, and arrange prompt review preferably by a senior clinician", "Place her last in the queue as she left voluntarily", "Ask the police to remain with her until discharge", "Transfer her directly to the mental health unit"], "answer": 1, "exp": "[G] Returned patients should be re-triaged, considered high risk for further absconding, and seen promptly, preferably by a senior clinician. Their condition may have changed (e.g. alcohol or drug ingestion), so previous plans must be reviewed. Establish whether police presence reflects s136, arrest or mere accompaniment, and whether they intend to remain.", "type": "mcq"}, {"n": 12, "topic": "Safeguarding", "stem": "A 15-year-old boy awaiting assessment after an alleged assault leaves the ED with his mother before being seen. Staff are unsure whether risk remains. What must this event trigger?", "options": ["No action — he left with a parent", "An immediate 999 call to the police", "Local safeguarding procedures", "A s136 request", "Referral to CAMHS within 24 hours"], "answer": 2, "exp": "[G] Recommendation 9: any children who abscond, with or without an accompanying adult, should trigger local safeguarding procedures. Police contact is a separate decision based on the risk assessment; the presence of a parent does not remove the safeguarding obligation — the accompanying adult is the distractor.", "type": "mcq"}, {"n": 13, "topic": "Observation level", "stem": "A 22-year-old man with suicidal ideation is assessed at triage as at high (but not the very highest) risk of absconding while waiting. What level of observation does RCEM recommend?", "options": ["Hourly welfare checks", "Observation every 30 minutes", "Intermittent observation, e.g. every 15 minutes", "Continuous one-to-one observation in all such cases", "CCTV monitoring from the nursing station"], "answer": 2, "exp": "[G] Patients at high risk of absconding or self-harm should be observed intermittently (e.g. every 15 minutes), or continuously if at very high risk. Staff carrying out observations should be trained and observations documented. Continuous observation is reserved for the very-high-risk group.", "type": "mcq"}, {"n": 14, "topic": "Governance", "stem": "Police are contacted and asked to urgently locate a vulnerable patient who absconded. What governance step must follow?", "options": ["No further action once the patient is found", "Completion of an incident form (e.g. DATIX), reviewed within a rolling governance programme with the police service", "A serious incident (SI) investigation in every case", "Referral of the case to the coroner", "Automatic safeguarding referral for all adults"], "answer": 1, "exp": "[G] Once police have been contacted to locate an absconded patient, an incident form (e.g. DATIX) should be completed, and these incidents reviewed as part of a rolling governance programme with the police. Departments should record numbers of absconding patients and police contacts to drive service improvement (Recommendation 10).", "type": "mcq"}]}, {"code": "S136", "title": "Section 136 for EDs", "source": "RCEM Brief Guide to s136 · Dec 2025", "hue": "#22d3ee", "questions": [{"n": 1, "topic": "Private dwelling", "stem": "A police officer finds a 34-year-old man behaving erratically in the private back garden of his own house, shouting that he is being watched by the government. The officer believes he has a mental disorder and is in immediate need of care or control. Can he be detained under s136?", "options": ["Yes, s136 applies anywhere including private dwellings and their gardens", "No, s136 cannot be used because he is in a private dwelling or associated private garden", "Yes, but only with a warrant obtained under section 135", "No, s136 can only be used in a hospital Emergency Department", "Yes, provided an AMHP is present at the scene"], "answer": 1, "exp": "[G] Per the RCEM Brief Guide to Section 136, s136 cannot be used if the person is in a private dwelling or the private garden/buildings associated with that place. Outside this exception s136 can be used in any other setting, including an ED. Entry to a private dwelling to remove a person requires a s135 warrant.", "type": "mcq"}, {"n": 2, "topic": "24-hour clock", "stem": "A patient is detained under s136 at 14:00 in a shopping centre. After a period in the police vehicle, they arrive at the ED at 15:30. At what time does the 24-hour period of detention begin?", "options": ["14:00, the time the officer first detained the patient", "15:30, the time of arrival at the Emergency Department (the place of safety)", "The time the triage nurse completes the initial assessment", "The time the on-call psychiatrist is bleeped", "Midnight on the day of detention"], "answer": 1, "exp": "[G] RCEM guidance: the 24-hour duration commences on arrival at the ED (the place of safety), even if the patient is subsequently transferred to a 136 suite. The time of arrival should be noted and recorded — a recurring exam boundary point.", "type": "mcq"}, {"n": 3, "topic": "12-hour extension", "stem": "A patient has been under s136 in the ED for 22 hours, still too intoxicated to be safely assessed. The MHA liaison team is unavailable. Most appropriate next step regarding the section?", "options": ["The section lapses at 24 hours regardless and the patient must be allowed to leave", "Any doctor may extend the section by up to 12 hours for medical reasons, ideally in discussion with the MHA team", "Only the AMHP can authorise any extension, and none is possible without them", "The patient should be sectioned under s2 instead to buy more time", "Security should physically restrain the patient until sober regardless of legal authority"], "answer": 1, "exp": "[G] s136 may be extended by 12 hours by a senior doctor who has assessed the patient, but only where there is a MEDICAL reason (not yet medically fit for assessment). Ideally enacted by the mental health professionals involved; if unavailable, any doctor can extend it, but should do so in discussion with the MHA team.", "type": "mcq"}, {"n": 4, "topic": "Police station (adult)", "stem": "Police wish to use a police station as the place of safety for a 40-year-old detained under s136 rather than the ED. Which is a correct precondition?", "options": ["It can be used for any adult if the ED is currently on divert", "It can be used if the behaviour presents imminent risk of serious injury or death, no other place of safety can reasonably detain them, and use is authorised by an inspector or above", "It can be used for anyone over the age of 16 without further authorisation", "It can be used routinely if the patient is intoxicated with alcohol", "It can be used if requested by the patient's family"], "answer": 1, "exp": "[G] A police station may only be used as a place of safety for an ADULT in exceptional circumstances: (a) behaviour presents an imminent risk of serious injury or death to self or others; (b) no other place of safety in the police area can reasonably be expected to detain them; and (c) authorised by an officer of inspector rank or above. Custody staff must ensure healthcare access and half-hourly checks.", "type": "mcq"}, {"n": 5, "topic": "Police station (under-18)", "stem": "A 16-year-old is detained under s136 after a public disturbance and appears acutely disturbed. The nearest ED-based place of safety is 90 minutes away; the local police station is 10 minutes away. Can the police station be used?", "options": ["Yes, if authorised by an inspector", "Yes, provided healthcare checks every 30 minutes are arranged", "No, police stations can never be used as a place of safety for anyone under 18", "Yes, but only for a maximum of 4 hours", "Yes, if the child's parents consent"], "answer": 2, "exp": "[G] RCEM guidance is explicit: police stations can NEVER be used as a place of safety for under-18s, regardless of distance, authorisation level, or parental consent. This is an absolute rule, unlike the conditional criteria that apply to adults.", "type": "mcq"}, {"n": 6, "topic": "Search powers", "stem": "A patient detained under s136 arrives at the ED and the accompanying officer wishes to search them before handover. Under what circumstance may a constable search a person detained under s136?", "options": ["Search is never permitted once s136 has been invoked", "Only with a magistrate's warrant", "If the constable has reasonable grounds to suspect a risk of self-harm or risk of harm to others", "Only if the patient consents in writing", "Only after formal MHA assessment is complete"], "answer": 2, "exp": "[G] Per the RCEM guidance summarising s136 powers, a police constable may search a detained person if they have reasonable grounds to suspect a risk of self-harm or risk of harm to others.", "type": "mcq"}, {"n": 7, "topic": "'If practicable' consultation", "stem": "Before invoking s136 in the community, what is the correct step regarding mental health professional involvement?", "options": ["Mental health professionals must always be physically present before s136 can be used", "Police must consult mental health professionals, if practicable, before using s136", "Mental health professional consultation is only required for patients under 18", "Consultation is only required if the person is in a public place, not elsewhere", "There is no requirement to consult mental health professionals at any stage"], "answer": 1, "exp": "[G] Police must consult mental health professionals, IF PRACTICABLE, before using s136. This is a 'where possible' duty, not an absolute precondition — s136 can still be used in an emergency without prior consultation if consultation is not practicable. Time to consult → consult; no time → act, still s136.", "type": "mcq"}, {"n": 8, "topic": "Place of safety agreement", "stem": "A patient is medically cleared and stable in the ED under s136 awaiting AMHP assessment. Escorting officers ask if they can leave. What determines whether the ED can safely take over responsibility?", "options": ["The ED must accept responsibility automatically once medical clearance occurs", "The ED is only a place of safety if the patient can be kept safe when the police leave, and this requires an agreement between an appropriate ED senior and the police officer", "Responsibility transfers automatically after 4 hours in the ED, per the 4-hour target", "Only the duty police inspector can authorise the police to leave, with no ED input required", "The patient's own consent is what determines whether police can leave"], "answer": 1, "exp": "[G] The ED is a health-based place of safety, but only a place of safety if the patient can be kept safe if the police leave. An agreement about if or when police may leave should be made by an appropriate ED senior (e.g. the senior nurse) and the police officer, with disagreements escalated to the emergency physician in charge and the duty inspector.", "type": "mcq"}, {"n": 9, "topic": "Webley case", "stem": "An ED senior agrees to take over legal responsibility for a s136 patient and allows police to leave. The patient absconds and comes to harm. Which legal precedent does RCEM highlight?", "options": ["The 'Webley' case, which established that the ED could be liable in negligence if they take on responsibility and the patient absconds", "The Bolam test, which protects clinicians from any liability if guidelines were followed", "Gillick competence, which is only relevant to under-16s", "The Montgomery ruling on consent to treatment", "There is no legal precedent; liability always remains with police regardless of handover"], "answer": 0, "exp": "[G] RCEM cites the 2015 'Webley' case as highlighting that an ED could be liable in negligence law if it agrees to take on legal responsibility for a s136 patient who then absconds. Conversely, if ED staff decline responsibility and police leave anyway, the police could be liable for abandoning someone in their custody.", "type": "mcq"}, {"n": 10, "topic": "RCRP", "stem": "Regarding the Right Care, Right Person (RCRP) national partnership agreement referenced in RCEM's s136 guidance, which statement is most accurate?", "options": ["RCRP mandates that police attend all mental health calls regardless of risk", "RCRP is an approach under which police aim to step back from all but the highest-risk mental healthcare work, requiring EDs to jointly agree procedures with police, mental health trusts, and social care", "RCRP abolishes the use of s136 entirely", "RCRP applies only in Scotland and Northern Ireland", "RCRP transfers all place-of-safety responsibility to ambulance services"], "answer": 1, "exp": "[G] RCEM describes RCRP as a national partnership agreement (signed July 2023) under which police in England and Wales aim to release themselves from all but the highest-risk mental healthcare work. EDs should work closely with local police, mental health trusts, social care and commissioning boards to jointly agree procedures throughout the s136 journey.", "type": "mcq"}, {"n": 11, "topic": "After expiry", "stem": "A patient's s136 detention (including the 12-hour extension) has expired and no MHA assessment has been completed. The patient wishes to leave. Which framework now governs their care?", "options": ["The patient remains detained under s136 indefinitely until assessed", "The patient automatically becomes detained under s2 of the MHA", "Once s136 expires, the patient is subject to the same legal frameworks as any other patient, e.g. the Mental Capacity Act or common law", "The patient must be physically restrained pending police re-attendance", "Detention continues under the authority of the ED consultant alone"], "answer": 2, "exp": "[G] Once the s136 runs out, the patient is subject to the same legal frameworks as any other patient — e.g. the Mental Capacity Act or common law — and RCEM directs readers to its 'Patient Who Absconds' and 'MCA in Emergency Medicine' guidance. There is no automatic conversion to another MHA section.", "type": "mcq"}, {"n": 12, "topic": "Rights", "stem": "On arrival in the ED under s136, what must staff ensure regarding communication with the patient, per RCEM's audit standards?", "options": ["Rights need only be explained if the patient specifically requests this information", "Rights must be explained to the patient and written information provided, alongside ongoing updates on their care and assessment plan", "Rights are explained only by the AMHP once they arrive, not by ED staff", "Written information is optional if verbal explanation has been given", "Explaining rights can be delayed until medical clearance is complete"], "answer": 1, "exp": "[G] RCEM's audit standards require that rights are explained to the patient and written information provided (an example leaflet is in Appendix 1). Patients should also be kept updated of the plan for their care and assessment, delivered by the nurse in charge or senior clinician at initial review — not contingent on the AMHP's arrival or on medical clearance.", "type": "mcq"}]}, {"code": "MIX2", "title": "Mixed Weak-Area Drill 2", "source": "NICE NG95 · RCUK 2025 · MHA · BSPED", "hue": "#f472b6", "questions": [{"n": 1, "topic": "Lyme serology", "stem": "A 34-year-old returns from hiking in the New Forest with a spreading annular rash. Lyme ELISA returns NEGATIVE, clinical suspicion remains high, symptoms began 9 days ago. Next step?", "options": ["Report ELISA as excluding Lyme", "Send immunoblot to confirm the negative", "Repeat ELISA in 4–6 weeks if symptoms persist", "Start doxycycline, no further serology", "Paired convalescent immunoblots 2 weeks apart"], "answer": 2, "exp": "[G] NICE NG95: a NEGATIVE ELISA with persisting suspicion is rescued by a repeat ELISA at 4–6 weeks (early testing predates antibody development). The immunoblot confirms a POSITIVE/equivocal ELISA — it does not rescue a negative one. If erythema migrans is present, diagnose clinically and treat with no serology.", "type": "mcq"}, {"n": 2, "topic": "Envenomation", "stem": "A 28-year-old stands on something wading at a UK beach — excruciating foot pain out of proportion to a small puncture. Weever fish suspected. First-line pain management?", "options": ["IV morphine as priority", "Immerse in hot water 40–45°C", "Cold pack and elevate", "LA infiltration first", "Iced water 5–10°C"], "answer": 1, "exp": "[C] Weever venom is thermolabile — hot water immersion at 40–45°C for 30–90 min is first-line and usually relieves pain faster than opioids. Morphine is an adjunct; cold worsens it.", "type": "mcq"}, {"n": 3, "topic": "Section 136", "stem": "Police called to a shopping centre; a man with apparent mental disorder stands on a ledge, in immediate danger. No mental health professional immediately contactable. Lawful position on s136?", "options": ["Must consult a professional first, cannot act yet", "May use s136 immediately; consultation required only where practicable", "Must obtain a s135 warrant first", "Cannot use s136 (private property)", "Must use common law instead"], "answer": 1, "exp": "[G] MHA 1983 / RCEM s136 guide: consultation is required WHERE PRACTICABLE. In a time-critical, imminent-risk situation, immediate use without prior consultation is lawful — a duty to attempt, not an absolute precondition. It doesn't force s135 or common law. s136 applies anywhere other than a private dwelling.", "type": "mcq"}, {"n": 4, "topic": "MCA vs MHA (Sessay)", "stem": "A 45-year-old with depression attends after a small overdose, now medically fit, wants to leave before the MH team arrives, and has capacity at this moment. Correct statement?", "options": ["MCA can detain her until the MHA assessment is complete", "Common law can hold her indefinitely as a suicide risk", "MCA cannot be used solely to detain her to await MHA assessment; that needs the MHA route", "Having capacity, staff have no lawful means to prevent immediate serious harm", "A doctor can complete s5(2) as she is an ED attender"], "answer": 2, "exp": "[Sessay] The MCA/common law cannot be used solely to detain someone to await an MHA assessment — that needs the MHA (s2/s3, or s136 in the community). The MCA applies only to those lacking capacity and only briefly to prevent immediate harm; she currently has capacity. s5(2) is an inpatient holding power, not for the ED.", "type": "mcq"}, {"n": 5, "topic": "Paediatric resus", "stem": "A 10-year-old in cardiac arrest, tracheal tube confirmed, continuous compressions. Ventilation rate?", "options": ["10", "15", "20", "25", "30 breaths/min"], "answer": 1, "exp": "[G] RCUK 2025: advanced airway in place → ventilate at the lower limit of normal for age — infants 25, 1–8y 20, 8–12y 15, >12y 10. A 10-year-old is in the 8–12y band → 15/min. Rates step down with age.", "type": "mcq"}, {"n": 6, "topic": "Paediatric resus", "stem": "An 8-year-old (25 kg) achieves ROSC after witnessed VF and goes to PICU. BP target for ≥24 h?", "options": ["Systolic >5th percentile", "Systolic and mean >10th percentile", "Mean >50th percentile", "Systolic >90th percentile", "Fixed MAP 65 mmHg"], "answer": 1, "exp": "[G] Post-ROSC target: systolic AND mean arterial pressure above the 10th percentile for ≥24 h. Distinguish from the 5th centile systolic used to define decompensation acutely.", "type": "mcq"}, {"n": 7, "topic": "Paediatric resus", "stem": "During CPR on a 4-year-old in asystole, a rhythm check shows an organised narrow-complex rhythm. Maximum duration to check signs of life and a central pulse?", "options": ["No pulse check", "Up to 5 s", "Up to 10 s", "Up to 15 s", "Up to 30 s"], "answer": 1, "exp": "[G] Within ALS every check is a maximum of 5 s — rhythm check <5 s, pulse/signs-of-life ≤5 s. The 10-second figure is BLS-only (initial breathing assessment).", "type": "mcq"}, {"n": 8, "topic": "Paediatric resus", "stem": "A 6-year-old pulled from an icy lake in arrest, core temp 31°C, shockable rhythm. Adrenaline and defibrillation?", "options": ["Adrenaline every 3–5 min, shock every 2 min as normal", "Single adrenaline, max 3 shocks, withhold both until >30°C", "Adrenaline every 8 min (6–10), defibrillate at normal 2-min intervals", "Withhold adrenaline until >35°C, shock without limit", "Double adrenaline, shock at 8 J/kg"], "answer": 2, "exp":

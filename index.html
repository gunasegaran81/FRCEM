ent after an alleged assault leaves the ED with his mother before being seen. Staff are unsure whether risk remains. What must this event trigger?", "options": ["No action — he left with a parent", "An immediate 999 call to the police", "Local safeguarding procedures", "A s136 request", "Referral to CAMHS within 24 hours"], "answer": 2, "exp": "[G] Recommendation 9: any children who abscond, with or without an accompanying adult, should trigger local safeguarding procedures. Police contact is a separate decision based on the risk assessment; the presence of a parent does not remove the safeguarding obligation — the accompanying adult is the distractor.", "type": "mcq"}, {"n": 13, "topic": "Observation level", "stem": "A 22-year-old man with suicidal ideation is assessed at triage as at high (but not the very highest) risk of absconding while waiting. What level of observation does RCEM recommend?", "options": ["Hourly welfare checks", "Observation every 30 minutes", "Intermittent observation, e.g. every 15 minutes", "Continuous one-to-one observation in all such cases", "CCTV monitoring from the nursing station"], "answer": 2, "exp": "[G] Patients at high risk of absconding or self-harm should be observed intermittently (e.g. every 15 minutes), or continuously if at very high risk. Staff carrying out observations should be trained and observations documented. Continuous observation is reserved for the very-high-risk group.", "type": "mcq"}, {"n": 14, "topic": "Governance", "stem": "Police are contacted and asked to urgently locate a vulnerable patient who absconded. What governance step must follow?", "options": ["No further action once the patient is found", "Completion of an incident form (e.g. DATIX), reviewed within a rolling governance programme with the police service", "A serious incident (SI) investigation in every case", "Referral of the case to the coroner", "Automatic safeguarding referral for all adults"], "answer": 1, "exp": "[G] Once police have been contacted to locate an absconded patient, an incident form (e.g. DATIX) should be completed, and these incidents reviewed as part of a rolling governance programme with the police. Departments should record numbers of absconding patients and police contacts to drive service improvement (Recommendation 10).", "type": "mcq"}]}, {"code": "S136", "title": "Section 136 for EDs", "source": "RCEM Brief Guide to s136 · Dec 2025", "hue": "#22d3ee", "questions": [{"n": 1, "topic": "Private dwelling", "stem": "A police officer finds a 34-year-old man behaving erratically in the private back garden of his own house, shouting that he is being watched by the government. The officer believes he has a mental disorder and is in immediate need of care or control. Can he be detained under s136?", "options": ["Yes, s136 applies anywhere including private dwellings and their gardens", "No, s136 cannot be used because he is in a private dwelling or associated private garden", "Yes, but only with a warrant obtained under section 135", "No, s136 can only be used in a hospital Emergency Department", "Yes, provided an AMHP is present at the scene"], "answer": 1, "exp": "[G] Per the RCEM Brief Guide to Section 136, s136 cannot be used if the person is in a private dwelling or the private garden/buildings associated with that place. Outside this exception s136 can be used in any other setting, including an ED. Entry to a private dwelling to remove a person requires a s135 warrant.", "type": "mcq"}, {"n": 2, "topic": "24-hour clock", "stem": "A patient is detained under s136 at 14:00 in a shopping centre. After a period in the police vehicle, they arrive at the ED at 15:30. At what time does the 24-hour period of detention begin?", "options": ["14:00, the time the officer first detained the patient", "15:30, the time of arrival at the Emergency Department (the place of safety)", "The time the triage nurse completes the initial assessment", "The time the on-call psychiatrist is bleeped", "Midnight on the day of detention"], "answer": 1, "exp": "[G] RCEM guidance: the 24-hour duration commences on arrival at the ED (the place of safety), even if the patient is subsequently transferred to a 136 suite. The time of arrival should be noted and recorded — a recurring exam boundary point.", "type": "mcq"}, {"n": 3, "topic": "12-hour extension", "stem": "A patient has been under s136 in the ED for 22 hours, still too intoxicated to be safely assessed. The MHA liaison team is unavailable. Most appropriate next step regarding the section?", "options": ["The section lapses at 24 hours regardless and the patient must be allowed to leave", "Any doctor may extend the section by up to 12 hours for medical reasons, ideally in discussion with the MHA team", "Only the AMHP can authorise any extension, and none is possible without them", "The patient should be sectioned under s2 instead to buy more time", "Security should physically restrain the patient until sober regardless of legal authority"], "answer": 1, "exp": "[G] s136 may be extended by 12 hours by a senior doctor who has assessed the patient, but only where there is a MEDICAL reason (not yet medically fit for assessment). Ideally enacted by the mental health professionals involved; if unavailable, any doctor can extend it, but should do so in discussion with the MHA team.", "type": "mcq"}, {"n": 4, "topic": "Police station (adult)", "stem": "Police wish to use a police station as the place of safety for a 40-year-old detained under s136 rather than the ED. Which is a correct precondition?", "options": ["It can be used for any adult if the ED is currently on divert", "It can be used if the behaviour presents imminent risk of serious injury or death, no other place of safety can reasonably detain them, and use is authorised by an inspector or above", "It can be used for anyone over the age of 16 without further authorisation", "It can be used routinely if the patient is intoxicated with alcohol", "It can be used if requested by the patient's family"], "answer": 1, "exp": "[G] A police station may only be used as a place of safety for an ADULT in exceptional circumstances: (a) behaviour presents an imminent risk of serious injury or death to self or others; (b) no other place of safety in the police area can reasonably be expected to detain them; and (c) authorised by an officer of inspector rank or above. Custody staff must ensure healthcare access and half-hourly checks.", "type": "mcq"}, {"n": 5, "topic": "Police station (under-18)", "stem": "A 16-year-old is detained under s136 after a public disturbance and appears acutely disturbed. The nearest ED-based place of safety is 90 minutes away; the local police station is 10 minutes away. Can the police station be used?", "options": ["Yes, if authorised by an inspector", "Yes, provided healthcare checks every 30 minutes are arranged", "No, police stations can never be used as a place of safety for anyone under 18", "Yes, but only for a maximum of 4 hours", "Yes, if the child's parents consent"], "answer": 2, "exp": "[G] RCEM guidance is explicit: police stations can NEVER be used as a place of safety for under-18s, regardless of distance, authorisation level, or parental consent. This is an absolute rule, unlike the conditional criteria that apply to adults.", "type": "mcq"}, {"n": 6, "topic": "Search powers", "stem": "A patient detained under s136 arrives at the ED and the accompanying officer wishes to search them before handover. Under what circumstance may a constable search a person detained under s136?", "options": ["Search is never permitted once s136 has been invoked", "Only with a magistrate's warrant", "If the constable has reasonable grounds to suspect a risk of self-harm or risk of harm to others", "Only if the patient consents in writing", "Only after formal MHA assessment is complete"], "answer": 2, "exp": "[G] Per the RCEM guidance summarising s136 powers, a police constable may search a detained person if they have reasonable grounds to suspect a risk of self-harm or risk of harm to others.", "type": "mcq"}, {"n": 7, "topic": "'If practicable' consultation", "stem": "Before invoking s136 in the community, what is the correct step regarding mental health professional involvement?", "options": ["Mental health professionals must always be physically present before s136 can be used", "Police must consult mental health professionals, if practicable, before using s136", "Mental health professional consultation is only required for patients under 18", "Consultation is only required if the person is in a public place, not elsewhere", "There is no requirement to consult mental health professionals at any stage"], "answer": 1, "exp": "[G] Police must consult mental health professionals, IF PRACTICABLE, before using s136. This is a 'where possible' duty, not an absolute precondition — s136 can still be used in an emergency without prior consultation if consultation is not practicable. Time to consult → consult; no time → act, still s136.", "type": "mcq"}, {"n": 8, "topic": "Place of safety agreement", "stem": "A patient is medically cleared and stable in the ED under s136 awaiting AMHP assessment. Escorting officers ask if they can leave. What determines whether the ED can safely take over responsibility?", "options": ["The ED must accept responsibility automatically once medical clearance occurs", "The ED is only a place of safety if the patient can be kept safe when the police leave, and this requires an agreement between an appropriate ED senior and the police officer", "Responsibility transfers automatically after 4 hours in the ED, per the 4-hour target", "Only the duty police inspector can authorise the police to leave, with no ED input required", "The patient's own consent is what determines whether police can leave"], "answer": 1, "exp": "[G] The ED is a health-based place of safety, but only a place of safety if the patient can be kept safe if the police leave. An agreement about if or when police may leave should be made by an appropriate ED senior (e.g. the senior nurse) and the police officer, with disagreements escalated to the emergency physician in charge and the duty inspector.", "type": "mcq"}, {"n": 9, "topic": "Webley case", "stem": "An ED senior agrees to take over legal responsibility for a s136 patient and allows police to leave. The patient absconds and comes to harm. Which legal precedent does RCEM highlight?", "options": ["The 'Webley' case, which established that the ED could be liable in negligence if they take on responsibility and the patient absconds", "The Bolam test, which protects clinicians from any liability if guidelines were followed", "Gillick competence, which is only relevant to under-16s", "The Montgomery ruling on consent to treatment", "There is no legal precedent; liability always remains with police regardless of handover"], "answer": 0, "exp": "[G] RCEM cites the 2015 'Webley' case as highlighting that an ED could be liable in negligence law if it agrees to take on legal responsibility for a s136 patient who then absconds. Conversely, if ED staff decline responsibility and police leave anyway, the police could be liable for abandoning someone in their custody.", "type": "mcq"}, {"n": 10, "topic": "RCRP", "stem": "Regarding the Right Care, Right Person (RCRP) national partnership agreement referenced in RCEM's s136 guidance, which statement is most accurate?", "options": ["RCRP mandates that police attend all mental health calls regardless of risk", "RCRP is an approach under which police aim to step back from all but the highest-risk mental healthcare work, requiring EDs to jointly agree procedures with police, mental health trusts, and social care", "RCRP abolishes the use of s136 entirely", "RCRP applies only in Scotland and Northern Ireland", "RCRP transfers all place-of-safety responsibility to ambulance services"], "answer": 1, "exp": "[G] RCEM describes RCRP as a national partnership agreement (signed July 2023) under which police in England and Wales aim to release themselves from all but the highest-risk mental healthcare work. EDs should work closely with local police, mental health trusts, social care and commissioning boards to jointly agree procedures throughout the s136 journey.", "type": "mcq"}, {"n": 11, "topic": "After expiry", "stem": "A patient's s136 detention (including the 12-hour extension) has expired and no MHA assessment has been completed. The patient wishes to leave. Which framework now governs their care?", "options": ["The patient remains detained under s136 indefinitely until assessed", "The patient automatically becomes detained under s2 of the MHA", "Once s136 expires, the patient is subject to the same legal frameworks as any other patient, e.g. the Mental Capacity Act or common law", "The patient must be physically restrained pending police re-attendance", "Detention continues under the authority of the ED consultant alone"], "answer": 2, "exp": "[G] Once the s136 runs out, the patient is subject to the same legal frameworks as any other patient — e.g. the Mental Capacity Act or common law — and RCEM directs readers to its 'Patient Who Absconds' and 'MCA in Emergency Medicine' guidance. There is no automatic conversion to another MHA section.", "type": "mcq"}, {"n": 12, "topic": "Rights", "stem": "On arrival in the ED under s136, what must staff ensure regarding communication with the patient, per RCEM's audit standards?", "options": ["Rights need only be explained if the patient specifically requests this information", "Rights must be explained to the patient and written information provided, alongside ongoing updates on their care and assessment plan", "Rights are explained only by the AMHP once they arrive, not by ED staff", "Written information is optional if verbal explanation has been given", "Explaining rights can be delayed until medical clearance is complete"], "answer": 1, "exp": "[G] RCEM's audit standards require that rights are explained to the patient and written information provided (an example leaflet is in Appendix 1). Patients should also be kept updated of the plan for their care and assessment, delivered by the nurse in charge or senior clinician at initial review — not contingent on the AMHP's arrival or on medical clearance.", "type": "mcq"}]}, {"code": "MIX2", "title": "Mixed Weak-Area Drill 2", "source": "NICE NG95 · RCUK 2025 · MHA · BSPED", "hue": "#f472b6", "questions": [{"n": 1, "topic": "Lyme serology", "stem": "A 34-year-old returns from hiking in the New Forest with a spreading annular rash. Lyme ELISA returns NEGATIVE, clinical suspicion remains high, symptoms began 9 days ago. Next step?", "options": ["Report ELISA as excluding Lyme", "Send immunoblot to confirm the negative", "Repeat ELISA in 4–6 weeks if symptoms persist", "Start doxycycline, no further serology", "Paired convalescent immunoblots 2 weeks apart"], "answer": 2, "exp": "[G] NICE NG95: a NEGATIVE ELISA with persisting suspicion is rescued by a repeat ELISA at 4–6 weeks (early testing predates antibody development). The immunoblot confirms a POSITIVE/equivocal ELISA — it does not rescue a negative one. If erythema migrans is present, diagnose clinically and treat with no serology.", "type": "mcq"}, {"n": 2, "topic": "Envenomation", "stem": "A 28-year-old stands on something wading at a UK beach — excruciating foot pain out of proportion to a small puncture. Weever fish suspected. First-line pain management?", "options": ["IV morphine as priority", "Immerse in hot water 40–45°C", "Cold pack and elevate", "LA infiltration first", "Iced water 5–10°C"], "answer": 1, "exp": "[C] Weever venom is thermolabile — hot water immersion at 40–45°C for 30–90 min is first-line and usually relieves pain faster than opioids. Morphine is an adjunct; cold worsens it.", "type": "mcq"}, {"n": 3, "topic": "Section 136", "stem": "Police called to a shopping centre; a man with apparent mental disorder stands on a ledge, in immediate danger. No mental health professional immediately contactable. Lawful position on s136?", "options": ["Must consult a professional first, cannot act yet", "May use s136 immediately; consultation required only where practicable", "Must obtain a s135 warrant first", "Cannot use s136 (private property)", "Must use common law instead"], "answer": 1, "exp": "[G] MHA 1983 / RCEM s136 guide: consultation is required WHERE PRACTICABLE. In a time-critical, imminent-risk situation, immediate use without prior consultation is lawful — a duty to attempt, not an absolute precondition. It doesn't force s135 or common law. s136 applies anywhere other than a private dwelling.", "type": "mcq"}, {"n": 4, "topic": "MCA vs MHA (Sessay)", "stem": "A 45-year-old with depression attends after a small overdose, now medically fit, wants to leave before the MH team arrives, and has capacity at this moment. Correct statement?", "options": ["MCA can detain her until the MHA assessment is complete", "Common law can hold her indefinitely as a suicide risk", "MCA cannot be used solely to detain her to await MHA assessment; that needs the MHA route", "Having capacity, staff have no lawful means to prevent immediate serious harm", "A doctor can complete s5(2) as she is an ED attender"], "answer": 2, "exp": "[Sessay] The MCA/common law cannot be used solely to detain someone to await an MHA assessment — that needs the MHA (s2/s3, or s136 in the community). The MCA applies only to those lacking capacity and only briefly to prevent immediate harm; she currently has capacity. s5(2) is an inpatient holding power, not for the ED.", "type": "mcq"}, {"n": 5, "topic": "Paediatric resus", "stem": "A 10-year-old in cardiac arrest, tracheal tube confirmed, continuous compressions. Ventilation rate?", "options": ["10", "15", "20", "25", "30 breaths/min"], "answer": 1, "exp": "[G] RCUK 2025: advanced airway in place → ventilate at the lower limit of normal for age — infants 25, 1–8y 20, 8–12y 15, >12y 10. A 10-year-old is in the 8–12y band → 15/min. Rates step down with age.", "type": "mcq"}, {"n": 6, "topic": "Paediatric resus", "stem": "An 8-year-old (25 kg) achieves ROSC after witnessed VF and goes to PICU. BP target for ≥24 h?", "options": ["Systolic >5th percentile", "Systolic and mean >10th percentile", "Mean >50th percentile", "Systolic >90th percentile", "Fixed MAP 65 mmHg"], "answer": 1, "exp": "[G] Post-ROSC target: systolic AND mean arterial pressure above the 10th percentile for ≥24 h. Distinguish from the 5th centile systolic used to define decompensation acutely.", "type": "mcq"}, {"n": 7, "topic": "Paediatric resus", "stem": "During CPR on a 4-year-old in asystole, a rhythm check shows an organised narrow-complex rhythm. Maximum duration to check signs of life and a central pulse?", "options": ["No pulse check", "Up to 5 s", "Up to 10 s", "Up to 15 s", "Up to 30 s"], "answer": 1, "exp": "[G] Within ALS every check is a maximum of 5 s — rhythm check <5 s, pulse/signs-of-life ≤5 s. The 10-second figure is BLS-only (initial breathing assessment).", "type": "mcq"}, {"n": 8, "topic": "Paediatric resus", "stem": "A 6-year-old pulled from an icy lake in arrest, core temp 31°C, shockable rhythm. Adrenaline and defibrillation?", "options": ["Adrenaline every 3–5 min, shock every 2 min as normal", "Single adrenaline, max 3 shocks, withhold both until >30°C", "Adrenaline every 8 min (6–10), defibrillate at normal 2-min intervals", "Withhold adrenaline until >35°C, shock without limit", "Double adrenaline, shock at 8 J/kg"], "answer": 2, "exp": "[G] 30–35°C band: adrenaline every ~8 min (6–10), defibrillate at normal 2-min intervals. Below 30°C is the different rule (single adrenaline, max 3 shocks, hold until >30°C, start ECLS). At 31°C this child is in the 30–35°C band.", "type": "mcq"}, {"n": 9, "topic": "DKA fluids", "stem": "A 25 kg child in DKA, dehydrated and vomiting but NOT shocked (CRT 2 s, normal BP). Initial fluid?", "options": ["10 mL/kg over 30 min, subtracted from the requirement", "20 mL/kg over 10 min, not subtracted", "10 mL/kg over 5–10 min, repeated to 40 mL/kg", "No bolus; deficit over 48 h only", "20 mL/kg 0.45% saline over 1 h"], "answer": 0, "exp": "[G NICE NG18 / BSPED 2024] Dehydrated but NOT shocked: 10 mL/kg over 30 min, and subtract that volume from the fluid requirement. Shocked = 10 mL/kg over 5–10 min, repeat to 40 mL/kg, NOT subtracted. Not shocked = slower + subtracted.", "type": "mcq"}, {"n": 10, "topic": "Pre-arrest adrenaline", "stem": "A 3-year-old during anaesthetic induction becomes profoundly bradycardic and hypotensive but has NOT lost cardiac output. Initial adrenaline dose?", "options": ["10 mcg/kg IV immediately", "1–2 mcg/kg IV incremental, escalating to 10 mcg/kg only if arrest", "100 mcg/kg IV", "500 mcg IM", "Withhold until asystole confirmed"], "answer": 1, "exp": "[G] Pre-arrest bradycardia/hypotension: incremental 1–2 mcg/kg IV, escalating to the 10 mcg/kg arrest dose only if arrest occurs. The pre-arrest dose is one tenth of the arrest dose.", "type": "mcq"}]}]</script>
<script>
const SETS = JSON.parse(document.getElementById('data').textContent);
const LTR = ['A','B','C','D','E'];
const app = document.getElementById('app');
let S = { view:'home', set:null, start:1 };
let run = null; // {set, order:[idx...], pos, answers:{n:chosen}, correct, attempted, missed:[], viewedMax}

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function home(){
  const cards = SETS.map((set,i)=>`
    <button class="card" style="--hue:${set.hue}" onclick="openSet(${i})">
      <span class="spine"></span>
      <span class="top">
        <span class="chip">${set.code}</span>
        <span class="qn">${set.questions.length} Q</span>
      </span>
      <h2>${esc(set.title)}</h2>
      <div class="src">${esc(set.source)}</div>
    </button>`).join('');
  app.innerHTML = `
    <div class="eyebrow">FRCEM SBA · Question Bank</div>
    <h1>Catalogue</h1>
    <p class="sub">Tap a set, choose where to start, work through in fixed order. Nothing is stored on your device — copy your result code at the end.</p>
    <div class="cards">${cards}</div>
    <div class="foot">${SETS.reduce((a,s)=>a+s.questions.length,0)} questions · UK guidelines only</div>`;
  window.scrollTo(0,0);
}

function openSet(i){
  S.set=i; S.start=1;
  const set=SETS[i]; const n=set.questions.length;
  app.innerHTML=`
    <button class="back" onclick="home()">&larr; Catalogue</button>
    <div class="panel" style="--hue:${set.hue}">
      <span class="chip" style="--hue:${set.hue}">${set.code}</span>
      <h1 style="margin-top:12px">${esc(set.title)}</h1>
      <div class="sub" style="margin-bottom:18px">${esc(set.source)} · ${n} questions</div>
      <div class="label">Start from question</div>
      <div class="stepper">
        <button onclick="bump(-1)" aria-label="down">–</button>
        <input id="startn" type="number" inputmode="numeric" min="1" max="${n}" value="${S.start}" onchange="setStart(this.value)">
        <button onclick="bump(1)" aria-label="up">+</button>
      </div>
      <div style="height:18px"></div>
      <button class="btn" style="background:${set.hue};color:#0d1117" onclick="startRun()">Start &rarr;</button>
    </div>`;
  window.scrollTo(0,0);
}
function bump(d){const set=SETS[S.set];S.start=Math.min(set.questions.length,Math.max(1,S.start+d));document.getElementById('startn').value=S.start;}
function setStart(v){const set=SETS[S.set];let x=parseInt(v||'1',10);if(isNaN(x))x=1;S.start=Math.min(set.questions.length,Math.max(1,x));document.getElementById('startn').value=S.start;}

function startRun(){
  const set=SETS[S.set];
  const order=[]; for(let k=S.start-1;k<set.questions.length;k++) order.push(k);
  run={set:S.set,order,pos:0,answers:{},correct:0,attempted:0,missed:[],lastN:set.questions[order[0]].n};
  renderQ();
}

function renderQ(){
  const set=SETS[run.set];
  const q=set.questions[run.order[run.pos]];
  run.lastN=q.n;
  const total=run.order.length, done=run.pos;
  const answered = run.answers.hasOwnProperty(q.n);
  const isShort = q.type==='short';
  let optsHtml='';
  if(!isShort){
    optsHtml = q.options.map((o,k)=>{
      let cls='opt';
      if(answered){
        if(k===q.answer) cls+=' correct';
        else if(k===run.answers[q.n]) cls+=' wrong';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="choose(${k})">
        <span class="ltr">${LTR[k]}</span><span>${esc(o)}</span></button>`;
    }).join('');
  }
  let expHtml='';
  if(answered){
    if(isShort){
      expHtml=`<div class="model"><b>Model answer.</b> ${esc(q.model)}</div>
               <div class="exp"><div class="verdict">Recall card — not scored</div>${esc(q.exp||'')}</div>`;
    }else{
      const ok=run.answers[q.n]===q.answer;
      expHtml=`<div class="exp"><div class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect — answer '+LTR[q.answer]}</div>${esc(q.exp)}</div>`;
    }
  }
  const lastQ = run.pos===total-1;
  const nav = answered ? `<button class="btn" style="background:${set.hue};color:#0d1117" onclick="next()">${lastQ?'Finish &rarr;':'Next &rarr;'}</button>` : '';
  const shortReveal = (isShort && !answered) ? `<button class="btn ghost" onclick="revealShort()">Reveal model answer</button>` : '';
  app.innerHTML=`
    <div class="qbar" style="--hue:${set.hue}">
      <span class="idx">${set.code} · Q${q.n}</span>
      <span class="prog"><i style="width:${Math.round((done/(total))*100)}%"></i></span>
      <button class="stop" onclick="finish(true)">Stop &amp; score</button>
    </div>
    <span class="tag" style="--hue:${set.hue}">${esc(q.topic)}</span>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts">${optsHtml}</div>
    ${shortReveal}
    ${expHtml}
    <div class="navbtns">${nav}</div>`;
  window.scrollTo(0,0);
}

function choose(k){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  if(run.answers.hasOwnProperty(q.n))return;
  run.answers[q.n]=k; run.attempted++;
  if(k===q.answer) run.correct++; else run.missed.push(q.n);
  renderQ();
}
function revealShort(){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  run.answers[q.n]='seen'; renderQ();
}
function next(){
  if(run.pos<run.order.length-1){run.pos++;renderQ();}
  else finish(false);
}

function finish(stopped){
  const set=SETS[run.set];
  const firstN = set.questions[run.order[0]].n;
  const lastN = run.lastN;
  const att=run.attempted, cor=run.correct;
  const pct = att? Math.round(cor/att*100):0;
  const missed=[...run.missed].sort((a,b)=>a-b);
  const code = `${set.code} ${firstN}-${lastN} ${cor}/${att} W:${missed.length?missed.join(','):'-'}`;
  const missedHtml = missed.length? `<div class="label" style="margin-top:16px">Missed</div><div class="missed">${missed.map(n=>`<span>Q${n}</span>`).join('')}</div>`:
    `<div class="label" style="margin-top:16px">Missed</div><div class="sub" style="margin:0">None — clean run.</div>`;
  app.innerHTML=`
    <button class="back" onclick="openSet(${run.set})">&larr; ${set.code}</button>
    <div class="panel" style="--hue:${set.hue}">
      <div class="label">${set.code} · ${stopped?'stopped at':'completed to'} Q${lastN}</div>
      <div class="big">${cor}<span style="color:var(--muted);font-size:24px">/${att}</span></div>
      <div class="pct">${pct}% · questions ${firstN}–${lastN}</div>
      ${missedHtml}
      <div class="label" style="margin-top:18px">Result code</div>
      <div class="code" id="code">${esc(code)}</div>
      <div class="navbtns">
        <button class="btn sm" style="background:${set.hue};color:#0d1117;width:100%" onclick="copyCode(${JSON.stringify(code).replace(/"/g,'&quot;')})">Copy result code</button>
      </div>
      <div class="navbtns">
        <button class="btn ghost" onclick="home()">Catalogue</button>
        <button class="btn ghost" onclick="openSet(${run.set})">Redo set</button>
      </div>
    </div>
    <div class="foot">Paste the code back into your FRCEM chat to log the result.</div>`;
  window.scrollTo(0,0);
}

function copyCode(txt){
  const done=()=>toast();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,cb){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
let tt;
function toast(){const t=document.getElementById('toast');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400);}

home();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRCEM SBA Catalogue</title>
<style>
  :root{
    --bg:#0d1117; --surface:#141b26; --surface2:#0f1620; --line:#26313f;
    --ink:#e7edf4; --muted:#8b98a9; --faint:#5a6675;
    --accent:#f5b544; --good:#3fb950; --bad:#f85149;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{line-height:1.5;padding:0 0 env(safe-area-inset-bottom)}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 96px}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .eyebrow{font:600 11px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  /* set cards */
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
        padding:16px 16px 16px 18px;text-align:left;width:100%;color:inherit;overflow:hidden;
        transition:border-color .15s,transform .05s}
  .card:active{transform:scale(.995)}
  .card:hover{border-color:#38455a}
  .card .spine{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hue,#888)}
  .card .top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .chip{font:700 11px/1 var(--mono);letter-spacing:.08em;padding:5px 8px;border-radius:6px;
        color:#0d1117;background:var(--hue,#888)}
  .qn{margin-left:auto;font:600 12px/1 var(--mono);color:var(--muted)}
  .card h2{font-size:17px;font-weight:700;margin:0 0 3px}
  .card .src{font-size:12px;color:var(--muted)}
  /* generic */
  .row{display:flex;align-items:center;gap:10px}
  .back{background:none;border:none;color:var(--muted);font:600 13px var(--sans);padding:6px 0;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--ink)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;background:var(--surface2)}
  .stepper button{width:46px;height:46px;background:none;border:none;color:var(--ink);font-size:22px;font-weight:700}
  .stepper button:active{background:#1c2532}
  .stepper input{width:64px;height:46px;text-align:center;background:none;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--ink);font:700 18px var(--mono)}
  .stepper input:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;
       font-weight:700;font-size:15px;padding:14px 18px;background:var(--accent);color:#1a1200;width:100%}
  .btn:active{filter:brightness(.94)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:10px 14px;font-size:13px}
  .label{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  /* quiz */
  .qbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .qbar .idx{font:700 13px var(--mono);color:var(--muted)}
  .prog{flex:1;height:5px;background:var(--surface);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--hue,var(--accent));transition:width .25s}
  .stop{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 10px;font:600 12px var(--sans);white-space:nowrap}
  .stop:hover{color:var(--ink)}
  .tag{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;color:var(--hue,var(--accent));border:1px solid var(--line);padding:4px 8px;border-radius:6px;margin-bottom:12px}
  .stem{font-size:17px;font-weight:500;margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);
       border-radius:11px;padding:13px 14px;color:var(--ink);font-size:15px;transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:#3c4a5e}
  .opt .ltr{font:700 13px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
  .opt.correct{border-color:var(--good);background:rgba(63,185,80,.12)}
  .opt.correct .ltr{background:var(--good);color:#04140a;border-color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:rgba(248,81,73,.10)}
  .opt.wrong .ltr{background:var(--bad);color:#1a0403;border-color:var(--bad)}
  .opt:disabled{cursor:default;opacity:1}
  .exp{margin-top:14px;border-left:3px solid var(--hue,var(--accent));background:var(--surface2);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;color:#cdd7e2}
  .exp .verdict{font-weight:700;margin-bottom:5px;display:flex;gap:8px;align-items:center}
  .exp .verdict.ok{color:var(--good)} .exp .verdict.no{color:var(--bad)}
  .model{margin-top:12px;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:#cdd7e2}
  .navbtns{display:flex;gap:10px;margin-top:18px}
  /* score */
  .big{font:800 44px/1 var(--sans);letter-spacing:-.02em}
  .pct{color:var(--muted);font-size:14px;margin-top:4px}
  .code{font:600 13px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--accent);word-break:break-all;margin-top:6px}
  .missed{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .missed span{font:600 12px var(--mono);background:rgba(248,81,73,.12);color:#ff9d97;border:1px solid rgba(248,81,73,.3);padding:4px 8px;border-radius:6px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1e2836;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .foot{margin-top:26px;color:var(--faint);font-size:12px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>

<script id="data" type="application/json">[{"code": "PRES", "title": "Paediatric Resuscitation", "source": "RCUK 2025 · NICE NG18 · BSPED 2024", "hue": "#5eead4", "questions": [{"n": 1, "topic": "Paediatric BLS", "stem": "A 6-month-old is found unresponsive on the paediatric ward. Airway opened with neutral-position head tilt/chin lift, not breathing normally, no signs of life. A colleague has bag-mask and oxygen ready. Immediate next action?", "options": ["Start 15 chest compressions before any ventilation", "Give 5 rescue breaths using bag-mask ventilation with oxygen", "Attach the defibrillator and analyse the rhythm before ventilating", "Give 2 rescue breaths then reassess for a brachial pulse for 10 seconds", "Start continuous chest compressions without ventilation"], "answer": 1, "exp": "[G] Paediatric BLS opens with five rescue breaths before compressions — paediatric arrest is overwhelmingly hypoxic. [G] Competent providers use BMV with oxygen rather than mouth-to-mouth. [G] Compressions follow only if no signs of life during the breaths. Compressions-first is the adult sequence; no formal pulse check is required.", "type": "mcq"}, {"n": 2, "topic": "Paediatric BLS", "stem": "A 5-year-old in cardiac arrest in resus. Two competent providers, no advanced airway. Compression-to-ventilation ratio?", "options": ["30:2", "15:2", "5:1", "3:1", "Continuous compressions with asynchronous ventilation"], "answer": 1, "exp": "[G] 15:2 is the ratio for anyone specifically trained in PBLS. [G] 30:2 is reserved for untrained rescuers, those trained only in adult BLS, and dispatcher-assisted CPR. The distinction is about the rescuer's training, not the child's age.", "type": "mcq"}, {"n": 3, "topic": "Bradycardia → CPR", "stem": "A 3-year-old with severe bronchiolitis: HR 48/min, weak central pulse, CRT 5 s, reduced conscious level, no improvement after 60 s of effective BMV with 100% oxygen. Most appropriate next step?", "options": ["Give atropine 20 mcg/kg IV and reassess", "Continue ventilation alone for a further 2 minutes", "Start chest compressions", "Give a 10 mL/kg fluid bolus and reassess", "Apply transcutaneous pacing"], "answer": 2, "exp": "[G] Compressions are indicated when a child is bradycardic below 60/min with poor perfusion despite adequate respiratory support, even with a palpable pulse. Both conditions must be met: rate <60 AND failure to respond to oxygenation/ventilation. Atropine is for vagally-mediated bradycardia or conduction disease.", "type": "mcq"}, {"n": 4, "topic": "Arrest drugs", "stem": "A 2-year-old (12 kg) in asystole, IO access just obtained. Correct initial adrenaline dose and timing?", "options": ["120 mcg (1.2 mL of 1:10,000) now, repeated every 3–5 min", "120 mcg (1.2 mL of 1:1000) now, repeated every 2 min", "1 mg (10 mL of 1:10,000) now, repeated every 3–5 min", "120 mcg IO after the second 2-minute cycle only", "1.2 mg (1.2 mL of 1:1000) now, repeated every 5 min"], "answer": 0, "exp": "[G] Adrenaline 10 mcg/kg IV/IO (max single dose 1 mg), given as soon as possible in non-shockable rhythms, repeated every 3–5 min. [G] Strength is 1:10,000 (100 mcg/mL) = 0.1 mL/kg. Follow with a flush. 1:1000 is the anaphylaxis IM concentration.", "type": "mcq"}, {"n": 5, "topic": "Defibrillation", "stem": "A 7-year-old (23 kg) collapses in the ED; monitor shows VF. Energy for the first shock?", "options": ["23 J", "46 J", "92 J", "150 J", "200 J"], "answer": 2, "exp": "[G] 4 J/kg for the first and all subsequent shocks, monophasic or biphasic. 23 × 4 = 92 J. [C] In practice select the nearest available setting.", "type": "mcq"}, {"n": 6, "topic": "Shockable rhythm drugs", "stem": "A 4-year-old in VF has had two shocks with immediate CPR after each. Rhythm remains VF at the third rhythm check. Immediately after the third shock, which drugs?", "options": ["Adrenaline only", "Amiodarone only", "Adrenaline and amiodarone", "Adrenaline and magnesium sulfate", "Amiodarone and calcium gluconate"], "answer": 2, "exp": "[G] After 3 shocks: adrenaline 10 mcg/kg IV/IO (then every 3–5 min) and amiodarone 5 mg/kg. [G] Amiodarone repeated 5 mg/kg once more only after the 5th shock. The commonest error is giving adrenaline earlier in a shockable rhythm — in VF/pVT it is withheld until after the third shock.", "type": "mcq"}, {"n": 7, "topic": "Refractory VF", "stem": "An 8-year-old (26 kg) in refractory VF after five shocks at 4 J/kg. Most appropriate escalation?", "options": ["Continue at 4 J/kg indefinitely", "Increase stepwise up to a maximum of 8 J/kg (max 360 J)", "Switch immediately to 360 J", "Increase to 10 J/kg", "Halve the energy and give paired stacked shocks"], "answer": 1, "exp": "[G] From the 5th shock onward, escalate stepwise up to 8 J/kg, capped at 360 J, for refractory VF/pVT. In adolescents escalate to 360 J. This is a change from a fixed 4 J/kg throughout.", "type": "mcq"}, {"n": 8, "topic": "Ventilation rate", "stem": "A 4-month-old in cardiac arrest, tracheal tube confirmed with waveform capnography, continuous compressions. Ventilation rate?", "options": ["10 breaths/min", "15 breaths/min", "20 breaths/min", "25 breaths/min", "40 breaths/min"], "answer": 3, "exp": "[G] With an advanced airway, ventilate at the lower limit of the normal rate for age: infants 25, 1–8y 20, 8–12y 15, >12y 10 breaths/min. Rates step down with increasing age. [G] Waveform capnography confirms placement and monitors ventilation.", "type": "mcq"}, {"n": 9, "topic": "Ventilation rate", "stem": "A 14-year-old in cardiac arrest with an SGA and continuous compressions. Ventilation rate?", "options": ["10 breaths/min", "12 breaths/min", "15 breaths/min", "20 breaths/min", "25 breaths/min"], "answer": 0, "exp": "[G] Over 12 years: 10/min. Same age-band table as Q8, opposite end: 25 / 20 / 15 / 10.", "type": "mcq"}, {"n": 10, "topic": "Advanced airway", "stem": "A 6-year-old in PEA just intubated mid-cycle. What happens to compressions and ventilation?", "options": ["Continue 15:2 until the next rhythm check, then switch", "Give continuous compressions and ventilate without pausing", "Pause compressions for each ventilation to avoid gastric insufflation", "Switch to 30:2 as for adults", "Stop ventilating and give compression-only CPR"], "answer": 1, "exp": "[G] Give continuous compressions once the airway is managed with a tracheal tube or SGA, ventilating without pausing, pausing only briefly for rhythm checks. [G] Do not interrupt compressions during airway management itself.", "type": "mcq"}, {"n": 11, "topic": "Advanced airway", "stem": "During continuous compressions in an intubated 3-year-old there is a large audible air leak and markedly diminished chest rise despite repositioning. Most appropriate action?", "options": ["Increase the ventilation rate to 30/min", "Return to a 15:2 compression-to-ventilation ratio", "Stop ventilating and continue compression-only CPR", "Increase inspiratory time to 3 seconds per breath", "Add 10 cmH2O of PEEP"], "answer": 1, "exp": "[G] Where there is doubt about the effectiveness of ventilation during continuous compressions — high air leak, diminished air entry — return to 15:2. This is the safety valve on the Q10 rule: continuous compressions are conditional on ventilation actually working.", "type": "mcq"}, {"n": 12, "topic": "Oxygen during CPR", "stem": "A 5-year-old receiving BMV during CPR; saturation probe reads 100%. How should inspired oxygen be managed during the arrest?", "options": ["Titrate FiO2 down to achieve SpO2 94–98%", "Reduce to 60% oxygen to limit reperfusion injury", "Continue 100% oxygen and do not titrate FiO2", "Titrate to an ETCO2 of 4–5 kPa", "Alternate 100% and 21% oxygen between cycles"], "answer": 2, "exp": "[G] Oxygenate and ventilate with 100% oxygen during CPR; do not titrate FiO2 during the arrest. [G] Titration to 94–98% begins only after ROSC. Saturation readings during CPR are unreliable.", "type": "mcq"}, {"n": 13, "topic": "Post-ROSC oxygen", "stem": "A 9-year-old achieves ROSC after a 12-minute arrest; ABG available. Oxygenation target?", "options": ["SpO2 100% for the first hour", "SpO2 88–92%", "SpO2 94–98% and normoxaemia on ABG", "PaO2 >20 kPa to maximise oxygen delivery", "SpO2 >90% with permissive hypoxaemia"], "answer": 2, "exp": "[G] Titrate FiO2 to SpO2 94–98% as soon as a reliable measurement is available; where ABG is available aim for normoxaemia. [G] Without ABG, aim for a normal respiratory rate for age and mild, just-visible chest rise.", "type": "mcq"}, {"n": 14, "topic": "Post-ROSC BP", "stem": "A 2-year-old has ROSC after in-hospital arrest, transferred to PICU. Absent a reason to individualise, BP goal for at least 24 hours?", "options": ["Systolic and mean arterial pressure above the 10th percentile for age", "Mean arterial pressure above the 50th percentile for age", "Systolic BP above the 5th percentile for age", "Mean arterial pressure 65 mmHg regardless of age", "Systolic BP above the 90th percentile for age"], "answer": 0, "exp": "[G] Target normoxaemia, normocapnia, and systolic AND mean arterial pressure above the 10th percentile for at least 24 h after arrest. Distinguish from the arrhythmia algorithm, which uses the 5th centile systolic to define decompensation — different percentile, different purpose.", "type": "mcq"}, {"n": 15, "topic": "Temperature control", "stem": "A 6-year-old remains comatose 6 h after ROSC; core temperature 37.9°C. Which best reflects RCUK 2025 temperature management?", "options": ["Actively cool to 33°C for 24 hours", "Maintain temperature control for at least 24 hours and avoid fever for at least 72 hours", "Allow spontaneous rewarming and treat fever only above 39°C", "Cool to 33°C for 72 hours then rewarm at 0.5°C/h", "Temperature control is not indicated after in-hospital arrest"], "answer": 1, "exp": "[G] Temperature control is integral to post-resuscitation care for at least 24 h after arrest; fever is avoided for at least 72 h. [G] Hyperthermia is always treated with active cooling. [G] Individualised goals are preferred over a single fixed target, so a mandated 33°C protocol is not the recommendation.", "type": "mcq"}, {"n": 16, "topic": "Prognostication", "stem": "Parents of a 4-year-old still sedated and unresponsive 24 h after a prolonged out-of-hospital arrest ask about recovery. Correct approach?", "options": ["Give a definitive prognosis based on absent pupillary reflexes at 24 hours", "Base prognosis on the initial rhythm alone", "Withhold formal prognostication for at least 72 hours and use a multimodal approach", "Use serum neuron-specific enolase alone at 48 hours", "Prognosticate at 48 hours if the EEG is isoelectric"], "answer": 2, "exp": "[G] Delay prognostication for at least 72 h in children with decreased consciousness or who are sedated. [G] No single modality has sufficient accuracy alone; combine pre-arrest status, arrest context and repeated post-arrest assessment. [G] Avoid both false optimism and false pessimism.", "type": "mcq"}, {"n": 17, "topic": "Pulse check", "stem": "During CPR on a 5-year-old in PEA, the 2-minute rhythm check shows an organised narrow-complex rhythm at 90/min. Most appropriate action?", "options": ["Immediately resume compressions without further assessment", "Check for signs of life and feel for a central pulse for a maximum of 5 seconds", "Palpate a peripheral pulse for up to 30 seconds", "Give a further dose of adrenaline before reassessing", "Deliver a synchronised shock at 1 J/kg"], "answer": 1, "exp": "[G] Reassess rhythm every 2 min, taking under 5 s. [G] If the rhythm becomes organised and could produce output, check signs of life and a central pulse for a maximum of 5 s. The 10-second figure belongs only to the initial BLS assessment — everything within ALS is 5 seconds.", "type": "mcq"}, {"n": 18, "topic": "CPR quality", "stem": "In a prolonged paediatric resuscitation, how often should the compressor be changed?", "options": ["Every 30 seconds", "At least every 2 minutes, or earlier if fatigued", "Every 5 minutes", "Only when the rescuer requests it", "Only at drug administration points"], "answer": 1, "exp": "[G] Change the person performing compressions at least every 2 min; watch for fatigue or suboptimal compressions and switch earlier if needed.", "type": "mcq"}, {"n": 19, "topic": "SVT compensated", "stem": "A 9-month-old (8 kg) with narrow-complex tachycardia 260/min, abrupt onset, normal conscious level, CRT 2 s, BP 78 systolic. Ice to face failed, IV in place. Next step?", "options": ["Adenosine 0.1–0.2 mg/kg rapid IV bolus with a large flush", "Adenosine 0.3 mg/kg rapid IV bolus with a large flush", "Synchronised cardioversion at 1 J/kg", "Amiodarone 5 mg/kg over 20 minutes", "Verapamil 0.1 mg/kg IV"], "answer": 0, "exp": "[G] Narrow-complex SVT without decompensated circulatory failure: vagal manoeuvres (modified Valsalva or ice to face), then IV adenosine 0.1–0.2 mg/kg (max 6 mg) as a rapid bolus via a large vein with a large flush, 12-lead ECG running. Cardioversion is for decompensated children; verapamil is not in the RCUK paediatric pathway and is hazardous in infants.", "type": "mcq"}, {"n": 20, "topic": "SVT escalation", "stem": "The same infant remains in SVT 90 s after adenosine 0.15 mg/kg. Conscious level and perfusion normal. Next step?", "options": ["Repeat the same dose of adenosine", "Give adenosine 0.3 mg/kg (max 12–18 mg)", "Proceed directly to synchronised cardioversion at 4 J/kg", "Give a 10 mL/kg fluid bolus and observe", "Give IV digoxin"], "answer": 1, "exp": "[G] If SVT persists, give a second dose of 0.3 mg/kg (max 12–18 mg) after at least one minute. [G] Seek paediatric cardiology advice; consider cardioversion or amiodarone particularly in sinus node disease, pre-excited atrial arrhythmias, prior transplant or severe asthma. The escalation is to a higher dose, not a repeat.", "type": "mcq"}, {"n": 21, "topic": "SVT decompensated", "stem": "A 3-year-old (14 kg) with narrow-complex tachycardia 240/min, mottled, CRT 5 s, BP 62 systolic, reduced conscious level. No IV access. Most appropriate management?", "options": ["Obtain IV access before any other intervention, then give adenosine", "Synchronised cardioversion at 1 J/kg with sedation and analgesia, using IM or intranasal ketamine if IV access is delayed", "Unsynchronised shock at 4 J/kg", "Amiodarone 5 mg/kg IO over 20 minutes before any shock", "Vagal manoeuvres alone and reassess in 5 minutes"], "answer": 1, "exp": "[G] In decompensated circulatory failure from any tachyarrhythmia, perform immediate synchronised cardioversion starting at 1 J/kg, doubling with each attempt to a maximum of 4 J/kg. [G] IV access attempts must not delay cardioversion — the algorithm names IM/intranasal ketamine as the workaround. Cardioversion is synchronised; 4 J/kg unsynchronised is the arrest defibrillation dose.", "type": "mcq"}, {"n": 22, "topic": "Torsades", "stem": "A 10-year-old (30 kg) with long QT has polymorphic broad-complex tachycardia with a pulse and mild circulatory compromise. Most appropriate drug?", "options": ["Amiodarone 5 mg/kg IV over 20 minutes", "Magnesium sulfate 25–50 mg/kg (max 2 g) IV over 10–15 minutes", "Adenosine 0.1 mg/kg IV", "Lidocaine 1 mg/kg IV", "Procainamide 15 mg/kg IV over 30 minutes"], "answer": 1, "exp": "[G] In torsades de pointes give IV magnesium sulfate. [G] The Feb 2026 drug chart specifies 25–50 mg/kg (max 2 g) over 10–15 min, repeatable once. [C] Amiodarone is relatively contraindicated in torsades — further QT prolongation risks worsening the arrhythmia.", "type": "mcq"}, {"n": 23, "topic": "Vagal bradycardia", "stem": "A 6-year-old undergoing NG tube insertion becomes bradycardic at 45/min with reduced conscious level. Airway patent, ventilation effective, SpO2 99% on high-flow oxygen. Bradycardia persists. Most appropriate next drug?", "options": ["Adrenaline 10 mcg/kg IV", "Atropine 20 mcg/kg IV", "Isoprenaline infusion", "Adenosine 0.1 mg/kg IV", "Glycopyrrolate 10 mcg/kg IV"], "answer": 1, "exp": "[G] Consider atropine only in specific cases — bradycardia induced by increased vagal tone or by cardiac conduction disease — at 20 mcg/kg IV. [G] PLS text gives max 500 mcg; the Feb 2026 drug chart gives max 600 mcg. [C] NG insertion is a classic vagal trigger, which is what makes atropine appropriate here.", "type": "mcq"}, {"n": 24, "topic": "Pre-arrest adrenaline", "stem": "A 4-year-old with congenital heart disease, bradycardic at 42/min, poor perfusion, palpable central pulse. No response to optimal oxygenation/ventilation or to atropine. Next step?", "options": ["Adrenaline 1–2 mcg/kg IV or a continuous adrenaline infusion", "Adrenaline 10 mcg/kg IV bolus", "A second dose of atropine 40 mcg/kg", "Immediate transcutaneous pacing as first-line", "Adenosine 0.1 mg/kg IV"], "answer": 0, "exp": "[G] Where there is no response to oxygenation or atropine, consider adrenaline. [G] The bradycardia dose is 1–2 mcg/kg or a continuous infusion — one tenth of the 10 mcg/kg arrest dose. [G] Pacing is rarely required, reserved for complete heart block or sick sinus syndrome.", "type": "mcq"}, {"n": 25, "topic": "Bradycardia definition", "stem": "Per the RCUK 2025 paediatric arrhythmia algorithm, which heart rate defines bradycardia?", "options": ["<60/min at all ages", "<80/min under 1 year; <60/min over 1 year", "<100/min under 1 year; <80/min over 1 year", "<50/min at all ages", "<60/min under 1 year; <50/min over 1 year"], "answer": 1, "exp": "[G] The arrhythmia algorithm defines bradycardia by these age-banded thresholds. [G] Note the separate figure in the ALS algorithm: compressions start at <60/min with poor perfusion at any age. Two thresholds, two contexts — recognition versus the trigger for CPR.", "type": "mcq"}, {"n": 26, "topic": "Infant choking", "stem": "A 7-month-old chokes on apple; conscious, silent, ineffective cough, increasing cyanosis. Correct sequence?", "options": ["5 back blows alternating with 5 abdominal thrusts", "5 back blows alternating with 5 chest thrusts", "5 abdominal thrusts then blind finger sweep", "Immediate chest compressions at 15:2", "Head-down positioning and repeated finger sweeps"], "answer": 1, "exp": "[G] In an infant with an ineffective cough who remains conscious, alternate up to 5 back blows with up to 5 chest thrusts. [G] Back blows face down along the forearm, head supported below the level of the thorax; chest thrusts use the two-thumb technique but sharper than for CPR. [C] Abdominal thrusts are NEVER used in infants (risk of hepatic injury) — the most examinable point in the choking algorithm.", "type": "mcq"}, {"n": 27, "topic": "Child choking", "stem": "A 4-year-old chokes on a grape; conscious with an ineffective cough. Correct sequence?", "options": ["5 back blows alternating with 5 abdominal thrusts", "5 back blows alternating with 5 chest thrusts", "5 abdominal thrusts only, repeated until relieved", "Blind finger sweep followed by back blows", "Immediate rescue breaths"], "answer": 0, "exp": "[G] In children and adolescents with an ineffective cough, alternate up to 5 back blows with up to 5 abdominal thrusts. [G] Stand behind, lean forward, fist between umbilicus and xiphisternum, pull sharply inwards and upwards. [G] Stop immediately on signs of relief. The sequence begins with back blows in both infants and children; only the second manoeuvre differs.", "type": "mcq"}, {"n": 28, "topic": "Choking → unconscious", "stem": "During treatment of an obstructed 3-year-old, the child becomes unconscious. Immediate next step?", "options": ["Continue abdominal thrusts on the floor", "Perform a blind finger sweep then reassess", "Open the airway and give 5 rescue breaths, then continue paediatric BLS", "Start chest compressions immediately without ventilating", "Attach an AED before any intervention"], "answer": 2, "exp": "[G] Start CPR immediately with five rescue breaths as soon as the child becomes unconscious, then continue paediatric BLS. [G] Call for help and the ambulance service at the latest when consciousness is lost. [C] The compressions that follow may also help displace the foreign body.", "type": "mcq"}, {"n": 29, "topic": "Finger sweep", "stem": "A 2-year-old with FBAO becomes unconscious. On opening the mouth a piece of sweet is clearly visible at the back of the tongue. What should you do?", "options": ["Perform repeated finger sweeps until the airway is clear", "Perform a single sweep to remove the clearly visible object", "Avoid touching the mouth and proceed to rescue breaths", "Use a suction-based anti-choking device as first-line", "Give 5 further abdominal thrusts before looking again"], "answer": 1, "exp": "[G] Do not use blind sweeps, but use a single sweep to remove a clearly visible object. [G] RCUK/ERC cannot recommend for or against suction-based anti-choking devices due to insufficient evidence, so they cannot be first-line. [C] Blind and repeated sweeps risk impacting the object further and causing trauma.", "type": "mcq"}, {"n": 30, "topic": "Dispatcher CPR", "stem": "An ambulance call handler instructs an untrained bystander who has found an unresponsive 5-year-old. Which CPR instruction?", "options": ["15:2 with 5 initial rescue breaths", "30:2 with 5 initial rescue breaths", "30:2 with no initial rescue breaths", "Compression-only CPR in all cases", "15:2 with no initial rescue breaths"], "answer": 1, "exp": "[G] Call handlers should use 30:2 with 5 initial rescue breaths for untrained bystanders or those trained only in adult BLS. [G] Actively encourage both breaths and compressions in children of all ages. [G] Only if bystanders are unwilling or unable to give breaths should compression-only CPR be encouraged. The ratio changes to 30:2, but the five initial breaths remain — that is the discriminator.", "type": "mcq"}, {"n": 31, "topic": "Lone rescuer", "stem": "A lone rescuer trained in PBLS finds an unresponsive, non-breathing 3-year-old in a park. No phone available. After 5 rescue breaths and starting compressions, what next?", "options": ["Leave immediately to call the ambulance service", "Perform CPR for 1 minute before leaving to call for help", "Perform CPR for 5 minutes before leaving to call for help", "Continue CPR indefinitely and do not leave the child", "Search for an AED before starting CPR"], "answer": 1, "exp": "[G] For a single rescuer out of hospital with no phone available, continue CPR for 1 minute before leaving to call the ambulance service. [G] If a phone is available, call immediately using the speaker function and do not leave the child.", "type": "mcq"}, {"n": 32, "topic": "CPR vs AED", "stem": "A single rescuer with a collapsed 8-year-old out of hospital; an AED is 200 m away. Correct priority?", "options": ["Fetch and attach the AED before starting CPR", "Call the ambulance service and start CPR in preference to fetching the AED", "Attach the AED only if the arrest was witnessed", "Give 2 minutes of CPR then fetch the AED", "Do not use an AED in children under 12 years"], "answer": 1, "exp": "[G] With only a single rescuer, calling the ambulance service and starting CPR is prioritised over fetching and attaching an AED. [G] Where a second rescuer is available, they call then bring and attach an AED as soon as possible, for children of all ages. Contrast Q31: no phone means 1 minute of CPR then leave to call. The AED never justifies leaving.", "type": "mcq"}, {"n": 33, "topic": "Traumatic arrest", "stem": "A 10-year-old in cardiac arrest after being struck by a car, with major haemorrhage from a thigh wound. Management priority?", "options": ["Attach an AED first and analyse rhythm before anything else", "Address hypovolaemia, hypoxia, tension pneumothorax and tamponade (HOTT) with priority over AED application", "Give three sequential doses of adrenaline before addressing reversible causes", "Withhold chest compressions until haemorrhage is controlled", "Perform CPR for 20 minutes before considering thoracostomy"], "answer": 1, "exp": "[G] In traumatic cardiac arrest use HOTT — Hypovolaemia, Oxygenation, Tension pneumothorax, Tamponade — taking priority over, or concurrent with, compressions and adrenaline. [G] HOTT has priority over the AED unless a shockable underlying rhythm is likely (electrocution, cardiac contusion). [G] Stop external bleeding immediately; use early blood products. [G] POCUS where available.", "type": "mcq"}, {"n": 34, "topic": "Traumatic arrest", "stem": "A 12-year-old in traumatic cardiac arrest after a fall from height, with no clinical evidence of tension pneumothorax. Most appropriate approach to the chest?", "options": ["Do not decompress the chest without clinical signs of tension", "Perform bilateral thoracostomies regardless of the presence of signs of tension pneumothorax", "Perform needle decompression on the left only", "Await a chest radiograph before decompression", "Perform pericardiocentesis first in all cases"], "answer": 1, "exp": "[G] Perform bilateral thoracostomies in traumatic cardiac arrest with or without signs of tension pneumothorax; a drain may be needed to maintain tract patency. [G] For suspected tamponade, resuscitative thoracotomy if competent, otherwise pericardiocentesis, preferably POCUS-guided. [C] Clinical signs of tension are unreliable in arrest and imaging delays treatment.", "type": "mcq"}, {"n": 35, "topic": "Drowning", "stem": "A 6-year-old pulled from a lake in cardiac arrest, soaking wet, AED has arrived. Correct approach?", "options": ["Apply the AED immediately without drying the chest", "Dry the chest and attach the AED, but uninterrupted CPR and oxygenation take priority", "Do not use an AED after immersion under any circumstances", "Give 3 stacked shocks before starting compressions", "Delay all resuscitation until the child is fully undressed and rewarmed"], "answer": 1, "exp": "[G] Attach an AED after drying the chest; uninterrupted CPR and oxygenation take priority. [G] 100% oxygen as soon as available; intubate if expertise and equipment allow. [G] Standard PALS with additional attention to reversing hypoxia and hypothermia; look for underlying arrhythmia, epilepsy, intoxication or trauma; check glucose and electrolytes. [G] Consider ECPR if conventional CPR is failing.", "type": "mcq"}, {"n": 36, "topic": "Hypothermia <30°C", "stem": "A 9-year-old in cardiac arrest after prolonged snow burial. Core temperature 27°C, rhythm VF. Correct modification of the PALS algorithm?", "options": ["Give adrenaline every 3–5 minutes as normal and shock every 2 minutes", "Withhold adrenaline entirely and shock every 2 minutes without limit", "Give a maximum of three shocks and withhold further adrenaline until core temperature exceeds 30°C, with immediate initiation of extracorporeal life support", "Double the adrenaline dose and shock at 8 J/kg", "Stop resuscitation as survival is not possible below 28°C"], "answer": 2, "exp": "[G] Below 30°C: a single dose of adrenaline and a maximum of three shocks if shockable. If ineffective, delay further attempts until core temperature exceeds 30°C and initiate ECLS immediately. [G] Below 32°C use active external and internal rewarming including extracorporeal techniques. [C] The profoundly hypothermic myocardium responds poorly to drugs and defibrillation while drug clearance is markedly reduced.", "type": "mcq"}, {"n": 37, "topic": "Hypothermia 30–35°C", "stem": "A 5-year-old in cardiac arrest with a core temperature of 32°C. How should adrenaline be given?", "options": ["Every 3–5 minutes as normal", "Every 8 minutes (i.e. 6–10 minutes)", "Only once for the entire resuscitation", "Continuous infusion only", "Withheld until temperature exceeds 35°C"], "answer": 1, "exp": "[G] Between 30 and 35°C: adrenaline IV/IO every 8 minutes (range 6–10), consider a normal dose of amiodarone after 8 minutes, and defibrillate at normal 2-minute intervals. [G] Above 35°C the standard algorithm applies unmodified. Drug intervals stretch as temperature falls, but shock intervals stay normal — except below 30°C where shocks are capped at three.", "type": "mcq"}, {"n": 38, "topic": "Rewarming", "stem": "A 3-year-old rescued from a canal, has spontaneous circulation, core temperature 32.5°C, reduced conscious level. Correct rewarming approach?", "options": ["Immerse in a warm bath at 40°C", "Active external rewarming applied to the trunk, aiming for at least 1°C per hour and stopping active rewarming at 35°C", "Vigorously rub the limbs to promote peripheral circulation", "Rewarm at no more than 0.2°C per hour to 37°C", "Place hot packs directly onto the skin of the extremities"], "answer": 1, "exp": "[G] Rewarm if core temperature is below 35°C at a rate of at least 1°C/h; aim for normothermia but stop active rewarming at 35°C to avoid overshoot. [G] Apply active external rewarming to the trunk — chest, abdomen, back, axillae — not the extremities. [G] Do not place warm devices directly on skin; avoid rubbing extremities; no warm shower or immersion in a child with reduced consciousness. [G] Handle gently and horizontally to reduce VF risk.", "type": "mcq"}, {"n": 39, "topic": "Anaphylaxis dose", "stem": "A 4-year-old (16 kg) develops stridor, wheeze and hypotension minutes after eating peanuts. Correct initial adrenaline dose and route?", "options": ["150 mcg IM (0.15 mL of 1:1000)", "300 mcg IM (0.3 mL of 1:1000)", "160 mcg IV (1.6 mL of 1:10,000)", "500 mcg IM (0.5 mL of 1:1000)", "100 mcg IM (0.1 mL of 1:1000)"], "answer": 0, "exp": "[G] IM adrenaline 1:1000 into the anterolateral middle third of the thigh. Age bands: under 6 months 100–150 mcg; 6 months–6 years 150 mcg; 6–12 years 300 mcg; over 12 years 500 mcg. [G] Repeat after 5 minutes if no response. [G] IV adrenaline is for experienced specialists only. Note the bands are by AGE, not weight.", "type": "mcq"}, {"n": 40, "topic": "Refractory anaphylaxis", "stem": "A 9-year-old with anaphylaxis has had two appropriate IM adrenaline doses 5 minutes apart with no improvement in breathing or circulation. Next step?", "options": ["Give a third IM dose and wait a further 5 minutes before escalating", "Treat as refractory anaphylaxis and start a low-dose IV adrenaline infusion with continued fluids", "Give IV chlorphenamine and hydrocortisone as the priority", "Give an IV adrenaline bolus of 10 mcg/kg", "Intubate before giving any further adrenaline"], "answer": 1, "exp": "[G] No improvement despite two appropriate IM doses defines refractory anaphylaxis — follow the refractory algorithm and start a low-dose IV adrenaline infusion. [G] Peripheral regimen: 1 mg in 100 mL 0.9% saline via a dedicated pumped line at 0.5–1.0 mL/kg/h. [G] Continue IM adrenaline every 5 min until the infusion runs; IV boluses are not recommended outside specialist settings. [G] Take mast cell tryptase; seek critical care help early.", "type": "mcq"}, {"n": 41, "topic": "Anaphylaxis fluids", "stem": "A 20 kg child with refractory anaphylaxis needs fluid resuscitation. Recommended bolus?", "options": ["200 mL of glucose-free crystalloid (10 mL/kg)", "400 mL of glucose-free crystalloid (20 mL/kg)", "500 mL of 5% glucose", "100 mL of 4.5% albumin", "200 mL of 0.45% saline with 5% glucose"], "answer": 0, "exp": "[G] Children receive 10 mL/kg per bolus (adults 500–1000 mL), titrated to response, using glucose-free crystalloid such as Hartmann's or Plasma-Lyte. [G] Large volumes may be required; arterial line and central access in the refractory patient. [G] If refractory to an adrenaline infusion, consider a second vasopressor, and glucagon in patients on beta-blockers.", "type": "mcq"}, {"n": 42, "topic": "Hyperkalaemia", "stem": "A 20 kg child with renal failure has potassium 7.8 mmol/L and a broad-complex bradycardia with hypotension. Most appropriate immediate treatment?", "options": ["Calcium gluconate 10% 0.5 mL/kg IV over 5–10 minutes", "Insulin-dextrose infusion alone", "Nebulised salbutamol alone", "Sodium bicarbonate 8.4% 1 mL/kg IV push", "Urgent haemofiltration before any drug therapy"], "answer": 0, "exp": "[G] For unstable arrhythmia due to hyperkalaemia: calcium gluconate 10% 0.5 mL/kg IV over 5–10 min, max 30 mL, repeated after 5–10 min if ECG changes persist. [C] Calcium stabilises the myocardium but does not lower potassium; insulin-dextrose, salbutamol and removal follow — membrane stabilisation comes first when the rhythm is unstable.", "type": "mcq"}, {"n": 43, "topic": "Hypoglycaemia", "stem": "A 14 kg child with reduced conscious level has capillary glucose 1.9 mmol/L. Correct treatment?", "options": ["2 mL/kg of 10% glucose IV, rechecking glucose after 5–10 minutes", "5 mL/kg of 10% glucose IV, rechecking after 30 minutes", "1 mL/kg of 50% glucose IV", "Oral glucose gel only", "10 mL/kg of 5% glucose IV over 1 hour"], "answer": 0, "exp": "[G] Give 2 mL/kg of 10% glucose IV/IO (0.2 g/kg), rechecking 5–10 minutes after the dose and repeating as required. [G] The same 2 mL/kg dose is recommended for newborns. [G] Hypoglycaemia is a metabolic reversible cause — check glucose after every arrest. [C] 50% glucose is avoided in children because of osmolality and tissue injury risk.", "type": "mcq"}, {"n": 44, "topic": "Status epilepticus", "stem": "A 20 kg child has been convulsing for 6 minutes. IV access in situ, no benzodiazepine given. Correct first drug and dose?", "options": ["Lorazepam 2 mg IV (100 mcg/kg), repeatable after 10 minutes", "Lorazepam 4 mg IV (200 mcg/kg), repeatable after 5 minutes", "Buccal midazolam 10 mg", "Phenytoin 20 mg/kg IV over 20 minutes", "Levetiracetam 40 mg/kg IV over 5 minutes"], "answer": 0, "exp": "[G] Lorazepam 100 mcg/kg IV/IO, max 4 mg, repeatable after 10 minutes. [C] Buccal midazolam is appropriate only where there is no vascular access; IV is already established here. [C] Second-line agents such as levetiracetam or phenytoin follow after two doses of benzodiazepine.", "type": "mcq"}, {"n": 45, "topic": "Septic shock fluids", "stem": "A 15 kg child with suspected meningococcal sepsis: CRT 5 s, cool peripheries, BP 68/40. No hepatomegaly or crepitations. Most appropriate initial fluid strategy?", "options": ["10 mL/kg balanced crystalloid over 5–10 minutes, reassessing after each bolus up to 40–60 mL/kg", "20 mL/kg balanced crystalloid over 5 minutes without reassessment until 60 mL/kg given", "10 mL/kg of 4.5% human albumin solution over 30 minutes", "Maintenance fluids only, with early inotropes", "20 mL/kg of 0.45% saline with 5% glucose over 1 hour"], "answer": 0, "exp": "[G] With no signs of fluid overload, give 10 mL/kg balanced crystalloid over 5–10 min and reassess after each bolus, up to 40–60 mL/kg or until perfusion improves. [G] End points: CRT <2 s, normal BP for age, urine output >1 mL/kg/h, normal pulses and mental state. [G] Cultures, glucose, U&E, lactate, gas; broad-spectrum antibiotics; senior/anaesthetic/PICU help. The examinable point is reassessment after every bolus.", "type": "mcq"}, {"n": 46, "topic": "Fluid-refractory shock", "stem": "The same child has had 40 mL/kg. Perfusion remains poor; liver edge now 3 cm below the costal margin with new basal crepitations. No central access. Next step?", "options": ["Continue fluid boluses to 60 mL/kg then reassess", "Stop bolus fluids and start a peripheral or IO adrenaline or noradrenaline infusion", "Wait for central venous access before any vasoactive drug", "Give a 10 mL/kg albumin bolus instead of crystalloid", "Give furosemide 1 mg/kg and continue crystalloid boluses"], "answer": 1, "exp": "[G] Watch for signs of fluid overload; if present, stop bolus therapy and start inotropic support. [G] In fluid-refractory shock start a vasoactive infusion centrally (preferable) or peripherally/IO — adrenaline 0.05–0.3 mcg/kg/min (more dilute if peripheral) and/or noradrenaline from 0.05 mcg/kg/min. [G] Clinical signs are unreliable at differentiating warm from cold shock in children.", "type": "mcq"}, {"n": 47, "topic": "Catecholamine-resistant shock", "stem": "A child with septic shock remains hypotensive despite adequate fluids and escalating adrenaline and noradrenaline. Which additional therapy?", "options": ["Hydrocortisone IV 1–2 mg/kg", "Dexamethasone 0.6 mg/kg IV", "Methylprednisolone 30 mg/kg IV", "Fludrocortisone 100 mcg orally", "Prednisolone 2 mg/kg orally"], "answer": 0, "exp": "[G] Consider hydrocortisone IV 1–2 mg/kg if not responding to fluids and vasoactive support, and in children with adrenal insufficiency or on relevant medications. [C] Hydrocortisone is chosen for its mineralocorticoid as well as glucocorticoid activity; the other agents have no role in this indication.", "type": "mcq"}, {"n": 48, "topic": "DKA fluids", "stem": "A 30 kg child with DKA, clinically dehydrated with vomiting but NOT shocked (CRT 2 s, normal BP). Correct initial fluid management?", "options": ["10 mL/kg balanced crystalloid or 0.9% sodium chloride over 30 minutes, with this volume subtracted from the calculated fluid requirement", "20 mL/kg 0.9% sodium chloride over 10 minutes, not subtracted from the fluid requirement", "10 mL/kg over 5–10 minutes repeated to 40 mL/kg", "No bolus; start deficit replacement over 24 hours", "20 mL/kg of 0.45% saline over 1 hour"], "answer": 0, "exp": "[G — NICE NG18 (2023) / BSPED 2024] Dehydrated but not shocked: 10 mL/kg over 30 min; discuss with a senior paediatrician before a second bolus. [G] In shock: 10 mL/kg over 5–10 min, repeat to max 40 mL/kg. [G] Requirement = 48 h maintenance + deficit over 48 h. Subtract 10 mL/kg for children NOT in shock; do not subtract resuscitation volumes for those who were shocked. The boundary: not shocked = slower and subtracted; shocked = fast and not subtracted.", "type": "mcq"}, {"n": 49, "topic": "Cerebral oedema", "stem": "Six hours into DKA treatment a 7-year-old develops severe headache, becomes irritable and drowsy, HR falls from 130 to 78/min with rising BP. Most appropriate immediate treatment?", "options": ["Increase the rate of IV fluid replacement", "Give 3% sodium chloride, seek PICU advice and call an anaesthetist", "Stop the insulin infusion and observe", "Give IV dexamethasone 0.15 mg/kg", "Arrange CT head before any treatment"], "answer": 1, "exp": "[G — NICE NG18 / BSPED 2024] Signs of raised ICP — headache, confusion, irritability, posturing, falling GCS, rising BP with bradycardia. Treat with 3% sodium chloride, seek PICU advice, call an anaesthetist. Consider CT to determine cause. [G] CT follows treatment; it does not precede it. [C] Cushing's triad mid-DKA-treatment is cerebral oedema until proven otherwise — the leading cause of death in paediatric DKA.", "type": "mcq"}, {"n": 50, "topic": "Pre-arrest adrenaline", "stem": "A 5-year-old in the anaesthetic room during induction is profoundly bradycardic and hypotensive but has not yet lost cardiac output. Most appropriate use of adrenaline?", "options": ["Give 10 mcg/kg IV immediately", "Give small incremental boluses of 1–2 mcg/kg IV initially, escalating to the standard 10 mcg/kg arrest dose if cardiac arrest occurs", "Give 100 mcg/kg IV as the pre-arrest dose", "Withhold adrenaline until asystole is confirmed", "Give 500 mcg IM"], "answer": 1, "exp": "[G] For hypotensive and/or bradycardic children in a pre-arrest state, give smaller incremental IV boluses initially, e.g. 1–2 mcg/kg. If cardiac arrest occurs, give adrenaline per the standard PALS algorithm at 10 mcg/kg. [G] Consider operating-room causes: gas embolism, bradycardia from axial blocks, malignant hyperthermia, LA toxicity, drug errors. This mirrors Q24 — pre-arrest dose is one tenth of the arrest dose.", "type": "mcq"}]}, {"code": "PAED", "title": "General Paediatric Emergencies", "source": "NICE (multiple) · BTS/SIGN · UKHSA", "hue": "#a78bfa", "questions": [{"n": 1, "topic": "Fever <3mo", "stem": "6-week-old, temp 38.2°C, no source, feeding well, looks well (NG143). Management?", "options": ["Reassure and discharge", "Full septic screen + parenteral antibiotics", "Urine only, discharge if clear", "Oral antibiotics, review 24h", "Observe 4h then discharge"], "answer": 1, "exp": "[G] NICE NG143: any infant <3 months with fever ≥38°C is high-risk — full septic screen and parenteral antibiotics regardless of how well they look.", "type": "mcq"}, {"n": 2, "topic": "Fever traffic light", "stem": "2-year-old with fever — which single finding is RED on the NG143 traffic light?", "options": ["Temp 39.5°C", "Parent-reported pallor", "Non-blanching rash", "Poor feeding", "CRT 2s"], "answer": 2, "exp": "[G] NG143: non-blanching rash is a RED feature. High temperature alone in this age is not red; pallor/poor feeding are amber.", "type": "mcq"}, {"n": 3, "topic": "Meningococcal (pre-hospital)", "stem": "GP, 3-year-old at home, non-blanching purpuric rash + fever, transfer arranged. Pre-hospital treatment?", "options": ["No antibiotics, transfer", "IM/IV benzylpenicillin 600 mg", "Oral amoxicillin 250 mg", "IM ceftriaxone 2 g", "Wait for cultures"], "answer": 1, "exp": "[G] NICE: suspected meningococcal disease in the community — give parenteral benzylpenicillin (age-appropriate dose) before urgent transfer, unless it delays transfer.", "type": "mcq"}, {"n": 4, "topic": "Meningitis empirical", "stem": "4-year-old, strongly suspected bacterial meningitis, ABC stable. First-line empirical antibiotic?", "options": ["IV cefotaxime", "IV ceftriaxone", "IV ceftriaxone + amoxicillin", "Benzylpenicillin + gentamicin", "Vancomycin + meropenem"], "answer": 1, "exp": "[G] NICE NG240: ceftriaxone is first-line for children >3 months. Amoxicillin cover (for Listeria) is added under 3 months, not at 4 years.", "type": "mcq"}, {"n": 5, "topic": "Meningitis steroids", "stem": "5-year-old, suspected bacterial meningitis, about to receive ceftriaxone. Dexamethasone?", "options": ["Wait until pneumococcus confirmed", "Give IV dexamethasone with/before the first antibiotics", "Only if LP lymphocytic", "Contraindicated with ceftriaxone", "High-dose 0.6 mg/kg/day"], "answer": 1, "exp": "[G] NG240: give dexamethasone with or just before the first antibiotic dose in suspected/confirmed bacterial meningitis in children >3 months (not in meningococcal septicaemia).", "type": "mcq"}, {"n": 6, "topic": "Bronchiolitis", "stem": "5-month-old, bronchiolitis, SpO2 94%, feeding ~70% (NG9). Management?", "options": ["Nebulised salbutamol", "Nebulised adrenaline + prednisolone", "Supportive care, observe", "Hypertonic saline + antibiotics", "Montelukast + ICS"], "answer": 2, "exp": "[G] NICE NG9: bronchiolitis is managed supportively. Bronchodilators, steroids and antibiotics are not recommended.", "type": "mcq"}, {"n": 7, "topic": "Bronchiolitis admission", "stem": "Which single feature most clearly mandates bronchiolitis admission (NG9)?", "options": ["Temp 38.3°C", "Feeding 60% usual", "Apnoea", "RR 55", "Coryza 3 days"], "answer": 2, "exp": "[G] NG9: apnoea (observed or reported) is a clear admission criterion.", "type": "mcq"}, {"n": 8, "topic": "Croup", "stem": "2-year-old, barking cough, stridor at rest, mild recession, alert. First-line treatment?", "options": ["Oral dexamethasone 0.15 mg/kg single dose", "Nebulised adrenaline first-line", "Oral amoxicillin", "Nebulised salbutamol", "IV hydrocortisone + ICU"], "answer": 0, "exp": "[C] Croup: single-dose oral dexamethasone 0.15 mg/kg is first-line for all severities. Nebulised adrenaline is added for severe/impending obstruction.", "type": "mcq"}, {"n": 9, "topic": "Severe croup", "stem": "3-year-old, croup, marked stridor at rest, severe recession, agitated. Immediate management?", "options": ["Oral dexamethasone alone, reassess 1h", "Nebulised adrenaline + corticosteroid, senior/anaesthetic support", "Intubate in cubicle", "Salbutamol + IV fluids", "IV antibiotics"], "answer": 1, "exp": "[C] Severe croup: nebulised adrenaline plus corticosteroid, keep the child calm, summon senior/anaesthetic support. Avoid distressing procedures.", "type": "mcq"}, {"n": 10, "topic": "Asthma severity", "stem": "8-year-old asthmatic, SpO2 89%, silent chest, exhausted. Severity?", "options": ["Moderate", "Severe", "Life-threatening", "Near-fatal", "Brittle"], "answer": 2, "exp": "[G] BTS/SIGN/NICE NG245: SpO2 <92%, silent chest and exhaustion are life-threatening features.", "type": "mcq"}, {"n": 11, "topic": "Asthma delivery", "stem": "6-year-old, acute severe asthma, SpO2 90%. Initial bronchodilator delivery?", "options": ["Salbutamol pMDI + spacer", "Salbutamol via O2-driven nebuliser", "Oral salbutamol", "IV salbutamol first-line", "Nebulised ipratropium alone"], "answer": 1, "exp": "[G] NG245: in severe/life-threatening asthma with hypoxia, give salbutamol via an oxygen-driven nebuliser. pMDI+spacer is for mild–moderate.", "type": "mcq"}, {"n": 12, "topic": "Asthma escalation", "stem": "7-year-old (25 kg), asthma not responding to nebs + ipratropium, had oral pred. IV escalation?", "options": ["IV magnesium sulfate", "IV aminophylline first", "IV adrenaline bolus", "IV salbutamol without senior", "Double oral pred"], "answer": 0, "exp": "[G] NG245: IV magnesium sulfate is the usual first IV agent when inhaled therapy fails; involve senior/PICU.", "type": "mcq"}, {"n": 13, "topic": "Febrile convulsion", "stem": "3-year-old, single generalised seizure 3 min, full recovery, otitis media source. Management?", "options": ["CT + EEG before discharge", "LP in all cases", "Treat the source, no routine neuro-investigation", "Start valproate", "Prophylactic antipyretics"], "answer": 2, "exp": "[C] Simple febrile convulsion: identify and treat the source; no routine neuroimaging, EEG or LP; no anticonvulsants.", "type": "mcq"}, {"n": 14, "topic": "Complex febrile seizure", "stem": "2-year-old, focal seizure 20 min + a second within the same illness. Classification/management?", "options": ["Simple, discharge", "Complex, admit and assess", "Epilepsy, start anticonvulsants", "Breath-holding", "Reflex anoxic"], "answer": 1, "exp": "[C] Focal, prolonged or recurrent within one illness = complex febrile seizure — admit and assess.", "type": "mcq"}, {"n": 15, "topic": "Gastroenteritis fluids", "stem": "2-year-old, gastroenteritis, clinical dehydration, no shock, tolerating oral (NG84). Rehydration?", "options": ["IV saline bolus 20 mL/kg", "ORS 50 mL/kg over 4h + maintenance, little and often", "Withhold fluids 4h", "Full-strength juice", "Loperamide + ORS"], "answer": 1, "exp": "[G] NICE NG84: clinical dehydration without shock — oral rehydration salts 50 mL/kg over 4h plus maintenance, given little and often.", "type": "mcq"}, {"n": 16, "topic": "Gastroenteritis red flag", "stem": "Which is an NG84 red flag for progression to shock?", "options": ["Increased thirst", "Reduced urine output", "Altered responsiveness", "Dry mucous membranes", "Single vomit"], "answer": 2, "exp": "[G] NG84: altered/decreased responsiveness is a red-flag feature indicating risk of progression to shock.", "type": "mcq"}, {"n": 17, "topic": "IV maintenance fluids", "stem": "4-year-old (18 kg), IV maintenance fluids post-op (NG29). Which fluid?", "options": ["0.18%/4% glucose", "0.45%/5% glucose", "Isotonic (0.9% saline ± glucose)", "5% glucose alone", "Hartmann's + routine K 40 mmol/500 mL"], "answer": 2, "exp": "[G] NICE NG29: use isotonic fluids (0.9% sodium chloride ± glucose) for maintenance to avoid hyponatraemia. Hypotonic fluids are not routine.", "type": "mcq"}, {"n": 18, "topic": "UTI <3mo", "stem": "2-month-old, confirmed UTI (NG224). Management?", "options": ["Oral trimethoprim 3d at home", "Refer to specialist + IV antibiotics", "Oral nitrofurantoin, GP 48h", "No antibiotics unless unwell", "Single IM gentamicin, discharge"], "answer": 1, "exp": "[G] NICE NG224: infants <3 months with UTI need referral to paediatric specialist care and IV antibiotics.", "type": "mcq"}, {"n": 19, "topic": "Atypical UTI imaging", "stem": "10-month-old, atypical UTI (NG224). Imaging during the acute infection?", "options": ["None", "Ultrasound during the acute infection", "DMSA acutely", "MCUG immediately", "CT KUB"], "answer": 1, "exp": "[G] NG224: atypical UTI warrants ultrasound during the acute infection. DMSA/MCUG are arranged later per criteria.", "type": "mcq"}, {"n": 20, "topic": "Intussusception", "stem": "9-month-old, colicky episodes, vomiting, redcurrant-jelly stool, no peritonitis. First-line?", "options": ["Immediate laparotomy", "Air (pneumatic) enema reduction", "ORS + observe", "Antibiotics alone", "Barium follow-through"], "answer": 1, "exp": "[C] Intussusception without peritonitis/perforation: air (pneumatic) enema reduction after resuscitation. Surgery if reduction fails or peritonitis.", "type": "mcq"}, {"n": 21, "topic": "Pyloric stenosis", "stem": "5-week-old boy, projectile non-bilious vomiting, palpable olive, hypochloraemic hypokalaemic alkalosis. Next step?", "options": ["Immediate pyloromyotomy", "Fluid/electrolyte correction before surgery", "NJ feeding", "Prokinetic + discharge", "Barium then outpatient surgery"], "answer": 1, "exp": "[C] Pyloric stenosis: correct fluid and electrolyte/acid-base derangement first; pyloromyotomy is not an emergency and follows resuscitation.", "type": "mcq"}, {"n": 22, "topic": "Testicular torsion", "stem": "12-year-old, 3h severe testicular pain, high-riding testis, absent cremasteric reflex. Management?", "options": ["Doppler US before referral", "Immediate surgical exploration, no imaging delay", "Antibiotics for epididymo-orchitis", "Analgesia + outpatient urology", "Scrotal support, review 24h"], "answer": 1, "exp": "[C] Torsion is a clinical diagnosis — immediate surgical exploration; do not delay for imaging (salvage falls sharply after ~6h).", "type": "mcq"}, {"n": 23, "topic": "Bilious vomiting", "stem": "3-day-old, bilious (green) vomiting. Correct statement?", "options": ["Usually benign posseting", "Surgical emergency until malrotation/volvulus excluded", "Anti-reflux therapy", "Reassure, keep feeding", "Outpatient ultrasound"], "answer": 1, "exp": "[C] Bilious vomiting in a neonate is a surgical emergency — malrotation with volvulus must be excluded urgently.", "type": "mcq"}, {"n": 24, "topic": "Head injury", "stem": "11-month-old, fall, 6 cm boggy scalp haematoma, GCS 15, otherwise well (NG232). Action?", "options": ["Discharge with advice", "CT head within 1 hour", "Skull X-ray", "Observe 4h, no imaging", "MRI within 24h"], "answer": 1, "exp": "[G] NICE NG232: in under-1s a large (>5 cm) boggy scalp haematoma is a risk factor prompting CT head within 1 hour.", "type": "mcq"}, {"n": 25, "topic": "Safeguarding", "stem": "4-month-old, non-mobile, spiral femoral fracture, vague inconsistent history. Most important action?", "options": ["Treat the fracture, GP follow-up", "Safeguarding referral + senior/child-protection involvement", "Reassure, spirals usually accidental", "Outpatient orthopaedics", "Skeletal survey after discharge"], "answer": 1, "exp": "[C] A fracture in a non-mobile infant with an inconsistent history is a major safeguarding concern — refer and involve seniors/child protection before discharge.", "type": "mcq"}, {"n": 26, "topic": "Kawasaki", "stem": "3-year-old, fever 6 days, bilateral non-purulent conjunctivitis, strawberry tongue, rash, cervical nodes, peeling. Investigation/treatment?", "options": ["Throat swab + penicillin", "Echo + IVIG + aspirin", "Blood film + supportive", "Skin biopsy + topical steroids", "Monospot + reassure"], "answer": 1, "exp": "[C] Kawasaki disease: echocardiography (coronary aneurysm risk) plus IVIG and aspirin, ideally within 10 days of fever onset.", "type": "mcq"}, {"n": 27, "topic": "HSP", "stem": "6-year-old, palpable purpura on buttocks/extensor legs, arthralgia, abdominal pain, otherwise well. Key monitoring?", "options": ["Serial FBCs for leukaemia", "BP + urinalysis for nephritis", "Weekly skin biopsies", "Repeat abdominal US", "Bone marrow aspiration"], "answer": 1, "exp": "[C] IgA vasculitis (HSP): monitor blood pressure and urinalysis for renal involvement (the main long-term risk).", "type": "mcq"}, {"n": 28, "topic": "Anaphylaxis obs", "stem": "9-year-old, wasp-sting anaphylaxis, full response to 1 dose adrenaline, no asthma, has autoinjector. Minimum observation?", "options": ["None", "2 hours", "6 hours", "12 hours", "24 hours"], "answer": 1, "exp": "[G] Resuscitation Council UK: after a good single-dose response with low-risk features, a minimum ~2h observation is acceptable; longer for risk features.", "type": "mcq"}, {"n": 29, "topic": "Neonatal jaundice", "stem": "Term baby, visibly jaundiced at 18 hours (NG98). Action?", "options": ["Reassure, physiological", "Measure bilirubin urgently — jaundice <24h is always pathological", "Recheck visually 24h", "Phototherapy without measuring", "More feeding, review 1 week"], "answer": 1, "exp": "[G] NICE NG98: jaundice within the first 24 hours is always pathological — measure bilirubin urgently (within 2h).", "type": "mcq"}, {"n": 30, "topic": "Duct-dependent lesion", "stem": "5-day-old, collapsed, grey, tachypnoeic, weak femoral pulses, suspected duct-dependent lesion. Key drug?", "options": ["IV furosemide", "IV prostaglandin E infusion", "IV adenosine", "Oral propranolol", "IV adrenaline infusion alone"], "answer": 1, "exp": "[C] Suspected duct-dependent congenital heart disease: prostaglandin E infusion to maintain ductal patency.", "type": "mcq"}, {"n": 31, "topic": "Button battery", "stem": "2-year-old, swallowed button battery lodged in oesophagus, asymptomatic. Management?", "options": ["Observe, repeat X-ray 24h", "Urgent removal (endoscopy)", "Emetic", "Reassure/discharge", "Wait for symptoms"], "answer": 1, "exp": "[C] Oesophageal button battery is a time-critical emergency (mucosal burns/perforation) — urgent endoscopic removal regardless of symptoms.", "type": "mcq"}, {"n": 32, "topic": "Magnets", "stem": "Toddler, swallowed several neodymium magnets, asymptomatic. Main concern/action?", "options": ["None, always pass", "Bowel necrosis/fistula/perforation — surgical/endoscopic removal", "Laxatives + discharge", "Only if a single magnet", "Repeat X-ray 1 week"], "answer": 1, "exp": "[C] Multiple magnets attract across bowel walls causing pressure necrosis, fistula and perforation — surgical/endoscopic removal.", "type": "mcq"}, {"n": 33, "topic": "Neonatal sepsis", "stem": "3-week-old, poor feeding, lethargy, temp instability, mottling. Approach?", "options": ["Await cultures before antibiotics", "Empirical IV antibiotics without waiting for cultures", "Oral antibiotics, review 24h", "Only treat if CRP raised", "Discharge if feeds during visit"], "answer": 1, "exp": "[C] Suspected neonatal/young-infant sepsis: take cultures but start empirical IV antibiotics immediately — do not delay for results.", "type": "mcq"}, {"n": 34, "topic": "Antipyretics", "stem": "3-year-old, febrile, distressed. Antipyretics (NG143)?", "options": ["Para + ibuprofen together routinely", "Either paracetamol or ibuprofen if distressed; not to reduce temperature alone", "Alternate as standard", "To prevent febrile convulsions", "Never use"], "answer": 1, "exp": "[G] NG143: give an antipyretic only if the child is distressed, not to reduce temperature per se or to prevent febrile convulsions; don't combine routinely.", "type": "mcq"}, {"n": 35, "topic": "New T1DM (not DKA)", "stem": "14-year-old, polyuria/polydipsia/weight loss, glucose 24, ketones 3.5, alert, not dehydrated, pH 7.34. Management?", "options": ["IV insulin infusion + boluses for DKA", "Confirm diagnosis, start SC insulin with specialist input (not DKA)", "Oral fluids + discharge/GP", "Stat long-acting insulin, home", "Oral rehydrate, recheck 4h"], "answer": 1, "exp": "[C] pH ≥7.3 with only mild ketosis is new-onset diabetes without DKA — SC insulin and urgent specialist input; DKA protocol is not indicated.", "type": "mcq"}, {"n": 36, "topic": "Splenic sequestration", "stem": "5-year-old, sickle cell, pale/tachycardic/hypotensive, rapidly enlarging spleen, Hb far below baseline. Diagnosis/priority?", "options": ["Aplastic crisis, antibiotics", "Splenic sequestration — fluids + transfusion", "Vaso-occlusive, analgesia", "Haemolytic, folic acid", "Painful crisis, discharge"], "answer": 1, "exp": "[C] Acute splenic sequestration: rapid splenic pooling causing anaemia and shock — resuscitate with fluids and urgent transfusion.", "type": "mcq"}, {"n": 37, "topic": "UTI sampling", "stem": "6-week-old, possible UTI, no clean-catch possible (NG224). Preferred collection?", "options": ["Cotton wool pad", "Clean-catch, then catheter/SPA if not possible", "Bag sample", "First-morning only", "No sample, treat empirically"], "answer": 1, "exp": "[G] NG224: clean-catch is preferred; if not possible use catheter or suprapubic aspirate. Bag/pad samples are unreliable.", "type": "mcq"}, {"n": 38, "topic": "Septic arthritis", "stem": "2-year-old, fever + limp, non-weight-bearing, hot swollen tender knee, raised CRP. Management?", "options": ["Reassure, transient synovitis", "Urgent orthopaedic referral, aspiration + IV antibiotics", "Ibuprofen + outpatient", "Physio + mobilise", "X-ray then discharge"], "answer": 1, "exp": "[C] Suspected septic arthritis: urgent orthopaedic referral, joint aspiration and IV antibiotics — a joint-threatening emergency.", "type": "mcq"}, {"n": 39, "topic": "Epiglottitis", "stem": "4-year-old, drooling, high fever, toxic, soft stridor, tripod, refusing to lie down. Immediate action?", "options": ["Examine throat with a depressor", "Keep calm/undisturbed, summon senior anaesthetic + ENT", "Oral dexamethasone + discharge", "Lateral neck X-ray in cubicle", "Nebulised salbutamol"], "answer": 1, "exp": "[C] Epiglottitis: do not distress or examine the throat; keep the child calm and summon senior anaesthetics and ENT for a controlled airway.", "type": "mcq"}, {"n": 40, "topic": "Burns airway", "stem": "7-year-old, house fire, facial burns, singed nasal hairs, soot, hoarse, stridor. Priority?", "options": ["Calculate burn area first", "Early senior airway assessment + consider intubation", "Cling film + discharge", "Parkland fluids + observe airway", "Analgesia, reassess 1h"], "answer": 1, "exp": "[C] Inhalation injury with airway signs: early senior airway assessment and consider early intubation before oedema progresses.", "type": "mcq"}, {"n": 41, "topic": "Scarlet fever", "stem": "3-year-old, fever 2d, sandpaper rash, strawberry tongue, circumoral pallor. Treatment/public health?", "options": ["Viral, no notification", "Penicillin V (or amoxicillin) + notify HPT (scarlet fever notifiable)", "IV aciclovir + isolation", "Topical antifungal", "Reassure, no antibiotics"], "answer": 1, "exp": "[C/UKHSA] Scarlet fever: 10 days penicillin V (or amoxicillin) and notify the health protection team — it is a notifiable disease.", "type": "mcq"}, {"n": 42, "topic": "Otitis media", "stem": "15-month-old, AOM, bulging red drum, systemically well (NG91). Approach?", "options": ["Immediate IV antibiotics", "Consider no/back-up antibiotic + analgesia", "Immediate grommets", "Topical antibiotic drops", "Co-amoxiclav 10d for all"], "answer": 1, "exp": "[G] NICE NG91: most AOM is self-limiting — analgesia with no or a back-up antibiotic in systemically well children.", "type": "mcq"}, {"n": 43, "topic": "Neonatal surgical abdomen", "stem": "10-day-old, poor feeding, bilious vomiting, distended tender abdomen, unwell. Priority?", "options": ["ORS + discharge", "Urgent surgical assessment, NBM, NG decompression, IV fluids", "Anti-reflux positioning", "Hydrolysed formula", "Outpatient ultrasound"], "answer": 1, "exp": "[C] Bilious vomiting with a distended tender abdomen in a neonate is a surgical emergency — NBM, NG decompression, IV fluids, urgent surgical review.", "type": "mcq"}, {"n": 44, "topic": "Non-anaphylactic allergy", "stem": "4-year-old, peanut allergy, lip swelling + urticaria, NO airway/breathing/circulation compromise. Management?", "options": ["IM adrenaline (anaphylaxis)", "Oral antihistamine + observe (non-anaphylactic)", "IV hydrocortisone first-line", "Nebulised adrenaline", "Discharge, no treatment"], "answer": 1, "exp": "[C] Without ABC compromise this is not anaphylaxis — oral antihistamine and observation; adrenaline is reserved for airway/breathing/circulation involvement.", "type": "mcq"}, {"n": 45, "topic": "Fever traffic light", "stem": "2-year-old, febrile, progressively less responsive, now difficult to rouse (NG143). Category?", "options": ["Green", "Amber", "Red", "Not relevant", "Amber only with rash"], "answer": 2, "exp": "[G] NG143: 'does not wake, or if roused does not stay awake' / difficult to rouse is a RED feature.", "type": "mcq"}, {"n": 46, "topic": "Bronchiolitis oxygen", "stem": "6-month-old, bronchiolitis, SpO2 persistently 89%, feeding adequately, mild recession (NG9). Action?", "options": ["Supplemental oxygen", "Nebulised salbutamol", "Discharge with advice", "Oral prednisolone", "NG feeding only"], "answer": 0, "exp": "[G] NICE NG9: give supplemental oxygen if SpO2 persistently below 90% in bronchiolitis.", "type": "mcq"}, {"n": 47, "topic": "Measles", "stem": "3-year-old, fever, maculopapular rash, cough/coryza/conjunctivitis, Koplik spots. Public-health action?", "options": ["Not notifiable", "Notify HPT urgently (measles notifiable)", "Notify only if admitted", "Await serology", "Notify only in outbreak"], "answer": 1, "exp": "[C/UKHSA] Measles is a notifiable disease — notify the health protection team urgently on clinical suspicion, before serology.", "type": "mcq"}, {"n": 48, "topic": "Neonatal hypoglycaemia", "stem": "Collapsed 5-day-old, glucose 1.2, reduced consciousness. Immediate treatment?", "options": ["Oral glucose gel", "2 mL/kg 10% glucose IV/IO, recheck", "5 mL/kg 50% glucose", "10 mL/kg 5% over 1h", "Glucagon 1 mg IM first-line"], "answer": 1, "exp": "[C] Symptomatic hypoglycaemia: IV/IO 10% glucose 2 mL/kg bolus then recheck and start an infusion. Concentrated 50% glucose is avoided in children.", "type": "mcq"}]}, {"code": "EYE", "title": "Emergency Eye Care", "source": "RCOphth 2020 · NICE · BSR · CKS", "hue": "#38bdf8", "questions": [{"n": 1, "topic": "Chemical injury", "stem": "A 34-year-old builder attends the ED 10 minutes after cement powder entered his left eye. Severe pain and blurred vision. Visual acuity not yet recorded. Single most appropriate immediate action?", "options": ["Record visual acuity in both eyes", "Instil topical anaesthetic and begin copious irrigation with normal saline", "Test the pH of the conjunctival fornix", "Perform slit lamp examination with fluorescein", "Refer immediately to ophthalmology before any intervention"], "answer": 1, "exp": "[G] RCOphth commissioning guidance (2020): chemical injury is the one ocular emergency where treatment precedes full assessment. Irrigate after topical anaesthetic; acuity, pH and slit lamp follow. Cement is alkaline (liquefactive necrosis) — every minute of delay worsens prognosis.", "type": "mcq"}, {"n": 2, "topic": "Chemical injury", "stem": "Following prolonged irrigation of an alkali eye injury, when should pH be re-checked to confirm irrigation can stop?", "options": ["Immediately after stopping irrigation", "5 minutes after stopping irrigation", "At least 15 minutes after stopping irrigation", "30 minutes after the injury occurred", "Only if the patient remains symptomatic"], "answer": 2, "exp": "[G] RCOphth: test pH prior to, and at least 15 min after, cessation of irrigation. Retained particulate alkali (evert the lids) keeps releasing hydroxide, so an immediate post-irrigation pH can be falsely reassuring. Aim for stable pH 7.0–7.5.", "type": "mcq"}, {"n": 3, "topic": "Chemical injury", "stem": "Which chemical agent typically causes the most severe ocular injury?", "options": ["Hydrochloric acid (car battery)", "Petrol", "Sodium hydroxide (oven cleaner)", "Vinegar", "Chlorinated pool water"], "answer": 2, "exp": "[C] Alkalis (NaOH, lime/cement, ammonia) cause liquefactive necrosis and saponify membranes, penetrating the anterior chamber rapidly. Acids cause coagulative necrosis that limits penetration (hydrofluoric acid excepted). Alkali = worst prognosis.", "type": "mcq"}, {"n": 4, "topic": "Post-op endophthalmitis", "stem": "A 76-year-old woman, 4 days after routine cataract surgery, with 12h of increasing pain, marked reduced vision and a hypopyon. Within what timeframe from first healthcare contact should an ophthalmologist examine her (RCOphth)?", "options": ["Within 1 hour", "Within 4 hours", "Within 12 hours", "Within 24 hours", "Within 48 hours"], "answer": 1, "exp": "[G] RCOphth: suspected endophthalmitis must be seen on a slit lamp within FOUR hours of first contact — the tightest of the ten emergency presentations. Organisms can double in <30 min. Management is tap-and-inject. Most other true emergencies carry a 24h standard.", "type": "mcq"}, {"n": 5, "topic": "Post-op endophthalmitis", "stem": "A 70-year-old man, 3 days after intravitreal anti-VEGF injection, painful red eye, vision hand movements. Endophthalmitis suspected. Definitive initial treatment?", "options": ["Intensive hourly topical ofloxacin", "Intravenous ceftriaxone", "Vitreous sampling and intravitreal antibiotic injection", "Oral moxifloxacin and review in 24 hours", "Immediate pars plana vitrectomy in all cases"], "answer": 2, "exp": "[G] RCOphth: immediate sampling of intraocular fluids and intravitreal antibiotics ('tap and inject'). Topical/oral/IV routes do not reach adequate vitreous levels. Vitrectomy is reserved for selected cases, not universal.", "type": "mcq"}, {"n": 6, "topic": "GCA", "stem": "A 74-year-old woman with sudden painless loss of vision in the right eye, 2-week temporal headache, jaw claudication, scalp tenderness; pale swollen disc. Single most appropriate immediate management?", "options": ["Oral prednisolone 40 mg and rheumatology referral within 3 days", "Urgent temporal artery biopsy before starting treatment", "Intravenous methylprednisolone 500 mg–1 g immediately", "Aspirin 300 mg and referral to TIA clinic", "Await ESR and CRP before starting corticosteroids"], "answer": 2, "exp": "[G] GCA with visual loss (arteritic AION): IV methylprednisolone 500 mg–1 g daily up to 3 days (BSR / RCOphth). Never delay for biopsy or bloods — the fellow eye can be lost within hours. Biopsy still valid within ~2 weeks of starting steroids.", "type": "mcq"}, {"n": 7, "topic": "GCA", "stem": "A 68-year-old man, two episodes of transient monocular visual loss (5 min), new headache, scalp tenderness. Vision 6/6 bilaterally, CRP elevated. Most appropriate immediate treatment?", "options": ["Aspirin 300 mg alone and TIA clinic referral", "Oral prednisolone 60 mg daily started immediately", "IV methylprednisolone for 3 days", "Topical steroids and ophthalmology review within 24 hours", "No treatment until temporal artery ultrasound performed"], "answer": 1, "exp": "[G] BSR: suspected GCA WITHOUT established visual loss — start high-dose oral prednisolone (40–60 mg) immediately; amaurosis pushes to the higher end plus urgent same-day ophthalmology. IV methylprednisolone is for established visual loss. Don't delay steroids for imaging/biopsy.", "type": "mcq"}, {"n": 8, "topic": "Vascular occlusion", "stem": "A 62-year-old hypertensive man, 3h after sudden painless profound visual loss; pale retina with a cherry-red spot. Time window and what it mandates alongside ophthalmic referral?", "options": ["Within 24 hours; routine cardiovascular risk assessment", "Within 8 hours; management as a stroke equivalent with same-day stroke pathway", "Within 72 hours; outpatient carotid Doppler", "Within 8 hours; immediate thrombolysis in the ED", "Within 4 hours; intravitreal antibiotics"], "answer": 1, "exp": "[G] CRAO — RCOphth triage: seen within 8 hours. It is an ocular stroke: urgent stroke-pathway assessment (imaging, carotid, risk factors) and always consider GCA in over-50s. Thrombolysis is not standard UK practice outside trials.", "type": "mcq"}, {"n": 9, "topic": "Acute angle closure", "stem": "A 58-year-old long-sighted woman at night: severe left eye pain, headache, vomiting, haloes; red eye, hazy cornea, fixed mid-dilated pupil, IOP 56. Initial pharmacological management in the ED?", "options": ["Topical prednisolone alone and review in the morning", "IV acetazolamide 500 mg plus topical pilocarpine, beta-blocker and steroid", "IV mannitol as first-line monotherapy", "Topical atropine to relieve ciliary spasm", "High-flow oxygen and analgesia pending ophthalmology review"], "answer": 1, "exp": "[G] AACG (NICE CKS / RCOphth): lie flat, IV acetazolamide 500 mg plus topical pilocarpine 2% (pulls iris from the angle), a beta-blocker and steroid; analgesia/antiemetics. Mannitol is second-line. Atropine is contraindicated (worsens closure). Definitive = laser peripheral iridotomy.", "type": "mcq"}, {"n": 10, "topic": "Microbial keratitis", "stem": "A 24-year-old contact lens wearer, 24h painful red watering eye, reduced vision; corneal infiltrate with epithelial defect. Most appropriate management?", "options": ["Chloramphenicol ointment and GP follow-up", "Topical aciclovir five times daily", "Same-day ophthalmology referral for corneal scrape then hourly topical fluoroquinolone", "Pressure patching the eye with cycloplegic drops", "Oral flucloxacillin and review in 48 hours"], "answer": 2, "exp": "[G] Contact-lens microbial keratitis — sight-threatening. RCOphth: slit lamp within 24h, corneal scrape, then hourly topical fluoroquinolone; cover Acanthamoeba in lens wearers. Never patch an infected cornea; stop lens wear and keep lens/case for culture.", "type": "mcq"}, {"n": 11, "topic": "Penetrating trauma", "stem": "A 29-year-old hammering metal, sudden pain and reduced vision; small subconjunctival haemorrhage and a peaked teardrop pupil. Most appropriate imaging for intraocular foreign body?", "options": ["MRI orbits", "CT orbits (thin slice)", "Plain orbital X-ray only", "B-scan ocular ultrasound with firm probe pressure", "No imaging — proceed straight to theatre"], "answer": 1, "exp": "[G] Metal-on-metal is the classic ferrous IOFB mechanism. Thin-slice CT orbits is investigation of choice. MRI is contraindicated with possible metallic IOFB; ultrasound needs globe pressure (avoid on suspected open globe). RCOphth: assess and repair within 24h.", "type": "mcq"}, {"n": 12, "topic": "Penetrating trauma", "stem": "A confirmed open globe injury awaiting transfer for repair. Most appropriate ED management step?", "options": ["Apply a firm pressure pad to prevent extrusion", "Instil topical chloramphenicol ointment", "Place a rigid shield over the eye, give antiemetics and analgesia, keep nil by mouth", "Attempt removal of any visible protruding foreign body", "Measure intraocular pressure to complete the assessment"], "answer": 2, "exp": "[G] Open globe: rigid shield on the orbital rim (never a pressure pad), antiemetics (vomiting raises IOP), analgesia, tetanus, NBM, IV antibiotics per policy. Don't remove protruding FBs, instil ointments, or measure IOP. Repair within 24h (RCOphth).", "type": "mcq"}, {"n": 13, "topic": "Retrobulbar haemorrhage", "stem": "A 45-year-old with blunt facial trauma: tense proptosed eye, vision hand movements, RAPD, IOP 52. CT awaited. Single most appropriate next step?", "options": ["Wait for CT orbits before intervening", "IV acetazolamide and reassess in one hour", "Immediate lateral canthotomy and inferior cantholysis in the ED", "Urgent transfer to a tertiary ophthalmic unit for decompression", "High-dose IV methylprednisolone"], "answer": 2, "exp": "[C/RCEM] Orbital compartment syndrome — minutes count; irreversible loss in 60–120 min. Lateral canthotomy and cantholysis is a core RCEM ED procedure done immediately on clinical grounds, never delayed for imaging/transfer. Medical IOP-lowering is adjunct only.", "type": "mcq"}, {"n": 14, "topic": "Orbital cellulitis", "stem": "A 19-year-old, 2 days periorbital swell

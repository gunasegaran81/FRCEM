lactate >2 mmol/L are NICE NG51 HIGH-RISK criteria. Action: senior review and IV broad-spectrum antibiotics within 1 hour, alongside the Sepsis Six. Antibiotics must NOT be delayed to await blood cultures.", "type": "mcq"}, {"n": 7, "topic": "Post-ROSC temperature", "stem": "Following ROSC after an out-of-hospital VF arrest the patient remains comatose. Regarding temperature per RCUK post-resuscitation care, which is most appropriate?", "options": ["Actively rewarm to 38°C", "Maintain a constant target temperature of 32–36°C and actively prevent fever", "No temperature control is required", "Cool to 28°C for 48 hours", "Permissive hyperthermia improves neurological outcome"], "answer": 1, "exp": "[G] RCUK post-resuscitation care: targeted temperature management — maintain a constant target between 32 and 36°C and actively prevent and treat fever (>37.7°C) for at least 72 hours in patients who remain comatose. Hyperthermia is associated with worse neurological outcome.", "type": "mcq"}, {"n": 8, "topic": "Adult choking", "stem": "A conscious adult suddenly clutches his throat during a meal, cannot speak, and has a silent (ineffective) cough. He remains conscious. Per the RCUK adult choking algorithm, what is correct?", "options": ["Blind finger sweep of the mouth", "Immediate abdominal thrusts only", "Up to 5 back blows, then up to 5 abdominal thrusts, alternating", "Start chest compressions now", "Encourage him to keep coughing"], "answer": 2, "exp": "[G] An ineffective (silent) cough indicates SEVERE airway obstruction. In a conscious adult: up to 5 back blows, then up to 5 abdominal thrusts, alternating, until relieved. If the person becomes unconscious, start CPR. Encouraging coughing is correct only for MILD obstruction. Blind finger sweeps are not recommended.", "type": "mcq"}, {"n": 9, "topic": "DNACPR", "stem": "An 84-year-old care-home resident with metastatic cancer arrests in the ED. A completed, signed DNACPR form dated last week accompanies her, with no reason to doubt validity. Family are not present. Most appropriate?", "options": ["Start full ALS because family are absent to confirm", "Start CPR until a consultant reviews the form", "Withhold CPR in line with the valid DNACPR decision", "Contact the coroner before deciding", "Perform CPR for 2 minutes as a compromise"], "answer": 2, "exp": "[Ethics/law twist] A valid DNACPR decision should be respected. The family's absence does not invalidate it, and relatives cannot demand CPR that is against a valid clinical decision. Only genuine doubt about the form's validity or applicability would justify commencing CPR while clarifying — and no such doubt exists here.", "type": "mcq"}, {"n": 10, "topic": "Capacitous refusal", "stem": "A 25-year-old presents after paracetamol overdose. Alert and oriented, understands untreated overdose can cause fatal liver failure, and calmly refuses acetylcysteine. Capacity assessment confirms she understands, retains, weighs and communicates. Most appropriate?", "options": ["Treat with acetylcysteine under the Mental Capacity Act", "Detain under Section 5(2) and force treatment", "Respect her refusal, as she has capacity to refuse this specific treatment", "Sedate and treat her in her best interests", "Treat under common law necessity"], "answer": 2, "exp": "[Capacity/MCA twist] A capacitous adult may refuse even life-saving treatment. MCA best-interests treatment applies ONLY where capacity is lacking; the MHA authorises treatment for a MENTAL disorder, not the physical consequences of an overdose. With capacity confirmed for this specific decision, respect the refusal — while documenting meticulously, offering ongoing help, and reassessing capacity, which can fluctuate as toxicity develops.", "type": "mcq"}, {"n": 11, "topic": "Advance decision", "stem": "A 40-year-old Jehovah's Witness is exsanguinating from a ruptured spleen. He carries a valid, signed, witnessed advance decision refusing blood and blood products even when life-threatening, with no reason to doubt validity or applicability. He is now unconscious. What is correct?", "options": ["Transfuse because the situation is now life-threatening", "Transfuse under the Mental Capacity Act in his best interests", "Respect the advance decision, withhold blood products, and use alternatives (e.g. cell salvage, haemostatics)", "Seek a court order before withholding transfusion", "Ask the family to override the decision"], "answer": 2, "exp": "[Advance decisions/MCA twist] A valid and applicable advance decision to refuse treatment (ADRT) — even one that is life-sustaining — is legally binding under the MCA 2005 and must be respected. Best-interests transfusion does not apply because a valid ADRT overrides it; family cannot override it and no court order is required. Manage with non-blood strategies (cell salvage, tranexamic acid, surgical/IR haemostasis).", "type": "mcq"}, {"n": 12, "topic": "Best interests", "stem": "An unidentified, unconscious adult is brought in after a road traffic collision, hypotensive and peri-arrest. No capacity, no known advance decision, no relatives present. What legal basis permits emergency life-saving treatment?", "options": ["Section 136 of the Mental Health Act", "Written consent from a relative is required before acting", "Treatment in his best interests under the Mental Capacity Act (doctrine of necessity)", "A court order must be obtained first", "A Deprivation of Liberty Safeguards authorisation"], "answer": 2, "exp": "[Best interests/necessity twist] For an adult lacking capacity with no valid advance decision or appointed attorney, provide treatment that is immediately necessary and in their best interests under the MCA 2005 / common law doctrine of necessity. Relatives cannot consent on behalf of an adult; s136, DoLS and the courts are not the legal basis for delivering emergency clinical treatment.", "type": "mcq"}]}, {"code": "ALS", "title": "Adult Advanced Life Support", "source": "RCUK ALS · boundary conditions", "hue": "#f97316", "questions": [{"n": 1, "topic": "Physiology-guided CPR", "stem": "A 55-year-old in ICU with continuous intra-arterial BP monitoring develops asystolic cardiac arrest. CPR commenced. Most appropriate initial adrenaline dosing strategy per RCUK ALS?", "options": ["Administer 1 mg adrenaline IV bolus immediately", "Administer 50–100 micrograms adrenaline IV increments", "Withhold adrenaline until a diastolic BP <30 mmHg is confirmed", "Administer 500 micrograms adrenaline IV bolus", "Start an adrenaline infusion at 2–10 micrograms/min"], "answer": 1, "exp": "[G] For adults in cardiac arrest ALREADY undergoing continuous intra-arterial BP monitoring, RCUK suggests adrenaline initially in small increments of 50–100 mcg IV. If a total of 1 mg has been given in micro-doses with no response, consider transitioning back to standard 1 mg every 3–5 min. [C] A standard 1 mg bolus with an arterial line running can cause severe harmful hypertension if ROSC occurs; titration supports a target diastolic BP ≥30 mmHg.", "type": "mcq"}, {"n": 2, "topic": "AF cardioversion", "stem": "A 68-year-old with rapid irregular wide-complex AF with pre-existing bundle branch block is unstable (BP 82/44) with severe acute heart failure. After sedation, recommended initial energy strategy for synchronised cardioversion?", "options": ["Initial synchronised shock at 70 J", "Initial synchronised shock at 100 J", "Initial synchronised shock at 120–150 J", "Initial synchronised shock at maximum defibrillator output", "Amiodarone 300 mg IV over 10–20 minutes prior to electrical shock"], "answer": 3, "exp": "[G] For an unstable patient in atrial fibrillation, RCUK explicitly states to deliver the initial synchronised shock at MAXIMUM defibrillator output, rather than an escalating approach. [C] AF is structurally more resilient than atrial flutter or PSVT (which start lower at 70–120 J); maximising the first shock avoids repeated failed attempts, myocardial stunning and further decompensation.", "type": "mcq"}, {"n": 3, "topic": "Atropine contraindication", "stem": "A 74-year-old with syncope has third-degree AV block with a wide QRS at 28 bpm, BP 85/50 and ongoing chest discomfort. Transcutaneous pacing is being retrieved. Most appropriate consideration regarding atropine?", "options": ["Administer atropine 500 micrograms IV immediately as first-line", "Avoid atropine as it is ineffective and may worsen the heart block", "Administer atropine 3 mg IV as a single rapid bolus", "Give aminophylline 100–200 mg slow IV instead of pacing", "Administer atropine only if the QRS complex narrows during telemetry"], "answer": 1, "exp": "[G] High-degree (third-degree) AV block with a WIDE QRS is a strict contraindication to atropine — it is ineffective and can paradoxically worsen the block or cause ventricular standstill. [C] Atropine blocks vagal tone at the SA/AV nodes; in infra-nodal block, speeding the sinus node can outpace and suppress fragile ventricular escape pacemakers. Bridge with pacing or inotropic infusion.", "type": "mcq"}, {"n": 4, "topic": "Ventilator settings in CPR", "stem": "A 42-year-old in refractory VF is intubated and transitioned to mechanical ventilation during continuous manual compressions (volume-controlled, RR 10/min, maximum FiO2). Correct combination for peak pressure alarm and flow trigger during CPR?", "options": ["Peak pressure alarm 30–40 cmH2O, flow trigger on", "Peak pressure alarm 40–50 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger off", "Peak pressure alarm 60–70 cmH2O, flow trigger on", "Peak pressure alarm 80–90 cmH2O, flow trigger off"], "answer": 2, "exp": "[G] For mechanical ventilation during CPR: volume-controlled mode, tidal volume 6–8 mL/kg, RR 10/min, peak pressure alarm 60–70 cmH2O, and flow trigger turned completely OFF. [C] Compressions generate heavy transient circuit flow; turning the flow trigger off stops the machine misinterpreting compressions as patient breaths (causing air trapping), and a high alarm ceiling prevents premature breath termination.", "type": "mcq"}, {"n": 5, "topic": "POCUS in arrest", "stem": "A 35-year-old in PEA arrest. POCUS by a skilled operator without interrupting compressions shows isolated right ventricular dilation, no pericardial fluid, no tension pneumothorax. Correct interpretation and management?", "options": ["RV dilation in isolation confirms massive PE; administer immediate thrombolysis", "RV dilation in isolation should not be used to diagnose pulmonary embolism; continue high-quality CPR and search for other reversible causes", "Isolated RV dilation indicates profound contractility failure; terminate resuscitation immediately", "RV dilation is a normal finding in PEA; pause CPR for 60 seconds for a formal echo", "Administer a fluid bolus immediately as isolated RV dilation confirms severe hypovolaemia"], "answer": 1, "exp": "[G] RCUK mandates that RV dilation in isolation during cardiac arrest must NOT be used to diagnose pulmonary embolism, nor should POCUS be the sole indicator to terminate resuscitation. [C] RV dilation is a non-specific consequence of any arrest — blood shifts from the arterial system to the compliant venous system in low-flow states and the right heart distends. Relying on it alone risks inappropriate thrombolysis.", "type": "mcq"}, {"n": 6, "topic": "Failed cardioversion", "stem": "A 59-year-old with unstable monomorphic VT with a pulse (BP 78/40, severe chest pain) has had synchronised shocks at 120 J then 150 J; the rhythm persists and he remains profoundly unstable. Most appropriate next step?", "options": ["Immediate IV bolus of 300 mg amiodarone over 1 minute", "Unsynchronised shock at maximum defibrillator output (360 J)", "Give procainamide 10–15 mg/kg over 20 minutes or amiodarone 300 mg IV over 10–20 minutes, then re-attempt electrical cardioversion", "Immediate infusion of isoprenaline at 5 micrograms/min", "Abandon electrical management and prepare for emergency transvenous pacing"], "answer": 2, "exp": "[G] If synchronised cardioversion fails in an unstable tachyarrhythmia, the RCUK algorithm directs procainamide 10–15 mg/kg over 20 min OR amiodarone 300 mg IV over 10–20 min, then re-attempt cardioversion. [C] Rapid amiodarone bolus over 1 minute is reserved for PULSELESS arrest; in a patient with a pulse it can trigger catastrophic vasodilatory hypotension.", "type": "mcq"}, {"n": 7, "topic": "Asthma — gas trapping", "stem": "A 26-year-old with brittle asthma is in PEA arrest and intubated. During ventilation there is extreme resistance, rapidly rising peak airway pressures, and profound drop in chest wall expansion during decompression. Dynamic hyperinflation suspected. Most appropriate immediate action?", "options": ["Apply PEEP of 10 cmH2O to splint the airways open", "Increase the respiratory rate to 20 breaths per minute", "Perform immediate bilateral needle thoracocentesis in the second intercostal space", "Disconnect the tracheal tube from the breathing circuit and manually compress the chest wall", "Administer an immediate IV bolus of 2 g magnesium sulphate over 1 minute"], "answer": 3, "exp": "[G] In cardiac arrest in asthma, if dynamic hyperinflation (gas trapping) is suspected, immediately disconnect the tracheal tube/breathing circuit and manually compress the chest wall to facilitate exhalation. [C] Trapped gas builds intrathoracic pressure, blocking venous return and mimicking tension pneumothorax. Increasing PEEP or rate worsens it. Empty the lungs before bilateral needle decompression.", "type": "mcq"}, {"n": 8, "topic": "Post-ROSC ventilation", "stem": "A 64-year-old resuscitated after a 12-minute out-of-hospital VF arrest remains comatose, ventilated on 100% oxygen, BP 118/72. ABG 15 min post-ROSC: pH 7.28, PaO2 24.5 kPa, PaCO2 3.9 kPa, HCO3 18. Most appropriate ventilator adjustments?", "options": ["Maintain 100% oxygen and increase minute ventilation to normalise pH", "Titrate FiO2 to target SpO2 94–98% and DECREASE minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Titrate FiO2 to target SpO2 88–92% and increase minute ventilation to achieve PaCO2 4.6–6.0 kPa", "Maintain 100% oxygen to correct the metabolic acidosis and keep current parameters", "Titrate FiO2 to target SpO2 94–98% and increase minute ventilation to drive PaCO2 below 3.5 kPa"], "answer": 1, "exp": "[G] Post-resuscitation care: titrate inspired oxygen as soon as feasible to SpO2 94–98% (avoiding hyperoxaemia) and ventilate to maintain normal PaCO2 of 4.6–6.0 kPa. [C] PaO2 24.5 kPa is severe hyperoxaemia (oxygen free radicals worsen reperfusion injury); PaCO2 3.9 kPa is hypocapnia causing cerebral vasoconstriction. Decreasing minute ventilation normalises CO2 and restores cerebral perfusion.", "type": "mcq"}, {"n": 9, "topic": "Airway attempts", "stem": "A 52-year-old in refractory VF after anterior MI. During compressions, direct laryngoscopy fails (poor view); a second attempt with a bougie also fails to pass the cords. Most appropriate next step?", "options": ["Attempt a third intubation using a video laryngoscope with a hyperangulated blade", "Immediately perform an emergency surgical cricothyroidotomy", "Switch to a supraglottic airway device or return to high-quality bag-mask ventilation", "Halt chest compressions for up to 20 seconds for a controlled third attempt", "Continue compressions and request a senior anaesthetist for a third direct laryngoscopy"], "answer": 2, "exp": "[G] RCUK ALS explicitly states no more than TWO attempts at tracheal intubation before switching to a supraglottic airway device or returning to bag-mask ventilation. [C] Fixating on a definitive tube causes prolonged compression interruptions and severe hypoxia.", "type": "mcq"}, {"n": 10, "topic": "Failed SGA", "stem": "A 45-year-old in arrest after drowning: two failed laryngoscopy attempts due to massive airway oedema, then a second-generation SGA placed. On testing there is zero chest rise, a massive audible leak and no ETCO2 waveform. Most appropriate immediate action?", "options": ["Proceed immediately to a third intubation attempt using a videolaryngoscope", "Revert immediately to high-quality bag-mask ventilation using a two-person technique and basic airway adjuncts", "Perform an immediate emergency surgical cricothyroidotomy", "Remove the SGA and attempt a larger size of the same device", "Continue chest compressions and ignore the lack of ventilation for two cycles"], "answer": 1, "exp": "[G] If both intubation and an SGA fail to provide adequate ventilation, revert immediately to high-quality bag-mask ventilation with a two-person technique and basic airway adjuncts. [C] A third intubation or changing SGA size wastes critical seconds during active hypoxia. Surgical cricothyroidotomy is a terminal option only in confirmed 'cannot intubate, cannot oxygenate' after bag-mask rescue has been maximised and failed.", "type": "mcq"}, {"n": 11, "topic": "Hyperkalaemic arrest", "stem": "A 62-year-old with ESRD who missed dialysis collapses in PEA arrest. The monitor shows an extremely wide sinusoidal QRS morphing towards asystole. Hyperkalaemia strongly suspected. Correct first-line drug intervention and dosing?", "options": ["30 mL of 10% calcium gluconate by slow IV infusion over 10 minutes", "10 mL of 10% calcium chloride by rapid intravenous bolus", "50 mL of 8.4% sodium bicarbonate over 15 minutes", "10 units of soluble insulin with 50 mL of 50% glucose over 5 minutes", "Withhold calcium until a formal point-of-care potassium is confirmed"], "answer": 1, "exp": "[G] In cardiac arrest secondary to hyperkalaemia, the standard slow calcium administration protocols are bypassed: give 10 mL of 10% CALCIUM CHLORIDE by rapid IV bolus, repeatable if the arrest continues. [C] Calcium stabilises the myocardial membrane; calcium chloride's superior bioavailability (gluconate requires hepatic activation) makes it first-line during active CPR.", "type": "mcq"}, {"n": 12, "topic": "Maternal arrest", "stem": "A 31-year-old at 28 weeks collapses in resus after a severe headache and arrests. High-quality compressions and continuous manual left uterine displacement are applied. Rhythm is asystole. After 3 minutes of ALS there is no ROSC. Critical timing boundary for resuscitative hysterotomy?", "options": ["Prepare to perform the procedure immediately if there is no ROSC by 4 minutes, aiming for delivery of the fetus by 5 minutes", "Defer until 10 minutes of ALS have been delivered to maximise maternal ROSC", "Perform only if fetal distress is documented via formal obstetric ultrasound", "Immediately transfer to the nearest obstetric theatre before initiating the incision", "Initiate immediately at the 2-minute mark if the rhythm is non-shockable"], "answer": 0, "exp": "[G] In maternal cardiac arrest (≥20 weeks or fundus at/above the umbilicus), if there is no ROSC within 4 minutes of collapse, immediately perform a resuscitative hysterotomy aiming for delivery by 5 minutes. [C] The gravid uterus compresses the IVC and aorta, reducing compression-generated output to negligible levels; emptying the uterus unloads this and gives the mother her best chance. Perform in the resus bay, not after transfer.", "type": "mcq"}]}, {"code": "HS", "title": "Head & Spine Injury", "source": "NICE NG232 · NG41", "hue": "#fda4af", "questions": [{"n": 1, "topic": "Head & spine (NG232/NG41)", "stem": "A 45-year-old man attends the ED after tripping and falling down a flight of exactly 5 stairs, striking the back of his head. He describes a brief loss of consciousness lasting about 20 seconds, immediately followed by full recovery. He has vomited once since the injury. On assessment 3 hours after the injury, GCS is 15/15, pupils equal and reactive, no focal neurological deficit, and no signs of skull fracture. He is not on any anticoagulant or antiplatelet medication and has no bleeding disorder. What is the most appropriate next step?", "options": ["Discharge with written head injury advice and no CT", "CT head within 1 hour", "Admit for observation with hourly neuro observations, no CT needed", "Skull X-ray to assess for fracture before deciding on CT", "CT head within 8 hours of the injury"], "answer": 0, "exp": "[G] NG232 1.5.8 requires MORE THAN 1 vomiting episode for immediate CT — he's had only 1, so that criterion isn't met. [G] 1.5.9's 8-hour pathway (for anyone with LOC/amnesia) needs age ≥65, a bleeding/clotting disorder, a dangerous mechanism (fall from a height of more than 1m OR more than 5 stairs), or more than 30 minutes' retrograde amnesia — a fall of exactly 5 stairs does not exceed that threshold. No criterion is met, so discharge with safety-netting advice. Tests the exact 'more than' wording routinely misread as '5 stairs or more'.", "type": "mcq"}, {"n": 2, "topic": "Head & spine (NG232/NG41)", "stem": "A 78-year-old woman on apixaban for atrial fibrillation trips and hits her head on a kitchen worktop. She has no loss of consciousness, no vomiting, no headache, and GCS is 15/15 with a normal neurological examination. There is no other indication for CT head based on history and examination. She presents to the ED 9 hours after the injury. What is the most appropriate imaging strategy?", "options": ["No CT required as she is asymptomatic", "CT head within 1 hour of presentation", "CT head within 8 hours of the injury", "CT head within 8 hours of presentation", "MRI head within 1 hour of presentation"], "answer": 1, "exp": "[G] NG232 1.5.13: anticoagulated patients with no other CT indication should have CT within 8 hours OF THE INJURY, or within 1 hour OF PRESENTATION if they present more than 8 hours after injury. She presents at 9 hours post-injury, so the 8-hour-from-injury window has closed — scan within 1 hour of presentation. Option C states the correct rule but the wrong point in the pathway; D anchors the 8-hour window to the wrong reference time.", "type": "mcq"}, {"n": 3, "topic": "Head & spine (NG232/NG41)", "stem": "A 4-year-old girl falls from a first-floor window, a height of approximately 3.5 metres, landing on a paved patio. In the ED she has vomited three times and appears intermittently drowsy but rousable. GCS is 15 (paediatric scale), no focal neurological deficit, no signs of basal or depressed skull fracture, and no suspicion of non-accidental injury. What is the most appropriate next step?", "options": ["Observe for a minimum of 4 hours, then reassess for CT", "Skeletal survey before any head imaging", "CT head within 1 hour", "MRI head as first-line investigation", "Discharge with safety-netting advice once vomiting settles"], "answer": 2, "exp": "[G] NG232 1.5.11: children with MORE THAN ONE risk factor (here: dangerous mechanism — fall >3m — plus ≥3 vomiting episodes) require CT within 1 hour. The 4-hour observation pathway (1.5.12) applies only when there is exactly one risk factor, which is the trap in option A.", "type": "mcq"}, {"n": 4, "topic": "Head & spine (NG232/NG41)", "stem": "A 6-year-old boy falls off his bike, without a helmet, and is witnessed by his father to be unconscious for approximately 6 minutes before waking spontaneously. In the ED, GCS is 15/15, no vomiting, no abnormal drowsiness, no dangerous mechanism, no bleeding disorder, and amnesia cannot be reliably assessed. No other risk factors from the immediate CT list are present. What is the most appropriate management?", "options": ["CT head within 1 hour", "Discharge home with safety-netting advice, no observation needed", "3-view skull X-ray to decide on need for CT", "Observe for a minimum of 4 hours from time of injury, with CT if any deterioration occurs", "Admit for 24-hour inpatient observation regardless of progress"], "answer": 3, "exp": "[G] NG232 1.5.12: a child with only ONE risk factor from the 1.5.11 list (here: witnessed LOC >5 minutes) should be observed a minimum of 4 hours from injury; CT within 1 hour is triggered only if GCS drops below 15, further vomiting, or a further episode of abnormal drowsiness during observation. Immediate CT (A) is for >1 risk factor; discharge (B) skips the mandatory observation.", "type": "mcq"}, {"n": 5, "topic": "Head & spine (NG232/NG41)", "stem": "A 71-year-old woman trips on a kerb and lands on her side, without direct head strike, but reports neck pain. GCS is 15/15, she is alert, ambulatory since the injury, and comfortable sitting in the assessment bay. There is no midline cervical tenderness and no focal neurological deficit or paraesthesia. What is the most appropriate next step regarding her cervical spine?", "options": ["Assess active range of neck movement (45 degrees left and right); if achieved, no imaging needed", "3-view cervical spine X-ray", "No imaging required as she meets several low-risk criteria", "MRI cervical spine as first-line investigation", "CT cervical spine within 1 hour, without formally assessing range of neck movement"], "answer": 4, "exp": "[G] NG232 1.6.1: range-of-neck-movement assessment can only be done when NO high-risk factors are present. Age ≥65 combined with clinical suspicion of cervical spine injury (neck pain) is itself a high-risk factor under 1.6.2, mandating CT within 1 hour. You do not proceed to ROM testing just because she also ticks 'low-risk' boxes — the high-risk factor overrides them.", "type": "mcq"}, {"n": 6, "topic": "Head & spine (NG232/NG41)", "stem": "A 10-year-old boy is a rear-seat passenger involved in a high-speed motorway collision. He complains of neck pain. GCS is 15/15, no focal neurological deficit, no paraesthesia, not intubated, and this is his only imaging requirement (no other body area being scanned). What is the most appropriate first-line cervical spine investigation?", "options": ["3-view cervical spine X-ray within 1 hour", "CT cervical spine within 1 hour", "MRI cervical spine", "No imaging needed if he can rotate his neck 45 degrees each way", "Cervical spine ultrasound"], "answer": 0, "exp": "[G] NG232 1.6.5: a child with neck pain/tenderness and a dangerous mechanism, but none of the CT-mandating factors (GCS ≤12, intubated, focal neuro signs, paraesthesia, urgent diagnosis, concurrent CT of other regions, strong suspicion despite normal X-ray, or an inadequate/positive X-ray), goes straight to a 3-view X-ray — before any range-of-movement assessment. Option D is the pathway for a child WITHOUT a dangerous mechanism (1.6.6).", "type": "mcq"}, {"n": 7, "topic": "Head & spine (NG232/NG41)", "stem": "A 34-year-old man involved in an assault has a GCS of 11 in the ED, 70 minutes after the injury. There is no evidence of active extracranial haemorrhage. CT head is being arranged. What is the most appropriate immediate pharmacological management?", "options": ["1 g intravenous tranexamic acid, given after the CT scan", "2 g intravenous tranexamic acid bolus, given now, before imaging", "Withhold tranexamic acid as it is only indicated with confirmed intracranial haemorrhage on CT", "15-30 mg/kg intravenous tranexamic acid bolus", "2 g intravenous tranexamic acid, but only if given within 3 hours of injury"], "answer": 1, "exp": "[G] NG232 1.3.17: for GCS ≤12 with no active extracranial bleeding, give a 2 g IV bolus of tranexamic acid (adult dose) as soon as possible within 2 hours of injury, and BEFORE imaging. A is a near-miss on dose and timing (before, not after, CT); E uses the wrong outer time limit (2 h, not 3); D is the paediatric weight-based dose wrongly applied to an adult.", "type": "mcq"}, {"n": 8, "topic": "Head & spine (NG232/NG41)", "stem": "An 8-year-old boy, weighing 25 kg, sustains a head injury in a road traffic collision. GCS is 12 on arrival, 45 minutes post-injury. There is no suspicion of active extracranial bleeding. What is the most appropriate tranexamic acid dose to give now, before imaging?", "options": ["2 g intravenous bolus (fixed adult dose)", "15-30 mg/kg, up to a maximum of 5 g", "375 mg to 750 mg intravenous bolus (15-30 mg/kg)", "Tranexamic acid is contraindicated under 16 years", "250 mg intravenous bolus regardless of weight"], "answer": 2, "exp": "[G] NG232 1.3.17: paediatric TXA dose is 15-30 mg/kg IV bolus, up to a maximum of 2 g. For 25 kg that is 375-750 mg. B is a near-miss with the wrong cap (5 g not 2 g); A applies the fixed adult dose to a child; D is wrong — this is an off-label but explicitly recommended use, not a contraindication.", "type": "mcq"}, {"n": 9, "topic": "Head & spine (NG232/NG41)", "stem": "A 55-year-old man is admitted for head injury observation after a fall. Initial CT head was normal. Three hours after admission he remains confused and disorientated to time and place, though GCS is 14 (E4V4M6) and stable. There is no focal neurological deficit, no seizure, and no deterioration in GCS. What is the most appropriate action regarding neurosurgical discussion at this point?", "options": ["Discuss with neurosurgery immediately, as any confusion warrants referral", "Repeat CT immediately regardless of neurosurgical discussion", "Discharge is appropriate once confusion resolves spontaneously", "Continue standard observation; discuss with neurosurgery only if confusion persists beyond 4 hours", "Discuss with neurosurgery only if GCS drops below 8"], "answer": 3, "exp": "[G] NG232 1.4.16 mandates neurosurgical discussion (regardless of imaging) for unexplained confusion persisting MORE THAN 4 hours. At 3 hours the threshold is not reached — continue observation and reassess at 4 hours, rather than referring prematurely (A) or waiting for GCS ≤8 (E), a different, more restrictive trigger.", "type": "mcq"}, {"n": 10, "topic": "Head & spine (NG232/NG41)", "stem": "A 68-year-old man on warfarin (INR 2.3) falls and sustains a head injury. CT head shows an isolated simple linear non-displaced skull fracture with no underlying intracranial abnormality. GCS is 15/15, examination is otherwise normal, and he has no other concerning symptoms. What is the most appropriate disposition?", "options": ["Discharge home with head injury advice, as the fracture is not clinically important", "Discharge, since GCS is 15 and the fracture is isolated and simple", "Admit only if a repeat CT at 24 hours is abnormal", "Discharge with urgent neurosurgical outpatient follow-up, no admission needed", "Admit for observation, as an isolated simple linear skull fracture is unlikely to be a clinically important abnormality UNLESS the person is on anticoagulant or antiplatelet medication"], "answer": 4, "exp": "[G] NG232 1.9.1 has an explicit carve-out: an isolated simple linear non-displaced skull fracture is usually NOT clinically important — UNLESS the patient is on anticoagulant or antiplatelet medication, in which case admission is indicated despite an otherwise reassuring picture.", "type": "mcq"}, {"n": 11, "topic": "Head & spine (NG232/NG41)", "stem": "A 29-year-old man presents after a motorcycle collision. On examination he has bruising confined to the mastoid region bilaterally, appearing approximately 24 hours post-injury, and clear fluid intermittently dripping from his left nostril. GCS is 15/15. Which combination of findings described is most consistent with a sign of basal skull fracture, mandating CT head within 1 hour?", "options": ["Battle's sign and CSF rhinorrhoea", "Bilateral periorbital bruising only", "Mastoid bruising alone, regardless of timing", "Clear nasal discharge alone, without other findings, in a patient with a history of allergic rhinitis", "Bruising around the eyes appearing more than 3 days after injury without other trauma"], "answer": 0, "exp": "[G] Battle's sign (mastoid bruising) and CSF rhinorrhoea (clear fluid from the nose) are both listed as basal skull fracture signs in NG232 1.5.8, each independently sufficient to trigger CT within 1 hour. [C] The 24-hour delay in bruising is classic for Battle's sign (a delayed sign), reinforcing rather than undermining the diagnosis.", "type": "mcq"}, {"n": 12, "topic": "Head & spine (NG232/NG41)", "stem": "A 40-year-old woman is under head injury observation with a baseline GCS of 15 (E4V5M6). On a routine half-hourly observation, her score is now E4V5M4, a drop of 2 points isolated to the motor component, first noted at this single observation. What is the most appropriate immediate action?", "options": ["Continue routine half-hourly observations and reassess in 30 minutes, since a single reading needs confirmation over 30 minutes before acting", "Urgently reassess now; a drop of 2 or more points in the motor score is itself a trigger for urgent reassessment, without needing to wait 30 minutes", "No action needed unless the total GCS score drops below 13", "Increase observation frequency to hourly and reassess in 4 hours", "This does not meet any deterioration criterion as the total GCS score has only dropped by 2 points"], "answer": 1, "exp": "[G] NG232 1.9.13 lists two distinct deterioration triggers: (i) a SUSTAINED (≥30 min) drop of 1 point in overall GCS, and (ii) any drop of ≥3 points in eye/verbal OR ≥2 points in the motor score — the latter is an immediate trigger with no 30-minute confirmation. This tests that distinction, commonly confused.", "type": "mcq"}, {"n": 13, "topic": "Head & spine (NG232/NG41)", "stem": "A 26-year-old man attends the ED after a head injury sustained while intoxicated with alcohol. GCS is 15/15 throughout, CT head is normal, and there is no other indication for admission. He is still clinically intoxicated at the time of the planned discharge, though cooperative and ambulant, and lives alone. What is the most appropriate disposition?", "options": ["Discharge now with written head injury advice, as GCS is 15 and CT is normal", "Discharge with a taxi home arranged, since intoxication alone is not a barrier to discharge", "Admit, or otherwise ensure a period of safe observation until no longer clinically intoxicated, given current alcohol intoxication and living alone", "Discharge once he can walk in a straight line", "Admit for a fixed 24-hour period regardless of clinical progress"], "answer": 2, "exp": "[G] NG232 1.9.1 lists current drug/alcohol intoxication as an independent factor warranting admission, separate from the imaging/GCS discharge criteria in 1.10.1-1.10.2. [G] 1.10.5 additionally requires suitable supervision at home before discharge — here he both remains intoxicated and lives alone, so neither condition for safe community transfer is satisfied.", "type": "mcq"}, {"n": 14, "topic": "Head & spine (NG232/NG41)", "stem": "A 50-year-old man was discharged 6 weeks ago after a moderate head injury. He now re-presents to the ED with persistent fatigue, and is found to have a blood pressure of 92/58 mmHg and sodium of 128 mmol/L on blood tests, with no other clear cause identified. What is the most appropriate next step regarding these findings?", "options": ["Reassure that fatigue is a normal part of post-concussion syndrome and discharge with no further investigation", "Arrange urgent repeat CT head, as this is the only investigation indicated", "These findings are unrelated to the head injury and should be referred to primary care without further ED input", "Consider investigation for hypopituitarism given persistently low sodium and low blood pressure", "Start empirical corticosteroid replacement without further investigation"], "answer": 3, "exp": "[G] NG232 1.9.7/1.10.15: persistently abnormal low sodium or low blood pressure after a head injury (even weeks to months later) should prompt consideration of investigation for hypopituitarism. [C] Starting empirical steroid replacement without confirmatory investigation is not guideline-supported and risks masking the underlying endocrine picture.", "type": "mcq"}, {"n": 15, "topic": "Head & spine (NG232/NG41)", "stem": "At the roadside, paramedics assess a 30-year-old woman involved in a low-speed rear-end shunt. She was ambulatory at the scene, is comfortable sitting in the ambulance, has no midline cervical tenderness, and is able to actively rotate her neck 45 degrees to both left and right without pain. According to the Canadian C-spine rule as applied in NICE NG41, how should this patient be categorised, and what is the immobilisation requirement?", "options": ["Low risk; full in-line immobilisation should still be maintained until ED assessment", "High risk; immobilise fully due to the mechanism", "Indeterminate risk; immobilise until Canadian C-spine rule can be formally applied in hospital", "Low risk; immobilise only if she later develops delayed-onset neck pain", "No risk; full in-line spinal immobilisation is not required"], "answer": 4, "exp": "[G] NG41 1.1.5: a patient with at least one low-risk factor (ambulatory since injury, comfortable sitting, minor rear-end collision, no midline tenderness) AND who can actively rotate their neck 45 degrees both ways is categorised as 'no risk', distinct from 'low risk' (which still requires the ROM test to de-escalate). [G] 1.1.10: immobilisation is not required in the 'no risk' group.", "type": "mcq"}, {"n": 16, "topic": "Head & spine (NG232/NG41)", "stem": "A driver is involved in a low-speed collision. She is not physically trapped in the vehicle, has no distracting injuries, no paraesthesia, weakness or numbness, no spinal pain, and no high-risk factors for cervical spine injury by the Canadian C-spine rule. What is the most appropriate approach to extrication?", "options": ["Consider asking her to self-extricate, then lie supine on a stretcher for assessment in the ambulance", "Full spinal immobilisation with collar, extrication board and blocks before any movement", "Rapid extrication using a longboard, which can then be used for transport to hospital", "Immobilise first, then allow self-extrication once the collar is fitted", "Self-extrication is never appropriate regardless of clinical findings"], "answer": 0, "exp": "[G] NG41 1.1.16-1.1.18: self-extrication should be considered when a patient is not physically trapped and has none of significant distracting injuries, abnormal neurological symptoms, spinal pain, or high-risk Canadian C-spine factors; she then lies supine on a stretcher and is assessed in the ambulance. [G] 1.1.19: a longboard is an extrication device ONLY, never for transport — making C a deliberate trap.", "type": "mcq"}, {"n": 17, "topic": "Head & spine (NG232/NG41)", "stem": "A 45-year-old man with a suspected thoracic spinal column injury is in severe pain at the roadside. Paramedics are unable to establish intravenous access after two attempts. What is the most appropriate next analgesic approach?", "options": ["Wait until IV access is achieved in the ED before giving any analgesia", "Intranasal atomised diamorphine or ketamine", "Intramuscular morphine", "Oral immediate-release morphine solution", "Entonox alone, with no other analgesia until IV access is obtained"], "answer": 1, "exp": "[G] NG41 1.2.5-1.2.6: first-line analgesia in spinal injury is IV morphine; if IV access cannot be established, the intranasal route for atomised diamorphine or ketamine is the recommended next step (off-label but specifically endorsed) — not IM or oral, and not withholding analgesia while waiting for IV access.", "type": "mcq"}, {"n": 18, "topic": "Head & spine (NG232/NG41)", "stem": "A 25-year-old man has a suspected traumatic spinal cord injury following a motorcycle collision, with full in-line spinal immobilisation in place. He develops airway compromise requiring rapid sequence induction and intubation, which the pre-hospital team is unable to safely deliver at scene. What is the most appropriate immediate destination?", "options": ["Nearest major trauma centre, irrespective of transfer time", "Nearest linked spinal cord injury centre directly from scene", "Nearest trauma unit, to allow the life-saving intervention to be delivered", "Remain at scene until a pre-hospital critical care team arrives, regardless of delay", "Nearest emergency department of any type, spinal centre status irrelevant"], "answer": 2, "exp": "[G] NG41 1.3.2: transport suspected spinal cord injury directly to a major trauma centre irrespective of transfer time, UNLESS an immediate life-saving intervention is needed. [G] 1.3.4: if that intervention (e.g. RSI) cannot be delivered pre-hospital, divert to the NEAREST TRAUMA UNIT. [G] 1.3.5 prohibits transporting directly to a spinal cord injury centre from the scene — making B a hard-rule violation.", "type": "mcq"}, {"n": 19, "topic": "Head & spine (NG232/NG41)", "stem": "A 22-year-old man is diagnosed with an acute traumatic spinal cord injury in the emergency department. A junior colleague suggests starting high-dose methylprednisolone to reduce secondary cord damage, citing historic NASCIS trial data. What is the most appropriate response according to current NICE guidance?", "options": ["Agree and start high-dose methylprednisolone within 8 hours of injury, per NASCIS II protocol", "Start methylprednisolone only if the injury is cervical rather than thoracolumbar", "Start a lower 'renal-adjusted' dose of methylprednisolone to reduce side effects", "Do not use methylprednisolone, nimodipine, or naloxone in the acute stage after traumatic spinal cord injury", "Methylprednisolone is appropriate but only in patients under 30 years old"], "answer": 3, "exp": "[G] NG41 1.7.3 explicitly advises against methylprednisolone, nimodipine and naloxone in the acute stage after traumatic spinal cord injury. [C] This reflects the shift away from NASCIS-era steroid protocols — the risk of harm (infection, GI bleeding, myopathy) outweighs any modest neurological benefit. A classic superseded-practice trap still taught informally.", "type": "mcq"}, {"n": 20, "topic": "Head & spine (NG232/NG41)", "stem": "An 8-year-old girl is involved in a high-speed road traffic collision. She has thoracolumbar spinal tenderness on palpation but no abnormal neurological signs or symptoms, and no distracting injuries elsewhere requiring urgent CT. What is the most appropriate first-line imaging strategy for her suspected thoracolumbar spine injury?", "options": ["Whole-body CT (vertex to mid-thigh) given the high-speed mechanism", "MRI thoracolumbar spine as first-line investigation", "CT thoracolumbar spine as first-line investigation, given the dangerous mechanism", "No imaging required as she has no neurological signs or symptoms", "Plain X-ray of the thoracolumbar spine (T1-L3) as first-line investigation"], "answer": 4, "exp": "[G] NG41 1.5.9: plain X-ray (T1-L3) is first-line for suspected thoracolumbar spinal column injury without abnormal neurological signs/symptoms; CT is reserved for an abnormal X-ray or the development of signs/symptoms (1.5.10). [G] 1.5.15: whole-body CT is NOT routine in children — that pathway (1.5.12) is for adults with blunt major trauma — making A an adult-practice trap.", "type": "mcq"}]}, {"code": "ABS", "title": "The Patient Who Absconds", "source": "RCEM Best Practice Guideline (rev. 2023)", "hue": "#4ade80", "questions": [{"n": 1, "topic": "Definitions", "stem": "A 34-year-old man brought to the ED after an overdose is booked in and placed in majors awaiting bloods. An hour later his cubicle is empty; no staff saw him leave and he remains at potential risk of self-harm. Which term correctly describes this event?", "options": ["Did not wait", "Left without being seen", "Self-discharge", "Absconded", "Discharge against medical advice"], "answer": 3, "exp": "[G] RCEM (The Patient Who Absconds, rev. 2023) defines absconding as a patient who has left the department unexpectedly, without the knowledge of clinical staff, and in whom there remains a potential risk of harm to self or others. The guideline explicitly excludes 'did not wait', 'left without being seen' and 'self-discharge'. A duty of care exists from the moment of booking in.", "type": "mcq"}, {"n": 2, "topic": "Risk identification", "stem": "At triage a 26-year-old woman presenting after self-harm is judged at risk of absconding. Which single action is essential as soon as the risk is identified?", "options": ["Record her physical description", "Assess her capacity, ideally as part of a mental health triage tool", "Allocate a security officer to observe her", "Refer immediately to the mental health liaison team", "Move her to a cubicle near the nursing station"], "answer": 1, "exp": "[G] RCEM Recommendation 2: the essential action once absconding risk is identified is to assess capacity, ideally within a mental health triage tool. The triage question is 'Do you think this patient has the capacity to decide to leave?'. Recording a physical description and prioritised assessment are also recommended, but capacity assessment is the guideline-stated essential first action.", "type": "mcq"}, {"n": 3, "topic": "Restraint threshold", "stem": "A 78-year-old woman with delirium from urosepsis lacks capacity and repeatedly attempts to leave. Security physically restrain her under the MCA 2005. After what duration of physical restraint should chemical restraint (rapid tranquillisation) be administered?", "options": ["5 minutes", "10 minutes", "20 minutes", "30 minutes", "60 minutes"], "answer": 1, "exp": "[G] Guideline-stated: if restraint is needed for more than 10 minutes, chemical restraint (rapid tranquillisation) should be administered. Restraint must be clinically led, necessary, proportionate and in the patient's best interests, with its legal basis documented in the notes.", "type": "mcq"}, {"n": 4, "topic": "Deprivation of liberty", "stem": "A 45-year-old man with head injury and fluctuating confusion lacks capacity and is being prevented from leaving under s6 MCA 2005. His work-up will take 6–8 hours and he keeps trying to leave. Key legal issue?", "options": ["Restraint under s6 MCA 2005 remains lawful for the whole attendance", "He should be detained under s5(2) MHA 1983 by the ED consultant", "Keeping him for more than a short period likely amounts to a deprivation of liberty requiring formal authority", "Common law powers permit detention for up to 24 hours", "ED nursing staff can apply s5(4) MHA 1983"], "answer": 2, "exp": "[G] MCA s6 permits necessary and proportionate restraint, but if a patient must remain for more than a short period ('measured at most in hours') this goes beyond restraint and becomes a deprivation of liberty, lawful only with formal authority. s5(2) and s5(4) holding powers apply to admitted inpatients, not the ED.", "type": "mcq"}, {"n": 5, "topic": "ED and MHA powers", "stem": "A 30-year-old man with acute psychosis, not on any section, is attempting to leave. He is felt to lack capacity due to mental illness. Which correctly describes ED staff powers under the MHA 1983?", "options": ["The ED consultant can complete an emergency s4 application", "ED nurses can use the s5(4) holding power", "ED staff have no MHA detention powers; options are limited to requesting the police apply s136", "Security staff can detain under s136 within hospital grounds", "Two ED doctors can jointly detain under s2 pending psychiatric review"], "answer": 2, "exp": "[G] ED personnel do not have powers to detain under the MHA 1983; options are limited to requesting police assistance, as police can apply s136 in the ED. If the primary problem is mental illness, discuss with mental health liaison. In the interim, if he lacks capacity, MCA 2005 powers may justify restraint in his best interests.", "type": "mcq"}, {"n": 6, "topic": "Unsigned s2 paperwork", "stem": "A 24-year-old woman has been assessed under the MHA with medical recommendations completed for a s2 admission, but no bed identified and the application paperwork unsigned. She attempts to leave. Which statement is correct?", "options": ["She is already detained under s2 and can be restrained under the MHA", "The s2 recommendation does not apply until the paperwork is signed once a bed is identified; if she lacks capacity, restrain under the MCA 2005", "She must be allowed to leave as no legal framework applies", "The police must be called to apply s135", "Security may detain her under common law for up to 4 hours"], "answer": 1, "exp": "[G] Guideline-stated boundary point: a recommendation for s2 or s3 does not apply until the paperwork has been signed when a bed has been identified. Until then, restraint is only lawful under the MCA 2005 (if she lacks capacity, in her best interests) or via police s136 if she is not sectioned. s135 relates to a magistrate's warrant for removal from private premises.", "type": "mcq"}, {"n": 7, "topic": "Capacitous refusal", "stem": "A 28-year-old man with pleuritic chest pain and raised D-dimer awaiting CTPA wants to leave to collect his children. Formal assessment confirms capacity. He understands he may have a PE and could die. What should happen?", "options": ["Restrain him under s6 MCA 2005 as the decision is unwise", "Detain him under common law given the risk to life", "Respect his decision, document the discussion and offer a return plan", "Contact the police to return him if he leaves", "Ask security to delay him until senior review"], "answer": 2, "exp": "[G] The decision of a patient with capacity must be respected even if the clinician considers it unwise, provided it does not put others at immediate risk of significant harm. The guideline advises caution before concluding an apparently unwise decision was made with capacity — but once capacity is confirmed, his liberty prevails.", "type": "mcq"}, {"n": 8, "topic": "Common law", "stem": "An intoxicated man attempting to leave begins swinging a metal drip stand at staff and other patients. His capacity status is unknown. Legal basis for immediately intervening?", "options": ["Section 6 MCA 2005", "Section 136 MHA 1983", "Common law — preventing immediate risk of significant harm to others, irrespective of capacity", "Deprivation of Liberty Safeguards", "Intervention is unlawful until capacity is formally assessed"], "answer": 2, "exp": "[G] If a patient's actions put others at immediate risk of significant harm, it is lawful under common law to intervene to prevent that harm, irrespective of their capacity. MCA s6 applies only where the patient lacks capacity and restraint is in their own best interests; s136 is a police power. Capacity is irrelevant here — that's the trap.", "type": "mcq"}, {"n": 9, "topic": "Initial response", "stem": "A nurse discovers a 40-year-old man who presented after paracetamol overdose has absconded from the waiting room. What should the department do FIRST?", "options": ["Immediately telephone the police", "Search the ED and immediate surrounding area and undertake a thorough risk assessment", "Complete a DATIX incident form", "Send a discharge letter to the GP", "Contact the mental health liaison team"], "answer": 1, "exp": "[G] EDs should avoid immediately calling police and instead undertake a thorough risk assessment: search the ED and surrounding area, involve security and CCTV, call the patient's contact number, consider next of kin. Police involvement comes later and only if strict criteria are met — real and immediate risk to life AND proportionate police response AND vulnerability considered AND telephone contact failed AND no other person or service can return the patient.", "type": "mcq"}, {"n": 10, "topic": "Police powers", "stem": "Police locate a 52-year-old man with capacity who absconded before review of an abnormal ECG. He is safe at home and refuses to return. Not under arrest, not on s136, no marked vulnerability. What can the police do?", "options": ["Return him to the ED using reasonable force", "Apply s5(2) MHA 1983", "Detain him under the MCA 2005 on the ED's behalf", "They have no power to return him against his will", "Issue a community treatment order"], "answer": 3, "exp": "[G] Police do not have the power to bring patients back to the ED against their will unless the patient is under arrest, has been placed on s136, or is considered at risk and vulnerable (e.g. dementia, a child). None applies here, so his refusal stands. Alternatives: contact him directly, involve a relative if appropriate, inform the GP.", "type": "mcq"}, {"n": 11, "topic": "Return to ED", "stem": "A 19-year-old woman who absconded after presenting with suicidal ideation is brought back by police 3 hours later. What does RCEM recommend on her return?", "options": ["Resume the previous management plan from where it was interrupted", "Re-triage her, treat her as high risk for further absconding, and arrange prompt review preferably by a senior clinician", "Place her last in the queue as she left voluntarily", "Ask the police to remain with her until discharge", "Transfer her directly to the mental health unit"], "answer": 1, "exp": "[G] Returned patients should be re-triaged, considered high risk for further absconding, and seen promptly, preferably by a senior clinician. Their condition may have changed (e.g. alcohol or drug ingestion), so previous plans must be reviewed. Establish whether police presence reflects s136, arrest or mere accompaniment, and whether they intend to remain.", "type": "mcq"}, {"n": 12, "topic": "Safeguarding", "stem": "A 15-year-old boy awaiting assessment after an alleged assault leaves the ED with his mother before being seen. Staff are unsure whether risk remains. What must this event trigger?", "options": ["No action — he left with a parent", "An immediate 999 call to the police", "Local safeguarding procedures", "A s136 request", "Referral to CAMHS within 24 hours"], "answer": 2, "exp": "[G] Recommendation 9: any children who abscond, with or without an accompanying adult, should trigger local safeguarding procedures. Police contact is a separate decision based on the risk assessment; the presence of a parent does not remove the safeguarding obligation — the accompanying adult is the distractor.", "type": "mcq"}, {"n": 13, "topic": "Observation level", "stem": "A 22-year-old man with suicidal ideation is assessed at triage as at high (but not the very highest) risk of absconding while waiting. What level of observation does RCEM recommend?", "options": ["Hourly welfare checks", "Observation every 30 minutes", "Intermittent observation, e.g. every 15 minutes", "Continuous one-to-one observation in all such cases", "CCTV monitoring from the nursing station"], "answer": 2, "exp": "[G] Patients at high risk of absconding or self-harm should be observed intermittently (e.g. every 15 minutes), or continuously if at very high risk. Staff carrying out observations should be trained and observations documented. Continuous observation is reserved for the very-high-risk group.", "type": "mcq"}, {"n": 14, "topic": "Governance", "stem": "Police are contacted and asked to urgently locate a vulnerable patient who absconded. What governance step must follow?", "options": ["No further action once the patient is found", "Completion of an incident form (e.g. DATIX), reviewed within a rolling governance programme with the police service", "A serious incident (SI) investigation in every case", "Referral of the case to the coroner", "Automatic safeguarding referral for all adults"], "answer": 1, "exp": "[G] Once police have been contacted to locate an absconded patient, an incident form (e.g. DATIX) should be completed, and these incidents reviewed as part of a rolling governance programme with the police. Departments should record numbers of absconding patients and police contacts to drive service improvement (Recommendation 10).", "type": "mcq"}]}, {"code": "S136", "title": "Section 136 for EDs", "source": "RCEM Brief Guide to s136 · Dec 2025", "hue": "#22d3ee", "questions": [{"n": 1, "topic": "Private dwelling", "stem": "A police officer finds a 34-year-old man behaving erratically in the private back garden of his own house, shouting that he is being watched by the government. The officer believes he has a mental disorder and is in immediate need of care or control. Can he be detained under s136?", "options": ["Yes, s136 applies anywhere including private dwellings and their gardens", "No, s136 cannot be used because he is in a private dwelling or associated private garden", "Yes, but only with a warrant obtained under section 135", "No, s136 can only be used in a hospital Emergency Department", "Yes, provided an AMHP is present at the scene"], "answer": 1, "exp": "[G] Per the RCEM Brief Guide to Section 136, s136 cannot be used if the person is in a private dwelling or the private garden/buildings associated with that place. Outside this exception s136 can be used in any other setting, including an ED. Entry to a private dwelling to remove a person requires a s135 warrant.", "type": "mcq"}, {"n": 2, "topic": "24-hour clock", "stem": "A patient is detained under s136 at 14:00 in a shopping centre. After a period in the police vehicle, they arrive at the ED at 15:30. At what time does the 24-hour period of detention begin?", "options": ["14:00, the time the officer first detained the patient", "15:30, the time of arrival at the Emergency Department (the place of safety)", "The time the triage nurse completes the initial assessment", "The time the on-call psychiatrist is bleeped", "Midnight on the day of detention"], "answer": 1, "exp": "[G] RCEM guidance: the 24-hour duration commences on arrival at the ED (the place of safety), even if the patient is subsequently transferred to a 136 suite. The time of arrival should be noted and recorded — a recurring exam boundary point.", "type": "mcq"}, {"n": 3, "topic": "12-hour extension", "stem": "A patient has been under s136 in the ED for 22 hours, still too intoxicated to be safely assessed. The MHA liaison team is unavailable. Most appropriate next step regarding the section?", "options": ["The section lapses at 24 hours regardless and the patient must be allowed to leave", "Any doctor may extend the section by up to 12 hours for medical reasons, ideally in discussion with the MHA team", "Only the AMHP can authorise any extension, and none is possible without them", "The patient should be sectioned under s2 instead to buy more time", "Security should physically restrain the patient until sober regardless of legal authority"], "answer": 1, "exp": "[G] s136 may be extended by 12 hours by a senior doctor who has assessed the patient, but only where there is a MEDICAL reason (not yet medically fit for assessment). Ideally enacted by the mental health professionals involved; if unavailable, any doctor can extend it, but should do so in discussion with the MHA team.", "type": "mcq"}, {"n": 4, "topic": "Police station (adult)", "stem": "Police wish to use a police station as the place of safety for a 40-year-old detained under s136 rather than the ED. Which is a correct precondition?", "options": ["It can be used for any adult if the ED is currently on divert", "It can be used if the behaviour presents imminent risk of serious injury or death, no other place of safety can reasonably detain them, and use is authorised by an inspector or above", "It can be used for anyone over the age of 16 without further authorisation", "It can be used routinely if the patient is intoxicated with alcohol", "It can be used if requested by the patient's family"], "answer": 1, "exp": "[G] A police station may only be used as a place of safety for an ADULT in exceptional circumstances: (a) behaviour presents an imminent risk of serious injury or death to self or others; (b) no other place of safety in the police area can reasonably be expected to detain them; and (c) authorised by an officer of inspector rank or above. Custody staff must ensure healthcare access and half-hourly checks.", "type": "mcq"}, {"n": 5, "topic": "Police station (under-18)", "stem": "A 16-year-old is detained under s136 after a public disturbance and appears acutely disturbed. The nearest ED-based place of safety is 90 minutes away; the local police station is 10 minutes away. Can the police station be used?", "options": ["Yes, if authorised by an inspector", "Yes, provided healthcare checks every 30 minutes are arranged", "No, police stations can never be used as a place of safety for anyone under 18", "Yes, but only for a maximum of 4 hours", "Yes, if the child's parents consent"], "answer": 2, "exp": "[G] RCEM guidance is explicit: police stations can NEVER be used as a place of safety for under-18s, regardless of distance, authorisation level, or parental consent. This is an absolute rule, unlike the conditional criteria that apply to adults.", "type": "mcq"}, {"n": 6, "topic": "Search powers", "stem": "A patient detained under s136 arrives at the ED and the accompanying officer wishes to search them before handover. Under what circumstance may a constable search a person detained under s136?", "options": ["Search is never permitted once s136 has been invoked", "Only with a magistrate's warrant", "If the constable has reasonable grounds to suspect a risk of self-harm or risk of harm to others", "Only if the patient consents in writing", "Only after formal MHA assessment is complete"], "answer": 2, "exp": "[G] Per the RCEM guidance summarising s136 powers, a police constable may search a detained person if they have reasonable grounds to suspect a risk of self-harm or risk of harm to others.", "type": "mcq"}, {"n": 7, "topic": "'If practicable' consultation", "stem": "Before invoking s136 in the community, what is the correct step regarding mental health professional involvement?", "options": ["Mental health professionals must always be physically present before s136 can be used", "Police must consult mental health professionals, if practicable, before using s136", "Mental health professional consultation is only required for patients under 18", "Consultation is only required if the person is in a public place, not elsewhere", "There is no requirement to consult mental health professionals at any stage"], "answer": 1, "exp": "[G] Police must consult mental health professionals, IF PRACTICABLE, before using s136. This is a 'where possible' duty, not an absolute precondition — s136 can still be used in an emergency without prior consultation if consultation is not practicable. Time to consult → consult; no time → act, still s136.", "type": "mcq"}, {"n": 8, "topic": "Place of safety agreement", "stem": "A patient is medically cleared and stable in the ED under s136 awaiting AMHP assessment. Escorting officers ask if they can leave. What determines whether the ED can safely take over responsibility?", "options": ["The ED must accept responsibility automatically once medical clearance occurs", "The ED is only a place of safety if the patient can be kept safe when the police leave, and this requires an agreement between an appropriate ED senior and the police officer", "Responsibility transfers automatically after 4 hours in the ED, per the 4-hour target", "Only the duty police inspector can authorise the police to leave, with no ED input required", "The patient's own consent is what determines whether police can leave"], "answer": 1, "exp": "[G] The ED is a health-based place of safety, but only a place of safety if the patient can be kept safe if the police leave. An agreement about if or when police may leave should be made by an appropriate ED senior (e.g. the senior nurse) and the police officer, with disagreements escalated to the emergency physician in charge and the duty inspector.", "type": "mcq"}, {"n": 9, "topic": "Webley case", "stem": "An ED senior agrees to take over legal responsibility for a s136 patient and allows police to leave. The patient absconds and comes to harm. Which legal precedent does RCEM highlight?", "options": ["The 'Webley' case, which established that the ED could be liable in negligence if they take on responsibility and the patient absconds", "The Bolam test, which protects clinicians from any liability if guidelines were followed", "Gillick competence, which is only relevant to under-16s", "The Montgomery ruling on consent to treatment", "There is no legal precedent; liability always remains with police regardless of handover"], "answer": 0, "exp": "[G] RCEM cites the 2015 'Webley' case as highlighting that an ED could be liable in negligence law if it agrees to take on legal responsibility for a s136 patient who then absconds. Conversely, if ED staff decline responsibility and police leave anyway, the police could be liable for abandoning someone in their custody.", "type": "mcq"}, {"n": 10, "topic": "RCRP", "stem": "Regarding the Right Care, Right Person (RCRP) national partnership agreement referenced in RCEM's s136 guidance, which statement is most accurate?", "options": ["RCRP mandates that police attend all mental health calls regardless of risk", "RCRP is an approach under which police aim to step back from all but the highest-risk mental healthcare work, requiring EDs to jointly agree procedures with police, mental health trusts, and social care", "RCRP abolishes the use of s136 entirely", "RCRP applies only in Scotland and Northern Ireland", "RCRP transfers all place-of-safety responsibility to ambulance services"], "answer": 1, "exp": "[G] RCEM describes RCRP as a national partnership agreement (signed July 2023) under which police in England and Wales aim to release themselves from all but the highest-risk mental healthcare work. EDs should work closely with local police, mental health trusts, social care and commissioning boards to jointly agree procedures throughout the s136 journey.", "type": "mcq"}, {"n": 11, "topic": "After expiry", "stem": "A patient's s136 detention (including the 12-hour extension) has expired and no MHA assessment has been completed. The patient wishes to leave. Which framework now governs their care?", "options": ["The patient remains detained under s136 indefinitely until assessed", "The patient automatically becomes detained under s2 of the MHA", "Once s136 expires, the patient is subject to the same legal frameworks as any other patient, e.g. the Mental Capacity Act or common law", "The patient must be physically restrained pending police re-attendance", "Detention continues under the authority of the ED consultant alone"], "answer": 2, "exp": "[G] Once the s136 runs out, the patient is subject to the same legal frameworks as any other patient — e.g. the Mental Capacity Act or common law — and RCEM directs readers to its 'Patient Who Absconds' and 'MCA in Emergency Medicine' guidance. There is no automatic conversion to another MHA section.", "type": "mcq"}, {"n": 12, "topic": "Rights", "stem": "On arrival in the ED under s136, what must staff ensure regarding communication with the patient, per RCEM's audit standards?", "options": ["Rights need only be explained if the patient specifically requests this information", "Rights must be explained to the patient and written information provided, alongside ongoing updates on their care and assessment plan", "Rights are explained only by the AMHP once they arrive, not by ED staff", "Written information is optional if verbal explanation has been given", "Explaining rights can be delayed until medical clearance is complete"], "answer": 1, "exp": "[G] RCEM's audit standards require that rights are explained to the patient and written information provided (an example leaflet is in Appendix 1). Patients should also be kept updated of the plan for their care and assessment, delivered by the nurse in charge or senior clinician at initial review — not contingent on the AMHP's arrival or on medical clearance.", "type": "mcq"}, {"topic": "Section 136 · drill", "stem": "A woman is detained by police under s136 outside a train station at 09:00. She is combative in the police van, so paramedics are called and she is taken directly to the local 136 suite (a health-based place of safety co-located with, but administratively separate from, the ED), arriving at 10:15. From what time does her 24-hour period run?", "options": ["A. 09:00, the time of initial detention by police", "B. 10:15, the time of arrival at the place of safety", "C. The time the paramedics were called", "D. The midpoint between detention and arrival", "E. The time the AMHP is allocated to the case"], "answer": 1, "exp": "The 24-hour clock starts on arrival at the place of safety, not at the point of initial police detention — this applies equally whether the place of safety is the ED itself or a co-located 136 suite. Only the arrival time at the place of safety is what should be recorded and used to calculate the 24-hour deadline.", "type": "mcq", "n": 13}, {"topic": "Section 136 · drill", "stem": "A patient detained under s136 has been in the ED for 20 hours. They have now sobered up and are medically fit, but the AMHP is delayed by an unrelated crisis elsewhere and will not arrive for another 6 hours. Is a 12-hour extension of the section appropriate in this situation?", "options": ["A. Yes, any delay to assessment justifies an extension", "B. No — a 12-hour extension requires a medical reason (the patient not yet being fit for assessment); AMHP unavailability alone is not a valid basis", "C. Yes, but only if authorised by the police inspector", "D. No, extensions can never be granted once 20 hours have elapsed", "E. Yes, and it must be authorised by two doctors acting jointly"], "answer": 1, "exp": "The 12-hour extension exists specifically for a medical reason — i.e. the patient is not yet medically fit for assessment. Since this patient has sobered up and is medically fit, staffing/service delays (AMHP unavailability) are not themselves grounds for extension; the priority instead is escalating to expedite the overdue MHA assessment within the original 24 hours.", "type": "mcq", "n": 14}, {"topic": "Section 136 · drill", "stem": "A 17-year-old is detained under s136 in a rural area at 02:00. The nearest ED is over an hour away by road and currently on ambulance divert; the police custody suite is 5 minutes away and has a healthcare professional on-site who can perform checks. Can the custody suite be used as the place of safety while an ED bed is arranged?", "options": ["A. Yes, because a healthcare professional is available on-site", "B. Yes, because the ED is on divert and unavailable", "C. No — police stations can never be used as a place of safety for anyone under 18, regardless of ED availability or distance", "D. Yes, for a maximum of 2 hours only", "E. Yes, if the custody sergeant is of inspector rank"], "answer": 2, "exp": "The prohibition on using a police station as a place of safety for under-18s is absolute — it does not bend for practical constraints such as ED distance, divert status, or on-site healthcare provision. An alternative health or social-care-based place of safety must be found, however logistically difficult.", "type": "mcq", "n": 15}, {"topic": "Section 136 · drill", "stem": "Police are called to a public park where a man is standing on a bridge railing, stating he intends to jump, with no time to make contact with a mental health professional before acting. They detain him under s136 immediately without prior consultation. Was this action lawful?", "options": ["A. No — consultation with a mental health professional is always mandatory before s136 can be invoked", "B. Yes — consultation is required only 'if practicable', so immediate action to prevent serious harm without prior consultation is permitted", "C. No — this can only be done under s135 with a warrant", "D. Yes, but only if a second officer co-signs the decision retrospectively", "E. No — this situation requires common law necessity, not s136"], "answer": 1, "exp": "Consultation with mental health professionals before using s136 is required only where practicable. In a time-critical situation with imminent risk to life, immediate use of s136 without prior consultation remains lawful — the 'if practicable' qualifier exists precisely for scenarios like this.", "type": "mcq", "n": 16}, {"topic": "Section 136 · drill", "stem": "A patient under s136 has been medically cleared. The department is extremely busy, resus is full, and there is no spare staff member to provide 1:1 observation. The police officer offers to stay but says they need to know if they're needed. What is the correct process for deciding whether the police can leave?", "options": ["A. The police must always stay until the AMHP physically arrives, regardless of ED staffing", "B. The ED must accept the patient and let police leave immediately once medical clearance is documented", "C. An appropriate ED senior (e.g. senior nurse) and the police officer should agree whether the ED currently has the staff/resources to keep the patient safe; if they cannot agree, escalate to the emergency physician in charge and duty police inspector", "D. The decision rests solely with the patient's stated preference", "E. The hospital security team has sole authority to release the police from the scene"], "answer": 2, "exp": "Whether the ED can safely take over responsibility is a discussion, not an automatic transfer at medical clearance. It should be agreed between an appropriate ED senior and the police officer based on real-time safety/staffing, with disagreements escalated to the emergency physician in charge and the duty police inspector — reflecting that the ED is only a place of safety if the patient can actually be kept safe once police leave.", "type": "mcq", "n": 17}, {"topic": "Section 136 · drill", "stem": "A patient's s136 has run for 24 hours and been extended by a further 12 hours for a valid medical reason — the maximum 36 hours is now reached and MHA assessment still has not occurred. The patient wants to self-discharge and appears to lack capacity to make that decision safely. What is the correct legal position?", "options": ["A. The s136 can be extended again for a further 12 hours if the MHA team requests it", "B. The section 136 authority has now ended; ongoing detention or restraint, if needed, must be justified under the Mental Capacity Act or common law rather than the MHA", "C. The patient automatically becomes detained under section 2 of the MHA at the 36-hour mark", "D. The police must be recalled to re-detain the patient under a fresh s136", "E. The ED consultant may unilaterally continue detention under s136 for patient safety"], "answer": 1, "exp": "There is no further extension beyond the single 12-hour extension (36 hours total) and no automatic conversion to another MHA section. Once s136 authority ends, any further restriction of the patient's liberty must be justified under the Mental Capacity Act (if they lack capacity and it's in their best interests) or common law necessity — the same frameworks that would apply to any other patient.", "type": "mcq", "n": 18}]}, {"code": "MHA", "title": "Mental Health Act in the ED", "source": "MHA 1983 · MCA 2005 · RCEM", "hue": "#5eead4", "questions": [{"n": 1, "topic": "Mental Health Act", "stem": "A 34-year-old man with no previous psychiatric history is brought to the ED by family. Over two weeks he has become increasingly paranoid, is not sleeping, and believes neighbours are poisoning him. He refuses admission and has no insight. The mental health team agree he needs admission to assess an unclear diagnosis. Which is the most appropriate legal framework for his admission?", "options": ["Section 2 MHA", "Section 3 MHA", "Section 4 MHA", "Section 5(2) MHA", "Section 136 MHA"], "answer": 0, "exp": "Section 2 is admission for assessment (with treatment) for up to 28 days, used where the diagnosis/prognosis is unclear. Two doctors (one Section 12-approved) + AMHP application; not renewable. Section 3 is for treatment of a known disorder; Section 4 is the emergency single-doctor version; Section 5(2) is inpatients only; Section 136 is a police power.", "type": "mcq"}, {"n": 2, "topic": "Mental Health Act", "stem": "A 45-year-old woman with a 20-year history of bipolar affective disorder relapses and requires admission for treatment. She is detained on the recommendation of two doctors and an AMHP for treatment of her known disorder. What is the maximum initial duration of this detention?", "options": ["72 hours", "28 days", "3 months", "6 months", "12 months"], "answer": 3, "exp": "Section 3 (admission for treatment) lasts up to 6 months initially, renewable for a further 6 months then annually. Section 2 = 28 days; Section 4 and Section 5(2) = 72 hours.", "type": "mcq"}, {"n": 3, "topic": "Mental Health Act", "stem": "A 29-year-old informal (voluntary) inpatient on a psychiatric ward, receiving treatment for a mental disorder, suddenly demands to leave. The nurse believes he is at significant risk if he leaves, but the responsible doctor is 20 minutes away. Which power allows the nurse to prevent him leaving until a doctor attends?", "options": ["Section 5(2)", "Section 5(4)", "Section 2", "Common law only", "Section 136"], "answer": 1, "exp": "Section 5(4) is the nurse's holding power: a registered mental health or learning-disability nurse may detain an informal inpatient already receiving treatment for a mental disorder for up to 6 hours, or until a doctor able to use Section 5(2) arrives. Section 5(2) is the doctor's 72h power, not what the nurse applies.", "type": "mcq"}, {"n": 4, "topic": "Mental Health Act", "stem": "A 26-year-old man attends the ED after his family raise concerns about his mental state. He has NOT been admitted to a ward. While waiting for psychiatric liaison he stands up to leave, saying he wants to go home. He appears to have a mental disorder and staff are concerned for his safety. A foundation doctor suggests using Section 5(2) to keep him in the department. Most appropriate response?", "options": ["Section 5(2) is appropriate and should be completed", "Section 5(2) cannot be used in the ED; prevent immediate harm under common law and arrange urgent MHA assessment", "Complete a Section 4 to detain him", "Use Section 136 as he is effectively in a public place", "Allow him to leave; no legal power applies in the ED"], "answer": 1, "exp": "Section 5(2) applies only to admitted inpatients, so it cannot be used for an ED attender. To prevent immediate serious harm, use common law (reasonable, proportionate restraint) pending urgent MHA assessment, and the MCA if he lacks capacity for the relevant decision. Section 136 is a police power exercised outside hospital.", "type": "mcq"}, {"n": 5, "topic": "Mental Health Act", "stem": "Regarding the doctor's holding power under Section 5(2) of the Mental Health Act 1983, which statement is correct?", "options": ["It lasts up to 6 hours", "It can be applied to any patient attending the emergency department", "It lasts up to 72 hours and applies only to hospital inpatients", "It authorises compulsory treatment of the mental disorder", "It can be renewed once for a further 72 hours"], "answer": 2, "exp": "Section 5(2) lets the doctor/approved clinician in charge (or a nominated deputy) detain an informal inpatient for up to 72 hours to allow an MHA assessment. Inpatients only; does not itself authorise treatment; not renewable — convert to Section 2/3 if further detention is needed.", "type": "mcq"}, {"n": 6, "topic": "Mental Health Act", "stem": "A patient requires urgent detention for assessment. The situation is an emergency, and waiting for a second doctor would cause undesirable delay with significant risk. One doctor and an AMHP are available. Which section allows admission?", "options": ["Section 2", "Section 3", "Section 4", "Section 5(4)", "Section 136"], "answer": 2, "exp": "Section 4 (emergency admission for assessment): one doctor's recommendation + AMHP (or nearest relative) application, where there is urgent necessity and obtaining the second recommendation needed for Section 2 would cause undesirable delay. Lasts up to 72 hours; normally converted to Section 2.", "type": "mcq"}, {"n": 7, "topic": "Mental Health Act", "stem": "A 24-year-old woman a

hat is the most appropriate management?", "options": ["Immediate synchronised DC cardioversion", "Rate control alone with no anticoagulation as she is haemodynamically stable", "Transoesophageal echo in the ED, then immediate cardioversion if no thrombus", "Rate control and anticoagulation, deferring cardioversion", "Chemical cardioversion with flecainide"], "answer": 3, "exp": "When AF has been present for more than 48 hours or the onset is uncertain, do not cardiovert acutely. Offer rate control and anticoagulation for at least 3 weeks before elective cardioversion. [G]\n\nImmediate cardioversion is reserved for the haemodynamically unstable patient, or where onset is confidently under 48 hours. TOE-guided early cardioversion is a legitimate strategy but is a planned cardiology pathway, not an ED manoeuvre. Omitting anticoagulation is the dangerous distractor. [G]NICE NG196 — Atrial fibrillation: diagnosis and management", "type": "mcq"}, {"n": 4, "topic": "Cardiology", "stem": "A 79-year-old man has acute pulmonary oedema. He is distressed, RR 34, SpO₂ 86% on 15 L/min, BP 158/92, with widespread crackles. ABG shows pH 7.24, PaCO₂ 7.2 kPa.\n\nWhich combination is most appropriate?", "options": ["Intravenous furosemide, nitrate infusion and non-invasive ventilation", "Intravenous furosemide and nebulised salbutamol", "Intravenous furosemide alone, with intubation if no response in 30 minutes", "Nitrate infusion and a 500 mL fluid challenge to assess preload responsiveness", "Intravenous furosemide, morphine 5 mg IV and non-invasive ventilation"], "answer": 0, "exp": "Offer IV diuretics; consider a nitrate infusion where there is concomitant hypertension, myocardial ischaemia or severe mitral regurgitation; and offer non-invasive ventilation to those with cardiogenic pulmonary oedema and severe dyspnoea or acidaemia. He is acidaemic. [G]\n\nDo not routinely offer opiates — this is an explicit 'do not do', and morphine is the classic superseded-practice distractor. Fluid loading is actively harmful, and salbutamol treats a diagnosis he does not have. [G]NICE NG187 — Acute heart failure", "type": "mcq"}, {"n": 5, "topic": "Cardiology", "stem": "A 58-year-old man has tearing interscapular pain. CT aortogram confirms a type B aortic dissection. BP is 186/104 and heart rate 96. He is neurologically intact with no malperfusion.\n\nWhat is the most appropriate initial pharmacological approach?", "options": ["Intravenous hydralazine boluses", "Oral amlodipine and admission for observation", "Intravenous labetalol to achieve heart rate below 60/min, then a vasodilator if needed", "Glyceryl trinitrate infusion alone", "Sodium nitroprusside infusion titrated to a systolic of 100–120 mmHg"], "answer": 2, "exp": "Rate control comes before vasodilatation. A beta-blocker such as labetalol or esmolol is given first to reduce heart rate below 60/min and blunt the rate of rise of aortic pressure (dP/dt), targeting a systolic of roughly 100–120 mmHg. [C]\n\nStarting with a pure vasodilator — nitroprusside, hydralazine or GTN — causes reflex tachycardia that increases aortic wall shear stress and can extend the dissection. Right drugs, wrong order, is the discriminator. [C]General accepted UK practice; no NICE guideline covers acute aortic dissection management", "type": "mcq"}, {"n": 6, "topic": "Respiratory", "stem": "A 66-year-old woman collapses in the ED. CTPA confirms a large bilateral pulmonary embolism. BP is 78/44 despite 1 litre of crystalloid, HR 126, and she is peripherally shut down. There is no bleeding history and no recent surgery.\n\nWhat is the most appropriate treatment?", "options": ["Systemic thrombolysis", "Apixaban loading dose orally", "Treatment-dose low molecular weight heparin alone", "Unfractionated heparin infusion and repeat echo in 6 hours", "Inferior vena cava filter insertion"], "answer": 0, "exp": "Offer thrombolysis or other pharmacological/mechanical embolectomy to people with PE and haemodynamic instability. Anticoagulation alone is not sufficient in this group. [G]\n\nConversely, thrombolysis is explicitly not offered to those without haemodynamic instability, however large the clot burden looks on CT — that is the reciprocal trap. IVC filters are for those in whom anticoagulation cannot be given. [G]NICE NG158 — Venous thromboembolic diseases", "type": "mcq"}, {"n": 7, "topic": "Respiratory", "stem": "A 62-year-old woman with morbid obesity and suspected obesity hypoventilation syndrome is admitted with pneumonia. She is not known to retain carbon dioxide and no blood gas is yet available. SpO₂ is 84% on air.\n\nWhat initial oxygen saturation target should be set?", "options": ["94–98%, reviewed once a blood gas is available", "90–94% for all acutely unwell patients", "No target; give 15 L/min via reservoir mask until the gas returns", "88–92%, pending a blood gas", "Above 98% until the gas returns"], "answer": 3, "exp": "People at risk of hypercapnic respiratory failure — which includes obesity hypoventilation, chest wall and neuromuscular disease, cystic fibrosis, bronchiectasis and COPD — should be started on a target of 88–92% pending blood gases, even before retention is confirmed. [G]\n\n94–98% is the correct target for the general acutely unwell adult; applying it here is the near-miss. Reservoir-mask oxygen at 15 L/min is for critical illness (shock, major trauma, sepsis, anaphylaxis, cardiac arrest) — she is hypoxic but not peri-arrest. [G]BTS Guideline for Oxygen Use in Adults in Healthcare and Emergency Settings (2017)", "type": "mcq"}, {"n": 8, "topic": "Trauma", "stem": "An intubated, ventilated polytrauma patient becomes acutely hypotensive with rising airway pressures and reduced breath sounds on the right. The trachea is deviated to the left.\n\nWhat is the most appropriate immediate intervention?", "options": ["Immediate intercostal drain insertion after a chest radiograph", "Urgent portable chest radiograph to confirm the diagnosis", "Needle decompression in the second intercostal space, mid-clavicular line", "Open (finger) thoracostomy in the fourth or fifth intercostal space, anterior axillary line", "Increase PEEP and give a fluid bolus while awaiting imaging"], "answer": 3, "exp": "In a ventilated patient, needle decompression frequently fails — the cannula is too short, kinks, or blocks. Open finger thoracostomy in the 4th/5th intercostal space, anterior axillary line is the reliable manoeuvre, followed by a drain once the patient is stable. [G]\n\nThe 2nd space mid-clavicular needle is the older teaching for the spontaneously breathing patient, and even there the lateral position is now preferred in adults. Tension pneumothorax is a clinical diagnosis — imaging first is the fatal delay. [C]Resuscitation Council UK Special Circumstances (2021); BTS Pleural Disease (2023)", "type": "mcq"}, {"n": 9, "topic": "Paediatrics", "stem": "A 2-year-old has a barking cough, hoarse voice and stridor at rest with marked sternal recession. He is agitated, SpO₂ 93% on air. He weighs 12 kg.\n\nWhat is the most appropriate immediate treatment?", "options": ["Oral dexamethasone 0.6 mg/kg alone", "Nebulised salbutamol 2.5 mg plus oral prednisolone", "Oral dexamethasone 0.15 mg/kg alone", "Intravenous ceftriaxone and urgent ENT review", "Nebulised adrenaline 1:1000 plus oral dexamethasone 0.15 mg/kg"], "answer": 4, "exp": "Stridor at rest with marked recession is severe croup: give nebulised adrenaline 1:1000, 0.5 mL/kg to a maximum of 5 mL, alongside a single dose of oral dexamethasone 0.15 mg/kg. [G]\n\nSteroid alone is right for mild and moderate croup but too slow here — adrenaline buys the 2–3 hours the steroid needs. The 0.6 mg/kg figure is the higher dose used in some protocols and is the dose distractor; UK practice is 0.15 mg/kg. Bronchodilators have no role. [G]NICE CKS — Croup", "type": "mcq"}, {"n": 10, "topic": "Neurology", "stem": "A 71-year-old man had 25 minutes of right arm weakness and slurred speech that resolved completely 3 hours ago. He is now neurologically normal. He is not on any antithrombotic and has no bleeding risk.\n\nWhat is the most appropriate immediate management?", "options": ["Aspirin 300 mg daily and specialist assessment within 24 hours", "Aspirin 300 mg and clopidogrel 300 mg with discharge and GP follow-up", "Urgent CT head in the ED to confirm the diagnosis before starting aspirin", "Admit for thrombolysis assessment", "Calculate an ABCD2 score and refer within 7 days if 4 or above"], "answer": 0, "exp": "For suspected TIA, give aspirin 300 mg immediately (unless contraindicated) and refer for specialist assessment within 24 hours of symptom onset. [G]\n\nDo not use ABCD2 to stratify risk or delay referral — that is the superseded-practice trap, and it appears constantly. Do not offer CT head unless an alternative diagnosis is suspected that CT could detect. Thrombolysis has no role once symptoms have fully resolved. [G]NICE NG128 — Stroke and transient ischaemic attack in over 16s", "type": "mcq"}, {"n": 11, "topic": "Infection", "stem": "A 34-year-old man has fever, severe headache, neck stiffness and photophobia. GCS 14, no focal deficit, no papilloedema, no rash. He is not immunocompromised and has had no seizures.\n\nWhat is the most appropriate sequence?", "options": ["Lumbar puncture immediately, then antibiotics once CSF is obtained", "Blood cultures, then ceftriaxone plus dexamethasone, with lumbar puncture as soon as possible without delaying antibiotics beyond 1 hour", "Ceftriaxone alone, withholding dexamethasone until CSF confirms a bacterial cause", "Ceftriaxone plus aciclovir, with lumbar puncture deferred for 24 hours", "CT head first, then lumbar puncture, then antibiotics"], "answer": 1, "exp": "He has no indication for CT before LP (no focal deficit, no seizure, GCS above 12, not immunocompromised, no papilloedema). Take cultures, give ceftriaxone within 1 hour with dexamethasone 10 mg given before or with the first dose, and perform LP as soon as it can be done without pushing antibiotics past that hour. [G]\n\nWaiting for CSF before starting antibiotics, or before giving dexamethasone, is the classic error — the steroid benefit depends on early administration and cannot be retrofitted. [G]NICE NG240 — Meningitis (bacterial) and meningococcal disease", "type": "mcq"}, {"n": 12, "topic": "Neurology", "stem": "A 44-year-old woman has a 5-day history of ascending symmetrical limb weakness with areflexia following a diarrhoeal illness. She is now unable to lift her legs off the bed. Bedside forced vital capacity is 1.1 litres; she weighs 65 kg. Oxygen saturation is 97% on air and her ABG is normal.\n\nWhat is the most appropriate immediate action?", "options": ["Urgent critical care referral for airway and ventilatory support", "Start non-invasive ventilation on the ward", "Repeat the vital capacity in 12 hours and escalate only if it falls further", "Reassure, as saturations and blood gas are normal, and admit to a general ward", "Give intravenous immunoglobulin and reassess in the morning"], "answer": 0, "exp": "An FVC of 1.1 L (about 17 mL/kg) is below the 20 mL/kg / 1 L threshold at which elective intubation should be planned in Guillain–Barré syndrome. Refer to critical care now. [C]\n\nSaturations and blood gases stay normal until immediately before catastrophic decompensation in neuromuscular respiratory failure — waiting for them to change is the trap the question is built around. NIV is generally avoided because of bulbar weakness and aspiration risk. IVIG is the definitive treatment but does not address the airway. [C]General accepted UK practice (20/30/40 rule); NICE NG127 (suspected neurological conditions)", "type": "mcq"}, {"n": 13, "topic": "Spinal", "stem": "A 41-year-old man has 3 days of worsening low back pain, now with bilateral posterior thigh numbness, difficulty initiating micturition and a post-void residual of 480 mL on bladder scan. Perianal sensation is reduced.\n\nWhat is the most appropriate management?", "options": ["Emergency MRI of the whole spine and immediate discussion with the spinal surgical service", "CT lumbar spine now, with MRI only if CT is inconclusive", "High-dose dexamethasone and admission under medicine", "Catheterise, give analgesia and refer to physiotherapy", "Urgent outpatient MRI lumbar spine within 2 weeks"], "answer": 0, "exp": "This is cauda equina syndrome with painless retention and saddle anaesthesia. It requires emergency MRI (whole spine) and immediate referral to the spinal surgical service — same admission, not the next clinic. [G]\n\nAny imaging delay measured in days is wrong. CT is inadequate for cord and root visualisation. Dexamethasone belongs to malignant spinal cord compression, not to disc-related cauda equina — right drug, wrong pathology. [G]NICE NG59 — Low back pain and sciatica; NHS England Cauda Equina Syndrome pathway", "type": "mcq"}, {"n": 14, "topic": "Burns", "stem": "A 30-year-old man weighing 80 kg has a scald covering 30% of his total body surface area. He arrives 2 hours after the injury. Nothing has been given yet.\n\nUsing a 4 mL/kg/%TBSA regimen, how much crystalloid should be given and over what period?", "options": ["9600 mL over the first 8 hours, then maintenance only", "2400 mL as a bolus, then reassess urine output", "4800 mL over 24 hours, given evenly", "9600 mL over 24 hours, half in the first 8 hours from the time of injury", "9600 mL over 24 hours, half in the first 8 hours from the time of arrival"], "answer": 3, "exp": "4 × 80 × 30 = 9600 mL over 24 hours, with half (4800 mL) in the first 8 hours measured from the time of the burn, not from arrival. Two hours have already elapsed, so that 4800 mL must run over the remaining 6 hours. [G]\n\nTiming from arrival is the single most common error and is the intended near-miss. Titrate to a urine output of 0.5–1 mL/kg/hour in adults. Note that many UK burns services now use 2 mL/kg/%TBSA — always follow the receiving unit's protocol. [C]British Burn Association / National Burn Care Referral Guidance; EMSB principles as used in UK practice", "type": "mcq"}, {"n": 15, "topic": "Trauma", "stem": "An 83-year-old woman fell at home and has four left-sided rib fractures on CT with a small pulmonary contusion. There is no pneumothorax. Pain score is 8/10 on deep breathing and her cough is weak. SpO₂ 94% on air.\n\nWhat is the most appropriate disposition and analgesic plan?", "options": ["Admit to critical care for elective intubation", "Discharge with oral codeine and paracetamol and GP review", "Discharge with oral morphine and an incentive spirometer", "Admit for observation only, avoiding opioids because of her age", "Admit for multimodal analgesia, consider regional block, with physiotherapy and respiratory monitoring"], "answer": 4, "exp": "Age over 65 with three or more rib fractures carries a substantially increased risk of pneumonia and death. Admit for multimodal analgesia (regular paracetamol, careful opioid, consideration of a regional technique such as a serratus anterior or erector spinae block), with chest physiotherapy and monitoring. [C]\n\nDischarge with weak oral analgesia in this group is the trap — the injury looks minor and the mortality is not. Withholding opioids because of age causes exactly the splinting and sputum retention that kills her. [C]NICE NG39 (major trauma, pain management); accepted UK silver trauma practice", "type": "mcq"}, {"n": 16, "topic": "MSK", "stem": "A 19-year-old man has a closed tibial shaft fracture in a backslab. Six hours later he has severe pain requiring escalating morphine, with pain on passive extension of the toes. Pulses are present and capillary refill is 2 seconds. Compartment pressure measurement shows a compartment pressure of 42 mmHg; his diastolic blood pressure is 68 mmHg.\n\nWhat is the most appropriate action?", "options": ["Repeat the pressure measurement in 2 hours before deciding", "Elevate the limb above heart level and reassess in 1 hour", "Give a regional nerve block for pain control and reassess", "Split the cast, and refer immediately for emergency fasciotomy", "Observe, as pulses are present and capillary refill is normal"], "answer": 3, "exp": "The delta pressure (diastolic minus compartment pressure) is 68 − 42 = 26 mmHg, below the 30 mmHg threshold. Combined with escalating analgesic requirement and pain on passive stretch, this is compartment syndrome: release all circumferential dressings and refer for emergency fasciotomy. [G]\n\nPresent pulses and normal capillary refill are expected in compartment syndrome and never exclude it. Do not elevate above heart level (it reduces perfusion pressure) and do not mask the cardinal sign with a regional block. [G]BOAST — Diagnosis and Management of Compartment Syndrome of the Limbs; NICE NG38", "type": "mcq"}, {"n": 17, "topic": "MSK", "stem": "A 21-year-old woman fell onto an outstretched hand. She has anatomical snuffbox tenderness and pain on telescoping the thumb. Scaphoid-view radiographs are reported as normal.\n\nWhat is the most appropriate next imaging step?", "options": ["CT scaphoid within 72 hours", "Repeat plain radiographs in 10–14 days", "MRI as the first-line imaging after the normal radiograph", "Bone scan at 72 hours", "No further imaging; treat as a soft tissue injury"], "answer": 2, "exp": "Where scaphoid fracture is suspected and initial radiographs are normal, offer MRI as the first-line imaging. [G]\n\nRepeat films at 10–14 days is the superseded pathway and is the intended distractor — it delays diagnosis, prolongs immobilisation, and misses a proportion of fractures. CT is second-line where MRI is contraindicated or unavailable. [G]NICE NG38 — Fractures (non-complex): assessment and management", "type": "mcq"}, {"n": 18, "topic": "Paediatrics", "stem": "A 6-year-old refuses to weight-bear on the right leg. Temperature 38.4°C, he holds the hip flexed and externally rotated, CRP 78 mg/L, WCC 15.2 × 10⁹/L, ESR 52 mm/hr. He is systemically well otherwise and haemodynamically normal.\n\nWhat is the most appropriate next step?", "options": ["Start intravenous flucloxacillin immediately and admit for observation", "Plain radiograph of the hip and discharge if normal", "MRI hip within 24 hours before any intervention", "Oral ibuprofen and review in 48 hours as this is likely transient synovitis", "Urgent ultrasound and joint aspiration before starting antibiotics"], "answer": 4, "exp": "He meets all four Kocher predictors (non-weight-bearing, fever above 38.5°C by history, ESR above 40, WCC above 12), giving a very high probability of septic arthritis. In a haemodynamically stable child, obtain joint aspiration for microscopy and culture before antibiotics — once antibiotics are given, the organism is often never identified. [C]\n\nThe exception, and the discriminator: if the child is septic or shocked, antibiotics come first and must not wait for aspiration. Treating as transient synovitis with this inflammatory picture risks joint destruction. [C]RCPCH / BSCOS accepted UK practice; NICE NG51 for the septic child", "type": "mcq"}, {"n": 19, "topic": "Toxicology", "stem": "A 32-year-old man with known heroin dependence is found with a respiratory rate of 5/min, pinpoint pupils and GCS 6. He is being bag-mask ventilated effectively.\n\nWhat is the most appropriate naloxone strategy?", "options": ["Withhold naloxone and intubate, as reversal will precipitate withdrawal", "Naloxone 400 micrograms IV bolus, repeated every 2–3 minutes as needed", "Naloxone 800 micrograms intramuscularly and observe for 30 minutes", "Naloxone 100–200 micrograms IV, titrated upwards, aiming for adequate ventilation rather than full consciousness", "Naloxone 2 mg IV as a single bolus to guarantee full reversal"], "answer": 3, "exp": "In a dependent patient, start low — 100–200 micrograms IV — and titrate upwards. The therapeutic endpoint is adequate respiration, not a fully awake patient. [G]\n\nLarge boluses precipitate acute withdrawal, agitation, vomiting with aspiration risk, and occasionally pulmonary oedema. The 400 microgram starting dose is correct for the non-dependent patient — right drug, right route, wrong population. Naloxone's half-life is shorter than most opioids, so plan for repeat dosing or an infusion (roughly 60% of the effective bolus per hour). [G]TOXBASE/NPIS — Opioids; BNF naloxone monograph", "type": "mcq"}, {"n": 20, "topic": "Toxicology", "stem": "A 54-year-old woman on long-term lithium presents confused, with a coarse tremor, ataxia and vomiting after starting a new diuretic. Serum lithium is 3.4 mmol/L, creatinine 210 micromol/L, and she is oliguric.\n\nWhat is the most appropriate management?", "options": ["Activated charcoal 50 g and intravenous fluids", "Intravenous sodium chloride 0.9% and urgent haemodialysis", "Forced alkaline diuresis", "Intravenous sodium chloride 0.9% alone, with repeat levels every 6 hours", "Whole-bowel irrigation with polyethylene glycol"], "answer": 1, "exp": "Rehydrate with sodium chloride 0.9% and arrange urgent haemodialysis. Dialysis is indicated for a level above 4 mmol/L, or above 2.5 mmol/L with severe neurological features or renal impairment — she meets the second criterion twice over. [G]\n\nActivated charcoal does not bind lithium, which is the trap most often taken. Whole-bowel irrigation has a role only for acute modified-release overdose, not chronic toxicity. Forced alkaline diuresis is obsolete. [G]TOXBASE/NPIS — Lithium", "type": "mcq"}, {"n": 21, "topic": "Toxicology", "stem": "A 3-year-old, weight 15 kg, is brought in 3 hours after swallowing an unknown number of her mother's ferrous sulfate 200 mg tablets. She has vomited twice and has abdominal pain. Abdominal radiograph shows multiple radio-opaque tablets. Serum iron at 4 hours is 105 micromol/L.\n\nWhat is the most appropriate treatment?", "options": ["Activated charcoal 1 g/kg and observation", "Oral deferasirox and discharge if asymptomatic at 6 hours", "Observation alone, as vomiting indicates the iron has been cleared", "Gastric lavage and observation for 12 hours", "Desferrioxamine infusion and consideration of whole-bowel irrigation"], "answer": 4, "exp": "A serum iron above 90 micromol/L at 4–6 hours, or clinical toxicity, indicates desferrioxamine (typically 15 mg/kg/hour IV, titrated). Whole-bowel irrigation is considered when tablets remain visible on radiograph. [G]\n\nActivated charcoal does not bind iron — the same trap as lithium, and worth pairing in your revision. Vomiting is a feature of stage 1 toxicity, not evidence of decontamination, and the deceptively quiet stage 2 latent phase follows it. [G]TOXBASE/NPIS — Iron salts", "type": "mcq"}, {"n": 22, "topic": "Toxicology", "stem": "A 47-year-old man is drowsy and tachypnoeic after drinking antifreeze. pH 7.09, bicarbonate 6 mmol/L, anion gap 32, osmolar gap 42. Creatinine is rising and urine microscopy shows calcium oxalate crystals.\n\nWhat is the most appropriate specific treatment?", "options": ["Ethanol infusion alone", "Sodium bicarbonate infusion alone until the pH normalises", "Fomepizole, with haemodialysis", "Activated charcoal and intravenous fluids", "Intravenous calcium gluconate to bind the oxalate"], "answer": 2, "exp": "Ethylene glycol poisoning is treated with an alcohol dehydrogenase inhibitor — fomepizole (preferred; ethanol is the alternative where fomepizole is unavailable) — combined with haemodialysis for severe acidosis, renal failure or a high level. [G]\n\nBicarbonate is adjunctive only and does not stop ongoing toxic metabolite production. Charcoal does not bind alcohols. Giving calcium is actively unhelpful and risks worsening tissue oxalate deposition — a plausible-sounding but wrong mechanism. [G]TOXBASE/NPIS — Ethylene glycol", "type": "mcq"}, {"n": 23, "topic": "Paediatrics", "stem": "A 4-year-old, weight 18 kg, has suspected sepsis: temperature 39.5°C, mottled skin, capillary refill 5 seconds, HR 175, BP 78/40, lactate 4.2 mmol/L.\n\nWhat is the most appropriate initial fluid resuscitation?", "options": ["Human albumin solution 4.5% 20 mL/kg", "Maintenance fluid only, with early inotropes", "Balanced crystalloid 10 mL/kg over less than 10 minutes, with reassessment after each bolus", "Sodium chloride 0.9% 20 mL/kg over 20 minutes, repeated to 60 mL/kg", "Sodium chloride 0.9% 5 mL/kg over 30 minutes"], "answer": 2, "exp": "For children with suspected sepsis and shock, give a 10 mL/kg bolus of balanced crystalloid over less than 10 minutes, reassessing after each bolus and seeking senior input if more than 40–60 mL/kg is needed. [G]\n\nThe 20 mL/kg figure is the superseded volume and remains the commonest wrong answer — the change reflects concern about fluid overload. Antibiotics within 1 hour run in parallel. [G]NICE NG51 — Sepsis: recognition, diagnosis and early management", "type": "mcq"}, {"n": 24, "topic": "Paediatrics", "stem": "A 9-month-old has episodes of drawing his legs up and screaming every 20 minutes, with vomiting and a single redcurrant-jelly stool. He is lethargic between episodes. Abdomen is soft with a vague right-sided mass. He is not peritonitic and observations are normal.\n\nWhat is the most appropriate management?", "options": ["Barium follow-through to confirm the diagnosis", "Abdominal radiograph; if normal, discharge with safety-netting", "Ultrasound to confirm, then air enema reduction", "Ultrasound to confirm, then immediate laparotomy", "Nasogastric decompression and observation for 24 hours"], "answer": 2, "exp": "Intussusception is confirmed by ultrasound (target or doughnut sign) and treated by air (pneumatic) enema reduction in a child who is resuscitated and has no contraindication. [G]\n\nSurgery is reserved for failed reduction, peritonitis, perforation or shock — none present here, so going straight to laparotomy over-treats. A normal abdominal radiograph does not exclude the diagnosis. [C]Accepted UK paediatric surgical practice; NICE CKS", "type": "mcq"}, {"n": 25, "topic": "Urology", "stem": "A 15-year-old boy has sudden severe left testicular pain that woke him 4 hours ago, with one episode of vomiting. The left testis is high-riding with a transverse lie and absent cremasteric reflex.\n\nWhat is the most appropriate management?", "options": ["Analgesia and urology clinic review within 24 hours", "Urgent Doppler ultrasound; explore only if flow is absent", "Immediate urological referral for surgical exploration", "Attempt manual detorsion in the ED and discharge if pain resolves", "Urine dipstick and antibiotics for suspected epididymo-orchitis"], "answer": 2, "exp": "Testicular torsion is a clinical diagnosis requiring immediate surgical exploration. Salvage rates fall sharply after 6 hours, and he is already at 4. [C]\n\nThe trap is imaging: Doppler has imperfect sensitivity and, more importantly, arranging it consumes the window. It has a role only where the diagnosis is genuinely doubtful and it causes no delay. Manual detorsion may be attempted while theatre is prepared but never substitutes for exploration. [C]BAUS / accepted UK practice; NICE CKS — Scrotal pain and swelling", "type": "mcq"}, {"n": 26, "topic": "Paediatrics", "stem": "A 3-year-old has had a fever for 6 days, bilateral non-purulent conjunctivitis, cracked red lips, a polymorphous rash, unilateral cervical lymphadenopathy and erythema of the palms.\n\nWhat is the most appropriate management?", "options": ["Discharge with antipyretics as this is likely a viral exanthem", "Oral antibiotics for presumed streptococcal infection and review in 48 hours", "Admit for intravenous immunoglobulin 2 g/kg and aspirin, with echocardiography", "Admit for intravenous ceftriaxone and await blood culture results", "Oral prednisolone alone"], "answer": 2, "exp": "Fever for 5 or more days plus 4 of 5 principal features is Kawasaki disease. Treat with IVIG 2 g/kg and aspirin, with echocardiography, ideally within 10 days of fever onset to reduce the risk of coronary artery aneurysms. [C]\n\nHe has all five. Delay past day 10 markedly increases aneurysm risk, so 'review in 48 hours' is not a neutral option. Aspirin here is a specific exception to the usual paediatric contraindication. [C]RCPCH / accepted UK practice; NICE CKS — Kawasaki disease", "type": "mcq"}, {"n": 27, "topic": "Head injury", "stem": "A 10-month-old fell from a changing table onto a hard floor. He has a 6 cm boggy swelling over the left parietal region. He cried immediately, has not vomited, has no seizure, and is now alert and interactive with a normal neurological examination.\n\nWhat is the most appropriate imaging plan?", "options": ["MRI head within 24 hours", "Skull radiograph, with CT only if a fracture is identified", "CT head within 8 hours", "CT head within 1 hour", "No imaging; observe for 4 hours and discharge if well"], "answer": 3, "exp": "In children under 1 year, a bruise, swelling or laceration more than 5 cm on the head is a criterion for CT head within 1 hour, on its own. [G]\n\nReassuring behaviour and a normal examination do not override it — the concern is occult intracranial injury in a skull that tolerates it poorly. Other 1-hour paediatric criteria include GCS below 14 (below 15 if under 1 year), suspected non-accidental injury, post-traumatic seizure, tense fontanelle, and three or more discrete vomits. Skull radiographs are only used as part of a skeletal survey for suspected NAI. [G]NICE NG232 — Head injury: assessment and early management", "type": "mcq"}, {"n": 28, "topic": "Vascular", "stem": "A 74-year-old smoker collapses with sudden abdominal and back pain. BP 78/46, HR 118, with a pulsatile abdominal mass. Bedside ultrasound shows a 7.8 cm abdominal aortic aneurysm. He is grey and confused.\n\nWhat is the most appropriate immediate management?", "options": ["CT angiogram to define the anatomy before any surgical referral", "Admit to critical care for optimisation and CT in the morning", "Intravenous labetalol to reduce shear stress, then CT", "Rapid crystalloid resuscitation to a systolic of 120 mmHg, then CT", "Immediate vascular surgical referral with permissive hypotension and transfer to theatre"], "answer": 4, "exp": "In a haemodynamically unstable patient with a ruptured AAA, the diagnosis is already made — go straight to immediate vascular referral and theatre, with permissive hypotension (target a systolic around 70–90 mmHg, or a palpable radial pulse and maintained cerebration). [G]\n\nCT belongs to the stable patient, where it determines suitability for EVAR. Aggressive fluid resuscitation to a normal blood pressure disrupts clot and worsens bleeding — right instinct, wrong physiology. [G]NICE NG156 — Abdominal aortic aneurysm: diagnosis and management", "type": "mcq"}, {"n": 29, "topic": "Vascular", "stem": "A 68-year-old woman with atrial fibrillation has a cold, painful right leg of 4 hours' duration. There is reduced sensation over the forefoot and mild weakness of toe dorsiflexion. Arterial Doppler signals are inaudible; venous signals are audible.\n\nWhat is the most appropriate management?", "options": ["Primary amputation referral, as sensory and motor loss indicate irreversibility", "Intravenous prostaglandin infusion and elevation of the limb", "Immediate systemic heparinisation and emergency vascular referral for revascularisation", "Start apixaban and arrange outpatient CT angiography", "Immediate heparinisation and vascular clinic review within 48 hours"], "answer": 2, "exp": "Sensory loss with early motor involvement and inaudible arterial signals is a threatened but salvageable limb (Rutherford IIb). It needs immediate systemic heparinisation and emergency revascularisation within hours. [C]\n\nA 48-hour pathway loses the limb — this is the timing discriminator. Irreversible ischaemia (Rutherford III), where primary amputation is considered, is marked by profound anaesthesia, fixed mottling, muscle rigidity and absent venous signals; her venous signals are present. Elevation worsens perfusion. [C]NICE CG147 — Peripheral arterial disease; accepted UK vascular practice", "type": "mcq"}, {"n": 30, "topic": "Sepsis", "stem": "A 58-year-old woman with a urinary source has a temperature of 38.9°C, HR 118, RR 26, BP 88/52 not responding to an initial fluid bolus, and lactate 4.1 mmol/L.\n\nWhich set of actions is required, and in what timeframe?", "options": ["Antibiotics within 3 hours, with senior review within 1 hour", "Cultures first, with antibiotics once the source is confirmed", "Antibiotics, cultures, lactate, fluids, urine output monitoring and oxygen — all within 1 hour, with immediate senior review", "Antibiotics within 1 hour, with senior review only if she fails to respond by 3 hours", "Fluid resuscitation alone for the first hour, then antibiotics"], "answer": 2, "exp": "She has high-risk criteria (systolic below 90, lactate above 2 mmol/L). Give broad-spectrum antibiotics within 1 hour, take cultures and lactate, resuscitate with fluid, monitor urine output, and arrange immediate review by a senior clinical decision maker. [G]\n\nThe 3-hour window belongs to moderate-risk patients who are not deteriorating. Delaying antibiotics for source confirmation or for a fluid trial is the error the whole guideline exists to prevent. [G]NICE NG51 — Sepsis; NICE NG240 (updated sepsis pathways)", "type": "mcq"}, {"n": 31, "topic": "Infection", "stem": "A 55-year-old man with type 2 diabetes has rapidly spreading erythema of the left thigh over 12 hours, with pain far exceeding the visible changes, skin crepitus, and a lactate of 4.8 mmol/L. He is febrile and tachycardic.\n\nWhat is the most important definitive step?", "options": ["Immediate surgical referral for urgent exploration and debridement", "Calculate the LRINEC score and refer only if 6 or above", "Hyperbaric oxygen therapy as first-line treatment", "Intravenous flucloxacillin and elevation, with review in 6 hours", "Urgent MRI of the thigh before any surgical referral"], "answer": 0, "exp": "Necrotising fasciitis is a surgical emergency: survival depends on immediate exploration and radical debridement, alongside broad-spectrum antibiotics with clindamycin for its antitoxin effect, and aggressive resuscitation. [C]\n\nLRINEC is not a rule-out tool — a low score in a patient who looks like this must never delay surgery, and that is the intended trap. Imaging is similarly a delay when the clinical picture is convincing. Hyperbaric oxygen is at best adjunctive. [C]Accepted UK surgical practice; NICE NG141 (cellulitis antimicrobial prescribing) for the differential", "type": "mcq"}, {"n": 32, "topic": "Endocrine", "stem": "An 81-year-old man with type 2 diabetes has a 10-day history of polyuria and confusion. Glucose 48 mmol/L, sodium 158 mmol/L, osmolality 385 mOsm/kg, ketones 0.6 mmol/L, pH 7.36, bicarbonate 22 mmol/L.\n\nWhat is the most appropriate initial management?", "options": ["Fixed-rate insulin at 0.1 units/kg/hour with sodium chloride 0.9%", "Rapid correction of osmolality to normal within 12 hours", "Sodium chloride 0.45% to correct the sodium rapidly", "Sodium chloride 0.9% alone initially, adding low-dose insulin only if ketones are significant or glucose stops falling", "Fixed-rate insulin at 0.05 units/kg/hour with 5% glucose from the outset"], "answer": 3, "exp": "Hyperosmolar hyperglycaemic state is treated with fluid first. Sodium chloride 0.9% alone will lower glucose; insulin (0.05 units/kg/hour) is added only if there is significant ketonaemia (above 1 mmol/L) or if glucose stops falling with fluid alone. [G]\n\nStarting DKA-rate insulin is the classic crossover error: it drops osmolality too fast, risking cerebral oedema and cardiovascular collapse. Aim for a fall in osmolality of 3–8 mOsm/kg/hour, and expect the sodium to rise initially as glucose falls — that is not a reason to switch to hypotonic fluid. [G]JBDS-IP — Management of Hyperosmolar Hyperglycaemic State in adults", "type": "mcq"}, {"n": 33, "topic": "Endocrine", "stem": "A 39-year-old woman with known Addison's disease has had 2 days of vomiting. BP 82/50, HR 122, sodium 124 mmol/L, potassium 5.9 mmol/L, glucose 3.1 mmol/L. She looks profoundly unwell.\n\nWhat is the most appropriate immediate management?", "options": ["Take a random cortisol and ACTH, then treat once results are available", "Fludrocortisone 100 micrograms orally and intravenous fluids", "Dexamethasone 8 mg IV to avoid interfering with the cortisol assay", "Hydrocortisone 100 mg IV immediately with sodium chloride 0.9% and glucose correction", "Oral prednisolone 40 mg and intravenous fluids"], "answer": 3, "exp": "Adrenal crisis is treated on suspicion: hydrocortisone 100 mg IV immediately, aggressive sodium chloride 0.9% resuscitation and correction of hypoglycaemia. Take the cortisol sample if convenient, but never wait for it. [G]\n\nOral routes are useless in a vomiting, shocked patient. Fludrocortisone is unnecessary acutely — high-dose hydrocortisone provides sufficient mineralocorticoid effect. Dexamethasone is a plausible answer for an undiagnosed patient awaiting a Synacthen test, but she is already diagnosed and hydrocortisone is superior. [G]Society for Endocrinology UK — Emergency Guidance: Acute Adrenal Insufficiency", "type": "mcq"}, {"n": 34, "topic": "Metabolic", "stem": "A 68-year-old woman on bendroflumethiazide has a witnessed generalised seizure. Sodium is 108 mmol/L. She is now post-ictal with a GCS of 11. The onset of the hyponatraemia is unknown.\n\nWhat is the most appropriate immediate treatment?", "options": ["Rapid correction to 130 mmol/L within 6 hours with hypertonic saline", "Tolvaptan orally with hourly sodium monitoring", "Fluid restriction to 750 mL per day", "Hypertonic (3%) sodium chloride 150 mL IV over 20 minutes, aiming for a rise of about 5 mmol/L", "Sodium chloride 0.9% at 250 mL/hour until sodium exceeds 130 mmol/L"], "answer": 3, "exp": "Seizures or a reduced conscious level from hyponatraemia constitute severe symptomatic hyponatraemia, treated with a bolus of 3% sodium chloride, 150 mL over 20 minutes, repeated until symptoms improve or the sodium has risen by about 5 mmol/L. [C]\n\nThe correction limit is the examinable point: no more than 10 mmol/L in the first 24 hours, to avoid osmotic demyelination. Correcting to 130 mmol/L within 6 hours breaches that. Fluid restriction and tolvaptan address chronic hyponatraemia and are far too slow for an actively seizing patient. [C]Accepted UK practice (European Society guidance as adopted in UK renal and acute medicine protocols)", "type": "mcq"}, {"n": 35, "topic": "Obstetrics", "stem": "A 29-year-old woman delivers precipitously in the ED. Five minutes later she has heavy ongoing vaginal bleeding with an estimated loss of 900 mL. The uterus feels soft and boggy. Her blood pressure has been 158/98 throughout, with 2+ proteinuria.\n\nWhich uterotonic is contraindicated in her case?", "options": ["Oxytocin 5 units by slow intravenous injection", "Tranexamic acid 1 g intravenously", "Carboprost 250 micrograms intramuscularly", "Ergometrine 500 micrograms intramuscularly", "Misoprostol 800 micrograms rectally"], "answer": 3, "exp": "Ergometrine is contraindicated in hypertension and pre-eclampsia — it causes vasoconstriction and can precipitate a severe hypertensive crisis or stroke. Her pressure and proteinuria make pre-eclampsia likely. [G]\n\nUterine massage, bimanual compression and emptying the bladder come first, then oxytocin, then carboprost (avoided in asthma) or misoprostol. Tranexamic acid 1 g is given in postpartum haemorrhage. [G]NICE NG235 — Intrapartum care; RCOG Green-top Guideline on postpartum haemorrhage; BNF", "type": "mcq"}, {"n": 36, "topic": "Sexual health", "stem": "A 23-year-old woman attends 68 hours after a non-consensual sexual assault. She is not using contraception, is mid-cycle, and does not want to involve the police at present. She is medically well.\n\nWhich statement best describes the correct approach to prophylaxis?", "options": ["She must report to the police before a sexual assault referral centre can see her", "HIV post-exposure prophylaxis remains within window, and a copper intrauterine device or ulipristal are both still options for emergency contraception", "HIV post-exposure prophylaxis is no longer an option, and levonorgestrel is the only available emergency contraception", "Emergency contraception is no longer effective and only HIV prophylaxis should be offered", "Neither prophylaxis is indicated; arrange follow-up testing at 2 weeks"], "answer": 1, "exp": "HIV PEP is given up to 72 hours after exposure — she is at 68 and still within window. For emergency contraception, ulipristal acetate is licensed to 120 hours and the copper IUD to 120 hours after intercourse (or up to 5 days after the earliest likely ovulation), making it the most effective option. [G]\n\nLevonorgestrel is only licensed to 72 hours and is less effective as that limit approaches. She can be referred to a Sexual Assault Referral Centre without police involvement — self-referral is available, and forensic samples can be stored pending her decision. [G]FSRH Emergency Contraception guideline; BASHH UK guideline on HIV PEP; NICE NG225 context", "type": "mcq"}, {"n": 37, "topic": "Haematology", "stem": "An 84-year-old woman is 40 minutes into her second unit of red cells for symptomatic anaemia. She becomes breathless with SpO₂ 88%, BP 178/94, JVP raised to the ear lobes, and bibasal crackles. Temperature 36.9°C. She has known heart failure.\n\nWhat is the most likely diagnosis and the correct immediate action?", "options": ["Transfusion-associated circulatory overload — stop the transfusion, give oxygen and an intravenous diuretic", "Anaphylaxis — give intramuscular adrenaline 500 micrograms", "Febrile non-haemolytic reaction — slow the transfusion and give paracetamol", "Acute haemolytic reaction — stop the transfusion and give intravenous fluids", "Transfusion-related acute lung injury — stop the transfusion and give corticosteroids"], "answer": 0, "exp": "Hypertension with a raised JVP and pulmonary oedema in an elderly patient with heart failure is TACO. Stop the transfusion, sit her up, give oxygen and an IV diuretic, and report the reaction. [C]\n\nTRALI is the key discriminator and is hypotensive with a normal JVP, typically within 6 hours, and is managed with supportive ventilation — steroids are not the treatment. Acute haemolysis brings fever, loin pain and dark urine; anaphylaxis brings hypotension, urticaria and airway compromise. [C]SHOT / British Society for Haematology transfusion reaction guidance; MHRA", "type": "mcq"}, {"n": 38, "topic": "Alcohol", "stem": "A 52-year-old man with alcohol dependence is admitted with a chest infection. He is confused with nystagmus and ataxia, and cannot maintain gaze. Capillary glucose is 2.9 mmol/L.\n\nWhat is the most appropriate sequence of treatment?", "options": ["Give parenteral thiamine (Pabrinex) before or with the glucose", "Give 50 mL of 50% glucose immediately, then thiamine", "Correct the glucose and give thiamine only if the confusion persists at 24 hours", "Give chlordiazepoxide first and defer both thiamine and glucose", "Give oral thiamine 100 mg and correct the glucose orally"], "answer": 0, "exp": "He has the Wernicke's triad. Give parenteral thiamine (Pabrinex) before or at the same time as glucose — a glucose load in a thiamine-deplete patient consumes the last of the cofactor and can precipitate or worsen Wernicke's encephalopathy. [G]\n\nOral thiamine is inadequately absorbed for treatment (it has a role only in prophylaxis for the well patient). Deferring thiamine risks irreversible Korsakoff's. Treat hypoglycaemia — just get the thiamine in alongside it. [G]NICE CG100 — Alcohol-use disorders: physical complications; NICE CG115", "type": "mcq"}, {"n": 39, "topic": "Resus", "stem": "A 40-year-old man develops anaphylaxis after a wasp sting. Despite two doses of intramuscular adrenaline 500 micrograms 5 minutes apart, plus high-flow oxygen and a rapid crystalloid bolus, he remains hypotensive at 76/40 with persistent wheeze.\n\nWhat is the most appropriate next step?", "options": ["Start a low-dose intravenous adrenaline infusion, with expert help", "Intravenous adrenaline 1 mg bolus as in cardiac arrest", "Give chlorphenamine 10 mg IV and reassess", "Give hydrocortisone 200 mg IV as the priority", "A third intramuscular dose of adrenaline 500 micrograms"], "answer": 0, "exp": "Failure to respond to two appropriate IM doses defines refractory anaphylaxis. Move to a low-dose IV adrenaline infusion given by, or with the help of, someone experienced in its use, with continued rapid fluid resuscitation. [G]\n\nAn IV adrenaline bolus outside cardiac arrest risks lethal hypertension and arrhythmia and is the dangerous distractor. Corticosteroids are no longer recommended in the routine emergency management of anaphylaxis, and antihistamines are for cutaneous symptoms only — neither treats shock. [G]Resuscitation Council UK — Emergency treatment of anaphylaxis (2021)", "type": "mcq"}, {"n": 40, "topic": "Mental health", "stem": "A 26-year-old woman attends after cutting her forearm. The wound is superficial and closed with adhesive strips. She is calm, has no active suicidal ideation, and asks to go home. A risk assessment tool scores her as 'low risk'.\n\nWhat is the most appropriate management?", "options": ["Refer to psychiatry only if she has self-harmed on a previous occasion", "Admit all patients presenting with self-harm for 24 hours of observation", "Discharge with a crisis line number only, as she has capacity", "Discharge on the basis of the low-risk score with GP follow-up", "Undertake a full psychosocial assessment regardless of the risk score, and base management on it"], "answer": 4, "exp": "Everyone presenting with self-harm should have a full psychosocial assessment covering needs, strengths and circumstances. [G]\n\nDo not use risk assessment tools or scales to predict future suicide or self-harm, or to determine who should be offered treatment or discharged — this is an explicit NICE 'do not do', and the low-risk score in the stem is the deliberate trap. Severity of the physical injury is likewise a poor guide to psychiatric risk. [G]NICE NG225 — Self-harm: assessment, management and preventing recurrence", "type": "mcq"}]}]</script>
<script>
const SETS = JSON.parse(document.getElementById('data').textContent);
const LTR = ['A','B','C','D','E'];
const app = document.getElementById('app');
let S = { view:'home', set:null, start:1 };
let run = null; // {set, order:[idx...], pos, answers:{n:chosen}, correct, attempted, missed:[], viewedMax}

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function home(){
  const cards = SETS.map((set,i)=>`
    <button class="card" style="--hue:${set.hue}" onclick="openSet(${i})">
      <span class="spine"></span>
      <span class="top">
        <span class="chip">${set.code}</span>
        <span class="qn">${set.questions.length} Q</span>
      </span>
      <h2>${esc(set.title)}</h2>
      <div class="src">${esc(set.source)}</div>
    </button>`).join('');
  app.innerHTML = `
    <div class="eyebrow">FRCEM SBA · Question Bank</div>
    <h1>Catalogue</h1>
    <p class="sub">Tap a set, choose where to start, work through in fixed order. Nothing is stored on your device — copy your result code at the end.</p>
    <div class="cards">${cards}</div>
    <div class="foot">${SETS.reduce((a,s)=>a+s.questions.length,0)} questions · UK guidelines only</div>`;
  window.scrollTo(0,0);
}

function openSet(i){
  S.set=i; S.start=1;
  const set=SETS[i]; const n=set.questions.length;
  app.innerHTML=`
    <button class="back" onclick="home()">&larr; Catalogue</button>
    <div class="panel" style="--hue:${set.hue}">
      <span class="chip" style="--hue:${set.hue}">${set.code}</span>
      <h1 style="margin-top:12px">${esc(set.title)}</h1>
      <div class="sub" style="margin-bottom:18px">${esc(set.source)} · ${n} questions</div>
      <div class="label">Start from question</div>
      <div class="stepper">
        <button onclick="bump(-1)" aria-label="down">–</button>
        <input id="startn" type="number" inputmode="numeric" min="1" max="${n}" value="${S.start}" onchange="setStart(this.value)">
        <button onclick="bump(1)" aria-label="up">+</button>
      </div>
      <div style="height:18px"></div>
      <button class="btn" style="background:${set.hue};color:#0d1117" onclick="startRun()">Start &rarr;</button>
    </div>`;
  window.scrollTo(0,0);
}
function bump(d){const set=SETS[S.set];S.start=Math.min(set.questions.length,Math.max(1,S.start+d));document.getElementById('startn').value=S.start;}
function setStart(v){const set=SETS[S.set];let x=parseInt(v||'1',10);if(isNaN(x))x=1;S.start=Math.min(set.questions.length,Math.max(1,x));document.getElementById('startn').value=S.start;}

function startRun(){
  const set=SETS[S.set];
  const order=[]; for(let k=S.start-1;k<set.questions.length;k++) order.push(k);
  run={set:S.set,order,pos:0,answers:{},correct:0,attempted:0,missed:[],lastN:set.questions[order[0]].n};
  renderQ();
}

function renderQ(){
  const set=SETS[run.set];
  const q=set.questions[run.order[run.pos]];
  run.lastN=q.n;
  const total=run.order.length, done=run.pos;
  const answered = run.answers.hasOwnProperty(q.n);
  const isShort = q.type==='short';
  let optsHtml='';
  if(!isShort){
    optsHtml = q.options.map((o,k)=>{
      let cls='opt';
      if(answered){
        if(k===q.answer) cls+=' correct';
        else if(k===run.answers[q.n]) cls+=' wrong';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="choose(${k})">
        <span class="ltr">${LTR[k]}</span><span>${esc(o)}</span></button>`;
    }).join('');
  }
  let expHtml='';
  if(answered){
    if(isShort){
      expHtml=`<div class="model"><b>Model answer.</b> ${esc(q.model)}</div>
               <div class="exp"><div class="verdict">Recall card — not scored</div>${esc(q.exp||'')}</div>`;
    }else{
      const ok=run.answers[q.n]===q.answer;
      expHtml=`<div class="exp"><div class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect — answer '+LTR[q.answer]}</div>${esc(q.exp)}</div>`;
    }
  }
  const lastQ = run.pos===total-1;
  const nav = answered ? `<button class="btn" style="background:${set.hue};color:#0d1117" onclick="next()">${lastQ?'Finish &rarr;':'Next &rarr;'}</button>` : '';
  const shortReveal = (isShort && !answered) ? `<button class="btn ghost" onclick="revealShort()">Reveal model answer</button>` : '';
  app.innerHTML=`
    <div class="qbar" style="--hue:${set.hue}">
      <span class="idx">${set.code} · Q${q.n}</span>
      <span class="prog"><i style="width:${Math.round((done/(total))*100)}%"></i></span>
      <button class="stop" onclick="finish(true)">Stop &amp; score</button>
    </div>
    <span class="tag" style="--hue:${set.hue}">${esc(q.topic)}</span>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts">${optsHtml}</div>
    ${shortReveal}
    ${expHtml}
    <div class="navbtns">${nav}</div>`;
  window.scrollTo(0,0);
}

function choose(k){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  if(run.answers.hasOwnProperty(q.n))return;
  run.answers[q.n]=k; run.attempted++;
  if(k===q.answer) run.correct++; else run.missed.push(q.n);
  renderQ();
}
function revealShort(){
  const set=SETS[run.set]; const q=set.questions[run.order[run.pos]];
  run.answers[q.n]='seen'; renderQ();
}
function next(){
  if(run.pos<run.order.length-1){run.pos++;renderQ();}
  else finish(false);
}

function finish(stopped){
  const set=SETS[run.set];
  const firstN = set.questions[run.order[0]].n;
  const lastN = run.lastN;
  const att=run.attempted, cor=run.correct;
  const pct = att? Math.round(cor/att*100):0;
  const missed=[...run.missed].sort((a,b)=>a-b);
  const code = `${set.code} ${firstN}-${lastN} ${cor}/${att} W:${missed.length?missed.join(','):'-'}`;
  const missedHtml = missed.length? `<div class="label" style="margin-top:16px">Missed</div><div class="missed">${missed.map(n=>`<span>Q${n}</span>`).join('')}</div>`:
    `<div class="label" style="margin-top:16px">Missed</div><div class="sub" style="margin:0">None — clean run.</div>`;
  app.innerHTML=`
    <button class="back" onclick="openSet(${run.set})">&larr; ${set.code}</button>
    <div class="panel" style="--hue:${set.hue}">
      <div class="label">${set.code} · ${stopped?'stopped at':'completed to'} Q${lastN}</div>
      <div class="big">${cor}<span style="color:var(--muted);font-size:24px">/${att}</span></div>
      <div class="pct">${pct}% · questions ${firstN}–${lastN}</div>
      ${missedHtml}
      <div class="label" style="margin-top:18px">Result code</div>
      <div class="code" id="code">${esc(code)}</div>
      <div class="navbtns">
        <button class="btn sm" style="background:${set.hue};color:#0d1117;width:100%" onclick="copyCode(${JSON.stringify(code).replace(/"/g,'&quot;')})">Copy result code</button>
      </div>
      <div class="navbtns">
        <button class="btn ghost" onclick="home()">Catalogue</button>
        <button class="btn ghost" onclick="openSet(${run.set})">Redo set</button>
      </div>
    </div>
    <div class="foot">Paste the code back into your FRCEM chat to log the result.</div>`;
  window.scrollTo(0,0);
}

function copyCode(txt){
  const done=()=>toast();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,cb){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
let tt;
function toast(){const t=document.getElementById('toast');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400);}

home();
</script>
</body>
</html>
